  # #5021/#5022/#5023: the center-column priority stack (plan
  # docs/plans/5045-command-ui.md §9-§11). `proposed_prefix` marks an armed
  # command preview (tier 1); `inventory_pick_hint` names staged munition
  # picks (tier 2, %{rounds} is the pre-formatted "N × Type, M × Type"
  # enumeration — an opaque data value, never itself translated);
  # `mixed_selection`/`multi_subject` name a multi-unit current selection
  # (tier 3) when members disagree/agree on live status respectively;
  # `subject_link_tooltip` explains the subject click-to-inspect link and
  # `referent_link_tooltip` explains a MISSION/NOW referent's
  # select-and-follow link (the same contact/friendly a member's mission or
  # active order names); `mixed_selection_tooltip` explains its own link.
