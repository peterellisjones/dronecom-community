  # #5023: tier 1's per-recipient consequence breakdown (plan §9 item 1,
  # command plan §7 row 18). Each `consequence_*` key names one distinct
  # `RecipientConsequence` class — never collapsed into one aggregate count
  # (module doc on `consequence_breakdown`). `consequence_retasks_group`
  # additionally interpolates %{name} (the addressed leader's own display
  # name, a real already-existing group) alongside %{count};
  # `consequence_forms_group` takes %{count} alone — the group it names
  # doesn't exist until commit, so it has no leader to name yet; every
  # other key takes %{count} alone too.
  #
  # `consequence_detail_*` keys (below `armed_consequence_tooltip`) are the
  # armed-preview link's rich per-recipient tooltip content — one row per
  # addressed recipient, %{name} instead of %{count}, localized only the
  # frame the tooltip actually shows (`status_stack.rs`'s
  # `render_consequence_detail`), never the compact summary's counts.
  # `consequence_detail_replaces`/`_detached` are optional trailing clauses
  # appended only when `Retasked`'s `replaces`/`detaches_from` is `Some`.
  # `consequence_detail_member_active`/`_stowed` are the group variants'
  # per-member rows (`render_group_detail`): every named member gets its
  # own row, classified straight off the live `Units` snapshot. Wherever
  # `consequence_detail_launches`/`_retasked` is the member's actual
  # consequence for that group kind — a `FormsNewGroup` member currently
  # stowed really does launch to join; a `RetasksWholeGroup` member
  # currently active really is retasked in place — those keys are reused
  # instead; `_active`/`_stowed` cover only the opposite pairing, where
  # nothing is claimed beyond the member's plain live state.
  # `armed_consequence_tooltip` is the detail tooltip's trailing
  # click-affordance footer — the link still opens ASSETS on click, same as
  # before; only the hover content changed.
  consequence_retasked:
    de: "%{count} NEU BEAUFTRAGT"
    en: "%{count} RETASKED"
    es: "%{count} REASIGNADAS"
    fr: "%{count} RÉAFFECTÉES"
    it: "%{count} RIASSEGNATE"
    ja: "%{count} 件を再指令"
    ko: "%{count}개 재임무"
    "pt-BR": "%{count} REATRIBUÍDAS"
    ru: "%{count} ПЕРЕНАЗНАЧЕНО"
    zh: "%{count} 个重新分配"
    "zh-TW": "%{count} 個重新分配"
  consequence_retasked_from:
    de: "%{count} NEU BEAUFTRAGT VON %{mission}"
    en: "%{count} RETASKED FROM %{mission}"
    es: "%{count} REASIGNADAS DESDE %{mission}"
    fr: "%{count} RÉAFFECTÉES DEPUIS %{mission}"
    it: "%{count} RIASSEGNATE DA %{mission}"
    ja: "%{mission}から%{count}件を再指令"
    ko: "%{mission}에서 %{count}개 재임무"
    "pt-BR": "%{count} REATRIBUÍDAS DE %{mission}"
