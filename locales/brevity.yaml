_version: 2

# Glossary tooltips for the multi-service tactical brevity codes (#3292).
#
# The CODES THEMSELVES ARE NOT TRANSLATED — they are procedure words, in the
# same family as a track code (`T-001`), and `BrevityCode::label()` returns them
# as `&'static str` literals rendered verbatim in every locale. Only these
# explanations translate. Do not add surface-form keys here.
#
# Style: prose, sentence case (the tooltip layer is guidance, not tactical
# data). No em dashes and no repetition of the code itself — hovering `FOX 3`
# already shows the token, so the tooltip only has to say what it means.
brevity:
  # ── Weapon release ────────────────────────────────────────────────
  fox_1_tooltip:
    de: "Waffe abgefeuert, ohne eigenen Suchkopf. Sie fliegt bis zum Ziel nach der Lenkung ihres Trägers."
    en: "Weapon away with no seeker of its own. It flies on its launcher's guidance all the way to the target."
    es: "Arma lanzada sin buscador propio. Vuela guiada por su lanzador hasta el blanco."
    fr: "Arme tirée sans autodirecteur. Elle vole sur le guidage de son lanceur jusqu'à la cible."
    it: "Arma lanciata senza cercatore proprio. Vola con la guida del lanciatore fino al bersaglio."
    ja: "自らのシーカーを持たない兵器の発射。目標まで発射母機の誘導で飛翔します。"
    ko: "자체 탐색기가 없는 무장 발사. 표적까지 발사 플랫폼의 유도로 비행합니다."
    "pt-BR": "Arma lançada sem buscador próprio. Voa guiada pelo lançador até o alvo."
    ru: "Пуск оружия без собственной головки самонаведения. Летит до цели по наведению носителя."
    zh: "发射不带自身导引头的武器。全程依靠发射平台的制导飞向目标。"
    "zh-TW": "發射不帶自身導引頭的武器。全程依靠發射平台的導引飛向目標。"
  fox_2_tooltip:
    de: "Waffe mit Infrarot- oder elektrooptischem Suchkopf abgefeuert. Sie folgt passiv der Wärme oder dem Bild des Ziels."
    en: "Weapon away with an infrared or electro-optical seeker. It homes passively on the target's heat or image."
    es: "Arma lanzada con buscador infrarrojo o electroóptico. Se guía pasivamente por el calor o la imagen del blanco."
    fr: "Arme tirée avec autodirecteur infrarouge ou électro-optique. Elle guide passivement sur la chaleur ou l'image de la cible."
    it: "Arma lanciata con cercatore a infrarossi o elettro-ottico. Insegue passivamente il calore o l'immagine del bersaglio."
    ja: "赤外線または電子光学シーカーを備えた兵器の発射。目標の熱や画像に受動的に追尾します。"
    ko: "적외선 또는 전자광학 탐색기를 갖춘 무장 발사. 표적의 열이나 영상을 수동으로 추적합니다."
    "pt-BR": "Arma lançada com buscador infravermelho ou eletro-óptico. Guia-se passivamente pelo calor ou pela imagem do alvo."
    ru: "Пуск оружия с инфракрасной или оптико-электронной головкой. Наводится пассивно по тепловому или оптическому контрасту цели."
    zh: "发射配备红外或光电导引头的武器。以被动方式追踪目标的热量或图像。"
    "zh-TW": "發射配備紅外線或光電導引頭的武器。以被動方式追蹤目標的熱量或影像。"
  fox_3_tooltip:
    de: "Waffe mit aktivem Radarsuchkopf abgefeuert. Sie findet das Ziel mit ihrem eigenen Radar."
    en: "Weapon away with an active radar seeker. It finds the target with its own radar."
    es: "Arma lanzada con buscador de radar activo. Encuentra el blanco con su propio radar."
    fr: "Arme tirée avec autodirecteur radar actif. Elle trouve la cible avec son propre radar."
    it: "Arma lanciata con cercatore radar attivo. Trova il bersaglio con il proprio radar."
    ja: "アクティブレーダーシーカーを備えた兵器の発射。自らのレーダーで目標を捕捉します。"
    ko: "능동 레이더 탐색기를 갖춘 무장 발사. 자체 레이더로 표적을 포착합니다."
    "pt-BR": "Arma lançada com buscador de radar ativo. Encontra o alvo com o próprio radar."
    ru: "Пуск оружия с активной радиолокационной головкой. Находит цель собственным радаром."
    zh: "发射配备主动雷达导引头的武器。以自身雷达搜索目标。"
    "zh-TW": "發射配備主動雷達導引頭的武器。以自身雷達搜尋目標。"
  magnum_tooltip:
    de: "Anti-Radar-Waffe abgefeuert. Sie folgt der Abstrahlung eines Radars, das Abschalten des Senders nimmt ihr die Spur."
    en: "Anti-radiation weapon away. It homes on a radar's emissions, so the emitter going dark starves it."
    es: "Arma antirradiación lanzada. Se guía por las emisiones de un radar, así que apagarlo la deja sin referencia."
    fr: "Arme antiradar tirée. Elle guide sur les émissions d'un radar : si l'émetteur s'éteint, elle perd sa référence."
    it: "Arma antiradiazione lanciata. Insegue le emissioni di un radar, quindi spegnere l'emettitore la priva del riferimento."
    ja: "対レーダー兵器の発射。レーダーの電波に追尾するため、発信源が停波すると誘導を失います。"
    ko: "대레이더 무장 발사. 레이더의 방사를 추적하므로 방사원이 전파를 끊으면 유도를 잃습니다."
    "pt-BR": "Arma antirradiação lançada. Guia-se pelas emissões de um radar, portanto desligá-lo a deixa sem referência."
    ru: "Пуск противорадиолокационного оружия. Наводится на излучение радара, поэтому его отключение лишает ракету наведения."
    zh: "发射反辐射武器。依靠雷达辐射制导，辐射源关机即失去引导。"
    "zh-TW": "發射反輻射武器。依靠雷達輻射導引，輻射源關機即失去引導。"
  fish_tooltip:
    de: "Torpedo abgefeuert."
    en: "Torpedo away."
    es: "Torpedo lanzado."
    fr: "Torpille lancée."
    it: "Siluro lanciato."
    ja: "魚雷を発射しました。"
    ko: "어뢰를 발사했습니다."
    "pt-BR": "Torpedo lançado."
    ru: "Торпеда выпущена."
    zh: "鱼雷已发射。"
    "zh-TW": "魚雷已發射。"
  birds_away_tooltip:
    de: "Ein Schiff oder U-Boot hat einen Flugkörper gestartet."
    en: "A ship or submarine has launched a missile."
    es: "Un buque o submarino ha lanzado un misil."
    fr: "Un navire ou un sous-marin a tiré un missile."
    it: "Una nave o un sottomarino ha lanciato un missile."
    ja: "艦艇または潜水艦がミサイルを発射しました。"
    ko: "함정 또는 잠수함이 미사일을 발사했습니다."
    "pt-BR": "Um navio ou submarino lançou um míssil."
    ru: "Корабль или подводная лодка выпустили ракету."
    zh: "水面舰艇或潜艇已发射导弹。"
    "zh-TW": "水面艦艇或潛艦已發射飛彈。"
  bruiser_tooltip:
    de: "Luftgestützte Seezielwaffe abgefeuert."
    en: "Air-launched anti-ship weapon away."
    es: "Arma antibuque lanzada desde el aire."
    fr: "Arme antinavire tirée depuis les airs."
    it: "Arma antinave lanciata dall'aria."
    ja: "航空機発射の対艦兵器を発射しました。"
    ko: "공중 발사 대함 무장을 발사했습니다."
    "pt-BR": "Arma antinavio lançada do ar."
    ru: "Пуск противокорабельного оружия с воздуха."
    zh: "已发射空射反舰武器。"
    "zh-TW": "已發射空射反艦武器。"
  rifle_tooltip:
    de: "Luftgestützte Waffe gegen ein Landziel abgefeuert."
    en: "Air-launched weapon away against a land target."
    es: "Arma lanzada desde el aire contra un blanco terrestre."
    fr: "Arme tirée depuis les airs contre un objectif terrestre."
    it: "Arma lanciata dall'aria contro un bersaglio terrestre."
    ja: "地上目標に対し航空機発射の兵器を発射しました。"
    ko: "지상 표적을 향해 공중 발사 무장을 발사했습니다."
    "pt-BR": "Arma lançada do ar contra um alvo terrestre."
    ru: "Пуск оружия с воздуха по наземной цели."
    zh: "已对地面目标发射空射武器。"
    "zh-TW": "已對地面目標發射空射武器。"

  # ── Threat picture ────────────────────────────────────────────────
  buddy_spike_tooltip:
    de: "Ein eigenes oder verbündetes Feuerleitradar erfasst eine unserer Einheiten. Wird gemeldet, um Eigenbeschuss zu verhindern."
    en: "A friendly fire-control radar is illuminating one of our units. Called to prevent fratricide."
    es: "Un radar de control de tiro amigo ilumina una de nuestras unidades. Se anuncia para evitar el fuego amigo."
    fr: "Un radar de conduite de tir ami illumine une de nos unités. Annoncé pour éviter un tir fratricide."
    it: "Un radar di controllo del tiro amico sta illuminando una nostra unità. Segnalato per evitare il fuoco amico."
    ja: "味方の射撃管制レーダーが自軍ユニットを照射しています。同士討ちを防ぐための通報です。"
    ko: "아군 사격통제 레이더가 아군 유닛을 조사하고 있습니다. 오인 사격을 막기 위한 통보입니다."
    "pt-BR": "Um radar de controle de tiro amigo está iluminando uma de nossas unidades. Anunciado para evitar fogo amigo."
    ru: "Дружественный радар управления огнём подсвечивает наше подразделение. Сообщается для предотвращения дружественного огня."
    zh: "友方火控雷达正在照射我方单位。通报此项以避免误击。"
    "zh-TW": "友方火控雷達正在照射我方單位。通報此項以避免誤擊。"
  spike_tooltip:
    de: "Das Feuerleitradar eines feindlichen Luftfahrzeugs verfolgt eine unserer Einheiten."
    en: "A hostile aircraft's fire-control radar is tracking one of our units."
    es: "El radar de control de tiro de una aeronave hostil rastrea una de nuestras unidades."
    fr: "Le radar de conduite de tir d'un aéronef hostile suit une de nos unités."
    it: "Il radar di controllo del tiro di un velivolo ostile sta tracciando una nostra unità."
    ja: "敵航空機の射撃管制レーダーが自軍ユニットを追尾しています。"
    ko: "적 항공기의 사격통제 레이더가 아군 유닛을 추적하고 있습니다."
    "pt-BR": "O radar de controle de tiro de uma aeronave hostil está rastreando uma de nossas unidades."
    ru: "Радар управления огнём вражеского летательного аппарата ведёт наше подразделение."
    zh: "敌方航空器的火控雷达正在跟踪我方单位。"
    "zh-TW": "敵方航空器的火控雷達正在追蹤我方單位。"
  mud_tooltip:
    de: "Ein feindliches Feuerleitradar an Land oder auf See verfolgt eine unserer Einheiten."
    en: "A hostile surface or land fire-control radar is tracking one of our units."
    es: "Un radar de control de tiro hostil de superficie o terrestre rastrea una de nuestras unidades."
    fr: "Un radar de conduite de tir hostile de surface ou terrestre suit une de nos unités."
    it: "Un radar di controllo del tiro ostile di superficie o terrestre sta tracciando una nostra unità."
    ja: "敵の水上または地上の射撃管制レーダーが自軍ユニットを追尾しています。"
    ko: "적의 수상 또는 지상 사격통제 레이더가 아군 유닛을 추적하고 있습니다."
    "pt-BR": "Um radar de controle de tiro hostil de superfície ou terrestre está rastreando uma de nossas unidades."
    ru: "Вражеский надводный или наземный радар управления огнём ведёт наше подразделение."
    zh: "敌方水面或地面火控雷达正在跟踪我方单位。"
    "zh-TW": "敵方水面或地面火控雷達正在追蹤我方單位。"
  vampire_tooltip:
    de: "Ein anfliegender Flugkörper nähert sich einer unserer Einheiten."
    en: "An inbound missile is closing on one of our units."
    es: "Un misil entrante se aproxima a una de nuestras unidades."
    fr: "Un missile en approche se rapproche d'une de nos unités."
    it: "Un missile in arrivo si sta avvicinando a una nostra unità."
    ja: "飛来するミサイルが自軍ユニットに接近しています。"
    ko: "날아오는 미사일이 아군 유닛에 접근하고 있습니다."
    "pt-BR": "Um míssil em aproximação está fechando sobre uma de nossas unidades."
    ru: "Приближающаяся ракета сближается с нашим подразделением."
    zh: "来袭导弹正在接近我方单位。"
    "zh-TW": "來襲飛彈正在接近我方單位。"
  torpedo_tooltip:
    de: "Ein anlaufender Torpedo nähert sich einer unserer Einheiten."
    en: "An inbound torpedo is running at one of our units."
    es: "Un torpedo entrante corre hacia una de nuestras unidades."
    fr: "Une torpille en approche court vers une de nos unités."
    it: "Un siluro in arrivo sta correndo verso una nostra unità."
    ja: "航走中の魚雷が自軍ユニットに向かっています。"
    ko: "주행 중인 어뢰가 아군 유닛을 향하고 있습니다."
    "pt-BR": "Um torpedo em aproximação corre em direção a uma de nossas unidades."
    ru: "Идущая торпеда движется на наше подразделение."
    zh: "来袭鱼雷正驶向我方单位。"
    "zh-TW": "來襲魚雷正駛向我方單位。"
  naked_tooltip:
    de: "Kein Feuerleitradar liegt auf uns und keine Waffe ist im Anflug. Die Lage ist frei."
    en: "No fire-control radar is on us and no weapon is inbound. The picture is clear."
    es: "Ningún radar de control de tiro nos apunta y no hay armas entrantes. El cuadro está despejado."
    fr: "Aucun radar de conduite de tir sur nous et aucune arme en approche. La situation est dégagée."
    it: "Nessun radar di controllo del tiro su di noi e nessuna arma in arrivo. La situazione è libera."
    ja: "自軍を照射する射撃管制レーダーはなく、飛来する兵器もありません。状況はクリアです。"
    ko: "아군을 조사하는 사격통제 레이더도, 날아오는 무장도 없습니다. 상황은 깨끗합니다."
    "pt-BR": "Nenhum radar de controle de tiro sobre nós e nenhuma arma em aproximação. O quadro está limpo."
    ru: "Ни один радар управления огнём нас не ведёт, подлетающего оружия нет. Обстановка чистая."
    zh: "没有火控雷达照射我方，也没有来袭武器。态势清晰。"
    "zh-TW": "沒有火控雷達照射我方，也沒有來襲武器。態勢清晰。"

  # ── Contact picture ───────────────────────────────────────────────
  faded_tooltip:
    de: "Eine von unseren Sensoren gehaltene Spur ist verloren gegangen. Mit einer Wiederaufnahme ist zu rechnen."
    en: "A track our sensors were holding has been lost. Expect to regain it."
    es: "Se ha perdido una traza que mantenían nuestros sensores. Se espera recuperarla."
    fr: "Une piste tenue par nos capteurs a été perdue. On s'attend à la retrouver."
    it: "Una traccia mantenuta dai nostri sensori è stata persa. Se ne prevede il recupero."
    ja: "自軍センサーが保持していた航跡を失いました。再捕捉が見込まれます。"
    ko: "아군 센서가 유지하던 항적을 상실했습니다. 재획득이 예상됩니다."
    "pt-BR": "Uma trilha mantida por nossos sensores foi perdida. Espera-se recuperá-la."
    ru: "Трасса, которую вели наши сенсоры, потеряна. Ожидается её восстановление."
    zh: "我方传感器保持的航迹已丢失。预计可以重新捕获。"
    "zh-TW": "我方感測器保持的航跡已遺失。預計可以重新捕獲。"
  bandit_tooltip:
    de: "Ein Luftkontakt, der als feindlich identifiziert wurde."
    en: "An air contact identified as hostile."
    es: "Un contacto aéreo identificado como hostil."
    fr: "Un contact aérien identifié comme hostile."
    it: "Un contatto aereo identificato come ostile."
    ja: "敵性と識別された航空接触。"
    ko: "적대적으로 식별된 항공 접촉."
    "pt-BR": "Um contato aéreo identificado como hostil."
    ru: "Воздушный контакт, опознанный как враждебный."
    zh: "已识别为敌对的空中接触。"
    "zh-TW": "已識別為敵對的空中接觸。"
  bogey_tooltip:
    de: "Ein Luftkontakt, dessen Identität noch nicht bekannt ist."
    en: "An air contact whose identity is not yet known."
    es: "Un contacto aéreo cuya identidad aún se desconoce."
    fr: "Un contact aérien dont l'identité n'est pas encore connue."
    it: "Un contatto aereo la cui identità non è ancora nota."
    ja: "識別がまだ判明していない航空接触。"
    ko: "아직 정체가 밝혀지지 않은 항공 접촉."
    "pt-BR": "Um contato aéreo cuja identidade ainda não é conhecida."
    ru: "Воздушный контакт, чья принадлежность ещё не установлена."
    zh: "身份尚未查明的空中接触。"
    "zh-TW": "身分尚未查明的空中接觸。"
  skunk_tooltip:
    de: "Ein Überwasserkontakt, dessen Identität noch nicht bekannt ist."
    en: "A surface contact whose identity is not yet known."
    es: "Un contacto de superficie cuya identidad aún se desconoce."
    fr: "Un contact de surface dont l'identité n'est pas encore connue."
    it: "Un contatto di superficie la cui identità non è ancora nota."
    ja: "識別がまだ判明していない水上接触。"
    ko: "아직 정체가 밝혀지지 않은 수상 접촉."
    "pt-BR": "Um contato de superfície cuja identidade ainda não é conhecida."
    ru: "Надводный контакт, чья принадлежность ещё не установлена."
    zh: "身份尚未查明的水面接触。"
    "zh-TW": "身分尚未查明的水面接觸。"
  goblin_tooltip:
    de: "Ein Unterwasserkontakt, dessen Identität noch nicht bekannt ist."
    en: "A subsurface contact whose identity is not yet known."
    es: "Un contacto submarino cuya identidad aún se desconoce."
    fr: "Un contact sous-marin dont l'identité n'est pas encore connue."
    it: "Un contatto subacqueo la cui identità non è ancora nota."
    ja: "識別がまだ判明していない水中接触。"
    ko: "아직 정체가 밝혀지지 않은 수중 접촉."
    "pt-BR": "Um contato submarino cuja identidade ainda não é conhecida."
    ru: "Подводный контакт, чья принадлежность ещё не установлена."
    zh: "身份尚未查明的水下接触。"
    "zh-TW": "身分尚未查明的水下接觸。"

  # ── State ─────────────────────────────────────────────────────────
  splash_tooltip:
    de: "Wir bewerten ein Ziel als vernichtet. Die Einschätzung stammt von unseren eigenen Sensoren und kann sich noch als falsch erweisen."
    en: "We assess a target destroyed. Our own sensors made the call, so it may later be corrected."
    es: "Evaluamos un blanco como destruido. La estimación procede de nuestros propios sensores, por lo que puede corregirse más adelante."
    fr: "Nous évaluons une cible comme détruite. L'appréciation vient de nos propres capteurs et peut être corrigée par la suite."
    it: "Valutiamo un bersaglio come distrutto. La stima proviene dai nostri sensori e può essere corretta in seguito."
    ja: "目標を撃破と判定しました。自軍センサーによる判断のため、後に訂正される場合があります。"
    ko: "표적을 격파로 판정했습니다. 아군 센서에 의한 판단이므로 이후 정정될 수 있습니다."
    "pt-BR": "Avaliamos um alvo como destruído. A estimativa vem de nossos próprios sensores, portanto pode ser corrigida depois."
    ru: "Мы оцениваем цель как уничтоженную. Оценка сделана нашими сенсорами и может быть позже исправлена."
    zh: "我方判定目标已被摧毁。该判断来自我方传感器，之后可能被修正。"
    "zh-TW": "我方判定目標已被摧毀。該判斷來自我方感測器，之後可能被修正。"
  winchester_tooltip:
    de: "Eine Einheit hat ihre gesamte Munition verbraucht."
    en: "A unit has expended all of its ordnance."
    es: "Una unidad ha agotado todo su armamento."
    fr: "Une unité a épuisé tout son armement."
    it: "Un'unità ha esaurito tutto il suo armamento."
