  alliance_summary_tooltip:
    de: "Wer an wessen Seite kämpft. Wie viel verbündete Teams voneinander sehen, legt der Verbündeten-Modus unter Taktischer Realismus fest."
    en: "Who fights alongside whom. How much allied teams see of each other is set by the ally mode under Tactical Realism."
    es: "Quién combate junto a quién. Cuánto ven entre sí los equipos aliados lo fija el modo de aliados en Realismo Táctico."
    fr: "Qui combat aux côtés de qui. Ce que les équipes alliées voient les unes des autres est défini par le mode allié sous Réalisme tactique."
    it: "Chi combatte a fianco di chi. Quanto le squadre alleate vedono l'una dell'altra è stabilito dalla modalità alleati in Realismo Tattico."
    ja: "誰が誰と共に戦うかを示します。同盟チームが互いをどこまで見えるかは、戦術リアリズムの同盟モードで決まります。"
    ko: "누가 누구와 함께 싸우는지를 나타냅니다. 동맹 팀이 서로를 얼마나 볼 수 있는지는 전술 리얼리즘의 동맹 모드에서 정합니다."
    "pt-BR": "Quem luta ao lado de quem. O quanto as equipes aliadas veem umas das outras é definido pelo modo de aliados em Realismo Tático."
    ru: "Кто на чьей стороне. Насколько союзные команды видят друг друга, задаёт режим союзников в разделе «Тактическая достоверность»."
    zh: "谁与谁并肩作战。盟友队伍之间能看到多少，由战术拟真中的盟友模式决定。"
    "zh-TW": "誰與誰並肩作戰。盟友隊伍之間能看到多少，由戰術擬真中的盟友模式決定。"
