  alliance_versus:
    de: "%{a} gegen %{b}"
    en: "%{a} vs %{b}"
    es: "%{a} contra %{b}"
    fr: "%{a} contre %{b}"
    it: "%{a} contro %{b}"
    ja: "%{a} 対 %{b}"
    ko: "%{a} 대 %{b}"
    "pt-BR": "%{a} contra %{b}"
    ru: "%{a} против %{b}"
    zh: "%{a} 对 %{b}"
    "zh-TW": "%{a} 對 %{b}"
  alliance_summary_tooltip:
    de: "Wer an wessen Seite kämpft. Wie viel verbündete Teams voneinander sehen, legt der Verbündeten-Modus unter Taktischer Realismus fest."
    en: "Who fights alongside whom. How much allied teams see of each other is set by the ally mode under Tactical Realism."
    es: "Quién combate junto a quién. Cuánto ven entre sí los equipos aliados lo fija el modo de aliados en Realismo Táctico."
    fr: "Qui combat aux côtés de qui. Ce que les équipes alliées voient les unes des autres est défini par le mode allié sous Réalisme tactique."
    it: "Chi combatte a fianco di chi. Quanto le squadre alleate vedono l'una dell'altra è stabilito dalla modalità alleati in Realismo Tattico."
    ja: "誰が誰と共に戦うかを示します。同盟チームが互いをどこまで見えるかは、戦術リアリズムの同盟モードで決まります。"
    ko: "누가 누구와 함께 싸우는지를 나타냅니다. 동맹 팀이 서로를 얼마나 볼 수 있는지는 전술 리얼리즘의 동맹 모드에서 정합니다."
    "pt-BR": "Quem luta ao lado de quem. O quanto as equipes aliadas veem umas das outras é definido pelo modo de aliados em Realismo Tático."
    ru: "Кто на чьей стороне. Насколько союзные команды видят друг друга, задаёт режим союзников в разделе «Тактическая достоверность»."
    zh: "谁与谁并肩作战。盟友队伍之间能看到多少，由战术拟真中的盟友模式决定。"
    "zh-TW": "誰與誰並肩作戰。盟友隊伍之間能看到多少，由戰術擬真中的盟友模式決定。"
  alliance_single:
    de: "Alle Teams sind verbündet — dieses Match hat keine Feinde."
    en: "Every team is allied — this match has no enemies."
    es: "Todos los equipos son aliados: esta partida no tiene enemigos."
    fr: "Toutes les équipes sont alliées — cette partie n'a aucun ennemi."
    it: "Tutte le squadre sono alleate — questa partita non ha nemici."
    ja: "全チームが同盟しています — この対戦には敵がいません。"
    ko: "모든 팀이 동맹입니다 — 이 경기에는 적이 없습니다."
    "pt-BR": "Todas as equipes são aliadas — esta partida não tem inimigos."
    ru: "Все команды в союзе — в этом матче нет врагов."
    zh: "所有队伍都是盟友——本场对局没有敌人。"
    "zh-TW": "所有隊伍都是盟友——本場對局沒有敵人。"
  alliance_single_tooltip:
    de: "Ohne Feinde kann keine Seite besiegt werden, also beendet nur das Zeitlimit das Match. Ist es aus, endet das Match nie. „Jeder gegen Jeden“ macht jedes Team zum Feind."
    en: "With no enemies no side can be defeated, so only the match timeout can end it. With the timeout off, the match never ends. Free for All makes every team an enemy."
    es: "Sin enemigos ningún bando puede ser derrotado, así que solo el límite de tiempo puede terminar la partida. Sin límite de tiempo, la partida nunca termina. «Todos contra todos» hace enemigos a todos los equipos."
    fr: "Sans ennemi, aucun camp ne peut être vaincu : seule la limite de temps peut mettre fin à la partie. Sans limite de temps, la partie ne se termine jamais. « Chacun pour soi » rend chaque équipe ennemie."
    it: "Senza nemici nessuna parte può essere sconfitta, quindi solo il limite di tempo può terminare la partita. Senza limite di tempo, la partita non finisce mai. «Tutti contro tutti» rende nemica ogni squadra."
    ja: "敵がいないため、どの陣営も敗北しません。対戦を終わらせられるのは制限時間だけです。制限時間がオフの場合、対戦は終わりません。「フリー・フォー・オール」で全チームが敵同士になります。"
    ko: "적이 없으면 어느 쪽도 패배하지 않으므로 경기 제한 시간만이 경기를 끝낼 수 있습니다. 제한 시간이 꺼져 있으면 경기는 끝나지 않습니다. '개인전'을 누르면 모든 팀이 서로 적이 됩니다."
    "pt-BR": "Sem inimigos nenhum lado pode ser derrotado, então só o limite de tempo pode encerrar a partida. Sem limite de tempo, a partida nunca termina. \"Todos contra todos\" torna todas as equipes inimigas."
    ru: "Без врагов ни одну сторону нельзя победить, поэтому матч завершит только лимит времени. Без лимита времени матч не закончится никогда. «Каждый за себя» делает все команды врагами."
    zh: "没有敌人，任何一方都无法被击败，只有对局时限能结束对局。关闭时限时，对局永不结束。“混战”会让每支队伍互为敌人。"
    "zh-TW": "沒有敵人，任何一方都無法被擊敗，只有對局時限能結束對局。關閉時限時，對局永不結束。「混戰」會讓每支隊伍互為敵人。"
  affiliation_ffa:
    de: "Jeder gegen Jeden"
    en: "Free for All"
    es: "Todos contra todos"
    fr: "Chacun pour soi"
    it: "Tutti contro tutti"
    ja: "フリー・フォー・オール"
    ko: "개인전"
    "pt-BR": "Todos contra todos"
    ru: "Каждый за себя"
    zh: "混战"
    "zh-TW": "混戰"
  affiliation_ffa_tooltip:
    de: "Löscht alle Bündnisse — jedes Team wird zum Feind aller anderen."
    en: "Clear every alliance — every team becomes everyone's enemy."
    es: "Elimina todas las alianzas: cada equipo se convierte en enemigo de todos los demás."
    fr: "Efface toutes les alliances — chaque équipe devient l'ennemie de toutes les autres."
    it: "Cancella tutte le alleanze — ogni squadra diventa nemica di tutte le altre."
    ja: "すべての同盟を解除します — 各チームは他の全チームの敵になります。"
    ko: "모든 동맹을 해제합니다 — 각 팀이 다른 모든 팀의 적이 됩니다."
    "pt-BR": "Remove todas as alianças — cada equipe se torna inimiga de todas as outras."
    ru: "Отменяет все союзы — каждая команда становится врагом всех остальных."
    zh: "清除所有联盟——每支队伍都成为其他所有队伍的敌人。"
    "zh-TW": "清除所有聯盟——每支隊伍都成為其他所有隊伍的敵人。"
  # Same in all languages — "2v2" is a match-format notation universal in gaming
  affiliation_2v2:
    en: "2v2"
  affiliation_2v2_tooltip:
    de: "Verbündet die ersten beiden Teams miteinander und die letzten beiden miteinander — die beiden Paare sind gegeneinander verfeindet."
    en: "Ally the first two teams together and the last two together, enemies across the pair."
    es: "Alía a los dos primeros equipos entre sí y a los dos últimos entre sí, siendo enemigos entre ambos pares."
    fr: "Allie les deux premières équipes entre elles et les deux dernières entre elles, les deux paires étant ennemies l'une de l'autre."
    it: "Allea le prime due squadre tra loro e le ultime due tra loro, nemiche tra le due coppie."
    ja: "最初の2チームを同盟に、残りの2チームを同盟にし、両ペア同士は敵対します。"
    ko: "처음 두 팀을 서로 동맹으로, 마지막 두 팀을 서로 동맹으로 만들고 두 쌍은 서로 적이 됩니다."
    "pt-BR": "Alia as duas primeiras equipes entre si e as duas últimas entre si, sendo inimigas entre os dois pares."
    ru: "Объединяет первые две команды в союз и последние две в союз — эти две пары враждуют между собой."
    zh: "让前两支队伍互为同盟，后两支队伍互为同盟，两组之间互为敌方。"
    "zh-TW": "讓前兩支隊伍互為同盟，後兩支隊伍互為同盟，兩組之間互為敵方。"
