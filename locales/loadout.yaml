    "pt-BR": "Um projeto que este porta-drones transporta ou estoca está ausente da biblioteca, por isso ele não pode ser construído. Abra-o no projetista para substituir a referência ou excluir o projeto. Detalhes: %{reason}"
    ru: "Проект, который этот авианосец несёт или хранит, отсутствует в библиотеке, поэтому его нельзя построить. Откройте его в конструкторе, чтобы заменить ссылку или удалить проект. Подробности: %{reason}"
    zh: "此航母搭载或储备的某个设计在库中缺失，因此无法建造。在设计器中打开它以替换引用或删除该设计。详情：%{reason}"
    "zh-TW": "此航母搭載或儲備的某個設計在庫中缺失，因此無法建造。在設計器中開啟它以替換引用或刪除該設計。詳情：%{reason}"
