    ko: "이 저장 파일은 더 이상 설치되어 있지 않은 모드 콘텐츠를 참조합니다. 다음 유닛은 복원할 수 없었습니다:"
    "pt-BR": "Este save faz referência a conteúdo de mod que não está mais instalado. As unidades a seguir não puderam ser restauradas:"
    ru: "Это сохранение ссылается на содержимое мода, которое больше не установлено. Следующие юниты не удалось восстановить:"
    zh: "此存档引用了尚未安装的模组内容。以下单位无法恢复："
    "zh-TW": "此存檔引用了未安裝的模組內容。以下單位無法復原："
