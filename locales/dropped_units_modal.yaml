# dropped, and the definitions they needed.

dropped_units_modal:
  title:
    de: "EINHEITEN NICHT WIEDERHERGESTELLT"
    en: "UNITS NOT RESTORED"
    es: "UNIDADES NO RESTAURADAS"
    fr: "UNITÉS NON RESTAURÉES"
    it: "UNITÀ NON RIPRISTINATE"
    ja: "復元されなかったユニット"
