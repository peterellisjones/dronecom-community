    de: "Dieser Spielstand verweist auf Mod-Inhalte, die nicht mehr installiert sind. Die folgenden Einheiten konnten nicht wiederhergestellt werden:"
    en: "This save named mod content that is no longer installed. The following units could not be restored:"
    es: "Esta partida guardada hace referencia a contenido de mods que ya no está instalado. Las siguientes unidades no se pudieron restaurar:"
    fr: "Cette sauvegarde fait référence à du contenu de mod qui n'est plus installé. Les unités suivantes n'ont pas pu être restaurées :"
