common:
  # #3077/#3097: tag marking a design that ships with the game rather than one
  # the player authored. Shared by the tactical inspect masthead and the Drone
  # Designer library — both are tactical zones, so ALL CAPS in both, with the
  # same prose explanation on hover.
  default_design_badge:
    de: "STANDARD"
    en: "DEFAULT"
    es: "ESTÁNDAR"
    fr: "STANDARD"
    it: "STANDARD"
    ja: "標準設計"
    ko: "기본 설계"
    "pt-BR": "PADRÃO"
    ru: "СТАНДАРТ"
    zh: "预设设计"
    "zh-TW": "預設設計"
  default_design_badge_tooltip:
    de: "Mitgelieferter Entwurf. Kopiere ihn im Drohnen-Designer, um ihn zu bearbeiten."
    en: "Shipped design. Copy it in the Drone Designer to edit."
    es: "Diseño incluido. Cópialo en el Diseñador de Drones para editarlo."
    fr: "Modèle fourni. Copiez-le dans le Concepteur de drones pour le modifier."
    it: "Progetto incluso. Copialo nel Progettista di droni per modificarlo."
    ja: "ゲーム付属の標準設計。ドローン設計室でコピーすれば編集できる。"
    ko: "게임에 기본 포함된 설계입니다. 드론 설계실에서 복사하면 편집할 수 있습니다."
    "pt-BR": "Acompanha o jogo. Copie-o no Projetista de Drones para editá-lo."
    ru: "Входит в комплект игры. Скопируйте его в конструкторе дронов, чтобы редактировать."
    zh: "游戏自带设计。可在无人机设计室中复制以编辑。"
    "zh-TW": "遊戲內建設計。可在無人機設計室中複製以編輯。"
  # #2717: the click / shift-click interaction hint appended to every vehicle
  # entity link's hover tooltip. Guidance prose, so sentence case — the tooltip
  # body above it is the ALL-CAPS tactical readout.
  link_interaction_hint:
    de: "Klicken zum Auswählen. Shift-Klick, um zur Auswahl hinzuzufügen."
    en: "Click to select. Shift-click to add to the selection."
    es: "Haz clic para seleccionar. Mayús+clic para añadir a la selección."
    fr: "Cliquez pour sélectionner. Maj+clic pour ajouter à la sélection."
    it: "Fai clic per selezionare. Maiusc+clic per aggiungere alla selezione."
    ja: "クリックで選択します。Shift+クリックで選択に追加します。"
    ko: "클릭하여 선택합니다. Shift+클릭으로 선택에 추가합니다."
    "pt-BR": "Clique para selecionar. Shift+clique para adicionar à seleção."
    ru: "Нажмите, чтобы выбрать. Shift+клик, чтобы добавить к выделению."
    zh: "单击选择。Shift+单击添加到选择。"
    "zh-TW": "點擊選取。Shift+點擊加入選取。"
  # #4661: the right-click isolate/restore-all hint appended to every filter
  # chip's hover tooltip (domain/class/source chips, ...). Guidance prose, so
  # sentence case, composed in by the toolkit widget itself so no panel call
  # site can forget it.
  filter_chip_interaction_hint:
    de: "Rechtsklick zeigt nur dieses an. Erneuter Rechtsklick zeigt wieder alles an."
    en: "Right-click to show only this. Right-click it again to show everything."
    es: "Haz clic derecho para mostrar solo este. Vuelve a hacer clic derecho para mostrar todo de nuevo."
    fr: "Clic droit pour n'afficher que celui-ci. Un second clic droit réaffiche tout."
    it: "Clic destro per mostrare solo questo. Un altro clic destro per mostrare di nuovo tutto."
    ja: "右クリックでこれだけを表示します。もう一度右クリックするとすべて表示されます。"
    ko: "우클릭하면 이것만 표시됩니다. 다시 우클릭하면 전체가 다시 표시됩니다."
    "pt-BR": "Clique com o direito para mostrar somente este. Clique com o direito novamente para mostrar tudo de novo."
    ru: "Щёлкните правой кнопкой, чтобы показать только это. Щёлкните правой кнопкой ещё раз, чтобы показать всё."
    zh: "右键点击以仅显示此项。再次右键点击可显示全部。"
    "zh-TW": "右鍵點擊以僅顯示此項。再次右鍵點擊可顯示全部。"
  remove:
    de: "Entfernen"
    en: "Remove"
    es: "Quitar"
    fr: "Retirer"
    it: "Rimuovi"
    ja: "削除"
    ko: "제거"
    "pt-BR": "Remover"
    ru: "Удалить"
    zh: "移除"
    "zh-TW": "移除"
