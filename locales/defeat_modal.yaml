_version: 2

defeat_modal:
  title:
    de: "STREITKRÄFTE VERNICHTET"
    en: "FORCE ELIMINATED"
    es: "FUERZA ELIMINADA"
    fr: "FORCE ÉLIMINÉE"
    it: "FORZA ELIMINATA"
    ja: "戦力壊滅"
    ko: "전력 격멸"
    "pt-BR": "FORÇA ELIMINADA"
    ru: "СИЛЫ УНИЧТОЖЕНЫ"
    zh: "部队已消灭"
    "zh-TW": "部隊已消滅"
  body:
    de: "Dein Träger ist verloren. Das Gefecht geht ohne dich weiter."
    en: "Your carrier is gone. The engagement continues without you."
    es: "Tu portaaviones se ha perdido. El combate continúa sin ti."
    fr: "Votre porte-avions est perdu. L'engagement continue sans vous."
    it: "La tua portaerei è perduta. Il combattimento continua senza di te."
    ja: "空母を喪失した。戦闘は指揮官不在のまま続く。"
    ko: "항모를 잃었습니다. 지휘관 없이 교전이 계속됩니다."
    "pt-BR": "Seu porta-aviões foi perdido. O combate continua sem você."
    ru: "Ваш авианосец потерян. Бой продолжается без вас."
    zh: "你的航母已损失。战斗将在没有你的参与下继续。"
    "zh-TW": "你的航母已損失。戰鬥將在沒有你的參與下繼續。"
  body_tooltip:
    de: "Das Match endet erst, wenn nur noch ein Bündnis im Gefecht steht. Der Verlust deines Trägers beendet es nicht, solange ein Verbündeter noch kämpft."
    en: "The match ends only when one alliance is left standing. Losing your carrier doesn't end it while an ally is still fighting."
    es: "La partida termina solo cuando queda una sola alianza en pie. La pérdida de tu portaaviones no la termina mientras un aliado siga luchando."
    fr: "La partie ne se termine que lorsqu'une seule alliance reste en lice. La perte de votre porte-avions ne l'arrête pas tant qu'un allié combat encore."
    it: "La partita finisce solo quando resta in campo una sola alleanza. La perdita della tua portaerei non la conclude finché un alleato continua a combattere."
    ja: "残る同盟が一つになって初めて試合は終わる。空母を失っても、同盟国が戦い続けている限り試合は終わらない。"
    ko: "동맹이 하나만 남아야 비로소 경기가 종료됩니다. 우군이 아직 싸우고 있다면 항모를 잃어도 경기는 끝나지 않습니다."
    "pt-BR": "A partida só termina quando resta apenas uma aliança em combate. A perda do seu porta-aviões não a encerra enquanto um aliado ainda estiver lutando."
    ru: "Матч заканчивается только когда в бою остаётся один союз. Потеря авианосца не завершает его, пока союзник продолжает сражаться."
    zh: "只有当战场上只剩下一个联盟时，对局才会结束。只要还有盟友在战斗，航母的损失并不会结束对局。"
    "zh-TW": "只有當戰場上只剩下一個聯盟時，對局才會結束。只要還有盟友在戰鬥，航母的損失並不會結束對局。"
  fight_on:
    de: "WEITERKÄMPFEN"
    en: "FIGHT ON"
    es: "SEGUIR LUCHANDO"
    fr: "CONTINUER LE COMBAT"
    it: "CONTINUA A COMBATTERE"
    ja: "戦闘を継続"
    ko: "교전 계속"
    "pt-BR": "CONTINUAR LUTANDO"
    ru: "ПРОДОЛЖИТЬ БОЙ"
    zh: "继续战斗"
    "zh-TW": "繼續戰鬥"
  fight_on_tooltip:
    de: "Befehlige weiterhin die Einheiten, die deinen Träger überlebt haben. Sie können weder aufmunitioniert noch geborgen werden."
    en: "Keep commanding the units that outlived your carrier. They cannot rearm or recover."
    es: "Sigue al mando de las unidades que sobrevivieron a tu portaaviones. No pueden rearmarse ni ser recuperadas."
    fr: "Continuez à commander les unités qui ont survécu à votre porte-avions. Elles ne peuvent ni se réarmer ni être récupérées."
    it: "Continua a comandare le unità sopravvissute alla tua portaerei. Non possono riarmarsi né essere recuperate."
    ja: "空母を失っても生き残った部隊の指揮を続けられる。ただし再武装も収容もできない。"
    ko: "항모를 잃은 뒤에도 살아남은 부대의 지휘를 계속합니다. 재무장하거나 회수될 수 없습니다."
    "pt-BR": "Continue no comando das unidades que sobreviveram ao seu porta-aviões. Elas não podem se rearmar nem ser recuperadas."
    ru: "Продолжайте командовать подразделениями, пережившими гибель авианосца. Они не могут перевооружиться или быть возвращены на корабль."
    zh: "继续指挥在航母损失后幸存的部队。它们无法再武装或被回收。"
    "zh-TW": "繼續指揮在航母損失後倖存的部隊。它們無法再武裝或被回收。"
  concede:
    de: "AUFGEBEN"
    en: "CONCEDE"
    es: "CONCEDER"
    fr: "CONCÉDER"
    it: "CONCEDI"
    ja: "戦闘を断念"
    ko: "교전 포기"
    "pt-BR": "CONCEDER"
    ru: "КАПИТУЛИРОВАТЬ"
    zh: "认输"
    "zh-TW": "認輸"
  concede_unavailable_tooltip:
    de: "Als Host kannst du nicht aufgeben, da dies das Match für alle beenden würde."
    en: "The host can't concede, since ending the match would end it for every player."
    es: "El anfitrión no puede conceder, ya que eso terminaría la partida para todos."
    fr: "L'hôte ne peut pas concéder, car cela mettrait fin à la partie pour tout le monde."
    it: "L'host non può concedere, perché ciò terminerebbe la partita per tutti."
    ja: "ホストは戦闘を断念できない。試合が全員にとって終了してしまうため。"
    ko: "호스트는 교전을 포기할 수 없습니다. 경기가 모두에게 종료되기 때문입니다."
    "pt-BR": "O anfitrião não pode conceder, pois isso encerraria a partida para todos."
    ru: "Хост не может капитулировать, так как это завершит матч для всех игроков."
    zh: "作为主机无法认输，否则将结束所有人的对局。"
    "zh-TW": "作為主機無法認輸，否則將結束所有人的對局。"
  concede_tooltip:
    de: "Das Gefecht beenden und die Auswertung ansehen."
    en: "End the engagement and see the debrief."
    es: "Terminar el combate y ver el informe."
    fr: "Mettre fin à l'engagement et consulter le bilan."
    it: "Termina il combattimento e visualizza il rapporto."
    ja: "戦闘を終了し、報告を確認する。"
    ko: "교전을 종료하고 보고를 확인합니다."
    "pt-BR": "Encerrar o combate e ver o relatório."
    ru: "Завершить бой и посмотреть разбор."
    zh: "结束战斗并查看总结。"
    "zh-TW": "結束戰鬥並查看總結。"
  take_command:
    de: "%{name} ÜBERNEHMEN (%{count} EINHEITEN)"
    en: "TAKE COMMAND OF %{name} (%{count} UNITS)"
    es: "TOMAR EL MANDO DE %{name} (%{count} UNIDADES)"
    fr: "PRENDRE LE COMMANDEMENT DE %{name} (%{count} UNITÉS)"
    it: "PRENDI IL COMANDO DI %{name} (%{count} UNITÀ)"
    ja: "%{name}を指揮（%{count}ユニット）"
    ko: "%{name} 지휘 인수 (%{count} 유닛)"
    "pt-BR": "ASSUMIR O COMANDO DE %{name} (%{count} UNIDADES)"
    ru: "ПРИНЯТЬ КОМАНДОВАНИЕ %{name} (%{count} ЕДИНИЦ)"
    zh: "接管 %{name}（%{count} 个单位）"
    "zh-TW": "接管 %{name}（%{count} 個單位）"
  take_command_tooltip:
    de: "Übergib deine verbliebenen Einheiten der KI und übernimm für den Rest des Gefechts das Kommando über diesen verbündeten Verband. Sein Träger ist noch einsatzbereit."
    en: "Hand your surviving units to the AI and take command of this allied force for the rest of the match. Its carrier is still operational."
    es: "Entrega tus unidades supervivientes a la IA y toma el mando de esta fuerza aliada durante el resto de la partida. Su portaaviones sigue operativo."
    fr: "Confiez vos unités survivantes à l'IA et prenez le commandement de cette force alliée pour le reste de la partie. Son porte-avions est toujours opérationnel."
    it: "Affida le tue unità superstiti all'IA e assumi il comando di questa forza alleata per il resto della partita. La sua portaerei è ancora operativa."
    ja: "残存部隊をAIに委ね、この同盟部隊の指揮を試合終了まで引き継ぐ。空母はまだ健在だ。"
    ko: "남은 부대를 AI에 맡기고 남은 경기 동안 이 우군 부대의 지휘를 인수합니다. 이 부대의 항모는 아직 작전 가능합니다."
    "pt-BR": "Entregue suas unidades sobreviventes à IA e assuma o comando desta força aliada pelo resto da partida. O porta-aviões dela ainda está operacional."
    ru: "Передайте уцелевшие подразделения ИИ и примите командование этим союзным соединением до конца матча. Его авианосец ещё боеспособен."
    zh: "将幸存部队交给 AI，并在本局剩余时间内接管这支盟军部队。其航母仍可作战。"
    "zh-TW": "將倖存部隊交給 AI，並在本局剩餘時間內接管這支盟軍部隊。其航母仍可作戰。"
  take_command_no_carrier_tooltip:
    de: "Übergib deine verbliebenen Einheiten der KI und übernimm für den Rest des Gefechts das Kommando über diesen verbündeten Verband. Sein Träger ist verloren, daher können seine Einheiten weder aufmunitionieren noch geborgen werden."
    en: "Hand your surviving units to the AI and take command of this allied force for the rest of the match. Its carrier is gone, so its units cannot rearm or recover."
    es: "Entrega tus unidades supervivientes a la IA y toma el mando de esta fuerza aliada durante el resto de la partida. Su portaaviones se ha perdido, por lo que sus unidades no pueden rearmarse ni ser recuperadas."
    fr: "Confiez vos unités survivantes à l'IA et prenez le commandement de cette force alliée pour le reste de la partie. Son porte-avions est perdu, ses unités ne peuvent donc ni se réarmer ni être récupérées."
    it: "Affida le tue unità superstiti all'IA e assumi il comando di questa forza alleata per il resto della partita. La sua portaerei è perduta, quindi le sue unità non possono riarmarsi né essere recuperate."
    ja: "残存部隊をAIに委ね、この同盟部隊の指揮を試合終了まで引き継ぐ。空母を失っているため、部隊は再武装も収容もできない。"
    ko: "남은 부대를 AI에 맡기고 남은 경기 동안 이 우군 부대의 지휘를 인수합니다. 이 부대는 항모를 잃어 재무장하거나 회수될 수 없습니다."
    "pt-BR": "Entregue suas unidades sobreviventes à IA e assuma o comando desta força aliada pelo resto da partida. O porta-aviões dela foi perdido, então suas unidades não podem se rearmar nem ser recuperadas."
    ru: "Передайте уцелевшие подразделения ИИ и примите командование этим союзным соединением до конца матча. Его авианосец потерян, поэтому его подразделения не могут перевооружиться или вернуться на корабль."
    zh: "将幸存部队交给 AI，并在本局剩余时间内接管这支盟军部队。其航母已损失，因此部队无法再武装或被回收。"
    "zh-TW": "將倖存部隊交給 AI，並在本局剩餘時間內接管這支盟軍部隊。其航母已損失，因此部隊無法再武裝或被回收。"
  spectate:
    de: "ZUSEHEN"
    en: "SPECTATE"
    es: "OBSERVAR"
    fr: "OBSERVER"
    it: "OSSERVA"
    ja: "観戦"
    ko: "관전"
    "pt-BR": "ASSISTIR"
    ru: "НАБЛЮДАТЬ"
    zh: "观战"
    "zh-TW": "觀戰"
  spectate_tooltip:
    de: "Übergib deine verbliebenen Einheiten der KI und verfolge den Rest des Gefechts bis zum Ende."
    en: "Hand your surviving units to the AI and watch the rest of the match to its end."
    es: "Entrega tus unidades supervivientes a la IA y observa el resto de la partida hasta el final."
    fr: "Confiez vos unités survivantes à l'IA et suivez le reste de la partie jusqu'à la fin."
    it: "Affida le tue unità superstiti all'IA e osserva il resto della partita fino alla fine."
    ja: "残存部隊をAIに委ね、試合の残りを最後まで観戦する。"
    ko: "남은 부대를 AI에 맡기고 남은 경기를 끝까지 관전합니다."
    "pt-BR": "Entregue suas unidades sobreviventes à IA e assista ao resto da partida até o fim."
    ru: "Передайте уцелевшие подразделения ИИ и наблюдайте за оставшейся частью матча до конца."
    zh: "将幸存部队交给 AI，观战直至对局结束。"
    "zh-TW": "將倖存部隊交給 AI，觀戰直到對局結束。"
