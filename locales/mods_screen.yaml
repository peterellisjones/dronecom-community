    "pt-BR": "Caminho do arquivo que falhou, relativo à pasta do mod."
    ru: "Путь к файлу, вызвавшему ошибку, относительно папки мода."
    zh: "失败文件的路径，相对于模组文件夹。"
    "zh-TW": "失敗檔案的路徑，相對於模組資料夾。"
  error_message_tooltip:
    de: "Die Diagnose des Loaders für diese Datei (Englisch)."
    en: "The loader's diagnostic for this file (English)."
    es: "El diagnóstico del cargador para este archivo (en inglés)."
    fr: "Le diagnostic du chargeur pour ce fichier (en anglais)."
    it: "La diagnostica del caricatore per questo file (in inglese)."
    ja: "このファイルに対するローダーの診断（英語）。"
    ko: "이 파일에 대한 로더의 진단(영어)."
    "pt-BR": "O diagnóstico do carregador para este arquivo (em inglês)."
    ru: "Диагностика загрузчика для этого файла (на английском)."
    zh: "加载器对该文件的诊断（英文）。"
    "zh-TW": "載入器對此檔案的診斷（英文）。"
  error_hint_tooltip:
    de: "Eine fehlende Referenz bedeutet meist, dass eine weitere Mod ebenfalls abonniert werden muss. Lege sie auf der Workshop-Seite als erforderliches Element fest."
    en: "A missing reference usually means another mod must be subscribed too. Set it as a Required Item on the Workshop page."
    es: "Una referencia faltante suele significar que también debe suscribirse otro mod. Configúralo como elemento requerido en la página del Workshop."
    fr: "Une référence manquante signifie généralement qu'un autre mod doit aussi être abonné. Définissez-le comme élément requis sur la page du Workshop."
    it: "Un riferimento mancante di solito significa che occorre iscriversi anche a un'altra mod. Impostala come elemento richiesto nella pagina del Workshop."
    ja: "参照先が見つからない場合、通常は別のMODも購読する必要があります。ワークショップページで必須アイテムに設定してください。"
    ko: "참조 대상이 없으면 보통 다른 모드도 구독해야 한다는 의미입니다. 워크숍 페이지에서 필수 항목으로 설정하세요."
    "pt-BR": "Uma referência ausente geralmente significa que outro mod também precisa ser inscrito. Defina-o como Item Necessário na página da Workshop."
    ru: "Отсутствующая ссылка обычно означает, что нужно подписаться и на другой мод. Укажите его как обязательный элемент на странице мастерской."
    zh: "缺少引用通常意味着还需订阅另一个模组。请在创意工坊页面将其设为必需项目。"
    "zh-TW": "缺少參照通常表示還需訂閱另一個模組。請在創意工坊頁面將其設為必要項目。"
  restart_note_tooltip:
    de: "Neu starten, um Mod-Inhalte zu übernehmen. ERNEUT PRÜFEN aktualisiert nur die Diagnosen."
    en: "Restart to apply mod content. RE-CHECK only refreshes diagnostics."
    es: "Reinicia para aplicar el contenido de los mods. RE-VERIFICAR solo actualiza los diagnósticos."
    fr: "Redémarrez pour appliquer le contenu des mods. RE-VÉRIFIER n'actualise que les diagnostics."
    it: "Riavvia per applicare i contenuti delle mod. RICONTROLLA aggiorna solo le diagnostiche."
    ja: "再起動するとMODの内容が反映されます。再チェックは診断のみを更新します。"
    ko: "다시 시작해야 모드 콘텐츠가 적용됩니다. 다시 확인은 진단만 새로 고칩니다."
    "pt-BR": "Reinicie para aplicar o conteúdo dos mods. REVERIFICAR atualiza apenas os diagnósticos."
    ru: "Перезапустите игру, чтобы применить содержимое модов. ПЕРЕПРОВЕРИТЬ обновляет только диагностику."
    zh: "重启以应用模组内容。重新检查仅刷新诊断。"
    "zh-TW": "重新啟動以套用模組內容。重新檢查僅重新整理診斷。"
  restart_pending_tooltip:
    de: "Das Spiel übernimmt Mod-Inhalte einmal beim Start. Das Aktivieren oder Deaktivieren eines Mods wirkt erst, wenn du das Spiel beendest und neu startest."
    en: "The game merges mod content once at launch, so enabling or disabling a mod takes effect after you quit and start the game again."
    es: "El juego incorpora el contenido de los mods una vez al iniciarse, así que activar o desactivar un mod surte efecto cuando sales y vuelves a iniciar el juego."
    fr: "Le jeu intègre le contenu des mods une seule fois au lancement : activer ou désactiver un mod prend effet après avoir quitté puis relancé le jeu."
    it: "Il gioco integra i contenuti delle mod una sola volta all'avvio, quindi attivare o disattivare una mod ha effetto dopo aver chiuso e riavviato il gioco."
    ja: "MODの内容は起動時に一度だけ統合されるため、MODの有効化・無効化はゲームを終了して再度起動した後に反映されます。"
    ko: "게임은 시작할 때 한 번만 모드 콘텐츠를 병합하므로, 모드 사용 여부 변경은 게임을 종료했다가 다시 시작한 후에 적용됩니다."
    "pt-BR": "O jogo incorpora o conteúdo dos mods uma vez ao iniciar, então ativar ou desativar um mod só tem efeito depois que você sai e inicia o jogo novamente."
    ru: "Игра объединяет содержимое модов один раз при запуске, поэтому включение или отключение мода вступает в силу после выхода и повторного запуска игры."
    zh: "游戏仅在启动时合并一次模组内容，因此启用或禁用模组会在你退出并重新启动游戏后生效。"
    "zh-TW": "遊戲僅在啟動時合併一次模組內容，因此啟用或停用模組會在你結束並重新啟動遊戲後生效。"
  enabled_tooltip:
    de: "Entferne den Haken, damit dieser Mod ab dem nächsten Start nicht mehr geladen wird. Seine Entwürfe und gespeicherten Einheiten sind dann nicht verfügbar, als wäre er deinstalliert."
    en: "Untick to stop this mod loading from the next launch. Its designs and saved units become unavailable, as if it were uninstalled."
    es: "Desmárcalo para que este mod deje de cargarse a partir del próximo inicio. Sus diseños y unidades guardadas dejarán de estar disponibles, como si estuviera desinstalado."
    fr: "Décochez pour ne plus charger ce mod à partir du prochain lancement. Ses plans et unités sauvegardées deviennent indisponibles, comme s'il était désinstallé."
    it: "Togli la spunta per non caricare più questa mod dal prossimo avvio. I suoi progetti e le unità salvate non saranno disponibili, come se fosse disinstallata."
    ja: "チェックを外すと、次回起動時からこのMODは読み込まれません。設計と保存済みユニットは、アンインストールした場合と同様に利用できなくなります。"
    ko: "선택을 해제하면 다음 시작부터 이 모드를 불러오지 않습니다. 설계와 저장된 유닛은 제거한 것처럼 사용할 수 없게 됩니다."
    "pt-BR": "Desmarque para que este mod deixe de carregar a partir da próxima inicialização. Seus projetos e unidades salvas ficam indisponíveis, como se ele tivesse sido desinstalado."
    ru: "Снимите флажок, чтобы мод не загружался со следующего запуска. Его проекты и сохранённые юниты станут недоступны, как если бы он был удалён."
    zh: "取消勾选后，该模组将从下次启动起不再加载。其设计和已保存单位将不可用，如同已卸载。"
    "zh-TW": "取消勾選後，此模組將從下次啟動起不再載入。其設計與已儲存單位將無法使用，如同已解除安裝。"
  disables_on_restart_tooltip:
    de: "Deaktiviert, aber seine Inhalte bleiben bis zum Neustart des Spiels geladen."
    en: "Disabled, but its content stays loaded until you restart the game."
    es: "Desactivado, pero su contenido sigue cargado hasta que reinicies el juego."
    fr: "Désactivé, mais son contenu reste chargé jusqu'au redémarrage du jeu."
    it: "Disattivata, ma i suoi contenuti restano caricati finché non riavvii il gioco."
    ja: "無効にしましたが、ゲームを再起動するまで内容は読み込まれたままです。"
    ko: "사용 안 함으로 설정했지만 게임을 다시 시작할 때까지 콘텐츠가 계속 로드되어 있습니다."
    "pt-BR": "Desativado, mas seu conteúdo continua carregado até você reiniciar o jogo."
    ru: "Отключён, но его содержимое остаётся загруженным до перезапуска игры."
    zh: "已禁用，但其内容在重启游戏前仍保持加载。"
    "zh-TW": "已停用，但其內容在重新啟動遊戲前仍保持載入。"
  enables_on_restart_tooltip:
    de: "Aktiviert, aber seine Inhalte werden erst nach einem Neustart des Spiels geladen."
    en: "Enabled, but its content loads only after you restart the game."
    es: "Activado, pero su contenido solo se carga después de reiniciar el juego."
    fr: "Activé, mais son contenu ne sera chargé qu'après le redémarrage du jeu."
    it: "Attivata, ma i suoi contenuti vengono caricati solo dopo il riavvio del gioco."
    ja: "有効にしましたが、内容はゲームを再起動した後に読み込まれます。"
    ko: "사용으로 설정했지만 콘텐츠는 게임을 다시 시작한 후에 로드됩니다."
    "pt-BR": "Ativado, mas seu conteúdo só carrega depois que você reiniciar o jogo."
    ru: "Включён, но его содержимое загрузится только после перезапуска игры."
    zh: "已启用，但其内容仅在重启游戏后加载。"
    "zh-TW": "已啟用，但其內容僅在重新啟動遊戲後載入。"
  disabled_detail_tooltip:
    de: "Setze den Haken bei AKTIV, um ihn beim nächsten Start zu laden."
    en: "Tick ENABLED to load it on the next launch."
    es: "Marca ACTIVO para cargarlo en el próximo inicio."
    fr: "Cochez ACTIVÉ pour le charger au prochain lancement."
    it: "Spunta ATTIVA per caricarla al prossimo avvio."
    ja: "次回起動時に読み込むには「有効」にチェックを入れてください。"
    ko: "다음 시작 시 불러오려면 '사용'을 선택하세요."
    "pt-BR": "Marque ATIVO para carregá-lo na próxima inicialização."
    ru: "Отметьте «ВКЛЮЧЁН», чтобы загрузить его при следующем запуске."
    zh: "勾选“已启用”即可在下次启动时加载。"
    "zh-TW": "勾選「已啟用」即可在下次啟動時載入。"
