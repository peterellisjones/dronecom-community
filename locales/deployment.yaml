_version: 2

deployment:
  heading_tooltip:
    de: "Wo jeder Träger und jeder eingeschiffte Rumpf das Match beginnt. Träger starten in deinem Aufstellungsgebiet, von der Aufstellungslinie bis zum Rand; U-Boote dürfen auch weiter vorn starten, zahlen den Weg dorthin aber mit Treibstoff."
    en: "Where each carrier and embarked hull starts the match. Carriers start in your deployment area, from the deployment line back to the border; submarines may also start further forward, paying for the transit in fuel."
    es: "Dónde empieza la partida cada portaaviones y cada casco embarcado. Los portaaviones empiezan en tu área de despliegue, desde la línea de despliegue hasta el borde; los submarinos también pueden empezar más adelante, pagando el tránsito en combustible."
    fr: "Où chaque porteur et chaque coque embarquée commence la partie. Les porteurs démarrent dans votre aire de déploiement, de la ligne de déploiement jusqu'au bord ; les sous-marins peuvent aussi démarrer plus en avant, en payant le transit en carburant."
    it: "Dove ogni portaerei e ogni scafo imbarcato inizia la partita. Le portaerei partono nella tua area di schieramento, dalla linea di schieramento fino al bordo; i sottomarini possono anche partire più avanti, pagando il transito in carburante."
    ja: "各空母と搭載艇が試合を開始する位置。空母は展開ラインから外縁までの展開エリア内から開始し、潜水艦は燃料で移動分を支払えばより前方からも開始できる。"
    ko: "각 항공모함과 탑재 선체가 경기를 시작하는 위치입니다. 항공모함은 배치선에서 외곽까지의 배치 지역에서 시작하며, 잠수함은 이동분을 연료로 지불하고 더 앞에서도 시작할 수 있습니다."
    "pt-BR": "Onde cada porta-aviões e cada casco embarcado começa a partida. Porta-aviões começam na sua área de posicionamento, da linha de posicionamento até a borda; submarinos também podem começar mais à frente, pagando o trânsito em combustível."
    ru: "Где каждый носитель и каждый корпус на борту начинает матч. Носители начинают в вашем районе развёртывания, от линии развёртывания до границы; подводные лодки могут начать и дальше вперёд, оплатив переход топливом."
    zh: "每艘母舰和舰载艇开始比赛的位置。母舰从本方部署区（部署线至边界之间）开始；潜艇也可以从更靠前的位置开始，但需用燃料支付航渡。"
    "zh-TW": "每艘母艦和艦載艇開始比賽的位置。母艦從本方部署區（部署線至邊界之間）開始；潛艇也可以從更靠前的位置開始，但需用燃料支付航渡。"
  no_spawn_ring:
    de: "Auf dieser Karte gibt es für diese Teams keinen gültigen Startring."
    en: "This map has no valid spawn ring for these teams."
    es: "Este mapa no tiene un anillo de aparición válido para estos equipos."
    fr: "Cette carte n'a aucun anneau d'apparition valide pour ces équipes."
    it: "Questa mappa non ha un anello di spawn valido per queste squadre."
    ja: "このマップにはこれらのチームに有効な出現リングがない。"
    ko: "이 맵에는 이 팀들을 위한 유효한 시작 링이 없습니다."
    "pt-BR": "Este mapa não tem um anel de surgimento válido para estas equipes."
    ru: "На этой карте нет допустимого кольца появления для этих команд."
    zh: "此地图没有适用于这些队伍的有效出生环。"
    "zh-TW": "此地圖沒有適用於這些隊伍的有效出生環。"
  no_spawn_ring_tooltip:
    de: "Kein Radius dieser Karte bietet jedem Team schiffbares Wasser auf seinem Bogen. Ändere Gelände oder Teams; ein Start mit diesen Einstellungen schlägt beim Laden fehl."
    en: "No radius on this map gives every team navigable water on its arc. Change the terrain or the teams; starting with these settings fails while loading."
    es: "Ningún radio de este mapa da a cada equipo agua navegable en su arco. Cambia el terreno o los equipos; empezar con esta configuración falla durante la carga."
    fr: "Aucun rayon de cette carte ne donne à chaque équipe des eaux navigables sur son arc. Modifiez le terrain ou les équipes ; démarrer avec ces réglages échoue au chargement."
    it: "Nessun raggio di questa mappa offre a ogni squadra acque navigabili sul proprio arco. Cambia il terreno o le squadre; avviare con queste impostazioni fallisce durante il caricamento."
    ja: "このマップには、全チームの弧上に航行可能な水域を確保できる半径がない。地形かチームを変更すること。この設定で開始するとロード中に失敗する。"
    ko: "이 맵에는 모든 팀의 호에 항행 가능한 수역을 주는 반경이 없습니다. 지형이나 팀을 바꾸십시오. 이 설정으로 시작하면 불러오는 중에 실패합니다."
    "pt-BR": "Nenhum raio deste mapa dá a cada equipe água navegável em seu arco. Mude o terreno ou as equipes; começar com estas configurações falha durante o carregamento."
    ru: "Ни один радиус на этой карте не даёт каждой команде судоходной воды на её дуге. Измените рельеф или команды; запуск с этими настройками завершится ошибкой при загрузке."
    zh: "此地图上没有任何半径能让每支队伍的弧线上都有可航行水域。请更改地形或队伍；以当前设置开始会在加载时失败。"
    "zh-TW": "此地圖上沒有任何半徑能讓每支隊伍的弧線上都有可航行水域。請更改地形或隊伍；以目前設定開始會在載入時失敗。"
  # #5894: the seat's sector cannot seat every carrier of its fleet.
  no_carrier_room:
    de: "Im Aufstellungsgebiet ist nicht für jeden Träger Platz."
    en: "The deployment area has no room for every carrier."
    es: "El área de despliegue no tiene sitio para todos los portaaviones."
    fr: "L'aire de déploiement n'a pas de place pour tous les porteurs."
    it: "L'area di schieramento non ha spazio per tutte le portaerei."
    ja: "展開エリアにすべての空母を置く余地がない。"
    ko: "배치 지역에 모든 항공모함을 둘 자리가 없습니다."
    "pt-BR": "A área de posicionamento não tem espaço para todos os porta-aviões."
    ru: "В районе развёртывания не хватает места для всех носителей."
    zh: "部署区容纳不下所有母舰。"
    "zh-TW": "部署區容納不下所有母艦。"
  no_carrier_room_tooltip:
    de: "Träger starten mit Mindestabstand zueinander auf schiffbarem Wasser, und für diese Flotte reicht dein Sektor nicht. Entferne Träger, bis die Flotte passt; solange kann nichts platziert und das Match nicht gestartet werden."
    en: "Carriers start a minimum distance apart on navigable water, and your sector cannot seat this fleet. Remove carriers until the fleet fits; until then nothing can be placed and the match cannot start."
    es: "Los portaaviones empiezan a una distancia mínima entre sí sobre agua navegable, y tu sector no puede acoger esta flota. Quita portaaviones hasta que la flota quepa; hasta entonces no se puede colocar nada ni empezar la partida."
    fr: "Les porteurs démarrent à une distance minimale les uns des autres sur des eaux navigables, et votre secteur ne peut pas accueillir cette flotte. Retirez des porteurs jusqu'à ce que la flotte tienne ; d'ici là, rien ne peut être placé et la partie ne peut pas démarrer."
    it: "Le portaerei partono a una distanza minima l'una dall'altra su acque navigabili, e il tuo settore non può ospitare questa flotta. Rimuovi portaerei finché la flotta non ci sta; fino ad allora non si può posizionare nulla né avviare la partita."
    ja: "空母は航行可能な水域に互いに最小距離を空けて開始するが、あなたのセクターにはこの艦隊を収める余地がない。艦隊が収まるまで空母を外すこと。それまでは何も配置できず、試合も開始できない。"
    ko: "항공모함은 항행 가능한 수역에서 서로 최소 거리를 두고 시작하는데, 당신의 구역은 이 함대를 수용할 수 없습니다. 함대가 들어갈 때까지 항공모함을 제거하십시오. 그때까지는 아무것도 배치할 수 없고 경기를 시작할 수 없습니다."
    "pt-BR": "Porta-aviões começam a uma distância mínima uns dos outros em água navegável, e o seu setor não comporta esta frota. Remova porta-aviões até a frota caber; até lá, nada pode ser posicionado e a partida não pode começar."
    ru: "Носители начинают на судоходной воде на минимальном расстоянии друг от друга, и ваш сектор не вмещает этот флот. Убирайте носители, пока флот не поместится; до тех пор ничего нельзя разместить, а матч нельзя начать."
    zh: "母舰须在可航行水域彼此保持最小间距开始，而你的扇区容纳不下这支舰队。请移除母舰直到舰队放得下；在此之前无法放置任何单位，也无法开始比赛。"
    "zh-TW": "母艦須在可航行水域彼此保持最小間距開始，而你的扇區容納不下這支艦隊。請移除母艦直到艦隊放得下；在此之前無法放置任何單位，也無法開始比賽。"
  crew_read_only:
    de: "Dein Sitzinhaber platziert die Flotte."
    en: "Your seat owner places the fleet."
    es: "El titular de tu asiento coloca la flota."
    fr: "Le titulaire de votre siège place la flotte."
    it: "Il titolare del tuo posto posiziona la flotta."
    ja: "艦隊は席の所有者が配置する。"
    ko: "함대는 좌석 소유자가 배치합니다."
    "pt-BR": "O dono do seu assento posiciona a frota."
    ru: "Флот размещает владелец вашего места."
    zh: "由席位所有者放置舰队。"
    "zh-TW": "由席位擁有者放置艦隊。"
  crew_read_only_tooltip:
    de: "Du bist Crew dieses Teams. Der Sitzinhaber wählt die Flotte und wo jede Einheit startet; dies ist sein Plan, wie ihn der Host zuletzt angenommen hat."
    en: "You crew this team. Its seat owner chooses the fleet and where each unit starts; this is their plan as the host last accepted it."
    es: "Eres tripulación de este equipo. El titular del asiento elige la flota y dónde empieza cada unidad; este es su plan tal como el anfitrión lo aceptó por última vez."
    fr: "Vous êtes équipage de cette équipe. Le titulaire du siège choisit la flotte et le départ de chaque unité ; voici son plan tel que l'hôte l'a accepté en dernier."
    it: "Sei equipaggio di questa squadra. Il titolare del posto sceglie la flotta e dove parte ogni unità; questo è il suo piano come l'host l'ha accettato l'ultima volta."
    ja: "あなたはこのチームのクルーだ。艦隊と各ユニットの開始位置は席の所有者が決める。これはホストが最後に受け入れたその計画だ。"
    ko: "당신은 이 팀의 승무원입니다. 좌석 소유자가 함대와 각 유닛의 시작 위치를 정하며, 이것은 호스트가 마지막으로 수락한 그 계획입니다."
    "pt-BR": "Você é tripulação desta equipe. O dono do assento escolhe a frota e onde cada unidade começa; este é o plano dele como o anfitrião o aceitou por último."
    ru: "Вы в экипаже этой команды. Владелец места выбирает флот и старт каждой единицы; это его план в том виде, в каком хост принял его последним."
    zh: "你是该队伍的船员。席位所有者选择舰队和每个单位的起始位置；这是主机最后接受的该计划。"
    "zh-TW": "你是該隊伍的船員。席位擁有者選擇艦隊和每個單位的起始位置；這是主機最後接受的該計畫。"
  plan_rejected_invalid_design:
    de: "Der Host hat deinen Plan abgelehnt: Ein Entwurf ist dort ungültig."
    en: "The host refused your plan: a design is not valid there."
    es: "El anfitrión rechazó tu plan: un diseño no es válido allí."
    fr: "L'hôte a refusé votre plan : un modèle n'y est pas valide."
    it: "L'host ha rifiutato il tuo piano: un progetto lì non è valido."
    ja: "ホストが計画を拒否した。ホスト側で無効な設計がある。"
    ko: "호스트가 계획을 거부했습니다. 호스트에서 유효하지 않은 설계가 있습니다."
    "pt-BR": "O anfitrião recusou seu plano: um projeto não é válido lá."
    ru: "Хост отклонил ваш план: один из проектов там недопустим."
    zh: "主机拒绝了你的计划：某个设计在主机上无效。"
    "zh-TW": "主機拒絕了你的計畫：某個設計在主機上無效。"
  plan_rejected_invalid_placement:
    de: "Der Host hat deinen Plan abgelehnt: Eine Platzierung verstößt gegen seine Aufstellungsregeln."
    en: "The host refused your plan: a placement breaks its deployment rules."
    es: "El anfitrión rechazó tu plan: una colocación incumple sus reglas de despliegue."
    fr: "L'hôte a refusé votre plan : un placement enfreint ses règles de déploiement."
    it: "L'host ha rifiutato il tuo piano: un posizionamento viola le sue regole di schieramento."
    ja: "ホストが計画を拒否した。配置がホストの展開ルールに反している。"
    ko: "호스트가 계획을 거부했습니다. 배치가 호스트의 배치 규칙을 위반합니다."
    "pt-BR": "O anfitrião recusou seu plano: um posicionamento viola as regras de posicionamento dele."
    ru: "Хост отклонил ваш план: одно из размещений нарушает его правила развёртывания."
    zh: "主机拒绝了你的计划：某个放置违反了其部署规则。"
    "zh-TW": "主機拒絕了你的計畫：某個放置違反了其部署規則。"
  plan_rejected_tooltip:
    de: "Der Host beurteilt deinen Plan nach denselben Regeln wie diese Liste; eine Ablehnung bedeutet also, dass seine Spieldaten von deinen abweichen. Deine nächste Änderung sendet den Plan erneut."
    en: "The host judges your plan by the same rules as this list, so a refusal means its game data and yours differ. Your next change sends the plan again."
    es: "El anfitrión juzga tu plan con las mismas reglas que esta lista, así que un rechazo significa que sus datos de juego y los tuyos difieren. Tu próximo cambio vuelve a enviar el plan."
    fr: "L'hôte juge votre plan selon les mêmes règles que cette liste ; un refus signifie donc que ses données de jeu diffèrent des vôtres. Votre prochaine modification renvoie le plan."
    it: "L'host giudica il tuo piano con le stesse regole di questa lista, quindi un rifiuto significa che i suoi dati di gioco differiscono dai tuoi. La tua prossima modifica invia di nuovo il piano."
    ja: "ホストはこのリストと同じルールで計画を判定するため、拒否はホストとあなたのゲームデータが異なることを意味する。次に変更すると計画が再送される。"
    ko: "호스트는 이 목록과 같은 규칙으로 계획을 판정하므로, 거부는 호스트와 당신의 게임 데이터가 다르다는 뜻입니다. 다음에 변경하면 계획이 다시 전송됩니다."
    "pt-BR": "O anfitrião julga seu plano pelas mesmas regras desta lista, então uma recusa significa que os dados de jogo dele e os seus diferem. Sua próxima alteração envia o plano de novo."
    ru: "Хост оценивает ваш план по тем же правилам, что и этот список, поэтому отказ означает, что его игровые данные отличаются от ваших. Следующее изменение отправит план снова."
    zh: "主机按与此列表相同的规则判定你的计划，因此被拒绝意味着主机与你的游戏数据不同。你的下一次更改会重新发送该计划。"
    "zh-TW": "主機按與此列表相同的規則判定你的計畫，因此被拒絕表示主機與你的遊戲資料不同。你的下一次變更會重新傳送該計畫。"
  station_default:
    de: "Standard"
    en: "Default"
    es: "Por defecto"
    fr: "Par défaut"
    it: "Predefinita"
    ja: "既定"
    ko: "기본"
    "pt-BR": "Padrão"
    ru: "По умолчанию"
    zh: "默认"
    "zh-TW": "預設"
  station_placed:
    de: "Platziert"
    en: "Placed"
    es: "Situado"
    fr: "Placé"
    it: "Posizionata"
    ja: "配置済み"
    ko: "배치됨"
    "pt-BR": "Posicionado"
    ru: "Размещён"
    zh: "已放置"
    "zh-TW": "已放置"
  station_tooltip:
    de: "Ein Träger auf seiner Standardposition startet dort, wo das Match ihn sonst setzen würde. Ein platzierter Träger startet an dem Punkt, den du im Aufstellungsgebiet gewählt hast."
    en: "A carrier at its default position starts where the match would otherwise put it. A placed carrier starts at the point you chose in the deployment area."
    es: "Un portaaviones en su posición predeterminada empieza donde la partida lo pondría de otro modo. Un portaaviones situado empieza en el punto que elegiste del área de despliegue."
    fr: "Un porteur à sa position par défaut démarre là où la partie le placerait de toute façon. Un porteur placé démarre au point choisi dans l'aire de déploiement."
    it: "Una portaerei nella posizione predefinita parte dove la partita la metterebbe comunque. Una portaerei posizionata parte dal punto scelto nell'area di schieramento."
    ja: "既定位置の空母は、試合が本来配置する場所から開始する。配置済みの空母は、展開エリア内で選んだ地点から開始する。"
    ko: "기본 위치의 항공모함은 경기가 원래 배치할 곳에서 시작합니다. 배치된 항공모함은 배치 지역에서 고른 지점에서 시작합니다."
    "pt-BR": "Um porta-aviões na posição padrão começa onde a partida o colocaria de qualquer forma. Um porta-aviões posicionado começa no ponto escolhido na área de posicionamento."
    ru: "Носитель на позиции по умолчанию начинает там, куда его поставил бы матч. Размещённый носитель начинает в выбранной вами точке района развёртывания."
    zh: "处于默认位置的母舰从比赛原本安排的位置开始。已放置的母舰从你在部署区内选定的点开始。"
    "zh-TW": "處於預設位置的母艦從比賽原本安排的位置開始。已放置的母艦從你在部署區內選定的點開始。"
  identity_carrier_tooltip:
    de: "Träger, %{cost}. Die Flottenkosten oben zählen jeden Träger der Flotte."
    en: "Carrier, %{cost}. The fleet cost above counts every carrier in the fleet."
    es: "Portaaviones, %{cost}. El coste de flota de arriba cuenta cada portaaviones de la flota."
    fr: "Porteur, %{cost}. Le coût de la flotte ci-dessus compte chaque porteur de la flotte."
    it: "Portaerei, %{cost}. Il costo flotta qui sopra conta ogni portaerei della flotta."
    ja: "空母、%{cost}。上の艦隊コストは艦隊内のすべての空母を合計する。"
    ko: "항공모함, %{cost}. 위의 함대 비용은 함대의 모든 항공모함을 합산합니다."
    "pt-BR": "Porta-aviões, %{cost}. O custo da frota acima soma cada porta-aviões da frota."
    ru: "Носитель, %{cost}. Стоимость флота выше учитывает каждый носитель флота."
    zh: "母舰，%{cost}。上方的舰队费用计入舰队中的每艘母舰。"
    "zh-TW": "母艦，%{cost}。上方的艦隊費用計入艦隊中的每艘母艦。"
  identity_carrier_uncosted_tooltip:
    de: "Träger."
    en: "Carrier."
    es: "Portaaviones."
    fr: "Porteur."
    it: "Portaerei."
    ja: "空母。"
    ko: "항공모함."
    "pt-BR": "Porta-aviões."
    ru: "Носитель."
    zh: "母舰。"
    "zh-TW": "母艦。"
  identity_submarine_tooltip:
    de: "U-Boot. Es darf im Aufstellungsgebiet oder irgendwo weiter vorn in deinem Sektor starten."
    en: "Submarine. It may start in the deployment area or anywhere further forward in your sector."
    es: "Submarino. Puede empezar en el área de despliegue o en cualquier punto más adelante de tu sector."
    fr: "Sous-marin. Il peut démarrer dans l'aire de déploiement ou n'importe où plus en avant dans votre secteur."
    it: "Sottomarino. Può partire nell'area di schieramento o in qualsiasi punto più avanti nel tuo settore."
    ja: "潜水艦。展開エリアか、自陣セクター内のより前方の任意の地点から開始できる。"
    ko: "잠수함. 배치 지역이나 자기 구역 안 더 앞쪽 어디에서든 시작할 수 있습니다."
