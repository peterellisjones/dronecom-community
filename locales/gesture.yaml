_version: 2

# S-F #1853: gesture mission-preview verbs that have no `mission.verb.*` entry
# (the anchor×posture verbs live in `mission.yaml`). The cursor preview shows
# these in caps; the friendly verb cycle (Accompany / Form group / RTB) uses
# them. `cycle_hint` is the terse "press TAB to cycle" affordance shown when
# more than one candidate is available.
gesture:
  form_group:
    de: "Gruppe bilden"
    en: "Form group"
    es: "Formar grupo"
    fr: "Former un groupe"
    it: "Forma gruppo"
    ja: "編隊を形成"
    ko: "편대 구성"
    "pt-BR": "Formar grupo"
    ru: "Сформировать группу"
    zh: "编组"
    "zh-TW": "編組"
  rtb:
    de: "Bergen"
    en: "Recover"
    es: "Recuperar"
    fr: "Récupérer"
    it: "Recupera"
    ja: "回収"
    ko: "회수"
    "pt-BR": "Recuperar"
    ru: "Принять"
    zh: "回收"
    "zh-TW": "回收"
  cycle_hint:
    de: "TAB"
    en: "TAB"
    es: "TAB"
    fr: "TAB"
    it: "TAB"
    ja: "TAB"
    ko: "TAB"
    "pt-BR": "TAB"
    ru: "TAB"
    zh: "TAB"
    "zh-TW": "TAB"
  attack:
    # Appended to the ATTACK verb line (AC5, AC7, AC10) — planned expenditure
    # / existing commitment, or the exact bounded selection once inventory
    # picks are staged, either way distinguishing Fire from Move-into-range.
    # See `dc_ui::world::gesture::preview::attack_override_line`.
    planned:
      de: "%{count} neue Schuss"
      en: "%{count} new rounds"
      es: "%{count} proyectiles nuevos"
      fr: "%{count} nouvelles munitions"
      it: "%{count} nuovi colpi"
      ja: "新規%{count}発"
      ko: "신규 %{count}발"
      "pt-BR": "%{count} projéteis novos"
      ru: "новых снарядов: %{count}"
      zh: "新增%{count}发"
      "zh-TW": "新增%{count}發"
    # #5020: AC8 requires the existing target-wide commitment to be a real,
    # visible figure (rounds already committed), not a bare "engaged" flag.
    planned_with_commitment:
      de: "%{count} neue Schuss · %{committed} gebundene Schuss"
      en: "%{count} new rounds · %{committed} committed rounds"
      es: "%{count} proyectiles nuevos · %{committed} proyectiles comprometidos"
      fr: "%{count} nouvelles munitions · %{committed} munitions engagées"
      it: "%{count} nuovi colpi · %{committed} colpi impegnati"
      ja: "新規%{count}発 · 拘束済み%{committed}発"
      ko: "신규 %{count}발 · 투입 %{committed}발"
      "pt-BR": "%{count} projéteis novos · %{committed} projéteis comprometidos"
      ru: "новых снарядов: %{count} · задействованных снарядов: %{committed}"
      zh: "新增%{count}发 · 已投入%{committed}发"
      "zh-TW": "新增%{count}發 · 已投入%{committed}發"
    no_additional_rounds:
      de: "keine weiteren Schuss · %{committed} gebundene Schuss"
      en: "no additional rounds · %{committed} committed rounds"
      es: "sin proyectiles adicionales · %{committed} proyectiles comprometidos"
      fr: "aucune munition supplémentaire · %{committed} munitions engagées"
      it: "nessun colpo aggiuntivo · %{committed} colpi impegnati"
      ja: "追加射撃なし · 拘束済み%{committed}発"
      ko: "추가 사격 없음 · 투입 %{committed}발"
      "pt-BR": "nenhum projétil adicional · %{committed} projéteis comprometidos"
      ru: "нет дополнительных снарядов · задействованных снарядов: %{committed}"
      zh: "无追加弹药 · 已投入%{committed}发"
      "zh-TW": "無追加彈藥 · 已投入%{committed}發"
    no_rounds_planned:
      de: "keine weiteren Schuss · Ziel bereits abgedeckt"
      en: "no additional rounds · target already covered"
      es: "sin proyectiles adicionales · objetivo ya cubierto"
      fr: "aucune munition supplémentaire · cible déjà couverte"
      it: "nessun colpo aggiuntivo · obiettivo già coperto"
      ja: "追加射撃なし · 目標対応済み"
      ko: "추가 사격 없음 · 목표 충족됨"
      "pt-BR": "nenhum projétil adicional · alvo já coberto"
      ru: "нет дополнительных снарядов · цель уже покрыта"
      zh: "无追加弹药 · 目标已被覆盖"
      "zh-TW": "無追加彈藥 · 目標已被覆蓋"
    move_into_range:
      de: "In Reichweite gehen und %{count} abfeuern"
      en: "move into range and fire %{count}"
      es: "avanzar al alcance y disparar %{count}"
      fr: "se rapprocher puis tirer %{count}"
      it: "avvicinarsi e sparare %{count}"
      ja: "射程内に進出して%{count}発を発射"
      ko: "사거리 진입 후 %{count}발 발사"
      "pt-BR": "avançar ao alcance e disparar %{count}"
      ru: "сблизиться и выпустить %{count}"
      zh: "进入射程后发射 %{count} 发"
      "zh-TW": "進入射程後發射 %{count} 發"
    bounded_fire:
      de: "%{rounds} abfeuern"
      en: "fire %{rounds}"
      es: "disparar %{rounds}"
      fr: "tirer %{rounds}"
      it: "sparare %{rounds}"
      ja: "%{rounds} を発射"
      ko: "%{rounds} 발사"
      "pt-BR": "disparar %{rounds}"
      ru: "выпустить %{rounds}"
      zh: "发射 %{rounds}"
      "zh-TW": "發射 %{rounds}"
    bounded_move:
      de: "In Reichweite gehen und %{rounds} abfeuern"
      en: "move into range and fire %{rounds}"
      es: "avanzar al alcance y disparar %{rounds}"
      fr: "se rapprocher puis tirer %{rounds}"
      it: "avvicinarsi e sparare %{rounds}"
      ja: "射程内に進出して%{rounds}を発射"
      ko: "사거리 진입 후 %{rounds} 발사"
      "pt-BR": "avançar ao alcance e disparar %{rounds}"
      ru: "сблизиться и выпустить %{rounds}"
      zh: "进入射程后发射 %{rounds}"
      "zh-TW": "進入射程後發射 %{rounds}"
