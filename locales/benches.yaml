  column_range_tooltip:
    de: "Die weiteste abgetastete Entfernung, auf der der Sensor das Ziel erfasst. Clutter kann ein näheres Ziel verbergen; daher wird abgetastet, nicht der erste Kontaktverlust gesucht."
    en: "The farthest sampled range at which the sensor detects the target. Clutter can hide a target closer in, so this is sampled, not the first loss of contact."
    es: "La mayor distancia muestreada a la que el sensor detecta el objetivo. El clutter puede ocultarlo más cerca, así que se muestrea en vez de buscar la primera pérdida."
    fr: "La plus grande distance échantillonnée où le capteur détecte la cible. Le fouillis peut la masquer plus près ; on échantillonne donc au lieu de chercher la première perte."
    it: "La massima distanza campionata a cui il sensore rileva il bersaglio. Il clutter può nasconderlo più vicino, quindi si campiona anziché cercare la prima perdita."
    ja: "センサーが目標を探知できる最も遠いサンプル距離。クラッタで近距離の目標が隠れることがあるため、最初の失探点ではなくサンプリングで求めます。"
    ko: "센서가 표적을 탐지하는 가장 먼 표본 거리. 클러터가 가까운 표적을 가릴 수 있어 첫 탐지 상실 지점이 아니라 표본으로 구합니다."
    "pt-BR": "A maior distância amostrada em que o sensor detecta o alvo. O clutter pode escondê-lo mais perto, então se amostra em vez de procurar a primeira perda."
    ru: "Наибольшая дальность выборки, на которой датчик обнаруживает цель. Помехи могут скрыть цель ближе, поэтому дальность берётся по выборке, а не по первой потере контакта."
    zh: "传感器能探测到目标的最远采样距离。杂波可能在更近处遮蔽目标，因此按采样而非首次失联求取。"
    "zh-TW": "感測器能偵測到目標的最遠取樣距離。雜波可能在更近處遮蔽目標，因此按取樣而非首次失聯求取。"
