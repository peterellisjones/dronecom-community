    zh: "将光标悬停在曲线上可查看链路预算。"
    "zh-TW": "將游標懸停在曲線上可查看鏈路預算。"
  hover_hint_tooltip:
    de: "Jeder Term, den das Signal bei dieser Entfernung zahlt: Kerbe, Clutter, Schallkanal-Verluste und -Gewinne."
    en: "Every term the signal pays at that range: notch, clutter, sound-channel losses and gains."
    es: "Cada término que paga la señal a esa distancia: muesca, clutter, pérdidas y ganancias del canal sonoro."
    fr: "Chaque terme que paie le signal à cette distance : encoche, fouillis, pertes et gains du canal sonore."
    it: "Ogni termine che il segnale paga a quella distanza: tacca, clutter, perdite e guadagni del canale acustico."
    ja: "その距離で信号が受ける各項目：ノッチ、クラッタ、音響伝搬の損失と利得。"
    ko: "그 거리에서 신호가 받는 모든 항목: 노치, 클러터, 음향 채널 손실과 이득."
    "pt-BR": "Cada termo que o sinal paga naquela distância: entalhe, clutter, perdas e ganhos do canal sonoro."
    ru: "Каждое слагаемое сигнала на этой дальности: провал, помехи, потери и выигрыш звукового канала."
    zh: "该距离上信号承受的每一项：凹口、杂波、声道损耗与增益。"
    "zh-TW": "該距離上訊號承受的每一項：凹口、雜波、聲道損耗與增益。"
