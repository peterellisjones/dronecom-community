      it: "Ancora rilevato alla fine del grafico, che si ferma a metà della circonferenza terrestre: la massima distanza possibile tra due punti del globo."
      ja: "グラフの端でもまだ探知しています。グラフは地球の円周の半分、つまり地球上の2点が離れうる最大距離で終わります。"
      ko: "그래프 끝에서도 여전히 탐지됩니다. 그래프는 지구 둘레의 절반, 즉 지구상의 두 점이 떨어질 수 있는 최대 거리에서 끝납니다."
