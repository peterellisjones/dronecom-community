      ja: "視線方向速度が小さすぎ、静止背景とともに除去されます。接近・離脱する目標はノッチを抜けます。"
      ko: "시선 방향 속도가 너무 작아 정지 배경과 함께 걸러졌습니다. 접근하거나 멀어지는 표적은 노치를 벗어납니다."
      "pt-BR": "Pouca velocidade radial: filtrado com o fundo estacionário. Um alvo que se aproxima ou se afasta escapa do entalhe."
      ru: "Слишком мала радиальная скорость: отфильтрована вместе с фоном. Сближающаяся или удаляющаяся цель уходит из провала."
      zh: "径向速度过小，与静止背景一同被滤除。逼近或远离的目标可避开凹口。"
      "zh-TW": "徑向速度過小，與靜止背景一同被濾除。逼近或遠離的目標可避開凹口。"
