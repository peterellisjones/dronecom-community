    en: "Signal-to-noise ratio over ground range. A curve is solid where the target is detected and faded where it is not; a hollow ring marks where the earth's curvature hides the target."
    es: "Relación señal-ruido según la distancia. La curva es sólida donde el objetivo se detecta y tenue donde no; un anillo hueco marca dónde la curvatura terrestre oculta el objetivo."
    fr: "Rapport signal sur bruit selon la distance. La courbe est pleine là où la cible est détectée et pâle ailleurs ; un anneau creux marque l'endroit où la courbure terrestre masque la cible."
    it: "Rapporto segnale/rumore sulla distanza. La curva è piena dove il bersaglio è rilevato e sbiadita dove no; un anello vuoto indica dove la curvatura terrestre nasconde il bersaglio."
    ja: "地上距離に対する信号対雑音比。探知できる区間は実線、できない区間は淡く表示します。白抜きの円は地球の曲率で目標が隠れる地点です。"
    ko: "지상 거리에 따른 신호 대 잡음비. 탐지되는 구간은 실선, 탐지되지 않는 구간은 흐리게 표시합니다. 빈 원은 지구 곡률로 표적이 가려지는 지점입니다."
    "pt-BR": "Relação sinal-ruído pela distância. A curva é sólida onde o alvo é detectado e esmaecida onde não é; um anel vazado marca onde a curvatura da Terra esconde o alvo."
    ru: "Отношение сигнал/шум по дальности. Кривая сплошная там, где цель обнаруживается, и бледная там, где нет; полое кольцо отмечает, где цель скрывается за кривизной Земли."
    zh: "信噪比随地面距离的变化。能探测到目标的部分为实线，探测不到的部分为淡色；空心圆表示地球曲率遮蔽目标之处。"
    "zh-TW": "訊雜比隨地面距離的變化。能偵測到目標的部分為實線，偵測不到的部分為淡色；空心圓表示地球曲率遮蔽目標之處。"
