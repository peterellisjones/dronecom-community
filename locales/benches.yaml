  stat_aperture_height_tooltip:
    de: "Wie hoch der Sensor über seinem Rumpf sitzt: die Masthöhe bei Mastmontage, sonst null. Sie hebt den Radarhorizont."
    en: "How far above its hull the sensor sits: the mast height for a mast-mounted sensor, otherwise zero. It lifts the radar horizon."
    es: "Cuánto se eleva el sensor sobre su casco: la altura del mástil si va en mástil; si no, cero. Amplía el horizonte radar."
    fr: "Hauteur du capteur au-dessus de sa coque : la hauteur de mât s'il est monté sur mât, sinon zéro. Elle recule l'horizon radar."
    it: "Quanto il sensore sta sopra lo scafo: l'altezza dell'albero se montato sull'albero, altrimenti zero. Allontana l'orizzonte radar."
    ja: "センサーが車体からどれだけ高い位置にあるか。マスト搭載ならマスト高、それ以外はゼロ。レーダー水平線を遠ざけます。"
    ko: "센서가 선체에서 얼마나 높이 있는지. 마스트 탑재면 마스트 높이, 아니면 0. 레이더 수평선을 넓힙니다."
    "pt-BR": "Quanto o sensor fica acima do casco: a altura do mastro se montado no mastro; senão, zero. Afasta o horizonte radar."
    ru: "Высота датчика над корпусом: высота мачты для мачтового датчика, иначе ноль. Отодвигает радиогоризонт."
    zh: "传感器高出船体的高度：桅杆式传感器为桅杆高度，否则为零。它会推远雷达地平线。"
    "zh-TW": "感測器高出船體的高度：桅桿式感測器為桅桿高度，否則為零。它會推遠雷達地平線。"
