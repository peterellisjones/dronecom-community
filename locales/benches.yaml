  tab_sensor_tooltip:
    de: "Zeigt, wie weit ein Sensor jedes Ziel einer Klasse erfasst – mit derselben Physik wie im Gefecht."
    en: "Chart how far a sensor detects each target of a class, using the same physics as a match."
    es: "Muestra a qué distancia un sensor detecta cada objetivo de una clase, con la misma física que en partida."
    fr: "Montre à quelle distance un capteur détecte chaque cible d'une classe, avec la même physique qu'en partie."
    it: "Mostra a quale distanza un sensore rileva ogni bersaglio di una classe, con la stessa fisica della partita."
    ja: "センサーが各クラスの目標を探知できる距離を、実戦と同じ物理モデルでグラフ化します。"
    ko: "센서가 각 등급의 표적을 탐지하는 거리를 실전과 같은 물리 모델로 그래프에 표시합니다."
    "pt-BR": "Mostra a que distância um sensor detecta cada alvo de uma classe, com a mesma física da partida."
    ru: "Показывает, на какой дальности датчик обнаруживает каждую цель класса, по той же физике, что и в бою."
    zh: "以与对局相同的物理模型，绘制传感器对某类每个目标的探测距离。"
    "zh-TW": "以與對局相同的物理模型，繪製感測器對某類每個目標的偵測距離。"
