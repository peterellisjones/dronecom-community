    de: "Der Rumpf, der den Sensor trägt. Nur wählbar, wo sich Rümpfe erfassungsrelevant unterscheiden: im Einsatzraum oder in der Masthöhe eines mastmontierten Sensors."
    en: "The hull carrying the sensor. Offered only where hulls differ in a way that changes detection: their domain, or the mast height of a mast-mounted sensor."
    es: "El casco que lleva el sensor. Solo se ofrece donde los cascos difieren en algo que cambia la detección: su dominio o la altura del mástil de un sensor montado en mástil."
    fr: "La coque qui porte le capteur. Proposée seulement là où les coques diffèrent d'une façon qui change la détection : leur milieu, ou la hauteur de mât d'un capteur monté sur mât."
    it: "Lo scafo che porta il sensore. Offerto solo dove gli scafi differiscono in modo rilevante per il rilevamento: dominio o altezza dell'albero di un sensore montato sull'albero."
    ja: "センサーを搭載する車体。探知に影響する違い（運用領域、マスト搭載センサーのマスト高）がある場合のみ選択できます。"
    ko: "센서를 탑재한 선체. 탐지에 영향을 주는 차이(운용 영역, 마스트 탑재 센서의 마스트 높이)가 있을 때만 선택할 수 있습니다."
    "pt-BR": "O casco que leva o sensor. Só é oferecido onde os cascos diferem de forma que muda a detecção: o domínio ou a altura do mastro de um sensor de mastro."
    ru: "Корпус с датчиком. Выбор доступен, только если корпуса различаются тем, что влияет на обнаружение: средой или высотой мачты для мачтового датчика."
    zh: "搭载传感器的船体。仅当船体差异会影响探测（作战领域，或桅杆式传感器的桅杆高度）时才可选择。"
    "zh-TW": "搭載感測器的船體。僅當船體差異會影響偵測（作戰領域，或桅桿式感測器的桅桿高度）時才可選擇。"
