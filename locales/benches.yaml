  stat_resolution_cell_tooltip:
    de: "Strahlbreite mal Entfernungstor: das Seestück, das mit einem tiefen Ziel konkurriert. Eine kleinere Zelle enthält weniger Clutter."
    en: "Beamwidth by range gate: the patch of sea that competes with a low target. A smaller cell holds less clutter."
    es: "Ancho de haz por puerta de distancia: la porción de mar que compite con un objetivo bajo. Una celda menor contiene menos clutter."
    fr: "Largeur de faisceau par porte distance : la portion de mer qui concurrence une cible basse. Une cellule plus petite contient moins de fouillis."
    it: "Ampiezza del fascio per porta di distanza: la porzione di mare che compete con un bersaglio basso. Una cella più piccola contiene meno clutter."
    ja: "ビーム幅×距離ゲート。低空目標と競合する海面の範囲です。セルが小さいほどクラッタは少なくなります。"
    ko: "빔 폭 × 거리 게이트. 저고도 표적과 경쟁하는 해면 영역입니다. 셀이 작을수록 클러터가 적습니다."
    "pt-BR": "Largura do feixe por porta de distância: o trecho de mar que compete com um alvo baixo. Uma célula menor contém menos clutter."
    ru: "Ширина луча на строб дальности: участок моря, конкурирующий с низкой целью. Чем меньше ячейка, тем меньше помех."
    zh: "波束宽度×距离门：与低空目标竞争的海面区域。单元越小，杂波越少。"
    "zh-TW": "波束寬度×距離門：與低空目標競爭的海面區域。單元越小，雜波越少。"
  stat_surface_search:
