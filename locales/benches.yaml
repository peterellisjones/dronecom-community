    it: "Ricerca di superficie"
    ja: "水上捜索"
    ko: "수상 탐색"
    "pt-BR": "Busca de superfície"
    ru: "Поиск надводных целей"
    zh: "海面搜索"
    "zh-TW": "海面搜索"
  stat_surface_search_tooltip:
    de: "Ob das Radar eine Wellenform mit feinem Entfernungstor für Schiffe hat, die Seegangsecho bei langsamen Überwasserzielen besser schlägt als Puls-Doppler."
    en: "Whether the radar has a fine-range-gate waveform for ships, which beats sea clutter better than pulse-Doppler on slow surface targets."
    es: "Si el radar tiene una forma de onda de puerta fina para buques, que supera el clutter marino mejor que el pulso-Doppler con objetivos lentos de superficie."
    fr: "Si le radar dispose d'une forme d'onde à porte fine pour les navires, qui bat mieux le fouillis de mer que le Doppler pulsé sur des cibles de surface lentes."
    it: "Se il radar ha una forma d'onda a porta fine per le navi, che supera il clutter marino meglio del Doppler impulsivo su bersagli lenti di superficie."
    ja: "低速の水上目標に対して、パルス・ドップラーよりシークラッタに強い、艦船用の細かい距離ゲート波形を持つかどうか。"
    ko: "저속 수상 표적에 대해 펄스 도플러보다 해면 클러터에 강한, 함정용 정밀 거리 게이트 파형을 갖추었는지 여부."
    "pt-BR": "Se o radar tem uma forma de onda de porta fina para navios, que vence o clutter marítimo melhor que o pulso-Doppler em alvos lentos de superfície."
    ru: "Есть ли у РЛС режим с узким стробом для кораблей, который лучше импульсно-доплеровского справляется с отражениями от моря на медленных надводных целях."
    zh: "雷达是否具备针对舰船的精细距离门波形；对慢速水面目标，它比脉冲多普勒更能抑制海杂波。"
    "zh-TW": "雷達是否具備針對艦船的精細距離門波形；對慢速水面目標，它比脈衝都卜勒更能抑制海雜波。"
  surface_search_yes:
