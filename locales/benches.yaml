  observer_position_tooltip:
    de: "Wo der Beobachter im Diagramm jedes Senders liegt. Außerhalb des Abtastsektors eines Richtsenders hört er nur den Nebenkeulenpegel, etwa 13 dB tiefer – rund ein Fünftel der Reichweite für einen Warnempfänger."
    en: "Where the observer sits in each transmitter's pattern. Outside a directional transmitter's scan sector it hears only the sidelobe floor, about 13 dB down — around a fifth of the range for a warning receiver."
    es: "Dónde está el observador en el diagrama de cada emisor. Fuera del sector de barrido de un emisor direccional solo oye el nivel de lóbulo lateral, unos 13 dB menos: cerca de una quinta parte del alcance para un receptor de alerta."
    fr: "Où se trouve l'observateur dans le diagramme de chaque émetteur. Hors du secteur balayé d'un émetteur directif, il n'entend que le niveau des lobes secondaires, environ 13 dB plus bas — près d'un cinquième de la portée pour un détecteur d'alerte."
    it: "Dove si trova l'osservatore nel diagramma di ogni emettitore. Fuori dal settore di scansione di un emettitore direttivo sente solo il livello dei lobi secondari, circa 13 dB in meno: circa un quinto della portata per un ricevitore d'allarme."
    ja: "各発信源のビームパターン内で観測側がいる位置。指向性発信源の走査範囲外ではサイドローブのみ（約13 dB低い）を受信し、警報受信機では探知距離が約5分の1になります。"
    ko: "각 발신원의 빔 패턴에서 관측 측의 위치. 지향성 발신원의 주사 구역 밖에서는 약 13 dB 낮은 사이드로브만 들려, 경보 수신기의 탐지 거리가 약 5분의 1이 됩니다."
    "pt-BR": "Onde o observador fica no diagrama de cada emissor. Fora do setor de varredura de um emissor direcional, ouve só o nível de lóbulo lateral, cerca de 13 dB abaixo — perto de um quinto do alcance para um receptor de alerta."
    ru: "Положение наблюдателя в диаграмме каждого излучателя. Вне сектора обзора направленного излучателя он слышит только уровень боковых лепестков, примерно на 13 дБ ниже, — около пятой части дальности для приёмника предупреждения."
    zh: "观测方在每个发射源方向图中的位置。在定向发射源的扫描扇区外只能听到约低13 dB的旁瓣，告警接收机的探测距离约为五分之一。"
    "zh-TW": "觀測方在每個發射源方向圖中的位置。在定向發射源的掃描扇區外只能聽到約低13 dB的旁瓣，告警接收機的偵測距離約為五分之一。"
