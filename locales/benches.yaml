    span_tooltip:
      de: "Am Diagrammende noch erfasst; das Diagramm endet beim halben Erdumfang, der größten Entfernung zweier Punkte auf der Erde."
      en: "Still detected at the end of the chart, which stops at half the Earth's circumference: the farthest apart two points on the globe can be."
