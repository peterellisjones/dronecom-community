    ko: "주사 구역 밖. 약 13 dB 낮은 사이드로브만 들립니다. 전방향 발신원은 어느 쪽이든 같습니다."
    "pt-BR": "Fora do setor de varredura: só o lóbulo lateral, cerca de 13 dB abaixo. Um emissor omnidirecional é igual nos dois casos."
