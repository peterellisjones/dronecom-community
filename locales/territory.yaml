_version: 2

# #4146 (epic #4140): territory-capture zone captions, painted at each zone's
# centre on the tactical map.
#
# Values are stored in natural case and uppercased at the render site (see
# `dc_ui::world::territory::label::caption_text`), the same convention the
# gesture mission preview uses — map captions are tactical data, so they draw
# in ALL CAPS.
#
# `zone_allied` is the one caption outside #4146's four listed states: an ally
# holding a zone without you is reachable in any 2v2, and neither `zone_held`
# (which would claim income you are not earning) nor `zone_enemy` (which would
# mark an ally hostile) can honestly cover it.
territory:
  zone_held:
    de: "Gehalten"
    en: "Held"
    es: "En poder"
    fr: "Tenue"
    it: "Controllata"
    ja: "確保"
    ko: "확보"
    "pt-BR": "Sob controle"
    ru: "Удержана"
    zh: "已控制"
    "zh-TW": "已控制"
  zone_shared:
    de: "Geteilt"
    en: "Shared"
    es: "Compartida"
    fr: "Partagée"
    it: "Condivisa"
    ja: "共有"
    ko: "공유"
    "pt-BR": "Compartilhada"
    ru: "Совместная"
    zh: "共享"
    "zh-TW": "共享"
  # #4148 fix round 1 (M2): hover explanation for the income tooltip's
  # `(SHARED)` breakdown row — the figure shown is this team's own
  # already-divided cut, not the zone's total payout.
  zone_shared_tooltip:
    de: "Euer Anteil — der Ertrag der Zone wird gleichmäßig auf alle anwesenden verbündeten Teams aufgeteilt."
    en: "Your team's share — the zone's payout is split evenly across every allied team present."
    es: "La parte de tu equipo: la renta de la zona se reparte a partes iguales entre todos los equipos aliados presentes."
    fr: "La part de votre équipe : le revenu de la zone est réparti à parts égales entre toutes les équipes alliées présentes."
    it: "La quota della tua squadra: il reddito della zona viene diviso in parti uguali tra tutte le squadre alleate presenti."
    ja: "自チームの取り分です。このゾーンの収入は、駐留する同盟チーム全員で均等に分配されます。"
    ko: "우리 팀의 몫입니다. 이 구역의 수입은 주둔 중인 모든 동맹 팀에게 균등하게 분배됩니다."
    "pt-BR": "A parte da sua equipe: a renda da zona é dividida igualmente entre todas as equipes aliadas presentes."
    ru: "Доля вашей команды — доход зоны делится поровну между всеми присутствующими союзными командами."
    zh: "你方的份额：该区域的收入会在所有在场的盟队之间平均分配。"
    "zh-TW": "你方的份額：該區域的收入會在所有在場的盟隊之間平均分配。"
  zone_allied:
    de: "Verbündet"
    en: "Allied"
    es: "Aliada"
    fr: "Alliée"
    it: "Alleata"
    ja: "友軍"
    ko: "아군"
    "pt-BR": "Aliada"
    ru: "Союзная"
    zh: "友军"
    "zh-TW": "友軍"
  zone_enemy:
    de: "Feindlich"
    en: "Enemy"
    es: "Enemiga"
    fr: "Ennemie"
    it: "Nemica"
    ja: "敵"
    ko: "적"
    "pt-BR": "Inimiga"
    ru: "Вражеская"
    zh: "敌方"
    "zh-TW": "敵方"
  zone_contested:
    de: "Umkämpft"
    en: "Contested"
    es: "Disputada"
    fr: "Disputée"
    it: "Contesa"
    ja: "係争中"
    ko: "교전 중"
    "pt-BR": "Disputada"
    ru: "Оспариваемая"
    zh: "争夺中"
    "zh-TW": "爭奪中"

  # #4148 (epic #4140): the shared zone-naming scheme — `CENTER` for the
  # centre zone, an 8-point compass bearing of a wedge's mid-angle plus
  # `WEDGE` for an outer zone (`NE WEDGE`). Used by the income breakdown
  # tooltip (`dc_ui::hud::top_toolbar`) and available to the map's centroid
  # labels (`dc_ui::world::territory::label`) via the same
  # `dc_ui_client::display::ZoneIdUi` helper. Same case convention as the
  # captions above: natural case here, uppercased at the render site.
  zone_center:
    de: "Zentrum"
    en: "Center"
    es: "Centro"
    fr: "Centre"
    it: "Centro"
    ja: "中央"
    ko: "중앙"
    "pt-BR": "Centro"
    ru: "Центр"
    zh: "中心"
    "zh-TW": "中心"
  # `%{compass}` is one of the eight `territory.compass.*` words below.
  zone_wedge:
    de: "%{compass}-Sektor"
    en: "%{compass} Wedge"
    es: "Sector %{compass}"
    fr: "Secteur %{compass}"
    it: "Settore %{compass}"
    ja: "%{compass}セクター"
    ko: "%{compass} 섹터"
    "pt-BR": "Setor %{compass}"
    ru: "Сектор %{compass}"
    zh: "%{compass}扇区"
    "zh-TW": "%{compass}扇區"
  # #4148 fix round 1 (C1): a 16-point compass, not 8 — see
  # `dc_ui_client::display::CompassPoint`'s doc comment for why 8 points
  # collide (every 4-team wedge mid-angle lands exactly on an 8-point
  # boundary, and float noise tips it unpredictably) and why 16 points is
  # structurally clear of that failure for every reachable team count.
