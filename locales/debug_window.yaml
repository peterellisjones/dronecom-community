    en: "Click the map to teleport — Esc cancels"
    es: "Haz clic en el mapa para teletransportar — Esc cancela"
    fr: "Cliquez sur la carte pour téléporter — Échap annule"
    it: "Clicca sulla mappa per teletrasportare — Esc annulla"
