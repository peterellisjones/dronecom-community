      ja: "残高：不明"
      ko: "잔액: 알 수 없음"
      "pt-BR": "Saldo: desconhecido"
      ru: "Баланс: неизвестен"
      zh: "余额：未知"
      "zh-TW": "餘額：未知"
    balance_tooltip:
      de: "Das aktuell ausgebbare Guthaben des Teams."
      en: "The team's current spendable balance."
      es: "El saldo gastable actual del equipo."
      fr: "Le solde actuellement dépensable de l'équipe."
      it: "Il saldo attualmente spendibile della squadra."
      ja: "チームが現在使える残高です。"
      ko: "팀이 현재 사용할 수 있는 잔액입니다."
      "pt-BR": "O saldo atualmente gastável da equipe."
      ru: "Текущий доступный для трат баланс команды."
      zh: "该队伍当前可用的余额。"
      "zh-TW": "該隊伍目前可用的餘額。"
    amount_label:
