      es: "Fijar"
      fr: "Définir"
      it: "Imposta"
      ja: "設定"
      ko: "설정"
      "pt-BR": "Definir"
      ru: "Задать"
      zh: "设置"
      "zh-TW": "設定"
    set_tooltip:
