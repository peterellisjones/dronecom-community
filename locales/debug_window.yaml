      ru: "Новый баланс"
      zh: "新余额"
      "zh-TW": "新餘額"
    amount_tooltip:
      de: "Ziehen oder anklicken und tippen, um das Guthaben festzulegen."
      en: "Drag, or click to type, the balance to set."
      es: "Arrastra, o haz clic para escribir, el saldo que quieres fijar."
      fr: "Faites glisser, ou cliquez pour saisir, le solde à définir."
      it: "Trascina, o fai clic per digitare, il saldo da impostare."
      ja: "ドラッグまたはクリックして入力し、設定する残高を決めます。"
      ko: "드래그하거나 클릭해 입력하여 설정할 잔액을 정합니다."
      "pt-BR": "Arraste, ou clique para digitar, o saldo a definir."
      ru: "Перетащите или щёлкните для ввода баланса, который нужно установить."
      zh: "拖动或点击输入要设置的余额。"
      "zh-TW": "拖曳或點擊輸入要設定的餘額。"
    set:
