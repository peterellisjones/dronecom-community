      en: "Replace the team's balance with this amount."
      es: "Sustituye el saldo del equipo por esta cantidad."
      fr: "Remplace le solde de l'équipe par ce montant."
      it: "Sostituisce il saldo della squadra con questo importo."
      ja: "チームの残高をこの金額に置き換えます。"
      ko: "팀의 잔액을 이 금액으로 바꿉니다."
      "pt-BR": "Substitui o saldo da equipe por este valor."
      ru: "Заменяет баланс команды этой суммой."
      zh: "将该队伍的余额替换为此金额。"
      "zh-TW": "將該隊伍的餘額替換為此金額。"
  ai:
    header:
      de: "KI-Kommandeur"
      en: "AI commander"
      es: "Comandante IA"
      fr: "Commandant IA"
      it: "Comandante IA"
      ja: "AI指揮官"
      ko: "AI 지휘관"
      "pt-BR": "Comandante de IA"
      ru: "Командир ИИ"
      zh: "AI指挥官"
      "zh-TW": "AI指揮官"
    header_tooltip:
      de: "Friert einen KI-Kommandeur ein, sodass er keine neuen Entscheidungen trifft. Bereits erteilte Befehle werden weiter ausgeführt."
      en: "Freeze an AI commander so it makes no new decisions. Orders already issued keep executing."
      es: "Congela a un comandante IA para que no tome nuevas decisiones. Las órdenes ya emitidas siguen ejecutándose."
      fr: "Gèle un commandant IA pour qu'il ne prenne plus de décisions. Les ordres déjà donnés continuent de s'exécuter."
      it: "Congela un comandante IA così da non prendere nuove decisioni. Gli ordini già impartiti continuano a essere eseguiti."
      ja: "AI指揮官を凍結し、新たな判断をさせません。発令済みの命令は実行され続けます。"
      ko: "AI 지휘관을 정지시켜 새로운 결정을 내리지 않게 합니다. 이미 내린 명령은 계속 수행됩니다."
      "pt-BR": "Congela um comandante de IA para que ele não tome novas decisões. Ordens já emitidas continuam sendo executadas."
      ru: "Замораживает командира ИИ, чтобы он не принимал новых решений. Уже отданные приказы продолжают выполняться."
      zh: "冻结AI指挥官，使其不再做出新决策。已下达的命令会继续执行。"
      "zh-TW": "凍結AI指揮官，使其不再做出新決策。已下達的命令會繼續執行。"
    team_tooltip:
      de: "Von der KI befehligtes Team."
      en: "AI-commanded team."
      es: "Equipo comandado por la IA."
      fr: "Équipe commandée par l'IA."
      it: "Squadra comandata dall'IA."
      ja: "AIが指揮するチームです。"
      ko: "AI가 지휘하는 팀입니다."
      "pt-BR": "Equipe comandada pela IA."
      ru: "Команда под управлением ИИ."
      zh: "由AI指挥的队伍。"
      "zh-TW": "由AI指揮的隊伍。"
    frozen:
      de: "Eingefroren"
      en: "Frozen"
      es: "Congelado"
      fr: "Gelé"
      it: "Congelato"
      ja: "凍結"
      ko: "정지"
      "pt-BR": "Congelado"
      ru: "Заморожен"
      zh: "冻结"
      "zh-TW": "凍結"
    frozen_tooltip:
      de: "Hindert die KI dieses Teams daran, neue Befehle zu erteilen. Abwählen, damit sie wieder entscheidet."
      en: "Stop this team's AI from issuing new orders. Clear to let it decide again."
      es: "Impide que la IA de este equipo emita nuevas órdenes. Desmárcalo para que vuelva a decidir."
      fr: "Empêche l'IA de cette équipe de donner de nouveaux ordres. Décochez pour qu'elle décide à nouveau."
      it: "Impedisce all'IA di questa squadra di impartire nuovi ordini. Deseleziona per farla decidere di nuovo."
      ja: "このチームのAIが新しい命令を出さないようにします。解除すると再び判断を始めます。"
      ko: "이 팀의 AI가 새 명령을 내리지 못하게 합니다. 해제하면 다시 결정을 내립니다."
      "pt-BR": "Impede a IA desta equipe de emitir novas ordens. Desmarque para ela voltar a decidir."
      ru: "Не даёт ИИ этой команды отдавать новые приказы. Снимите флажок, чтобы он снова принимал решения."
      zh: "阻止该队伍的AI下达新命令。取消勾选后恢复决策。"
      "zh-TW": "阻止該隊伍的AI下達新命令。取消勾選後恢復決策。"
    none:
      de: "Keine KI-Teams."
      en: "No AI-commanded teams."
      es: "No hay equipos de la IA."
      fr: "Aucune équipe commandée par l'IA."
      it: "Nessuna squadra comandata dall'IA."
      ja: "AI指揮のチームはありません。"
      ko: "AI가 지휘하는 팀이 없습니다."
      "pt-BR": "Nenhuma equipe comandada por IA."
      ru: "Нет команд под управлением ИИ."
      zh: "没有由AI指挥的队伍。"
      "zh-TW": "沒有由AI指揮的隊伍。"
    none_tooltip:
      de: "Jedes Team wird von einem Menschen befehligt."
      en: "Every team is commanded by a human."
      es: "Todos los equipos están comandados por humanos."
      fr: "Chaque équipe est commandée par un humain."
      it: "Ogni squadra è comandata da un umano."
      ja: "すべてのチームを人間が指揮しています。"
      ko: "모든 팀을 사람이 지휘하고 있습니다."
      "pt-BR": "Todas as equipes são comandadas por humanos."
      ru: "Всеми командами управляют люди."
      zh: "所有队伍都由人类指挥。"
      "zh-TW": "所有隊伍都由人類指揮。"
  teleport_button:
    de: "Teleportieren"
    en: "Teleport"
    es: "Teletransportar"
    fr: "Téléporter"
    it: "Teletrasporta"
    ja: "テレポート"
    ko: "순간이동"
    "pt-BR": "Teleportar"
    ru: "Телепорт"
    zh: "传送"
    "zh-TW": "傳送"
  teleport_button_tooltip:
    de: "Verschiebt diese Einheit an einen auf der Karte angeklickten Punkt. Ihre Befehle werden gelöscht und die Geschwindigkeit zurückgesetzt."
    en: "Move this unit to a point you click on the map. Its orders are cleared and its velocity reset."
    es: "Mueve esta unidad al punto que pulses en el mapa. Sus órdenes se borran y su velocidad se reinicia."
    fr: "Déplace cette unité au point cliqué sur la carte. Ses ordres sont effacés et sa vitesse remise à zéro."
    it: "Sposta questa unità nel punto cliccato sulla mappa. I suoi ordini vengono cancellati e la velocità azzerata."
    ja: "マップ上でクリックした地点にこのユニットを移動させます。命令は消去され、速度はリセットされます。"
    ko: "지도에서 클릭한 지점으로 이 유닛을 이동시킵니다. 명령은 삭제되고 속도는 초기화됩니다."
    "pt-BR": "Move esta unidade para o ponto clicado no mapa. Suas ordens são apagadas e a velocidade é zerada."
    ru: "Перемещает этот юнит в точку, по которой вы щёлкнете на карте. Приказы отменяются, скорость сбрасывается."
    zh: "将该单位移动到你在地图上点击的位置。其命令会被清除，速度归零。"
    "zh-TW": "將該單位移動到你在地圖上點擊的位置。其命令會被清除，速度歸零。"
  teleport_prompt:
