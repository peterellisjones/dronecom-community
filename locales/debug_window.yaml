_version: 2

debug_window:
  title:
    de: "Debug-Werkzeuge"
    en: "Debug Tools"
    es: "Herramientas de depuración"
    fr: "Outils de débogage"
    it: "Strumenti di debug"
    ja: "デバッグツール"
    ko: "디버그 도구"
    "pt-BR": "Ferramentas de depuração"
    ru: "Инструменты отладки"
    zh: "调试工具"
    "zh-TW": "除錯工具"
  side:
    header:
      de: "Spielerseite"
      en: "Player side"
      es: "Bando del jugador"
      fr: "Camp du joueur"
      it: "Schieramento del giocatore"
      ja: "プレイヤー陣営"
      ko: "플레이어 진영"
      "pt-BR": "Lado do jogador"
      ru: "Сторона игрока"
      zh: "玩家阵营"
      "zh-TW": "玩家陣營"
    header_tooltip:
      de: "Wähle, welches Team du befehligst. Die KI übernimmt die verlassene Seite; Auswahl, Kriegsnebel und Wirtschaft folgen der neuen Seite."
      en: "Choose which team you command. The AI takes over the side you leave; selection, fog of war and economy follow the new side."
      es: "Elige qué equipo comandas. La IA toma el bando que dejas; la selección, la niebla de guerra y la economía siguen al nuevo bando."
      fr: "Choisissez l'équipe que vous commandez. L'IA prend le camp que vous quittez ; sélection, brouillard de guerre et économie suivent le nouveau camp."
      it: "Scegli quale squadra comandi. L'IA prende il controllo di quella che lasci; selezione, nebbia di guerra ed economia seguono il nuovo schieramento."
      ja: "指揮するチームを選びます。離れた陣営はAIが引き継ぎ、選択・戦場の霧・経済表示は新しい陣営に切り替わります。"
      ko: "지휘할 팀을 고릅니다. 떠난 진영은 AI가 넘겨받고, 선택·전장의 안개·경제 표시는 새 진영을 따릅니다."
      "pt-BR": "Escolha qual equipe você comanda. A IA assume o lado que você deixa; seleção, névoa de guerra e economia seguem o novo lado."
      ru: "Выберите команду, которой вы командуете. ИИ берёт на себя покинутую сторону; выбор, туман войны и экономика переключаются на новую сторону."
      zh: "选择你指挥的队伍。你离开的一方由AI接管；选择、战争迷雾和经济面板都会切换到新阵营。"
      "zh-TW": "選擇你指揮的隊伍。你離開的一方由AI接管；選取、戰爭迷霧和經濟面板都會切換到新陣營。"
    current_tooltip:
      de: "Du befehligst diese Seite."
      en: "You command this side."
      es: "Comandas este bando."
      fr: "Vous commandez ce camp."
      it: "Comandi questo schieramento."
      ja: "この陣営を指揮しています。"
      ko: "이 진영을 지휘하고 있습니다."
      "pt-BR": "Você comanda este lado."
      ru: "Вы командуете этой стороной."
      zh: "你正在指挥这一方。"
      "zh-TW": "你正在指揮這一方。"
    swap_tooltip:
      de: "Übernimm das Kommando über diese Seite. Die KI übernimmt deine aktuelle Seite."
      en: "Take command of this side. The AI takes over your current side."
      es: "Toma el mando de este bando. La IA toma tu bando actual."
      fr: "Prenez le commandement de ce camp. L'IA prend votre camp actuel."
      it: "Prendi il comando di questo schieramento. L'IA prende il tuo schieramento attuale."
      ja: "この陣営の指揮を執ります。現在の陣営はAIが引き継ぎます。"
      ko: "이 진영의 지휘를 맡습니다. 현재 진영은 AI가 넘겨받습니다."
      "pt-BR": "Assuma o comando deste lado. A IA assume o seu lado atual."
      ru: "Принять командование этой стороной. ИИ возьмёт вашу текущую сторону."
      zh: "接管这一方的指挥权。你当前的一方将由AI接管。"
      "zh-TW": "接管這一方的指揮權。你目前的一方將由AI接管。"
  god_mode:
    label:
      de: "Gottmodus"
      en: "God mode"
      es: "Modo dios"
      fr: "Mode dieu"
      it: "Modalità dio"
      ja: "ゴッドモード"
      ko: "갓 모드"
      "pt-BR": "Modo deus"
      ru: "Режим бога"
      zh: "上帝模式"
      "zh-TW": "上帝模式"
    tooltip:
      de: "Die Einheiten deiner Seite erleiden keinen Detonationsschaden. Folgt deiner Seite bei einem Wechsel."
      en: "Your side's units take no damage from detonations. It follows your side if you swap."
      es: "Las unidades de tu bando no sufren daño por detonaciones. Sigue a tu bando si lo cambias."
      fr: "Les unités de votre camp ne subissent aucun dégât de détonation. Suit votre camp si vous en changez."
      it: "Le unità del tuo schieramento non subiscono danni da detonazioni. Segue il tuo schieramento se lo cambi."
      ja: "自陣営のユニットは爆発によるダメージを受けません。陣営を切り替えても追従します。"
      ko: "내 진영의 유닛은 폭발 피해를 입지 않습니다. 진영을 바꾸면 따라갑니다."
      "pt-BR": "As unidades do seu lado não sofrem dano de detonações. Acompanha o seu lado se você trocar."
      ru: "Юниты вашей стороны не получают урона от детонаций. Переключается вместе с вашей стороной."
      zh: "己方单位不会受到爆炸伤害。更换阵营时会随之切换。"
      "zh-TW": "己方單位不會受到爆炸傷害。更換陣營時會隨之切換。"
  funds:
    header:
      de: "Mittel"
      en: "Funds"
      es: "Fondos"
      fr: "Fonds"
      it: "Fondi"
      ja: "資金"
      ko: "자금"
      "pt-BR": "Fundos"
      ru: "Средства"
      zh: "资金"
      "zh-TW": "資金"
    header_tooltip:
      de: "Setzt das Guthaben eines Teams. Die Gesamtsummen für Einnahmen und Ausgaben bleiben unverändert."
      en: "Set a team's balance. Lifetime earned and spent totals are not changed."
      es: "Fija el saldo de un equipo. Los totales ganados y gastados no cambian."
      fr: "Définit le solde d'une équipe. Les totaux gagnés et dépensés ne changent pas."
      it: "Imposta il saldo di una squadra. I totali guadagnati e spesi non cambiano."
      ja: "チームの残高を設定します。累計の獲得額・支出額は変わりません。"
      ko: "팀의 잔액을 설정합니다. 누적 수입·지출 합계는 바뀌지 않습니다."
      "pt-BR": "Define o saldo de uma equipe. Os totais ganhos e gastos não mudam."
      ru: "Устанавливает баланс команды. Итоги заработанного и потраченного не меняются."
      zh: "设置某支队伍的余额。累计收入和支出不会改变。"
      "zh-TW": "設定某支隊伍的餘額。累計收入和支出不會改變。"
    team_tooltip:
      de: "Mittel dieses Teams bearbeiten."
      en: "Edit this team's funds."
      es: "Editar los fondos de este equipo."
      fr: "Modifier les fonds de cette équipe."
      it: "Modifica i fondi di questa squadra."
      ja: "このチームの資金を編集します。"
      ko: "이 팀의 자금을 편집합니다."
      "pt-BR": "Editar os fundos desta equipe."
      ru: "Изменить средства этой команды."
      zh: "编辑这支队伍的资金。"
      "zh-TW": "編輯這支隊伍的資金。"
