  step:
    welcome:
      title:
        de: "Willkommen"
        en: "Welcome"
        es: "Bienvenido"
        fr: "Bienvenue"
        it: "Benvenuto"
        ja: "ようこそ"
        ko: "환영합니다"
        "pt-BR": "Boas-vindas"
        ru: "Добро пожаловать"
        zh: "欢迎"
        "zh-TW": "歡迎"
      body:
        de: "Diese Mission vermittelt die Grundlagen der Führung einer Trägergruppe. Hier kann Ihnen nichts passieren. Drücken Sie Beginnen, wenn Sie bereit sind."
        en: "This mission teaches the basics of commanding a carrier group. Nothing here can hurt you. Press Begin when ready."
        es: "Esta misión enseña los fundamentos del mando de un grupo de portaaviones. Aquí nada puede hacerte daño. Pulsa Comenzar cuando estés listo."
        fr: "Cette mission enseigne les bases du commandement d'un groupe aéronaval. Rien ici ne peut vous nuire. Appuyez sur Commencer quand vous êtes prêt."
        it: "Questa missione insegna le basi del comando di un gruppo portaerei. Qui nulla può farti del male. Premi Inizia quando sei pronto."
        ja: "このミッションでは空母群の指揮の基本を学びます。ここでは何も危害は及びません。準備ができたら「開始」を押してください。"
        ko: "이 임무에서는 항모 전단을 지휘하는 기본을 배웁니다. 여기서는 아무것도 당신을 해치지 못합니다. 준비되면 시작을 누르세요."
        "pt-BR": "Esta missão ensina o básico do comando de um grupo de porta-aviões. Nada aqui pode lhe causar dano. Pressione Começar quando estiver pronto."
        ru: "Эта миссия учит основам командования авианосной группой. Здесь вам ничто не угрожает. Нажмите «Начать», когда будете готовы."
        zh: "本任务讲解指挥航母编队的基础知识。这里的一切都不会伤害你。准备好后请按“开始”。"
        "zh-TW": "本任務講解指揮航艦編隊的基礎知識。這裡的一切都不會傷害你。準備好後請按「開始」。"
    camera:
      title:
        de: "Kamera"
        en: "Camera"
        es: "Cámara"
        fr: "Caméra"
        it: "Telecamera"
        ja: "カメラ"
        ko: "카메라"
        "pt-BR": "Câmera"
        ru: "Камера"
        zh: "镜头"
        "zh-TW": "鏡頭"
      body:
        de: "Bewegen Sie die Kamera mit %{key_pan} oder per Ziehen und zoomen Sie mit dem Mausrad."
        en: "Pan the camera with %{key_pan} or by dragging, and zoom with the mouse wheel."
        es: "Desplaza la cámara con %{key_pan} o arrastrando, y acércate con la rueda del ratón."
        fr: "Déplacez la caméra avec %{key_pan} ou en faisant glisser, et zoomez avec la molette de la souris."
        it: "Sposta la telecamera con %{key_pan} o trascinando, e ingrandisci con la rotellina del mouse."
        ja: "%{key_pan} またはドラッグでカメラを移動し、マウスホイールでズームします。"
        ko: "%{key_pan} 또는 드래그로 카메라를 이동하고 마우스 휠로 확대/축소하세요."
        "pt-BR": "Mova a câmera com %{key_pan} ou arrastando, e aproxime com a roda do mouse."
        ru: "Перемещайте камеру клавишами %{key_pan} или перетаскиванием, масштабируйте колёсиком мыши."
        zh: "用 %{key_pan} 或拖动来平移镜头，用鼠标滚轮缩放。"
        "zh-TW": "用 %{key_pan} 或拖曳來平移鏡頭，用滑鼠滾輪縮放。"
    assets_tab:
      title:
        de: "Träger auswählen"
        en: "Select your carrier"
        es: "Selecciona tu portaaviones"
        fr: "Sélectionner votre porte-avions"
        it: "Seleziona la tua portaerei"
        ja: "空母を選択"
        ko: "항모 선택"
        "pt-BR": "Selecione seu porta-aviões"
        ru: "Выберите авианосец"
        zh: "选择你的航母"
        "zh-TW": "選擇你的航艦"
      body:
        de: "Der Reiter EINHEITEN links listet Ihre Einheiten auf. Klicken Sie auf die Zeile Ihres Trägers, um ihn auszuwählen und die Kamera dorthin zu bewegen."
        en: "The ASSETS tab on the left lists your units. Click your carrier's row to select it and fly the camera to it."
        es: "La pestaña MEDIOS de la izquierda lista tus unidades. Haz clic en la fila de tu portaaviones para seleccionarlo y llevar la cámara hasta él."
        fr: "L'onglet MOYENS à gauche liste vos unités. Cliquez sur la ligne de votre porte-avions pour le sélectionner et y amener la caméra."
        it: "La scheda ASSETTI a sinistra elenca le tue unità. Clicca sulla riga della portaerei per selezionarla e portarvi la telecamera."
        ja: "左の「戦力」タブに自軍のユニットが並びます。空母の行をクリックすると選択され、カメラがそこへ移動します。"
        ko: "왼쪽의 전력 탭에 아군 유닛이 나열됩니다. 항모 행을 클릭하면 선택되고 카메라가 그쪽으로 이동합니다."
        "pt-BR": "A aba MEIOS à esquerda lista suas unidades. Clique na linha do seu porta-aviões para selecioná-lo e levar a câmera até ele."
        ru: "Вкладка СИЛЫ слева содержит список ваших юнитов. Щёлкните строку авианосца, чтобы выбрать его и перенести к нему камеру."
        zh: "左侧的“兵力”标签列出你的单位。点击航母所在的行即可选中它，并将镜头飞到它身上。"
        "zh-TW": "左側的「兵力」分頁列出你的單位。點擊航艦所在的列即可選取它，並將鏡頭飛到它身上。"
    speed:
      title:
        de: "Geschwindigkeit einstellen"
        en: "Set your speed"
        es: "Ajusta la velocidad"
        fr: "Régler la vitesse"
        it: "Imposta la velocità"
        ja: "速力を設定"
        ko: "속력 설정"
        "pt-BR": "Defina a velocidade"
        ru: "Задайте скорость"
        zh: "设定航速"
        "zh-TW": "設定航速"
      body:
        de: "Das Panel rechts zeigt die ausgewählte Einheit. Stellen Sie in der Zeile MNV die Geschwindigkeit Ihres Trägers ein."
        en: "The panel on the right shows the selected unit. In the MNV row, set your carrier's speed."
        es: "El panel de la derecha muestra la unidad seleccionada. En la fila MNV, ajusta la velocidad de tu portaaviones."
        fr: "Le panneau de droite affiche l'unité sélectionnée. Dans la ligne MNV, réglez la vitesse de votre porte-avions."
        it: "Il pannello a destra mostra l'unità selezionata. Nella riga MNV, imposta la velocità della portaerei."
        ja: "右のパネルに選択中のユニットが表示されます。MNV 行で空母の速力を設定してください。"
        ko: "오른쪽 패널에 선택한 유닛이 표시됩니다. MNV 행에서 항모의 속력을 설정하세요."
        "pt-BR": "O painel à direita mostra a unidade selecionada. Na linha MNV, defina a velocidade do seu porta-aviões."
        ru: "Панель справа показывает выбранный юнит. В строке MNV задайте скорость авианосца."
        zh: "右侧面板显示所选单位。在 MNV 行中设定航母的航速。"
        "zh-TW": "右側面板顯示所選單位。在 MNV 列中設定航艦的航速。"
    move:
      title:
        de: "Bewegen"
        en: "Move"
        es: "Moverse"
        fr: "Se déplacer"
        it: "Muoversi"
        ja: "移動"
        ko: "이동"
        "pt-BR": "Mover"
        ru: "Движение"
        zh: "移动"
        "zh-TW": "移動"
      body:
        de: "Klicken Sie mit der rechten Maustaste auf offenes Wasser, um Ihren Träger dorthin zu schicken."
        en: "Right-click open water to send your carrier there."
        es: "Haz clic derecho en aguas abiertas para enviar allí tu portaaviones."
        fr: "Faites un clic droit sur la mer libre pour y envoyer votre porte-avions."
        it: "Clicca con il tasto destro sull'acqua libera per mandarvi la portaerei."
        ja: "開けた海面を右クリックすると、空母がそこへ向かいます。"
        ko: "탁 트인 바다를 우클릭하면 항모가 그곳으로 향합니다."
        "pt-BR": "Clique com o botão direito em águas abertas para enviar seu porta-aviões até lá."
        ru: "Щёлкните правой кнопкой по открытой воде, чтобы отправить туда авианосец."
        zh: "在开阔水域上点击右键，让航母前往该处。"
        "zh-TW": "在開闊水域上按右鍵，讓航艦前往該處。"
    first_sortie:
      title:
        de: "Drohne losschicken"
        en: "Send the drone out"
        es: "Envía el dron"
        fr: "Envoyer le drone"
        it: "Invia il drone"
        ja: "ドローンを送り出す"
        ko: "드론 출격"
        "pt-BR": "Envie o drone"
        ru: "Отправьте дрон"
        zh: "派出无人机"
        "zh-TW": "派出無人機"
      body:
        de: "Ihr Träger hat eine Angriffsdrohne an Bord, und ein pulsierender Ring auf der Karte markiert, wohin sie fliegen soll. Wählen Sie im Reiter EINHEITEN die Drohne unter Ihrem Träger aus und klicken Sie dann mit der rechten Maustaste in die Mitte des markierten Gebiets. Ein Kartenbefehl an eine Drohne an Bord startet sie und schickt sie auf den Weg — den Knopf STARTEN brauchen Sie nicht. Die Deckmannschaft macht sie zuerst startklar."
        en: "Your carrier has one strike drone aboard, and a pulsing ring on the map marks where to send it. In the ASSETS tab, select the drone under your carrier, then right-click the centre of the marked area. A map order given to a drone aboard launches it and sends it on its way, so there is no need for the LAUNCH button. The deck crew readies it first."
        es: "Tu portaaviones lleva a bordo un dron de ataque, y un anillo pulsante en el mapa marca adónde enviarlo. En la pestaña MEDIOS, selecciona el dron bajo tu portaaviones y haz clic derecho en el centro de la zona marcada. Una orden en el mapa a un dron a bordo lo lanza y lo pone en camino, así que no necesitas el botón LANZAR. La dotación de cubierta lo prepara primero."
        fr: "Votre porte-avions embarque un drone de frappe, et un anneau pulsant sur la carte marque où l'envoyer. Dans l'onglet MOYENS, sélectionnez le drone sous votre porte-avions, puis faites un clic droit au centre de la zone marquée. Un ordre donné sur la carte à un drone à bord le lance et l'envoie en route : inutile d'utiliser le bouton LANCER. L'équipe de pont le prépare d'abord."
        it: "La tua portaerei ha a bordo un drone d'attacco, e un anello pulsante sulla mappa indica dove mandarlo. Nella scheda ASSETTI, seleziona il drone sotto la portaerei, poi clicca con il tasto destro al centro dell'area indicata. Un ordine sulla mappa a un drone a bordo lo lancia e lo manda per la sua strada: il pulsante LANCIA non serve. Il personale di ponte lo prepara prima."
        ja: "空母には攻撃ドローンが 1 機搭載されており、マップ上で点滅する円が送り先を示しています。「戦力」タブで空母の下にあるドローンを選択し、示されたエリアの中心を右クリックします。艦上のドローンにマップで命令すると発艦してそのまま向かうので、「発艦」ボタンは不要です。まず甲板要員が発進準備を行います。"
        ko: "항모에는 타격 드론 한 기가 실려 있고, 지도에서 깜박이는 원이 보낼 곳을 표시합니다. 전력 탭에서 항모 아래의 드론을 선택한 뒤 표시된 구역의 중앙을 우클릭하세요. 함에 있는 드론에 지도 명령을 내리면 발진해 바로 출발하므로 발진 버튼은 필요 없습니다. 먼저 갑판 요원이 비행 준비를 합니다."
        "pt-BR": "Seu porta-aviões tem um drone de ataque a bordo, e um anel pulsante no mapa marca para onde enviá-lo. Na aba MEIOS, selecione o drone sob o seu porta-aviões e clique com o botão direito no centro da área marcada. Uma ordem no mapa a um drone a bordo o lança e o põe a caminho, então o botão LANÇAR não é necessário. A equipe de convés o prepara primeiro."
        ru: "На борту авианосца есть один ударный дрон, а пульсирующее кольцо на карте отмечает, куда его отправить. На вкладке СИЛЫ выберите дрон под авианосцем и щёлкните правой кнопкой по центру отмеченного района. Приказ на карте дрону на борту запускает его и отправляет в путь — кнопка ЗАПУСК не нужна. Сначала палубная команда подготовит его к вылету."
        zh: "你的航母上有一架攻击无人机，地图上闪烁的圆环标出了要派它去的地方。在“兵力”标签中选中航母下方的无人机，然后右键点击标记区域的中心。对舰上的无人机下达地图命令，它就会发射并直接出发，无需使用“发射”按钮。甲板人员会先为它做好起飞准备。"
        "zh-TW": "你的航艦上有一架攻擊無人機，地圖上閃爍的圓環標出了要派它去的地方。在「兵力」分頁中選取航艦下方的無人機，然後以右鍵點擊標記區域的中心。對艦上的無人機下達地圖命令，它就會發射並直接出發，無需使用「發射」按鈕。甲板人員會先為它做好起飛準備。"
    time:
      title:
        de: "Zeit beschleunigen"
        en: "Speed up time"
        es: "Acelera el tiempo"
        fr: "Accélérer le temps"
        it: "Accelera il tempo"
        ja: "時間を加速"
        ko: "시간 가속"
        "pt-BR": "Acelere o tempo"
        ru: "Ускорьте время"
        zh: "加快时间"
        "zh-TW": "加快時間"
      body:
        de: "Während die Drohne an Deck startklar gemacht wird, beschleunigen Sie die Simulation mit den Zeitreglern oben (%{key_speed_up}). Die Suche braucht Zeit; dieser Schritt ist abgeschlossen, sobald die Drohne in der Luft ist."
        en: "While the drone readies on deck, speed up the simulation with the time controls at the top (%{key_speed_up}). Searching takes time; this step completes once the drone is in the air."
        es: "Mientras el dron se prepara en cubierta, acelera la simulación con los controles de tiempo de arriba (%{key_speed_up}). Buscar lleva tiempo; este paso se completa cuando el dron está en el aire."
        fr: "Pendant que le drone se prépare sur le pont, accélérez la simulation avec les commandes de temps en haut (%{key_speed_up}). La recherche prend du temps ; cette étape se termine une fois le drone en l'air."
        it: "Mentre il drone si prepara sul ponte, accelera la simulazione con i controlli del tempo in alto (%{key_speed_up}). La ricerca richiede tempo; questo passaggio si completa quando il drone è in volo."
        ja: "ドローンが甲板で発進準備をしている間に、上部の時間操作でシミュレーションを加速してください（%{key_speed_up}）。捜索には時間がかかります。ドローンが離陸するとこのステップは完了します。"
        ko: "드론이 갑판에서 준비하는 동안 상단의 시간 조작으로 시뮬레이션을 빠르게 하세요(%{key_speed_up}). 탐색에는 시간이 걸립니다. 드론이 이륙하면 이 단계가 완료됩니다."
        "pt-BR": "Enquanto o drone se prepara no convés, acelere a simulação com os controles de tempo no alto (%{key_speed_up}). Procurar leva tempo; esta etapa termina quando o drone estiver no ar."
        ru: "Пока дрон готовят на палубе, ускорьте симуляцию кнопками времени вверху (%{key_speed_up}). Поиск требует времени; шаг завершится, когда дрон окажется в воздухе."
        zh: "趁无人机在甲板上准备时，用顶部的时间控制加快模拟速度（%{key_speed_up}）。搜索需要时间；无人机升空后此步骤即完成。"
        "zh-TW": "趁無人機在甲板上準備時，用頂部的時間控制加快模擬速度（%{key_speed_up}）。搜尋需要時間；無人機升空後此步驟即完成。"
    contact:
      title:
        de: "Auf Kontakt warten"
        en: "Wait for contact"
        es: "Espera un contacto"
        fr: "Attendre un contact"
        it: "Attendi un contatto"
        ja: "接触を待つ"
        ko: "접촉 대기"
        "pt-BR": "Aguarde um contato"
        ru: "Дождитесь контакта"
        zh: "等待接触"
        "zh-TW": "等待接觸"
      body:
        de: "Ihre Drohne fliegt lautlos: Ihr Radar ist aus, denn Radar sieht weit, wird aber noch weiter gesehen. Passive Sensoren lauschen nur. Warten Sie, bis sie etwas entdeckt."
        en: "Your drone flies silent: its radar is off, because radar sees far but is seen further. Its passive sensors only listen. Wait for it to spot something."
        es: "Tu dron vuela en silencio: su radar está apagado, porque el radar ve lejos, pero lo ven desde más lejos. Sus sensores pasivos solo escuchan. Espera a que detecte algo."
        fr: "Votre drone vole en silence : son radar est coupé, car le radar voit loin mais est vu encore plus loin. Ses capteurs passifs ne font qu'écouter. Attendez qu'il repère quelque chose."
        it: "Il tuo drone vola in silenzio: il radar è spento, perché il radar vede lontano ma è visto ancora più lontano. I sensori passivi si limitano ad ascoltare. Attendi che avvisti qualcosa."
        ja: "ドローンは静粛状態で飛行しています。レーダーは遠くまで見えますが、さらに遠くから見つかるため、オフにしています。受動センサーは聞くだけです。何かを発見するまで待ちましょう。"
        ko: "드론은 침묵 상태로 비행합니다. 레이더는 멀리 보지만 더 멀리서 발각되므로 꺼 두었습니다. 수동 센서는 듣기만 합니다. 무언가 발견할 때까지 기다리세요."
        "pt-BR": "Seu drone voa em silêncio: o radar está desligado, porque o radar enxerga longe, mas é visto ainda mais longe. Os sensores passivos apenas escutam. Aguarde até que ele aviste algo."
        ru: "Ваш дрон летит в режиме тишины: радар выключен, ведь радар видит далеко, но его видно ещё дальше. Пассивные датчики только слушают. Подождите, пока он что-нибудь обнаружит."
        zh: "你的无人机正在静默飞行：雷达已关闭，因为雷达看得远，但也会被更远处发现。被动传感器只负责监听。等它发现目标。"
        "zh-TW": "你的無人機正在靜默飛行：雷達已關閉，因為雷達看得遠，但也會被更遠處發現。被動感測器只負責監聽。等它發現目標。"
    tracks_tab:
      title:
        de: "Spuren-Reiter öffnen"
        en: "Open the tracks tab"
        es: "Abre la pestaña de pistas"
        fr: "Ouvrir l'onglet des pistes"
        it: "Apri la scheda delle tracce"
        ja: "航跡タブを開く"
        ko: "항적 탭 열기"
        "pt-BR": "Abra a aba de pistas"
        ru: "Откройте вкладку трасс"
        zh: "打开航迹标签"
        "zh-TW": "開啟航跡分頁"
      body:
        de: "Kontakt! Öffnen Sie links den Reiter SPUREN, um alles zu sehen, was Ihre Streitkraft erfasst hat."
        en: "Contact! Open the TRACKS tab on the left to see everything your force has detected."
        es: "¡Contacto! Abre la pestaña PISTAS de la izquierda para ver todo lo que ha detectado tu fuerza."
        fr: "Contact ! Ouvrez l'onglet PISTES à gauche pour voir tout ce que votre force a détecté."
        it: "Contatto! Apri la scheda TRACCE a sinistra per vedere tutto ciò che la tua forza ha rilevato."
        ja: "接触あり！左の「航跡」タブを開いて、自軍が探知したものをすべて確認しましょう。"
        ko: "접촉! 왼쪽의 항적 탭을 열어 아군이 탐지한 모든 것을 확인하세요."
        "pt-BR": "Contato! Abra a aba PISTAS à esquerda para ver tudo o que sua força detectou."
        ru: "Контакт! Откройте вкладку ТРАССЫ слева, чтобы увидеть всё, что обнаружили ваши силы."
        zh: "发现接触！打开左侧的“航迹”标签，查看你的部队探测到的一切。"
        "zh-TW": "發現接觸！開啟左側的「航跡」分頁，查看你的部隊偵測到的一切。"
    track_row:
      title:
        de: "Spur auswählen"
        en: "Select the track"
        es: "Selecciona la pista"
        fr: "Sélectionner la piste"
        it: "Seleziona la traccia"
        ja: "航跡を選択"
        ko: "항적 선택"
        "pt-BR": "Selecione a pista"
        ru: "Выберите трассу"
        zh: "选择航迹"
        "zh-TW": "選擇航跡"
      body:
        de: "Klicken Sie auf die neue Spur, um sie auszuwählen und die Kamera dorthin zu bewegen."
        en: "Click the new track to select it and fly the camera to it."
        es: "Haz clic en la nueva pista para seleccionarla y llevar la cámara hasta ella."
        fr: "Cliquez sur la nouvelle piste pour la sélectionner et y amener la caméra."
        it: "Clicca sulla nuova traccia per selezionarla e portarvi la telecamera."
        ja: "新しい航跡をクリックすると選択され、カメラがそこへ移動します。"
        ko: "새 항적을 클릭하면 선택되고 카메라가 그쪽으로 이동합니다."
        "pt-BR": "Clique na nova pista para selecioná-la e levar a câmera até ela."
        ru: "Щёлкните новую трассу, чтобы выбрать её и перенести к ней камеру."
        zh: "点击新出现的航迹即可选中它，并将镜头飞到它身上。"
        "zh-TW": "點擊新出現的航跡即可選取它，並將鏡頭飛到它身上。"
    radar:
      title:
        de: "Radar an"
        en: "Radar on"
        es: "Radar encendido"
        fr: "Radar activé"
        it: "Radar acceso"
        ja: "レーダー作動"
        ko: "레이더 켜기"
        "pt-BR": "Radar ligado"
        ru: "Радар включён"
        zh: "开启雷达"
        "zh-TW": "開啟雷達"
      body:
        de: "Passive Sensoren lieferten nur eine Peilung: eine Richtung, keine Entfernung. Für eine Feuerlösung wählen Sie Ihre Drohne aus, stellen in der Zeile ROE EMCON auf Strahlen und warten, bis das Radar die Spur erfasst."
        en: "Passive sensors gave only a bearing: a direction, with no range. To get a firing solution, select your drone, set EMCON to Radiate in the ROE row, and wait for its radar to fix the track."
        es: "Los sensores pasivos solo dieron una demora: una dirección, sin distancia. Para obtener una solución de tiro, selecciona tu dron, ajusta EMCON a Irradiar en la fila ROE y espera a que su radar fije la traza."
        fr: "Les capteurs passifs n'ont donné qu'un relèvement : une direction, sans distance. Pour obtenir une solution de tir, sélectionnez votre drone, réglez l'EMCON sur Émettre dans la ligne ROE et attendez que son radar fixe la piste."
        it: "I sensori passivi hanno dato solo una direzione, senza distanza. Per ottenere una soluzione di tiro, seleziona il drone, imposta l'EMCON su Irradia nella riga ROE e attendi che il radar fissi la traccia."
        ja: "受動センサーで得られたのは方位だけで、距離はわかりません。射撃諸元を得るには、ドローンを選択し、ROE 行で EMCON を「放射」に設定して、レーダーが航跡を確定するまで待ちます。"
        ko: "수동 센서는 거리 없이 방위만 알려 주었습니다. 사격 해를 얻으려면 드론을 선택하고 ROE 행에서 EMCON을 방사로 설정한 뒤, 레이더가 항적을 확정할 때까지 기다리세요."
        "pt-BR": "Os sensores passivos deram apenas uma marcação: uma direção, sem distância. Para obter uma solução de tiro, selecione seu drone, defina o EMCON como Irradiar na linha ROE e aguarde o radar fixar a trilha."
        ru: "Пассивные датчики дали только пеленг: направление без дальности. Чтобы получить решение на стрельбу, выберите свой дрон, установите EMCON в Излучать в строке ROE и дождитесь, пока радар уточнит трассу."
        zh: "被动传感器只给出了方位：只有方向，没有距离。要获得射击诸元，请选中你的无人机，在 ROE 行中将 EMCON 设为“辐射”，然后等待雷达确定航迹。"
        "zh-TW": "被動感測器只提供了方位：只有方向，沒有距離。要取得射擊諸元，請選取你的無人機，在 ROE 列中將 EMCON 設為「輻射」，然後等待雷達確定航跡。"
    attack:
      title:
        de: "Angreifen"
        en: "Attack"
        es: "Ataca"
        fr: "Attaquer"
        it: "Attacca"
        ja: "攻撃"
        ko: "공격"
        "pt-BR": "Ataque"
        ru: "Атака"
        zh: "攻击"
        "zh-TW": "攻擊"
      body:
        de: "Klicken Sie bei ausgewählter Drohne mit der rechten Maustaste auf die markierte Spur, um sie anzugreifen."
        en: "With your drone selected, right-click the highlighted track to attack it."
        es: "Con tu dron seleccionado, haz clic derecho en la pista resaltada para atacarla."
        fr: "Avec votre drone sélectionné, faites un clic droit sur la piste en surbrillance pour l'attaquer."
        it: "Con il drone selezionato, clicca con il tasto destro sulla traccia evidenziata per attaccarla."
        ja: "ドローンを選択した状態で、強調表示された航跡を右クリックして攻撃します。"
        ko: "드론을 선택한 상태에서 강조 표시된 항적을 우클릭하여 공격하세요."
        "pt-BR": "Com o drone selecionado, clique com o botão direito na pista destacada para atacá-la."
        ru: "Выбрав дрон, щёлкните правой кнопкой по выделенной трассе, чтобы атаковать её."
        zh: "选中无人机后，在高亮显示的航迹上点击右键即可攻击。"
        "zh-TW": "選取無人機後，在醒目標示的航跡上按右鍵即可攻擊。"
    kill:
      title:
        de: "Schlag"
        en: "Strike"
        es: "Ataque"
        fr: "Frappe"
        it: "Attacco"
        ja: "攻撃実行"
        ko: "타격"
        "pt-BR": "Ataque"
        ru: "Удар"
        zh: "打击"
        "zh-TW": "打擊"
      body:
        de: "Waffen abgefeuert. Beobachten Sie den Schlag."
        en: "Weapons away. Watch the strike."
        es: "Armas lanzadas. Observa el ataque."
        fr: "Armes tirées. Observez la frappe."
        it: "Armi lanciate. Osserva l'attacco."
        ja: "兵装を発射しました。攻撃の様子を見守りましょう。"
        ko: "무장을 발사했습니다. 타격을 지켜보세요."
        "pt-BR": "Armas disparadas. Observe o ataque."
        ru: "Оружие применено. Наблюдайте за ударом."
        zh: "武器已发射。请观察打击过程。"
        "zh-TW": "武器已發射。請觀察打擊過程。"
    out_of_missiles:
      title:
        de: "Keine Raketen mehr"
        en: "Out of missiles"
        es: "Sin misiles"
        fr: "Plus de missiles"
        it: "Missili esauriti"
        ja: "ミサイル切れ"
        ko: "미사일 소진"
        "pt-BR": "Sem mísseis"
        ru: "Ракеты закончились"
        zh: "导弹耗尽"
        "zh-TW": "飛彈耗盡"
      body:
        de: "Ihre Drohne hat alle Raketen abgefeuert, und das Ziel schwimmt noch. Wählen Sie die Drohne aus und drücken Sie RÜCKKEHR (%{key_rtb}), um sie zum Nachladen heimzuholen. Die Drohne kreist über Ihrem Träger, um vor der Landung Höhe abzubauen — das dauert eine Weile. Beschleunigen Sie die Zeit, wenn Sie möchten (%{key_speed_up})."
        en: "Your drone has fired all its missiles and the target is still afloat. Select the drone and press RTB (%{key_rtb}) to bring it home for more. The drone circles your carrier to lose height before it lands — this takes a little while. Speed up time if you like (%{key_speed_up})."
        es: "Tu dron ha disparado todos sus misiles y el objetivo sigue a flote. Selecciona el dron y pulsa REGRESO (%{key_rtb}) para traerlo de vuelta a por más. El dron da vueltas sobre tu portaaviones para perder altura antes de aterrizar; esto lleva un rato. Acelera el tiempo si quieres (%{key_speed_up})."
        fr: "Votre drone a tiré tous ses missiles et la cible est toujours à flot. Sélectionnez le drone et appuyez sur RETOUR (%{key_rtb}) pour le ramener se réarmer. Le drone tourne au-dessus de votre porte-avions pour perdre de l'altitude avant de se poser — cela prend un moment. Accélérez le temps si vous le souhaitez (%{key_speed_up})."
        it: "Il tuo drone ha lanciato tutti i missili e il bersaglio è ancora a galla. Seleziona il drone e premi RIENTRO (%{key_rtb}) per riportarlo a riarmarsi. Il drone gira sopra la tua portaerei per perdere quota prima di atterrare: ci vuole un po'. Accelera il tempo, se vuoi (%{key_speed_up})."
        ja: "ドローンはミサイルを撃ち尽くしましたが、目標はまだ浮いています。ドローンを選択し、「帰還」（%{key_rtb}）を押して補給のために呼び戻しましょう。ドローンは着艦前に高度を下げるため空母の上空を旋回します。少し時間がかかるので、必要なら時間を加速してください（%{key_speed_up}）。"
        ko: "드론이 미사일을 모두 발사했지만 표적은 아직 떠 있습니다. 드론을 선택하고 귀환(%{key_rtb})을 눌러 재무장하러 돌아오게 하세요. 드론은 착함하기 전에 고도를 낮추려고 항모 주위를 선회합니다. 시간이 조금 걸리니 원하면 시간을 가속하세요(%{key_speed_up})."
        "pt-BR": "Seu drone disparou todos os mísseis e o alvo ainda está flutuando. Selecione o drone e pressione RETORNO (%{key_rtb}) para trazê-lo de volta e rearmar. O drone circula sobre o seu porta-aviões para perder altitude antes de pousar — isso leva um tempinho. Acelere o tempo se quiser (%{key_speed_up})."
        ru: "Дрон выпустил все ракеты, а цель всё ещё на плаву. Выберите дрон и нажмите ВОЗВРАТ (%{key_rtb}), чтобы вернуть его за новыми ракетами. Перед посадкой дрон кружит над вашим авианосцем, чтобы снизиться, — это займёт некоторое время. При желании ускорьте время (%{key_speed_up})."
        zh: "你的无人机已打光所有导弹，但目标仍未沉没。选中无人机并按“返回”（%{key_rtb}），让它返航补充弹药。无人机降落前会绕着你的航母盘旋以降低高度，这需要一点时间。如有需要，可以加快时间（%{key_speed_up}）。"
        "zh-TW": "你的無人機已打光所有飛彈，但目標仍未沉沒。選取無人機並按「返回」（%{key_rtb}），讓它返航補充彈藥。無人機降落前會繞著你的航艦盤旋以降低高度，這需要一點時間。如有需要，可以加快時間（%{key_speed_up}）。"
    relaunch:
      title:
        de: "Erneut starten"
        en: "Launch again"
        es: "Lanza de nuevo"
        fr: "Relancer"
        it: "Lancia di nuovo"
        ja: "再発進"
        ko: "재발진"
        "pt-BR": "Lance de novo"
        ru: "Запустите снова"
        zh: "再次发射"
        "zh-TW": "再次發射"
      body:
        de: "%{drone} ist betankt und aufmunitioniert. Wählen Sie die Drohne im Reiter EINHEITEN aus und schicken Sie sie zurück über das markierte Gebiet: Klicken Sie dort mit der rechten Maustaste, oder halten Sie Strg gedrückt und ziehen Sie mit der rechten Maustaste eine Patrouille. Der Kartenbefehl startet sie. Lassen Sie EMCON in der Zeile ROE auf Strahlen; sobald ihr Radar das Ziel wieder erfasst, greifen Sie an."
        en: "%{drone} is refuelled and rearmed. Select it in the ASSETS tab and send it back over the marked area: right-click there, or hold Ctrl and right-drag a patrol. The map order launches it. Keep EMCON on Radiate in the ROE row; once its radar has the target again, attack."
        es: "%{drone} está repostado y rearmado. Selecciónalo en la pestaña MEDIOS y envíalo de vuelta sobre la zona marcada: haz clic derecho allí, o mantén Ctrl y arrastra con el botón derecho una patrulla. La orden en el mapa lo lanza. Deja EMCON en Irradiar en la fila ROE; cuando su radar vuelva a captar el objetivo, ataca."
        fr: "%{drone} est ravitaillé et réarmé. Sélectionnez-le dans l'onglet MOYENS et renvoyez-le sur la zone marquée : faites-y un clic droit, ou maintenez Ctrl et faites un clic droit glissé pour une patrouille. L'ordre sur la carte le lance. Gardez l'EMCON sur Émettre dans la ligne ROE ; dès que son radar retrouve la cible, attaquez."
        it: "%{drone} è rifornito e riarmato. Selezionalo nella scheda ASSETTI e rimandalo sull'area indicata: clicca lì con il tasto destro, oppure tieni premuto Ctrl e trascina con il tasto destro un pattugliamento. L'ordine sulla mappa lo lancia. Lascia l'EMCON su Irradia nella riga ROE; quando il suo radar ritrova il bersaglio, attacca."
        ja: "%{drone} は給油と再武装を終えました。「戦力」タブで選択し、示されたエリアの上へ送り返しましょう。そこを右クリックするか、Ctrl を押しながら右ドラッグして哨戒を設定します。マップでの命令で発艦します。ROE 行の EMCON は「放射」のままにし、レーダーが再び目標を捉えたら攻撃します。"
        ko: "%{drone}의 급유와 재무장이 끝났습니다. 전력 탭에서 선택하고 표시된 구역 위로 돌려보내세요. 그곳을 우클릭하거나, Ctrl을 누른 채 우클릭 드래그하여 초계를 지정하세요. 지도 명령으로 발진합니다. ROE 행의 EMCON은 방사로 두고, 레이더가 다시 표적을 잡으면 공격하세요."
        "pt-BR": "%{drone} está reabastecido e rearmado. Selecione-o na aba MEIOS e mande-o de volta sobre a área marcada: clique ali com o botão direito, ou segure Ctrl e arraste com o botão direito uma patrulha. A ordem no mapa o lança. Mantenha o EMCON em Irradiar na linha ROE; quando o radar voltar a captar o alvo, ataque."
        ru: "%{drone} заправлен и перевооружён. Выберите его на вкладке СИЛЫ и отправьте обратно к отмеченному району: щёлкните там правой кнопкой или, удерживая Ctrl, перетащите патруль правой кнопкой. Приказ на карте запустит дрон. Оставьте EMCON в режиме Излучать в строке ROE; когда радар снова захватит цель, атакуйте."
        zh: "%{drone} 已完成加油和重新装弹。在“兵力”标签中选中它，把它派回标记区域：在那里点击右键，或按住 Ctrl 并右键拖动设置巡逻。地图命令会让它发射。在 ROE 行中保持 EMCON 为“辐射”；雷达再次捕获目标后即可发起攻击。"
        "zh-TW": "%{drone} 已完成加油和重新裝彈。在「兵力」分頁中選取它，把它派回標記區域：在那裡按右鍵，或按住 Ctrl 並以右鍵拖曳設定巡邏。地圖命令會讓它發射。在 ROE 列中保持 EMCON 為「輻射」；雷達再次捕獲目標後即可發起攻擊。"
    rtb:
      title:
        de: "Drohne bergen"
        en: "Recover the drone"
        es: "Recupera el dron"
        fr: "Récupérer le drone"
        it: "Recupera il drone"
        ja: "ドローンを回収"
        ko: "드론 회수"
        "pt-BR": "Recupere o drone"
        ru: "Верните дрон"
        zh: "回收无人机"
        "zh-TW": "回收無人機"
      body:
        de: "Holen Sie die Drohne heim, um sie zu schützen. Drücken Sie RÜCKKEHR (%{key_rtb}). Die Drohne kreist über Ihrem Träger, um vor der Landung Höhe abzubauen — das dauert eine Weile. Beschleunigen Sie die Zeit, wenn Sie möchten (%{key_speed_up})."
        en: "Bring the drone home to keep it safe. Press RTB (%{key_rtb}). The drone circles your carrier to lose height before it lands — this takes a little while. Speed up time if you like (%{key_speed_up})."
        es: "Trae el dron de vuelta para mantenerlo a salvo. Pulsa REGRESO (%{key_rtb}). El dron da vueltas sobre tu portaaviones para perder altura antes de aterrizar; esto lleva un rato. Acelera el tiempo si quieres (%{key_speed_up})."
        fr: "Ramenez le drone pour le mettre à l'abri. Appuyez sur RETOUR (%{key_rtb}). Le drone tourne au-dessus de votre porte-avions pour perdre de l'altitude avant de se poser — cela prend un moment. Accélérez le temps si vous le souhaitez (%{key_speed_up})."
        it: "Riporta il drone alla base per tenerlo al sicuro. Premi RIENTRO (%{key_rtb}). Il drone gira sopra la tua portaerei per perdere quota prima di atterrare: ci vuole un po'. Accelera il tempo, se vuoi (%{key_speed_up})."
        ja: "ドローンを安全に保つため、呼び戻しましょう。「帰還」（%{key_rtb}）を押します。ドローンは着艦前に高度を下げるため空母の上空を旋回します。少し時間がかかるので、必要なら時間を加速してください（%{key_speed_up}）。"
        ko: "드론을 안전하게 지키려면 귀환시키세요. 귀환(%{key_rtb})을 누르세요. 드론은 착함하기 전에 고도를 낮추려고 항모 주위를 선회합니다. 시간이 조금 걸리니 원하면 시간을 가속하세요(%{key_speed_up})."
        "pt-BR": "Traga o drone de volta para mantê-lo em segurança. Pressione RETORNO (%{key_rtb}). O drone circula sobre o seu porta-aviões para perder altitude antes de pousar — isso leva um tempinho. Acelere o tempo se quiser (%{key_speed_up})."
        ru: "Верните дрон домой, чтобы сохранить его. Нажмите ВОЗВРАТ (%{key_rtb}). Перед посадкой дрон кружит над вашим авианосцем, чтобы снизиться, — это займёт некоторое время. При желании ускорьте время (%{key_speed_up})."
        zh: "让无人机返航以确保其安全。按“返回”（%{key_rtb}）。无人机降落前会绕着你的航母盘旋以降低高度，这需要一点时间。如有需要，可以加快时间（%{key_speed_up}）。"
        "zh-TW": "讓無人機返航以確保其安全。按「返回」（%{key_rtb}）。無人機降落前會繞著你的航艦盤旋以降低高度，這需要一點時間。如有需要，可以加快時間（%{key_speed_up}）。"
    purchases:
      title:
        de: "Beschaffung öffnen"
        en: "Open purchasing"
        es: "Abre las compras"
        fr: "Ouvrir les achats"
        it: "Apri gli acquisti"
        ja: "発注を開く"
        ko: "구매 열기"
        "pt-BR": "Abra as compras"
        ru: "Откройте закупки"
        zh: "打开采购"
        "zh-TW": "開啟採購"
      body:
        de: "Sie brauchen eine weitere Drohne. Klicken Sie oben auf Ihr Budget oder drücken Sie %{key_purchases}, um die Beschaffung zu öffnen."
        en: "You need another drone. Click your budget at the top, or press %{key_purchases}, to open purchasing."
        es: "Necesitas otro dron. Haz clic en tu presupuesto arriba, o pulsa %{key_purchases}, para abrir las compras."
        fr: "Il vous faut un autre drone. Cliquez sur votre budget en haut, ou appuyez sur %{key_purchases}, pour ouvrir les achats."
        it: "Ti serve un altro drone. Clicca sul budget in alto, oppure premi %{key_purchases}, per aprire gli acquisti."
        ja: "もう 1 機ドローンが必要です。上部の予算をクリックするか %{key_purchases} を押して、発注画面を開きます。"
        ko: "드론이 한 기 더 필요합니다. 상단의 예산을 클릭하거나 %{key_purchases}을(를) 눌러 구매 창을 여세요."
        "pt-BR": "Você precisa de outro drone. Clique no seu orçamento no alto, ou pressione %{key_purchases}, para abrir as compras."
        ru: "Вам нужен ещё один дрон. Щёлкните бюджет вверху или нажмите %{key_purchases}, чтобы открыть закупки."
        zh: "你需要另一架无人机。点击顶部的预算，或按 %{key_purchases}，打开采购界面。"
        "zh-TW": "你需要另一架無人機。點擊頂部的預算，或按 %{key_purchases}，開啟採購介面。"
    buy:
      title:
        de: "Drohne kaufen"
        en: "Buy a drone"
        es: "Compra un dron"
        fr: "Acheter un drone"
        it: "Compra un drone"
        ja: "ドローンを購入"
        ko: "드론 구매"
        "pt-BR": "Compre um drone"
        ru: "Купите дрон"
        zh: "购买无人机"
        "zh-TW": "購買無人機"
      body:
        de: "Kaufen Sie eine Angriffsdrohne für Ihren Träger."
        en: "Buy a Strike Drone for your carrier."
        es: "Compra un dron de ataque para tu portaaviones."
        fr: "Achetez un drone de frappe pour votre porte-avions."
        it: "Compra un drone d'attacco per la tua portaerei."
        ja: "空母用に攻撃ドローンを購入してください。"
        ko: "항모에 배치할 타격 드론을 구매하세요."
        "pt-BR": "Compre um drone de ataque para o seu porta-aviões."
        ru: "Купите ударный дрон для своего авианосца."
        zh: "为你的航母购买一架攻击无人机。"
        "zh-TW": "為你的航艦購買一架攻擊無人機。"
    rearm:
      title:
        de: "Auftanken und aufmunitionieren"
        en: "Refuel and rearm"
        es: "Repostar y rearmar"
        fr: "Ravitailler et réarmer"
        it: "Rifornimento e riarmo"
        ja: "給油と再武装"
        ko: "급유와 재무장"
        "pt-BR": "Reabastecer e rearmar"
        ru: "Заправка и перевооружение"
        zh: "加油与重新装弹"
        "zh-TW": "加油與重新裝彈"
      body:
        de: "Sobald eine Drohne wieder an Bord ist, betankt der Träger sie und lädt ihre Raketen aus den Reservebeständen in seinen Vorräten nach — ganz ohne Befehle. Warten Sie, bis sie vollgetankt und voll bewaffnet ist. Kreist die Drohne noch über Ihrem Träger, baut sie Höhe für die Landung ab."
        en: "Once a drone is back aboard, the carrier refuels it and reloads its missiles from the spare rounds in its stores — no orders needed. Wait until it is full of fuel and fully armed. If the drone is still circling your carrier, it is losing height to land."
        es: "Cuando un dron vuelve a bordo, el portaaviones lo reposta y recarga sus misiles con la munición de reserva de sus pañoles, sin necesidad de órdenes. Espera hasta que tenga el depósito lleno y esté completamente armado. Si el dron sigue dando vueltas sobre tu portaaviones, está perdiendo altura para aterrizar."
        fr: "Dès qu'un drone est de retour à bord, le porte-avions le ravitaille et recharge ses missiles avec les munitions de réserve de ses soutes, sans aucun ordre. Attendez qu'il ait le plein et soit entièrement armé. Si le drone tourne encore au-dessus de votre porte-avions, il perd de l'altitude pour se poser."
        it: "Quando un drone torna a bordo, la portaerei lo rifornisce e ricarica i suoi missili con le munizioni di riserva nei depositi, senza bisogno di ordini. Attendi che abbia il pieno e sia completamente armato. Se il drone gira ancora sopra la tua portaerei, sta perdendo quota per atterrare."
        ja: "ドローンが艦に戻ると、空母は自動で給油し、予備弾薬からミサイルを再装填します。命令は不要です。燃料が満タンになり、完全に武装するまで待ちましょう。ドローンがまだ空母の上空を旋回しているなら、着艦に向けて高度を下げているところです。"
        ko: "드론이 함에 돌아오면 항모가 자동으로 급유하고 보관 중인 예비 탄으로 미사일을 재장전합니다. 명령은 필요 없습니다. 연료가 가득 차고 완전히 무장될 때까지 기다리세요. 드론이 아직 항모 주위를 선회하고 있다면 착함을 위해 고도를 낮추는 중입니다."
        "pt-BR": "Quando um drone volta a bordo, o porta-aviões o reabastece e recarrega seus mísseis com a munição de reserva dos paióis, sem precisar de ordens. Aguarde até que esteja com o tanque cheio e totalmente armado. Se o drone ainda estiver circulando sobre o seu porta-aviões, ele está perdendo altitude para pousar."
        ru: "Как только дрон вернётся на борт, авианосец сам заправит его и перезарядит ракеты из запасных боеприпасов в своих погребах — приказы не нужны. Дождитесь, пока он будет полностью заправлен и вооружён. Если дрон ещё кружит над авианосцем, он снижается для посадки."
        zh: "无人机一回到舰上，航母就会自动为它加油，并用库存的备用弹药重新装填导弹，无需下令。等待它加满燃料并完全装弹。如果无人机仍在航母上空盘旋，说明它正在降低高度准备降落。"
        "zh-TW": "無人機一回到艦上，航艦就會自動為它加油，並用庫存的備用彈藥重新裝填飛彈，無需下令。等待它加滿燃料並完全裝彈。如果無人機仍在航艦上空盤旋，表示它正在降低高度準備降落。"
    delivery:
      title:
        de: "Lieferung"
        en: "Delivery"
        es: "Entrega"
        fr: "Livraison"
        it: "Consegna"
        ja: "納品"
        ko: "인도"
        "pt-BR": "Entrega"
        ru: "Доставка"
        zh: "交付"
        "zh-TW": "交付"
      body:
        de: "Ihr Kauf wird gebaut. Danach fliegt er vom Kartenrand heran und landet auf Ihrem Träger."
        en: "Your purchase is being built. It then flies in from the edge of the map and lands aboard your carrier."
        es: "Tu compra se está construyendo. Después llegará volando desde el borde del mapa y aterrizará en tu portaaviones."
        fr: "Votre achat est en construction. Il arrivera ensuite en vol depuis le bord de la carte et se posera sur votre porte-avions."
        it: "Il tuo acquisto è in costruzione. Poi arriverà in volo dal bordo della mappa e atterrerà sulla portaerei."
        ja: "購入品を建造中です。完成するとマップの端から飛来し、空母に着艦します。"
        ko: "구매한 기체를 건조하는 중입니다. 완성되면 지도 가장자리에서 날아와 항모에 착함합니다."
        "pt-BR": "Sua compra está sendo construída. Depois ela chegará voando da borda do mapa e pousará no seu porta-aviões."
        ru: "Ваша покупка строится. Затем она прилетит с края карты и сядет на ваш авианосец."
        zh: "你购买的无人机正在建造中。完成后它会从地图边缘飞来，降落到你的航母上。"
        "zh-TW": "你購買的無人機正在建造中。完成後它會從地圖邊緣飛來，降落到你的航艦上。"
    second_sortie:
      title:
        de: "Zweiter Einsatz"
        en: "Second sortie"
        es: "Segunda salida"
        fr: "Deuxième sortie"
        it: "Seconda sortita"
        ja: "2 回目の出撃"
        ko: "두 번째 출격"
        "pt-BR": "Segunda surtida"
        ru: "Второй вылет"
        zh: "第二次出击"
        "zh-TW": "第二次出擊"
      body:
        de: "Ihre neue Drohne %{drone} ist auf Ihrem Träger gelandet. Wählen Sie sie im Reiter EINHEITEN aus, halten Sie dann Strg gedrückt und ziehen Sie mit der rechten Maustaste über das neu markierte Gebiet, um ihr dort eine Patrouille zuzuweisen. Wie zuvor startet der Kartenbefehl die Drohne und schickt sie auf den Weg."
        en: "Your new drone, %{drone}, has landed aboard your carrier. Select it in the ASSETS tab, then hold Ctrl and right-drag over the newly marked area to give it a patrol there. As before, the map order launches the drone and sends it on its way."
        es: "Tu nuevo dron, %{drone}, ha aterrizado en tu portaaviones. Selecciónalo en la pestaña MEDIOS, luego mantén Ctrl y arrastra con el botón derecho sobre la nueva zona marcada para darle una patrulla allí. Como antes, la orden en el mapa lanza el dron y lo pone en camino."
        fr: "Votre nouveau drone, %{drone}, s'est posé sur votre porte-avions. Sélectionnez-le dans l'onglet MOYENS, puis maintenez Ctrl et faites un clic droit glissé sur la nouvelle zone marquée pour lui y donner une patrouille. Comme avant, l'ordre sur la carte lance le drone et l'envoie en route."
        it: "Il tuo nuovo drone, %{drone}, è atterrato sulla portaerei. Selezionalo nella scheda ASSETTI, poi tieni premuto Ctrl e trascina con il tasto destro sulla nuova area indicata per assegnargli lì un pattugliamento. Come prima, l'ordine sulla mappa lancia il drone e lo manda per la sua strada."
        ja: "新しいドローン %{drone} が空母に着艦しました。「戦力」タブで選択し、Ctrl を押しながら新たに示されたエリアの上で右ドラッグして、そこでの哨戒を与えます。先ほどと同じく、マップでの命令でドローンが発艦し、そのまま向かいます。"
        ko: "새 드론 %{drone}이(가) 항모에 착함했습니다. 전력 탭에서 선택한 뒤 Ctrl을 누른 채 새로 표시된 구역 위에서 우클릭 드래그하여 그곳의 초계를 지정하세요. 앞서와 같이 지도 명령으로 드론이 발진해 바로 출발합니다."
        "pt-BR": "Seu novo drone, %{drone}, pousou no seu porta-aviões. Selecione-o na aba MEIOS, depois segure Ctrl e arraste com o botão direito sobre a nova área marcada para dar a ele uma patrulha ali. Como antes, a ordem no mapa lança o drone e o põe a caminho."
        ru: "Ваш новый дрон %{drone} сел на авианосец. Выберите его на вкладке СИЛЫ, затем, удерживая Ctrl, перетащите правой кнопкой по новому отмеченному району, чтобы задать ему патруль там. Как и раньше, приказ на карте запускает дрон и отправляет его в путь."
        zh: "你的新无人机 %{drone} 已降落到航母上。在“兵力”标签中选中它，然后按住 Ctrl 并在新标记的区域上按右键拖动，让它在那里巡逻。和之前一样，地图命令会让无人机发射并直接出发。"
        "zh-TW": "你的新無人機 %{drone} 已降落到航艦上。在「兵力」分頁中選取它，然後按住 Ctrl 並在新標記的區域上以右鍵拖曳，讓它在那裡巡邏。和之前一樣，地圖命令會讓無人機發射並直接出發。"
    second_radar:
      title:
        de: "Radar wieder an"
        en: "Radar on again"
        es: "Radar encendido de nuevo"
        fr: "Radar de nouveau activé"
        it: "Di nuovo radar acceso"
        ja: "再びレーダー作動"
        ko: "다시 레이더 켜기"
        "pt-BR": "Radar ligado de novo"
        ru: "Снова включите радар"
        zh: "再次开启雷达"
        "zh-TW": "再次開啟雷達"
      body:
        de: "Wählen Sie die neue Drohne aus und stellen Sie in der Zeile ROE EMCON auf Strahlen. Ihr Radar findet Schiffe auf Entfernung und erkennt, worum es sich handelt."
        en: "Select the new drone and set EMCON to Radiate in the ROE row. Its radar finds ships at range and identifies what they are."
        es: "Selecciona el nuevo dron y ajusta EMCON a Irradiar en la fila ROE. Su radar encuentra buques a distancia e identifica qué son."
        fr: "Sélectionnez le nouveau drone et réglez l'EMCON sur Émettre dans la ligne ROE. Son radar repère les navires à distance et identifie leur nature."
        it: "Seleziona il nuovo drone e imposta l'EMCON su Irradia nella riga ROE. Il suo radar trova le navi a distanza e ne identifica la natura."
        ja: "新しいドローンを選択し、ROE 行で EMCON を「放射」に設定します。レーダーは遠くの艦船を見つけ、その正体を識別します。"
        ko: "새 드론을 선택하고 ROE 행에서 EMCON을 방사로 설정하세요. 레이더가 먼 곳의 함선을 찾아내고 정체를 식별합니다."
        "pt-BR": "Selecione o novo drone e defina o EMCON como Irradiar na linha ROE. O radar encontra navios a distância e identifica o que são."
        ru: "Выберите новый дрон и установите EMCON в Излучать в строке ROE. Радар находит корабли на дальности и определяет, что это за суда."
        zh: "选中新无人机，并在 ROE 行中将 EMCON 设为“辐射”。雷达能在远处发现舰船并识别其身份。"
        "zh-TW": "選取新無人機，並在 ROE 列中將 EMCON 設為「輻射」。雷達能在遠處發現艦船並識別其身分。"
    neutral:
      title:
        de: "Ziviler Schiffsverkehr"
        en: "Civilian shipping"
        es: "Tráfico civil"
        fr: "Navires civils"
        it: "Traffico civile"
        ja: "民間船舶"
        ko: "민간 선박"
        "pt-BR": "Navegação civil"
        ru: "Гражданские суда"
        zh: "民用船只"
        "zh-TW": "民用船隻"
      body:
        de: "Nicht jedes Schiff ist ein Gegner. Erkennt Ihr Radar das zivile Frachtschiff auf Ihrer Route, wird seine Spur gelb: Neutral. Neutrale Schiffe sind keine Ziele: Beschädigen oder versenken Sie eines, zieht die AWC Ihnen automatisch Reparationen von Ihrem Budget ab. Wählen Sie seine Zeile im Reiter SPUREN aus."
        en: "Not every ship is an enemy. When your radar identifies the civilian cargo ship on your route, its track turns yellow: Neutral. Neutral ships are not targets: if you damage or sink one, the AWC automatically fines you reparations from your budget. Select its row in the TRACKS tab."
        es: "No todos los buques son enemigos. Cuando tu radar identifique el buque de carga civil de tu ruta, su pista se volverá amarilla: Neutral. Los buques neutrales no son objetivos: si dañas o hundes uno, la AWC te multa automáticamente con reparaciones que descuenta de tu presupuesto. Selecciona su fila en la pestaña PISTAS."
        fr: "Tous les navires ne sont pas ennemis. Quand votre radar identifie le cargo civil sur votre route, sa piste passe au jaune : Neutre. Les navires neutres ne sont pas des cibles : si vous en endommagez ou en coulez un, l'AWC vous inflige automatiquement des réparations prélevées sur votre budget. Sélectionnez sa ligne dans l'onglet PISTES."
        it: "Non tutte le navi sono nemiche. Quando il radar identifica la nave cargo civile sulla tua rotta, la sua traccia diventa gialla: Neutrale. Le navi neutrali non sono bersagli: se ne danneggi o ne affondi una, l'AWC ti addebita automaticamente le riparazioni sul tuo budget. Seleziona la sua riga nella scheda TRACCE."
        ja: "すべての艦船が敵とは限りません。レーダーが航路上の民間貨物船を識別すると、その航跡は黄色の「中立」になります。中立の船は攻撃目標ではありません。損傷させたり撃沈したりすると、AWC が自動的に賠償金を科し、予算から差し引きます。「航跡」タブでその行を選択しましょう。"
        ko: "모든 함선이 적은 아닙니다. 레이더가 항로 위의 민간 화물선을 식별하면 그 항적은 노란색 중립으로 바뀝니다. 중립 선박은 표적이 아닙니다. 손상시키거나 격침하면 AWC가 자동으로 배상금을 부과해 예산에서 차감합니다. 항적 탭에서 그 행을 선택하세요."
        "pt-BR": "Nem todo navio é inimigo. Quando seu radar identificar o navio cargueiro civil na sua rota, a pista dele fica amarela: Neutro. Navios neutros não são alvos: se você danificar ou afundar um, a AWC cobra automaticamente reparações do seu orçamento. Selecione a linha dele na aba PISTAS."
        ru: "Не каждый корабль — враг. Когда радар опознает гражданское грузовое судно на вашем маршруте, его трасса станет жёлтой: Нейтральный. Нейтральные суда — не цели: если вы повредите или потопите такое судно, AWC автоматически взыщет с вашего бюджета репарации. Выберите его строку на вкладке ТРАССЫ."
        zh: "并非每艘船都是敌人。当雷达识别出你航线上的民用货船时，其航迹会变成黄色：中立。中立船只不是攻击目标：如果你损坏或击沉一艘，AWC 会自动从你的预算中扣除赔款。在“航迹”标签中选中它所在的行。"
        "zh-TW": "並非每艘船都是敵人。當雷達識別出你航線上的民用貨船時，其航跡會變成黃色：中立。中立船隻不是攻擊目標：如果你損壞或擊沉一艘，AWC 會自動從你的預算中扣除賠款。在「航跡」分頁中選取它所在的列。"
    final_attack:
      title:
        de: "Letzter Angriff"
        en: "Final attack"
        es: "Ataque final"
        fr: "Attaque finale"
        it: "Attacco finale"
        ja: "最終攻撃"
        ko: "최후의 공격"
        "pt-BR": "Ataque final"
        ru: "Последняя атака"
        zh: "最后一击"
        "zh-TW": "最後一擊"
      body:
        de: "Da draußen ist noch ein gegnerisches Schiff. Fliegen Sie die neue Drohne darauf zu. Sobald ihr Radar das Ziel geortet hat, klicken Sie mit der rechten Maustaste auf die markierte Spur, um sie anzugreifen."
        en: "One more enemy ship is out there. Fly the new drone toward it. Once its radar has a fix, right-click the highlighted track to attack it."
        es: "Aún hay un buque enemigo por ahí. Vuela el nuevo dron hacia él. Cuando su radar lo tenga fijado, haz clic derecho en la pista resaltada para atacarla."
        fr: "Il reste un navire ennemi quelque part. Dirigez le nouveau drone vers lui. Dès que son radar l'a localisé, faites un clic droit sur la piste en surbrillance pour l'attaquer."
        it: "C'è ancora una nave nemica là fuori. Porta il nuovo drone verso di essa. Quando il radar l'ha localizzata, clicca con il tasto destro sulla traccia evidenziata per attaccarla."
        ja: "外にもう 1 隻、敵艦がいます。新しいドローンをそちらへ向かわせましょう。レーダーが位置を捉えたら、強調表示された航跡を右クリックして攻撃します。"
        ko: "밖에 적함이 한 척 더 있습니다. 새 드론을 그쪽으로 보내세요. 레이더가 위치를 잡으면 강조 표시된 항적을 우클릭하여 공격하세요."
        "pt-BR": "Ainda há um navio inimigo por aí. Leve o novo drone até ele. Assim que o radar o localizar, clique com o botão direito na pista destacada para atacá-la."
        ru: "Где-то там остался ещё один вражеский корабль. Направьте к нему новый дрон. Когда радар определит его место, щёлкните правой кнопкой по выделенной трассе, чтобы атаковать её."
        zh: "外面还有一艘敌舰。让新无人机飞向它。雷达锁定其位置后，在高亮显示的航迹上点击右键发起攻击。"
        "zh-TW": "外面還有一艘敵艦。讓新無人機飛向它。雷達鎖定其位置後，在醒目標示的航跡上按右鍵發起攻擊。"
    done:
      title:
        de: "Auftrag beenden"
        en: "Finish the mission"
        es: "Termina la misión"
        fr: "Terminer la mission"
        it: "Concludi la missione"
        ja: "任務を完了する"
        ko: "임무 마무리"
        "pt-BR": "Conclua a missão"
        ru: "Завершите миссию"
        zh: "完成任务"
        "zh-TW": "完成任務"
      body:
        de: "Zerstören Sie das gegnerische Versorgungsschiff, um das Tutorial abzuschließen."
        en: "Destroy the enemy supply ship to finish the tutorial."
        es: "Destruye el buque de suministro enemigo para terminar el tutorial."
        fr: "Détruisez le navire ravitailleur ennemi pour terminer le tutoriel."
        it: "Distruggi la nave di rifornimento nemica per concludere il tutorial."
        ja: "敵の補給艦を撃破するとチュートリアルが完了します。"
        ko: "적 보급함을 격파하여 튜토리얼을 마치세요."
        "pt-BR": "Destrua o navio de suprimentos inimigo para concluir o tutorial."
        ru: "Уничтожьте вражеское судно снабжения, чтобы завершить обучение."
        zh: "摧毁敌方补给舰即可完成教程。"
        "zh-TW": "摧毀敵方補給艦即可完成教學。"
    complete:
      title:
        de: "Mission erfüllt"
        en: "Mission complete"
        es: "Misión cumplida"
        fr: "Mission accomplie"
        it: "Missione compiuta"
        ja: "ミッション完了"
        ko: "임무 완료"
        "pt-BR": "Missão cumprida"
        ru: "Задание выполнено"
        zh: "任务完成"
        "zh-TW": "任務完成"
      body:
        de: "Gut gemacht! Sie haben Ihren Träger bewegt, Drohnen per Kartenbefehl entsandt, lautlos gesucht und für eine Feuerlösung das Radar eingeschaltet, angegriffen, eine Drohne zurückgeholt und neu bewaffnet, Verstärkung gekauft und zivile Schiffe verschont. In einem echten Spiel gewinnen Sie, indem Sie den gegnerischen Träger zerstören. Drücken Sie Abschließen, um die Mission zu beenden."
        en: "Well done! You moved your carrier, sent drones out with map orders, searched silent and turned the radar on for a firing solution, attacked, recovered and rearmed a drone, bought a reinforcement and left civilian shipping alone. In a real match, you win by destroying the enemy carrier. Press Finish to end the mission."
        es: "¡Bien hecho! Moviste tu portaaviones, enviaste drones con órdenes en el mapa, buscaste en silencio y encendiste el radar para obtener una solución de tiro, atacaste, recuperaste y rearmaste un dron, compraste un refuerzo y respetaste el tráfico civil. En una partida real, ganas destruyendo el portaaviones enemigo. Pulsa Terminar para finalizar la misión."
        fr: "Bien joué ! Vous avez déplacé votre porte-avions, envoyé des drones par ordre sur la carte, cherché en silence puis allumé le radar pour une solution de tir, attaqué, récupéré et réarmé un drone, acheté un renfort et épargné la navigation civile. Dans une vraie partie, vous gagnez en détruisant le porte-avions ennemi. Appuyez sur Terminer pour finir la mission."
        it: "Ben fatto! Hai spostato la portaerei, inviato droni con ordini sulla mappa, cercato in silenzio e acceso il radar per una soluzione di tiro, attaccato, recuperato e riarmato un drone, acquistato un rinforzo e risparmiato il traffico civile. In una partita vera vinci distruggendo la portaerei nemica. Premi Termina per concludere la missione."
        ja: "お見事です！空母を動かし、マップ指示でドローンを発進させ、静粛状態で捜索してからレーダーを作動させて射撃諸元を得て攻撃し、ドローンを回収して再武装し、増援を購入し、民間船には手を出しませんでした。実際の対戦では、敵空母を撃破すると勝利です。「完了」を押してミッションを終えましょう。"
        ko: "잘하셨습니다! 항공모함을 움직이고, 지도 명령으로 드론을 출격시키고, 침묵 상태로 탐색한 뒤 레이더를 켜 사격 해를 얻어 공격했으며, 드론을 회수해 재무장하고, 증원을 구매하고, 민간 선박은 건드리지 않았습니다. 실제 대전에서는 적 항공모함을 격파하면 승리합니다. 완료를 눌러 임무를 마치세요."
        "pt-BR": "Muito bem! Você moveu seu porta-aviões, enviou drones com ordens no mapa, buscou em silêncio e ligou o radar para obter uma solução de tiro, atacou, recuperou e rearmou um drone, comprou um reforço e poupou a navegação civil. Em uma partida de verdade, você vence destruindo o porta-aviões inimigo. Pressione Concluir para encerrar a missão."
        ru: "Отличная работа! Вы двигали авианосец, отправляли дроны приказами на карте, искали в режиме тишины и включали радар для решения на стрельбу, атаковали, возвращали и перевооружали дрон, купили подкрепление и не тронули гражданские суда. В настоящем матче победа — это уничтожение вражеского авианосца. Нажмите «Завершить», чтобы закончить задание."
        zh: "干得好！你移动了航母，用地图指令派出无人机，静默搜索后开启雷达获得射击诸元并发起攻击，回收无人机并重新装弹，购买了增援，还放过了民用船只。在真正的对局中，摧毁敌方航母即可获胜。按“完成”结束任务。"
        "zh-TW": "做得好！你移動了航艦，用地圖指令派出無人機，靜默搜尋後開啟雷達取得射擊諸元並發動攻擊，回收無人機並重新裝彈，購買了增援，也放過了民用船隻。在真正的對局中，摧毀敵方航艦即可獲勝。按「完成」結束任務。"
