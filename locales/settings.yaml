      en: "Shift + right-click — append waypoint"
      es: "Shift + clic derecho — añadir punto de ruta"
      fr: "Shift + clic droit — ajouter un point de route"
      it: "Shift + clic destro — aggiungi un punto di rotta"
      ja: "Shift + 右クリック — 経由点を追加"
      ko: "Shift + 오른쪽 클릭 — 경유점 추가"
      "pt-BR": "Shift + clique direito — acrescentar ponto de rota"
      ru: "Shift + ПКМ — добавить точку маршрута"
      zh: "Shift + 右键单击 — 追加航点"
      "zh-TW": "Shift + 右鍵單擊 — 附加航點"
    mouse_append_waypoint_tooltip:
      de: "Fügt der Route der ausgewählten Einheit einen Wegpunkt an der angeklickten Stelle hinzu; ein Klick nahe dem ersten Wegpunkt schließt sie stattdessen zu einem Patrouillenkreis."
      en: "Adds a waypoint to the selected unit's route at the clicked point; clicking near the first waypoint closes it into a patrol circuit instead."
      es: "Añade un punto de ruta en el lugar pulsado a la ruta de la unidad seleccionada; pulsar cerca del primer punto la cierra en un circuito de patrulla en su lugar."
      fr: "Ajoute un point de route à l'endroit cliqué sur la route de l'unité sélectionnée ; cliquer près du premier point la boucle en circuit de patrouille à la place."
      it: "Aggiunge un waypoint nel punto cliccato alla rotta dell'unità selezionata; cliccare vicino al primo waypoint la chiude invece in un circuito di pattuglia."
      ja: "選択したユニットのルートに、クリックした地点のウェイポイントを追加します。ルート最初のウェイポイント付近をクリックすると、代わりに哨戒巡回として閉じます。"
      ko: "선택한 유닛의 경로에 클릭한 지점의 경유점을 추가합니다. 첫 경유점 근처를 클릭하면 대신 순찰 순환로로 닫습니다."
      "pt-BR": "Adiciona um ponto de rota no local clicado à rota da unidade selecionada; clicar perto do primeiro ponto a fecha em um circuito de patrulha em vez disso."
      ru: "Добавляет точку маршрута в месте щелчка к маршруту выбранного юнита; щелчок рядом с первой точкой вместо этого замыкает его в патрульный круг."
      zh: "在选定单位的航线上于点击位置追加一个航点；点击靠近第一个航点处则会改为将航线闭合为巡逻回路。"
      "zh-TW": "在選定單位的航線上於點擊位置附加一個航點；點擊靠近第一個航點處則會改為將航線閉合為巡邏迴路。"
    mouse_waypoint_truncate:
