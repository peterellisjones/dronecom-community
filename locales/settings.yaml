  terrain_render_mode.label_tooltip:
    de: "Debug-Schattierung des Geländenetzes: Schichten, LOD-Stufe, Oberflächennormalen, eine Höhen-Heatmap oder die LOD-Übergangsmischung. Normal ist das ausgelieferte Erscheinungsbild."
