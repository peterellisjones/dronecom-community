  autosave_tooltip:
    de: "Automatische Speicherungen verwenden eigene nummerierte Plätze und löschen die älteste, sobald sie voll sind."
    en: "Periodic autosaves use separate numbered slots, deleting the oldest when full."
    es: "Los autoguardados periódicos usan ranuras numeradas propias y eliminan la más antigua al llenarse."
    fr: "Les sauvegardes automatiques utilisent des emplacements numérotés séparés et suppriment le plus ancien une fois pleins."
    it: "I salvataggi automatici periodici usano slot numerati propri ed eliminano il più vecchio quando sono pieni."
    ja: "定期的な自動保存は専用の番号付きスロットを使用し、満杯になると最も古いものを削除します。"
    ko: "주기적인 자동 저장은 별도의 번호가 붙은 슬롯을 사용하며, 가득 차면 가장 오래된 것을 삭제합니다."
    "pt-BR": "Os salvamentos automáticos periódicos usam espaços numerados próprios e excluem o mais antigo quando ficam cheios."
    ru: "Периодические автосохранения используют отдельные пронумерованные слоты и удаляют самый старый при заполнении."
    zh: "定期自动存档使用独立编号的存档位，存满后会删除最旧的一个。"
    "zh-TW": "定期自動存檔使用獨立編號的存檔位，存滿後會刪除最舊的一個。"
