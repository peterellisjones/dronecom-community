    fr: "Remplace le point central des symboles NTDS creux par une frimousse souriante. Purement cosmétique — aucun effet sur le jeu."
    it: "Sostituisce il punto centrale dei simboli NTDS vuoti con una faccina sorridente. Puramente estetico — nessun effetto sul gioco."
    ja: "中空のNTDSシンボルの中心点をスマイリーフェイスに置き換えます。純粋に見た目だけの変更で、ゲームプレイには影響しません。"
