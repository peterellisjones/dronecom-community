      ja: "選択とハイライトの色、描画色、そしてセンサーチップ・方位時間ウォーターフォール・デザイナーのセンサーアイコンが共有するパッシブ／アクティブセンサーの一対です。"
      ko: "선택 및 강조 색상, 그리기 색상, 그리고 센서 칩과 방위-시간 폭포도, 디자이너의 센서 아이콘이 함께 쓰는 수동/능동 센서 색 한 쌍입니다."
      "pt-BR": "Tons de seleção e destaque, a cor de desenho e o par de sensor passivo/ativo compartilhado pelas fichas de sensor, pela cascata marcação-tempo e pelos ícones de sensor do designer."
      ru: "Оттенки выделения и подсветки, цвет рисования и пара пассивный/активный сенсор, общая для значков сенсоров, водопада «пеленг — время» и значков сенсоров в конструкторе."
      zh: "选择与高亮色、绘图色，以及传感器标签、方位-时间瀑布图和设计器传感器图标共用的被动/主动传感器配色。"
      "zh-TW": "選擇與高亮色、繪圖色，以及感測器標籤、方位-時間瀑布圖和設計器感測器圖示共用的被動/主動感測器配色。"
