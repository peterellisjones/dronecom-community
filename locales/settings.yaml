    it: "Disegna la linea di ogni sensore che rileva verso il suo contatto, non solo quella della piattaforma selezionata."
    ja: "選択中のプラットフォームだけでなく、探知しているすべてのセンサーからコンタクトへの線を描画します。"
    ko: "선택한 플랫폼뿐 아니라 탐지 중인 모든 센서에서 접촉까지의 선을 그립니다."
