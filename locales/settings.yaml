    es: "Sombreado de depuración de la malla del terreno: capas, nivel de LOD, normales de superficie, un mapa de calor de altura o la mezcla de transición de LOD. Normal es el aspecto que se distribuye."
    fr: "Ombrage de débogage du maillage du terrain : couches, niveau de LOD, normales de surface, carte thermique d'altitude ou fondu de transition de LOD. Normal correspond au rendu livré."
    it: "Ombreggiatura di debug della mesh del terreno: livelli, livello di LOD, normali di superficie, una mappa di calore delle quote o la fusione di transizione LOD. Normale è l'aspetto distribuito."
    ja: "地形メッシュのデバッグ表示です。レイヤー、LOD レベル、面法線、高度ヒートマップ、LOD モーフの補間から選べます。Normal が製品版の見た目です。"
    ko: "지형 메시의 디버그 셰이딩입니다. 레이어, LOD 단계, 표면 법선, 고도 히트맵, LOD 모프 보간 중에서 고릅니다. Normal이 출시 상태의 모습입니다."
    "pt-BR": "Sombreamento de depuração da malha do terreno: camadas, nível de LOD, normais de superfície, um mapa de calor de altitude ou a mistura de transição de LOD. Normal é a aparência distribuída."
    ru: "Отладочная закраска сетки рельефа: слои, уровень LOD, нормали поверхности, тепловая карта высот или смешение при переходе LOD. Normal — вид, как в готовой игре."
    zh: "地形网格的调试着色：分层、LOD 级别、表面法线、高度热图或 LOD 过渡混合。Normal 为正式发布时的外观。"
    "zh-TW": "地形網格的除錯著色：分層、LOD 級別、表面法線、高度熱圖或 LOD 過渡混合。Normal 為正式發布時的外觀。"
