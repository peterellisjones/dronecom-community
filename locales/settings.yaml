  controls:
    hint:
      de: "Belegung anklicken, dann Taste drücken. Esc bricht ab."
      en: "Click a binding, then press a key. Esc cancels."
      es: "Haz clic en una asignación y pulsa una tecla. Esc cancela."
      fr: "Cliquez sur un raccourci, puis appuyez sur une touche. Échap annule."
      it: "Clicca su un'assegnazione, poi premi un tasto. Esc annulla."
      ja: "割り当てをクリックしてキーを押してください。Escで取り消し。"
      ko: "바인딩을 클릭한 후 키를 누르세요. Esc로 취소."
      "pt-BR": "Clique em um atalho e pressione uma tecla. Esc cancela."
      ru: "Нажмите на привязку, затем нажмите клавишу. Esc отменяет."
      zh: "点击绑定，然后按一个键。Esc 取消。"
      "zh-TW": "點擊綁定，然後按一個鍵。Esc 取消。"
    hint_tooltip:
      de: "Eine Taste innerhalb einer Gruppe erneut zu verwenden wird als Konflikt markiert; dieselbe Taste in verschiedenen Gruppen ist unproblematisch."
      en: "Reusing a key within a group is flagged as a conflict; the same key across different groups is fine."
      es: "Reutilizar una tecla dentro de un grupo se marca como conflicto; la misma tecla en grupos distintos no supone problema."
      fr: "Réutiliser une touche au sein d'un groupe est signalé comme un conflit ; la même touche dans des groupes différents ne pose pas de problème."
      it: "Riutilizzare un tasto all'interno di un gruppo viene segnalato come conflitto; lo stesso tasto in gruppi diversi va bene."
      ja: "同じグループ内でキーを重複させると競合として表示されます。異なるグループ間で同じキーを使うのは問題ありません。"
      ko: "같은 그룹 내에서 키를 중복 사용하면 충돌로 표시됩니다. 다른 그룹 간에는 같은 키를 사용해도 괜찮습니다."
      "pt-BR": "Reutilizar uma tecla dentro de um grupo é marcado como conflito; a mesma tecla em grupos diferentes não há problema."
      ru: "Повторное использование клавиши в пределах группы отмечается как конфликт; одна и та же клавиша в разных группах допустима."
      zh: "在同一组内重复使用某个键会被标记为冲突；不同组之间使用相同的键则没有问题。"
      "zh-TW": "在同一組內重複使用某個鍵會被標記為衝突；不同組之間使用相同的鍵則沒有問題。"
    press_key:
      de: "Taste drücken…"
      en: "Press a key…"
      es: "Pulsa una tecla…"
      fr: "Appuyez sur une touche…"
      it: "Premi un tasto…"
      ja: "キーを押してください…"
      ko: "키를 누르세요…"
      "pt-BR": "Pressione uma tecla…"
      ru: "Нажмите клавишу…"
      zh: "按一个键…"
      "zh-TW": "按一個鍵…"
    rebind_tooltip:
      de: "Zum Neubelegen klicken, dann Taste drücken. Esc bricht ab."
      en: "Click to rebind, then press a key. Esc cancels."
      es: "Haz clic para reasignar y pulsa una tecla. Esc cancela."
      fr: "Cliquez pour réattribuer, puis appuyez sur une touche. Échap annule."
      it: "Clicca per riassegnare, poi premi un tasto. Esc annulla."
      ja: "クリックして再割り当て、キーを押してください。Escで取り消し。"
      ko: "다시 지정하려면 클릭한 후 키를 누르세요. Esc로 취소."
      "pt-BR": "Clique para reatribuir e pressione uma tecla. Esc cancela."
      ru: "Нажмите для переназначения, затем нажмите клавишу. Esc отменяет."
      zh: "点击以重新绑定，然后按一个键。Esc 取消。"
      "zh-TW": "點擊以重新綁定，然後按一個鍵。Esc 取消。"
    also_bound:
      de: "Auch:"
      en: "Also:"
      es: "También:"
      fr: "Aussi :"
      it: "Anche:"
      ja: "他:"
      ko: "또한:"
      "pt-BR": "Também:"
      ru: "Также:"
      zh: "另外："
      "zh-TW": "另外："
    action_tooltip:
      de: "Die Aktion, die dieses Tastenkürzel ausführt."
      en: "The action this shortcut runs."
      es: "La acción que ejecuta este atajo."
      fr: "L'action exécutée par ce raccourci."
      it: "L'azione eseguita da questa scorciatoia."
      ja: "このショートカットが実行するアクション。"
      ko: "이 단축키가 실행하는 동작."
      "pt-BR": "A ação que este atalho executa."
      ru: "Действие, выполняемое этим сочетанием клавиш."
      zh: "此快捷键执行的操作。"
      "zh-TW": "此快捷鍵執行的操作。"
    also_bound_tooltip:
      de: "Diese Taste ist in dieser Gruppe auch einer anderen Aktion zugewiesen, daher reagiert eine davon möglicherweise nicht."
      en: "This key is also bound to another action in this group, so one of them may not respond."
      es: "Esta tecla también está asignada a otra acción de este grupo, por lo que una de ellas puede no responder."
      fr: "Cette touche est aussi attribuée à une autre action de ce groupe ; l'une d'elles pourrait ne pas répondre."
      it: "Questo tasto è assegnato anche a un'altra azione di questo gruppo, quindi una delle due potrebbe non rispondere."
      ja: "このキーはこのグループ内の別のアクションにも割り当てられているため、どちらか一方が反応しないことがあります。"
      ko: "이 키는 이 그룹의 다른 동작에도 지정되어 있어 둘 중 하나가 작동하지 않을 수 있습니다."
      "pt-BR": "Esta tecla também está atribuída a outra ação deste grupo, então uma delas pode não responder."
      ru: "Эта клавиша также назначена другому действию в этой группе, поэтому одно из них может не сработать."
      zh: "此键在本组中还绑定了另一个操作，因此其中一个可能不会响应。"
      "zh-TW": "此鍵在本組中還綁定了另一個操作，因此其中一個可能不會回應。"
    mouse:
      de: "Maus"
      en: "Mouse"
      es: "Ratón"
      fr: "Souris"
      it: "Mouse"
      ja: "マウス"
      ko: "마우스"
      "pt-BR": "Mouse"
      ru: "Мышь"
      zh: "鼠标"
      "zh-TW": "滑鼠"
    mouse_tooltip:
      de: "Einstellungen für Maus und Scrollrad."
      en: "Mouse and scroll-wheel preferences."
      es: "Preferencias del ratón y la rueda de desplazamiento."
      fr: "Préférences de la souris et de la molette."
      it: "Preferenze del mouse e della rotellina."
      ja: "マウスとスクロールホイールの設定。"
      ko: "마우스 및 스크롤 휠 설정."
      "pt-BR": "Preferências do mouse e da roda de rolagem."
      ru: "Настройки мыши и колеса прокрутки."
      zh: "鼠标和滚轮偏好设置。"
      "zh-TW": "滑鼠與滾輪偏好設定。"
    invert_scroll_zoom:
      de: "Zoomrichtung umkehren"
      en: "Invert scroll zoom"
      es: "Invertir el zoom con la rueda"
      fr: "Inverser le zoom à la molette"
      it: "Inverti lo zoom con la rotellina"
      ja: "スクロールズームを反転"
      ko: "스크롤 줌 반전"
      "pt-BR": "Inverter o zoom de rolagem"
      ru: "Инвертировать зум колесом"
      zh: "反转滚轮缩放"
      "zh-TW": "反轉滾輪縮放"
    invert_scroll_zoom_tooltip:
      de: "Kehrt die Zoomrichtung des Scrollrads auf der Karte um — standardmäßig zoomt Hochscrollen hinein."
      en: "Flips the map's scroll-wheel zoom direction — by default, scrolling up zooms in."
      es: "Invierte la dirección del zoom con la rueda en el mapa: por defecto, desplazar hacia arriba acerca."
      fr: "Inverse le sens du zoom à la molette sur la carte — par défaut, faire défiler vers le haut zoome en avant."
      it: "Inverte la direzione dello zoom con la rotellina sulla mappa — per impostazione predefinita, scorrere verso l'alto ingrandisce."
      ja: "マップ上のスクロールホイールによるズーム方向を反転します。既定では上にスクロールするとズームインします。"
      ko: "맵에서 스크롤 휠 줌 방향을 반전합니다. 기본적으로 위로 스크롤하면 확대됩니다."
      "pt-BR": "Inverte a direção do zoom da roda de rolagem no mapa — por padrão, rolar para cima aproxima."
      ru: "Меняет направление зума колесом прокрутки на карте — по умолчанию прокрутка вверх приближает."
      zh: "反转地图上滚轮缩放的方向——默认情况下向上滚动为放大。"
      "zh-TW": "反轉地圖上滾輪縮放的方向——預設情況下向上捲動為放大。"
    mouse_double_click:
      de: "Doppelklick links — gleiche Entwürfe wählen"
      en: "Double left-click — select matching designs"
      es: "Doble clic izquierdo — seleccionar diseños iguales"
      fr: "Double clic gauche — sélectionner les mêmes modèles"
      it: "Doppio clic sinistro — seleziona progetti uguali"
      ja: "左ダブルクリック — 同じ設計の機体を選択"
      ko: "왼쪽 더블 클릭 — 같은 설계 선택"
      "pt-BR": "Clique duplo esquerdo — selecionar projetos iguais"
      ru: "Двойной щелчок ЛКМ — выбрать одинаковые проекты"
      zh: "左键双击 — 选择相同设计的单位"
      "zh-TW": "左鍵雙擊 — 選取相同設計的單位"
    mouse_double_click_tooltip:
      de: "Wählt alle sichtbaren Einheiten mit demselben Entwurf wie die angeklickte Einheit aus. Funktioniert nur bei eigenen Einheiten — verbündete Einheiten und Kontakte werden normal ausgewählt."
      en: "Selects every visible unit sharing the clicked unit's design. Works only on your own units — allied units and contacts select normally."
      es: "Selecciona todas las unidades visibles que compartan el diseño de la unidad pulsada. Solo funciona con tus propias unidades: las unidades aliadas y los contactos se seleccionan normalmente."
      fr: "Sélectionne toutes les unités visibles partageant le modèle de l'unité cliquée. Ne fonctionne que sur vos propres unités : les unités alliées et les contacts sont sélectionnés normalement."
      it: "Seleziona tutte le unità visibili con lo stesso progetto dell'unità cliccata. Funziona solo sulle tue unità: le unità alleate e i contatti vengono selezionati normalmente."
      ja: "クリックした機体と同じ設計の視認機体をすべて選択します。自軍の機体でのみ機能し、同盟軍の機体や接触は通常どおり選択されます。"
      ko: "클릭한 유닛과 같은 설계를 가진, 보이는 모든 유닛을 선택합니다. 아군 유닛에만 적용되며, 동맹 유닛과 접촉은 평소처럼 선택됩니다."
      "pt-BR": "Seleciona todas as unidades visíveis que compartilham o mesmo projeto da unidade clicada. Funciona apenas com suas próprias unidades — unidades aliadas e contatos são selecionados normalmente."
      ru: "Выбирает все видимые юниты с тем же проектом, что и у юнита, по которому щёлкнули. Работает только с собственными юнитами — союзные юниты и контакты выбираются как обычно."
      zh: "选择所有与被点击单位设计相同的可见单位。仅适用于己方单位——盟军单位和接触目标将按正常方式选择。"
      "zh-TW": "選取所有與被點擊單位設計相同的可見單位。僅適用於己方單位——盟軍單位和接觸目標將以正常方式選取。"
    mouse_box_select:
      de: "Links ziehen — Auswahlrahmen"
      en: "Left-drag — box select"
      es: "Arrastrar con botón izquierdo — selección rectangular"
      fr: "Glisser avec le bouton gauche — sélection par cadre"
      it: "Trascina con il tasto sinistro — selezione rettangolare"
      ja: "左ドラッグ — 範囲選択"
      ko: "왼쪽 드래그 — 영역 선택"
      "pt-BR": "Arrastar com botão esquerdo — seleção por caixa"
      ru: "Перетаскивание ЛКМ — выделить рамкой"
      zh: "左键拖动 — 框选"
      "zh-TW": "左鍵拖曳 — 框選"
    mouse_box_select_tooltip:
      de: "Ziehen wählt alle Einheiten im Rahmen aus und ersetzt die aktuelle Auswahl. Shift halten, um stattdessen nur die Einheiten im Rahmen umzuschalten."
      en: "Drag to box-select every unit inside, replacing the current selection. Hold Shift to toggle just the boxed units instead."
      es: "Arrastra para seleccionar todas las unidades del recuadro, sustituyendo la selección actual. Mantén Shift para alternar solo las unidades del recuadro en su lugar."
      fr: "Glissez pour sélectionner toutes les unités du cadre, en remplaçant la sélection actuelle. Maintenez Shift pour basculer seulement les unités du cadre à la place."
      it: "Trascina per selezionare tutte le unità nel riquadro, sostituendo la selezione attuale. Tieni premuto Shift per alternare invece solo le unità nel riquadro."
      ja: "ドラッグすると枠内のすべての機体を選択し、現在の選択を置き換えます。Shiftを押しながらだと、代わりに枠内の機体だけを切り替えます。"
      ko: "드래그하면 상자 안의 모든 유닛을 선택하여 현재 선택을 대체합니다. Shift를 누르고 있으면 대신 상자 안의 유닛만 전환합니다."
      "pt-BR": "Arraste para selecionar todas as unidades dentro da caixa, substituindo a seleção atual. Mantenha Shift pressionado para, em vez disso, alternar apenas as unidades da caixa."
      ru: "Перетаскивание выбирает все юниты внутри рамки, заменяя текущее выделение. Удерживайте Shift, чтобы вместо этого переключать только юниты внутри рамки."
      zh: "拖动可选择框内的所有单位，并替换当前选择。按住 Shift 可改为只切换框内单位的选择状态。"
      "zh-TW": "拖曳可選取框內的所有單位，並取代目前的選取。按住 Shift 可改為只切換框內單位的選取狀態。"
    mouse_shift_select:
      de: "Shift + Linksklick — Auswahl ändern"
      en: "Shift + left-click — add/remove selection"
      es: "Shift + clic izquierdo — añadir/quitar de la selección"
      fr: "Shift + clic gauche — ajouter/retirer de la sélection"
      it: "Shift + clic sinistro — aggiungi/rimuovi dalla selezione"
      ja: "Shift + 左クリック — 選択に追加／解除"
      ko: "Shift + 왼쪽 클릭 — 선택 추가/해제"
      "pt-BR": "Shift + clique esquerdo — adicionar/remover da seleção"
      ru: "Shift + ЛКМ — добавить/убрать из выделения"
      zh: "Shift + 左键单击 — 添加／移除选择"
      "zh-TW": "Shift + 左鍵單擊 — 加入／移除選取"
    mouse_shift_select_tooltip:
      de: "Shift + Linksklick fügt eigene Einheiten hinzu oder entfernt sie; eine gruppierte Einheit wirkt dabei über ihren Anführer, sofern nicht Alt gedrückt wird. Kontakte, verbündete und verlorene Einheiten können nicht an einer Mehrfachauswahl teilnehmen — die Auswahl einer davon ersetzt die Auswahl."
      en: "Shift + left-click adds or removes your own units; grouped units act through their leader unless Alt is held. Selecting a contact, ally, or lost unit replaces the selection."
      es: "Shift + clic izquierdo añade o quita tus propias unidades; una unidad agrupada actúa a través de su líder, a menos que mantengas pulsada Alt. Contactos, unidades aliadas y unidades perdidas no pueden unirse a una selección múltiple — seleccionar una sustituye la selección."
      fr: "Shift + clic gauche ajoute ou retire vos propres unités ; une unité groupée agit via son chef, sauf si Alt est maintenu enfoncé. Contacts, unités alliées et unités perdues ne peuvent pas rejoindre une sélection multiple — en sélectionner une remplace la sélection."
      it: "Shift + clic sinistro aggiunge o rimuove le tue unità; un'unità raggruppata agisce tramite il suo capo, a meno che Alt non sia tenuto premuto. Contatti, unità alleate e unità perse non possono unirsi a una selezione multipla — selezionarne una sostituisce la selezione."
      ja: "Shift + 左クリックで自軍の機体を選択に追加または解除します。グループに属する機体は、Altを押していない限りそのリーダーに対して作用します。接触、同盟軍の機体、喪失した機体は複数選択に加われません — いずれかを選択すると選択が置き換わります。"
      ko: "Shift + 왼쪽 클릭은 아군 유닛을 추가하거나 제거하며, 그룹에 속한 유닛은 Alt를 누르고 있지 않는 한 대장을 기준으로 작동합니다. 접촉, 동맹 유닛, 손실된 유닛은 다중 선택에 포함될 수 없습니다 — 하나를 선택하면 선택이 대체됩니다."
      "pt-BR": "Shift + clique esquerdo adiciona ou remove suas próprias unidades; uma unidade agrupada age através do seu líder, a menos que Alt esteja pressionado. Contatos, unidades aliadas e unidades perdidas não podem entrar em uma seleção múltipla — selecionar uma delas substitui a seleção."
      ru: "Shift + ЛКМ добавляет или убирает собственные юниты; юнит в составе группы действует через своего ведущего, если не удерживается Alt. Контакты, союзные и потерянные юниты не могут входить в групповое выделение — выбор одного из них заменяет выделение."
      zh: "Shift + 左键单击可添加或移除己方单位，编组中的单位会作用于其领队，除非按住 Alt。接触目标、盟军单位和已损失的单位无法加入多选——选择其中之一将替换选择。"
      "zh-TW": "Shift + 左鍵單擊可加入或移除己方單位，編組中的單位會作用於其領隊，除非按住 Alt。接觸目標、盟軍單位和已損失的單位無法加入多選——選取其中之一將取代選取。"
    mouse_alt_select:
      de: "Alt + Linksklick — einzelnes Gruppenmitglied wählen"
      en: "Alt + left-click — select group member"
      es: "Alt + clic izquierdo — seleccionar miembro del grupo"
      fr: "Alt + clic gauche — sélectionner un membre du groupe"
