    status_tooltip:
      de: "Zustandsfarben: Erfolg, Warnung, Fehler, Info und gedämpft. Sie melden, wie es um etwas steht, nie zu welcher Seite es gehört."
      en: "State colors: success, warning, error, info and muted. They report how something is doing, never which side it belongs to."
      es: "Colores de estado: éxito, advertencia, error, información y atenuado. Informan de cómo va algo, nunca de a qué bando pertenece."
      fr: "Couleurs d'état : succès, avertissement, erreur, information et atténué. Elles indiquent l'état de quelque chose, jamais son camp."
      it: "Colori di stato: successo, avviso, errore, informazione e attenuato. Indicano come sta andando qualcosa, mai a quale schieramento appartiene."
      ja: "状態色です。成功・警告・エラー・情報・減光の 5 つで、対象の状態を示すもので、所属陣営は示しません。"
      ko: "상태 색입니다. 성공, 경고, 오류, 정보, 흐림의 다섯 가지로, 대상의 상태를 나타낼 뿐 소속 진영을 나타내지는 않습니다."
      "pt-BR": "Cores de estado: sucesso, aviso, erro, informação e atenuado. Elas informam como algo está, nunca a que lado pertence."
      ru: "Цвета состояния: успех, предупреждение, ошибка, информация и приглушённый. Они сообщают, как обстоят дела, а не к какой стороне относится объект."
      zh: "状态色：成功、警告、错误、信息与弱化。它们表示事物的状态，而非所属阵营。"
      "zh-TW": "狀態色：成功、警告、錯誤、資訊與弱化。它們表示事物的狀態，而非所屬陣營。"
