      ja: "経由点を右クリック — 以降の経路を削除"
      ko: "경유점 오른쪽 클릭 — 이후 경로 삭제"
      "pt-BR": "Clique direito no ponto de rota — encurtar rota"
      ru: "ПКМ по точке маршрута — сократить маршрут"
      zh: "右键单击航点 — 截断航线"
