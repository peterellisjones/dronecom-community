  show_water_overlay_tooltip:
    de: "Zeigt, welche Geländezellen die Wegfindung als befahrbar einstuft; dies kann von der sichtbaren Landmasse abweichen."
    en: "Shows which terrain cells the pathfinder considers navigable; this can differ from visible land."
    es: "Muestra qué celdas del terreno considera navegables el buscador de rutas; puede diferir de la tierra visible."
    fr: "Indique les cellules de terrain que le calcul d'itinéraire considère navigables ; cela peut différer du terrain visible."
    it: "Mostra quali celle di terreno il calcolo del percorso considera navigabili; può differire dalla terra visibile."
    ja: "経路探索がどの地形セルを航行可能と判断しているかを表示します。表示上の陸地とは異なる場合があります。"
    ko: "경로 탐색이 어떤 지형 셀을 항행 가능하다고 판단하는지 표시합니다. 화면에 보이는 육지와 다를 수 있습니다."
    "pt-BR": "Mostra quais células do terreno o cálculo de rotas considera navegáveis; isso pode diferir da terra visível."
    ru: "Показывает, какие ячейки рельефа поиск пути считает проходимыми; это может отличаться от видимой суши."
    zh: "显示寻路系统认为可通航的地形格；这可能与可见的陆地不同。"
    "zh-TW": "顯示尋路系統認為可通航的地形格；這可能與可見的陸地不同。"
