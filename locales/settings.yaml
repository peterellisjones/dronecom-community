  show_pathfinding_tooltip:
    de: "Zeichnet die A*-Zellen, die beim Routen des zuerst ausgewählten Fahrzeugs untersucht wurden. Ohne eine Auswahl mit Wegpunkten wird nichts angezeigt."
    en: "Draws the A* cells explored while routing the first selected vehicle. Nothing is shown without a selection that has waypoints."
    es: "Dibuja las celdas A* exploradas al calcular la ruta del primer vehículo seleccionado. No se muestra nada sin una selección que tenga waypoints."
    fr: "Trace les cellules A* explorées lors du calcul d'itinéraire du premier véhicule sélectionné. Rien ne s'affiche sans une sélection possédant des waypoints."
    it: "Disegna le celle A* esplorate calcolando il percorso del primo veicolo selezionato. Senza una selezione con waypoint non viene mostrato nulla."
    ja: "最初に選択した機体の経路計算で探索した A* セルを描画します。ウェイポイントを持つ選択がなければ何も表示されません。"
    ko: "처음 선택한 기체의 경로를 계산하며 탐색한 A* 셀을 그립니다. 웨이포인트가 있는 선택이 없으면 아무것도 표시되지 않습니다."
    "pt-BR": "Desenha as células A* exploradas ao calcular a rota do primeiro veículo selecionado. Nada aparece sem uma seleção que tenha waypoints."
    ru: "Рисует ячейки A*, просмотренные при прокладке маршрута первой выбранной единицы. Без выделения с путевыми точками ничего не отображается."
    zh: "绘制为首个所选载具规划路线时探索过的 A* 单元格。若所选目标没有航路点，则不显示任何内容。"
    "zh-TW": "繪製為首個所選載具規劃路線時探索過的 A* 單元格。若所選目標沒有航路點，則不顯示任何內容。"
