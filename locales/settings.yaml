  rtb_deck_preference.origin_carrier_tooltip:
    de: "Kehrt zum Träger des letzten Starts zurück, sofern erreichbar und nicht voll; andernfalls wird der nächstgelegene mit Platz gewählt."
    en: "Returns to the last launch carrier if reachable and not full; otherwise chooses the nearest with room."
    es: "Regresa al último portaaviones de despegue si es alcanzable y no está lleno; si no, elige el más cercano con espacio."
    fr: "Retourne au dernier porte-avions de décollage s'il est accessible et non plein ; sinon, choisit le plus proche disposant de place."
    it: "Ritorna all'ultima portaerei di decollo se raggiungibile e non piena; altrimenti sceglie la più vicina con spazio disponibile."
    ja: "最後に発艦した空母が到達可能かつ満杯でなければそこへ帰投します。それ以外の場合は、空きのある最寄りの空母を選びます。"
    ko: "마지막으로 발진한 항공모함이 도달 가능하고 가득 차지 않았다면 그곳으로 복귀합니다. 그렇지 않으면 여유 공간이 있는 가장 가까운 곳을 선택합니다."
    "pt-BR": "Retorna ao último porta-aviões de decolagem se estiver alcançável e não estiver cheio; caso contrário, escolhe o mais próximo com espaço."
    ru: "Возвращается на авианосец последнего взлёта, если он достижим и не заполнен; иначе выбирает ближайший со свободным местом."
    zh: "若最后一次起飞的航母可达且未满，则返回该航母；否则选择最近的有空位航母。"
    "zh-TW": "若最後一次起飛的航艦可達且未滿，則返回該航艦；否則選擇最近的有空位航艦。"
