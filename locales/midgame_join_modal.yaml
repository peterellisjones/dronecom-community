_version: 2

midgame_join_modal:
  title:
    de: "LAUFENDES SPIEL BEITRETEN"
    en: "JOIN GAME IN PROGRESS"
    es: "UNIRSE A PARTIDA EN CURSO"
    fr: "REJOINDRE UNE PARTIE EN COURS"
    it: "UNISCITI A PARTITA IN CORSO"
    ja: "進行中のゲームに参加"
    ko: "진행 중인 게임 참가"
    "pt-BR": "ENTRAR EM JOGO EM ANDAMENTO"
    ru: "ПРИСОЕДИНИТЬСЯ К ИДУЩЕЙ ИГРЕ"
    zh: "加入进行中的游戏"
    "zh-TW": "加入進行中的遊戲"
  pick_seat_hint:
    de: "Das Match läuft bereits. Wählen Sie einen Platz, um das Kommando zu übernehmen, oder schauen Sie zu."
    en: "The match is already running. Choose a seat to take command, or spectate."
    es: "La partida ya está en curso. Elija un puesto para tomar el mando, o vea como espectador."
    fr: "La partie est déjà en cours. Choisissez un poste pour prendre le commandement, ou observez."
    it: "La partita è già in corso. Scegli un posto per prendere il comando, oppure osserva."
    ja: "試合はすでに進行中です。指揮を執る席を選ぶか、観戦してください。"
    ko: "경기가 이미 진행 중입니다. 지휘를 맡을 자리를 선택하거나 관전하세요."
    "pt-BR": "A partida já está em andamento. Escolha um assento para assumir o comando, ou assista como espectador."
    ru: "Матч уже идёт. Выберите место, чтобы принять командование, или наблюдайте."
    zh: "比赛已经开始。选择一个席位接管指挥，或者观战。"
    "zh-TW": "比賽已經開始。選擇一個席位接管指揮，或者觀戰。"
  stance_allied:
    de: "VERBÜNDET"
    en: "ALLIED"
    es: "ALIADO"
    fr: "ALLIÉ"
    it: "ALLEATO"
    ja: "同盟"
    ko: "동맹"
    "pt-BR": "ALIADO"
    ru: "СОЮЗНИК"
    zh: "盟友"
    "zh-TW": "盟友"
  stance_allied_tooltip:
    de: "Dieses Team ist mit dem Host verbündet."
    en: "This team is allied with the host."
    es: "Este equipo está aliado con el anfitrión."
    fr: "Cette équipe est alliée à l'hôte."
    it: "Questa squadra è alleata con l'host."
    ja: "このチームはホストと同盟関係にあります。"
    ko: "이 팀은 호스트와 동맹 관계입니다."
    "pt-BR": "Esta equipe é aliada do anfitrião."
    ru: "Эта команда является союзником хоста."
    zh: "该队伍是主机的盟友。"
    "zh-TW": "該隊伍是主機的盟友。"
  stance_hostile:
    de: "FEINDLICH"
    en: "HOSTILE"
    es: "HOSTIL"
    fr: "HOSTILE"
    it: "OSTILE"
    ja: "敵対"
    ko: "적대"
    "pt-BR": "HOSTIL"
    ru: "ВРАЖДЕБНЫЙ"
    zh: "敌对"
    "zh-TW": "敵對"
  stance_hostile_tooltip:
    de: "Dieses Team kämpft gegen den Host."
    en: "This team is fighting against the host."
    es: "Este equipo lucha contra el anfitrión."
    fr: "Cette équipe combat contre l'hôte."
    it: "Questa squadra combatte contro l'host."
    ja: "このチームはホストと交戦しています。"
    ko: "이 팀은 호스트와 교전 중입니다."
    "pt-BR": "Esta equipe está lutando contra o anfitrião."
    ru: "Эта команда воюет против хоста."
    zh: "该队伍正在与主机交战。"
    "zh-TW": "該隊伍正在與主機交戰。"
  seat_row_tooltip:
    de: "Übernehmen Sie das Kommando über dieses Team. Die KI übergibt die Kontrolle, sobald Sie beitreten."
    en: "Take command of this team. The AI hands over control when you join."
    es: "Tome el mando de este equipo. La IA cede el control en cuanto se une."
    fr: "Prenez le commandement de cette équipe. L'IA cède le contrôle dès que vous rejoignez."
    it: "Prendi il comando di questa squadra. L'IA cede il controllo non appena ti unisci."
    ja: "このチームの指揮を執ります。参加するとAIが制御を引き渡します。"
    ko: "이 팀의 지휘를 맡습니다. 참가하면 AI가 제어권을 넘겨줍니다."
    "pt-BR": "Assuma o comando desta equipe. A IA cede o controle assim que você entra."
    ru: "Примите командование этой командой. ИИ передаст управление, как только вы присоединитесь."
    zh: "接管该队伍的指挥权。你加入后，AI 将移交控制权。"
    "zh-TW": "接管該隊伍的指揮權。你加入後，AI 將移交控制權。"
  spectate_row:
    de: "ZUSCHAUEN"
    en: "SPECTATE"
    es: "ESPECTADOR"
    fr: "OBSERVER"
    it: "OSSERVA"
    ja: "観戦"
    ko: "관전"
    "pt-BR": "ESPECTADOR"
    ru: "НАБЛЮДАТЬ"
    zh: "观战"
    "zh-TW": "觀戰"
  spectate_row_tooltip:
    de: "Sehen Sie sich das Match an, ohne ein Team zu kommandieren."
    en: "Watch the match without commanding a team."
    es: "Vea la partida sin comandar un equipo."
    fr: "Regardez la partie sans commander une équipe."
    it: "Guarda la partita senza comandare una squadra."
    ja: "チームを指揮せずに試合を観戦します。"
    ko: "팀을 지휘하지 않고 경기를 관전합니다."
    "pt-BR": "Assista à partida sem comandar uma equipe."
    ru: "Наблюдайте за матчем, не командуя командой."
    zh: "观看比赛而不指挥任何队伍。"
    "zh-TW": "觀看比賽而不指揮任何隊伍。"
  spectate_only_hint:
    de: "Es sind keine Plätze frei, aber der Host erlaubt Zuschauer."
    en: "No seats are open, but the host allows spectators."
    es: "No hay puestos libres, pero el anfitrión permite espectadores."
    fr: "Aucun poste n'est disponible, mais l'hôte autorise les observateurs."
    it: "Non ci sono posti liberi, ma l'host consente gli osservatori."
    ja: "空いている席はありませんが、ホストは観戦を許可しています。"
    ko: "빈 자리는 없지만, 호스트가 관전을 허용합니다."
    "pt-BR": "Não há assentos disponíveis, mas o anfitrião permite espectadores."
    ru: "Свободных мест нет, но хост разрешает наблюдателей."
    zh: "没有空闲席位，但主机允许观战。"
    "zh-TW": "沒有空閒席位，但主機允許觀戰。"
  no_seats_message:
    de: "In diesem Spiel sind keine Plätze frei. Bitten Sie den Host, einen Platz zu öffnen, und verbinden Sie sich erneut."
    en: "No seats are open in this game. Ask the host to open a seat and reconnect."
    es: "No hay puestos libres en esta partida. Pida al anfitrión que abra un puesto y vuelva a conectarse."
    fr: "Aucun poste n'est disponible dans cette partie. Demandez à l'hôte d'ouvrir un poste, puis reconnectez-vous."
    it: "Non ci sono posti liberi in questa partita. Chiedi all'host di aprire un posto e riconnettiti."
    ja: "このゲームには空いている席がありません。ホストに席を開けてもらい、再接続してください。"
    ko: "이 게임에는 빈 자리가 없습니다. 호스트에게 자리를 열어달라고 요청한 후 다시 연결하세요."
    "pt-BR": "Não há assentos disponíveis neste jogo. Peça ao anfitrião para abrir um assento e reconecte-se."
    ru: "В этой игре нет свободных мест. Попросите хоста открыть место и переподключитесь."
    zh: "本局游戏没有空闲席位。请让主机开放一个席位后重新连接。"
    "zh-TW": "本局遊戲沒有空閒席位。請讓主機開放一個席位後重新連線。"
  join_button:
    de: "BEITRETEN"
    en: "JOIN"
    es: "UNIRSE"
    fr: "REJOINDRE"
    it: "UNISCITI"
    ja: "参加"
    ko: "참가"
    "pt-BR": "ENTRAR"
    ru: "ПРИСОЕДИНИТЬСЯ"
    zh: "加入"
    "zh-TW": "加入"
  cancel_button:
    de: "Abbrechen"
    en: "Cancel"
    es: "Cancelar"
    fr: "Annuler"
    it: "Annulla"
    ja: "キャンセル"
    ko: "취소"
    "pt-BR": "Cancelar"
    ru: "Отмена"
    zh: "取消"
    "zh-TW": "取消"
  back_button:
    de: "Zurück"
    en: "Back"
    es: "Atrás"
    fr: "Retour"
    it: "Indietro"
    ja: "戻る"
    ko: "뒤로"
    "pt-BR": "Voltar"
    ru: "Назад"
    zh: "返回"
    "zh-TW": "返回"
