      es: "Los sensores de búsqueda detectan y siguen contactos hasta su límite de trazas. Los sensores de control de fuego guían armas hacia trazas asignadas, pero no pueden buscar."
      fr: "Les capteurs de recherche détectent et suivent des contacts jusqu'à leur limite de pistes. Les capteurs de contrôle de tir guident les armes vers des pistes assignées, mais ne peuvent pas rechercher."
      it: "I sensori di ricerca individuano e tracciano i contatti fino al loro limite di tracce. I sensori di controllo del fuoco guidano le armi sulle tracce assegnate, ma non possono cercare."
      ja: "捜索センサーは追尾数の上限まで接触目標を発見・追尾します。射撃管制センサーは指定された航跡へ兵器を誘導しますが、捜索はできません。"
      ko: "탐색 센서는 항적 한도까지 접촉을 탐지하고 추적합니다. 사격 통제 센서는 지정된 항적으로 무기를 유도하지만 탐색은 할 수 없습니다."
      "pt-BR": "Sensores de busca detectam e rastreiam contatos até seu limite de trilhas. Sensores de controle de fogo guiam armas até trilhas designadas, mas não conseguem buscar."
      ru: "Поисковые датчики обнаруживают и сопровождают контакты до предела трекового файла. Датчики управления огнём наводят оружие на назначенные треки, но не могут вести поиск."
      zh: "搜索型传感器可探测并跟踪接触目标，直至其航迹上限。火控型传感器可将武器引导至指定航迹，但无法搜索。"
      "zh-TW": "搜索型感測器可偵測並追蹤接觸目標，直至其航跡上限。火控型感測器可將武器導引至指定航跡，但無法搜索。"
