  save_game_tooltip:
    de: "Schreibt den aktuellen Spielstand in eine Speicherdatei. Nach dem Speichern deaktiviert, bis Sie dieses Menü erneut öffnen."
    en: "Write the current match to a save file. Disabled after saving until you reopen this menu."
