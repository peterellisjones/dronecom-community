    fr: "Écrit la partie en cours dans un fichier de sauvegarde. Désactivé après la sauvegarde jusqu'à la réouverture de ce menu."
    it: "Scrive la partita in corso in un file di salvataggio. Disattivato dopo il salvataggio finché non riapri questo menu."
    ja: "現在の対戦をセーブファイルに書き出します。保存後はこのメニューを開き直すまで無効になります。"
    ko: "현재 전투를 저장 파일로 기록합니다. 저장 후에는 이 메뉴를 다시 열 때까지 비활성화됩니다."
