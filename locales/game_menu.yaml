  exit_to_desktop_tooltip:
    de: "Beendet DRONECOM sofort. Nicht gespeicherter Fortschritt geht verloren."
    en: "Closes DRONECOM immediately. Any unsaved progress is lost."
    es: "Cierra DRONECOM de inmediato. Se perderá el progreso no guardado."
    fr: "Ferme DRONECOM immédiatement. Toute progression non sauvegardée sera perdue."
    it: "Chiude DRONECOM immediatamente. I progressi non salvati andranno persi."
    ja: "DRONECOM をすぐに終了します。保存していない進行状況は失われます。"
    ko: "DRONECOM을 즉시 종료합니다. 저장하지 않은 진행 상황은 사라집니다."
    "pt-BR": "Fecha o DRONECOM imediatamente. Todo progresso não salvo será perdido."
    ru: "Немедленно закрывает DRONECOM. Несохранённый прогресс будет потерян."
    zh: "立即关闭 DRONECOM。未保存的进度将会丢失。"
    "zh-TW": "立即關閉 DRONECOM。未儲存的進度將會遺失。"
