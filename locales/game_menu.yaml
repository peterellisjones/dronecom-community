    de: "Öffnet erneut die Wahl, die nach dem Verlust Ihres Trägers aufgeschoben wurde: weiterkämpfen oder aufgeben."
    en: "Re-opens the choice you deferred when your carrier was lost: fight on, or concede the engagement."
    es: "Vuelve a abrir la decisión que aplazaste al perder tu portaaviones: seguir luchando o rendirte."
    fr: "Rouvre le choix reporté à la perte de votre porte-drones : continuer le combat ou abandonner."
    it: "Riapre la scelta rinviata alla perdita della portadroni: continuare a combattere o arrendersi."
    ja: "母艦を失ったときに先送りした選択（戦闘続行か降伏か）をもう一度開きます。"
    ko: "모함을 잃었을 때 미뤄 둔 선택을 다시 엽니다: 계속 싸울 것인가, 항복할 것인가."
    "pt-BR": "Reabre a decisão adiada quando você perdeu seu porta-drones: continuar lutando ou desistir."
    ru: "Снова открывает выбор, отложенный после потери носителя: продолжать бой или сдаться."
    zh: "重新打开失去母舰时被推迟的选择：继续战斗，或者认输。"
    "zh-TW": "重新開啟失去母艦時被延後的選擇：繼續戰鬥，或者認輸。"
