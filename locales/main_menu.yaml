  config_failed:
    de: "Einige Konfigurationsdateien in deiner Spielinstallation konnten nicht gelesen werden."
    en: "Some config files in your game install could not be read."
    es: "No se pudieron leer algunos archivos de configuración de tu instalación del juego."
    fr: "Certains fichiers de configuration de votre installation du jeu n'ont pas pu être lus."
    it: "Alcuni file di configurazione nell'installazione del gioco non si sono potuti leggere."
    ja: "ゲームインストール内の一部の設定ファイルを読み込めませんでした。"
    ko: "게임 설치 폴더의 일부 설정 파일을 읽지 못했습니다."
    "pt-BR": "Alguns arquivos de configuração da sua instalação do jogo não puderam ser lidos."
    ru: "Некоторые файлы настроек в установленной игре не удалось прочитать."
    zh: "游戏安装目录中的部分配置文件无法读取。"
    "zh-TW": "遊戲安裝目錄中的部分設定檔無法讀取。"
  config_failed_remedy:
    de: "Das Spiel läuft mit den mitgelieferten Werten, deine Änderungen an diesen Dateien haben also keine Wirkung. Wenn du eine Datei bearbeitet hast, korrigiere sie und starte das Spiel neu. Steam → Eigenschaften → Installierte Dateien → Überprüfen stellt jede mit dem Spiel ausgelieferte Datei wieder her."
    en: "The game is running with the values that ship with it, so your changes to these files have no effect. If you edited a file, fix it and restart the game. Steam → Properties → Installed Files → Verify restores any file that ships with the game."
    es: "El juego se está ejecutando con los valores que vienen con él, así que tus cambios en estos archivos no tienen efecto. Si editaste un archivo, corrígelo y reinicia el juego. Steam → Propiedades → Archivos instalados → Verificar restaura cualquier archivo que venga con el juego."
    fr: "Le jeu fonctionne avec les valeurs fournies d'origine ; vos modifications de ces fichiers sont donc sans effet. Si vous avez modifié un fichier, corrigez-le et relancez le jeu. Steam → Propriétés → Fichiers installés → Vérifier restaure tout fichier fourni avec le jeu."
    it: "Il gioco sta usando i valori di serie, quindi le tue modifiche a questi file non hanno effetto. Se hai modificato un file, correggilo e riavvia il gioco. Steam → Proprietà → File installati → Verifica ripristina qualsiasi file distribuito con il gioco."
    ja: "ゲームは同梱の値で動作しているため、これらのファイルへの変更は反映されません。ファイルを編集した場合は、修正してゲームを再起動してください。Steam → プロパティ → インストール済みファイル → 整合性を確認 で、ゲームに同梱されているファイルを復元できます。"
    ko: "게임이 기본 제공 값으로 실행 중이므로 이 파일들에 대한 변경 사항은 적용되지 않습니다. 파일을 편집했다면 수정한 뒤 게임을 다시 시작하세요. Steam → 속성 → 설치된 파일 → 파일 무결성 확인 을 실행하면 게임에 포함된 파일이 복원됩니다."
    "pt-BR": "O jogo está rodando com os valores que vêm com ele, então suas alterações nesses arquivos não têm efeito. Se você editou um arquivo, corrija-o e reinicie o jogo. Steam → Propriedades → Arquivos instalados → Verificar restaura qualquer arquivo que acompanha o jogo."
    ru: "Игра работает со штатными значениями, поэтому ваши правки в этих файлах не действуют. Если вы редактировали файл, исправьте его и перезапустите игру. Steam → Свойства → Установленные файлы → Проверить восстановит любой файл, поставляемый с игрой."
    zh: "游戏正在使用自带的数值运行，因此你对这些文件的修改不会生效。如果你编辑过某个文件，请修复后重启游戏。Steam → 属性 → 已安装文件 → 验证 可以还原游戏自带的任何文件。"
    "zh-TW": "遊戲正在使用自帶的數值運行，因此你對這些檔案的修改不會生效。如果你編輯過某個檔案，請修復後重新啟動遊戲。Steam → 內容 → 已安裝檔案 → 驗證 可以還原遊戲自帶的任何檔案。"
  assets_modified:
    de: "Spieldaten geändert"
    en: "Game data modified"
    es: "Datos del juego modificados"
    fr: "Données de jeu modifiées"
    it: "Dati di gioco modificati"
    ja: "ゲームデータが変更されています"
    ko: "게임 데이터가 수정됨"
    "pt-BR": "Dados do jogo modificados"
    ru: "Игровые данные изменены"
    zh: "游戏数据已修改"
    "zh-TW": "遊戲資料已修改"
  assets_modified_detail:
    de: "Diese Dateien unterscheiden sich von den mitgelieferten Kopien. Das Spiel läuft mit deinen Werten. In einem Mehrspieler-Match sehen die anderen Teilnehmer, dass du sie geändert hast. Steam → Eigenschaften → Installierte Dateien → Überprüfen stellt die mitgelieferten Fassungen wieder her."
    en: "These files differ from the copies the game shipped with. The game is running with your values. In a multiplayer match, other participants can see that you changed them. Steam → Properties → Installed Files → Verify restores the shipped versions."
    es: "Estos archivos difieren de las copias incluidas con el juego. El juego usa tus valores. En una partida multijugador, los demás participantes verán que los has cambiado. Steam → Propiedades → Archivos instalados → Verificar restaura las versiones originales."
    fr: "Ces fichiers diffèrent des copies fournies avec le jeu. Le jeu utilise vos valeurs. Dans une partie multijoueur, les autres participants verront que vous les avez modifiés. Steam → Propriétés → Fichiers installés → Vérifier restaure les versions d'origine."
    it: "Questi file differiscono dalle copie incluse nel gioco. Il gioco sta usando i tuoi valori. In una partita multigiocatore gli altri partecipanti vedranno che li hai modificati. Steam → Proprietà → File installati → Verifica ripristina le versioni originali."
    ja: "これらのファイルはゲームに同梱されたものと異なります。ゲームはあなたの値で動作しています。マルチプレイでは、変更したことが他の参加者に表示されます。Steam → プロパティ → インストール済みファイル → 整合性を確認 で同梱版に戻せます。"
    ko: "이 파일들은 게임에 포함된 사본과 다릅니다. 게임은 당신의 값으로 실행됩니다. 멀티플레이어 경기에서는 다른 참가자가 변경 사실을 볼 수 있습니다. Steam → 속성 → 설치된 파일 → 확인 으로 원본을 복원할 수 있습니다."
    "pt-BR": "Estes arquivos diferem das cópias que acompanham o jogo. O jogo está usando os seus valores. Em uma partida multijogador, os outros participantes verão que você os alterou. Steam → Propriedades → Arquivos instalados → Verificar restaura as versões originais."
    ru: "Эти файлы отличаются от копий, поставляемых с игрой. Игра использует ваши значения. В сетевом матче другие участники увидят, что вы их изменили. Steam → Свойства → Установленные файлы → Проверить восстановит исходные версии."
    zh: "这些文件与游戏附带的副本不同。游戏正在使用你的数值。在多人对战中，其他参与者会看到你做了修改。Steam → 属性 → 已安装文件 → 验证 可恢复原始版本。"
    "zh-TW": "這些檔案與遊戲隨附的副本不同。遊戲正在使用你的數值。在多人對戰中，其他參與者會看到你做了修改。Steam → 內容 → 已安裝檔案 → 驗證 可還原原始版本。"
  definitions_failed:
    de: "Einige Definitionsdateien in deiner Spielinstallation konnten nicht geladen werden."
    en: "Some definition files in your game install failed to load."
    es: "Algunos archivos de definición de tu instalación del juego no se pudieron cargar."
    fr: "Certains fichiers de définition de votre installation du jeu n'ont pas pu être chargés."
    it: "Alcuni file di definizione nell'installazione del gioco non si sono caricati."
    ja: "ゲームインストール内の一部の定義ファイルを読み込めませんでした。"
    ko: "게임 설치 폴더의 일부 정의 파일을 불러오지 못했습니다."
    "pt-BR": "Alguns arquivos de definição da sua instalação do jogo não foram carregados."
    ru: "Некоторые файлы определений в установленной игре не удалось загрузить."
    zh: "游戏安装目录中的部分定义文件加载失败。"
    "zh-TW": "遊戲安裝目錄中的部分定義檔載入失敗。"
  definitions_failed_remedy:
    de: "Das Spiel kann erst starten, wenn diese behoben sind. Wenn du eine Datei bearbeitet hast, korrigiere oder entferne sie. Steam → Eigenschaften → Installierte Dateien → Überprüfen stellt jede mit dem Spiel ausgelieferte Datei wieder her."
    en: "The game cannot start until these are fixed. If you edited a file, fix or remove it. Steam → Properties → Installed Files → Verify restores any file that ships with the game."
    es: "El juego no puede iniciarse hasta que se corrijan. Si editaste un archivo, corrígelo o elimínalo. Steam → Propiedades → Archivos instalados → Verificar restaura cualquier archivo que venga con el juego."
    fr: "Le jeu ne peut pas démarrer tant que ces erreurs persistent. Si vous avez modifié un fichier, corrigez-le ou supprimez-le. Steam → Propriétés → Fichiers installés → Vérifier restaure tout fichier fourni avec le jeu."
    it: "Il gioco non può avviarsi finché non sono risolti. Se hai modificato un file, correggilo o rimuovilo. Steam → Proprietà → File installati → Verifica ripristina qualsiasi file distribuito con il gioco."
    ja: "これらが解決されるまでゲームを開始できません。ファイルを編集した場合は、修正するか削除してください。Steam → プロパティ → インストール済みファイル → 整合性を確認 で、ゲームに同梱されているファイルを復元できます。"
    ko: "문제가 해결될 때까지 게임을 시작할 수 없습니다. 파일을 편집했다면 수정하거나 삭제하세요. Steam → 속성 → 설치된 파일 → 파일 무결성 확인 을 실행하면 게임에 포함된 파일이 복원됩니다."
    "pt-BR": "O jogo não pode iniciar até que sejam corrigidos. Se você editou um arquivo, corrija-o ou remova-o. Steam → Propriedades → Arquivos instalados → Verificar restaura qualquer arquivo que acompanha o jogo."
    ru: "Игра не запустится, пока это не исправлено. Если вы редактировали файл, исправьте или удалите его. Steam → Свойства → Установленные файлы → Проверить восстановит любой файл, поставляемый с игрой."
    zh: "在修复之前游戏无法启动。如果你编辑过某个文件，请修复或删除它。Steam → 属性 → 已安装文件 → 验证 可以还原游戏自带的任何文件。"
    "zh-TW": "在修復之前遊戲無法啟動。如果你編輯過某個檔案，請修復或刪除它。Steam → 內容 → 已安裝檔案 → 驗證 可以還原遊戲自帶的任何檔案。"
  definitions_failed_blocked:
    de: "Nicht verfügbar, bis die Fehler in den Definitionsdateien behoben sind."
    en: "Unavailable until the definition file errors are fixed."
    es: "No disponible hasta que se corrijan los errores de los archivos de definición."
    fr: "Indisponible tant que les erreurs des fichiers de définition ne sont pas corrigées."
    it: "Non disponibile finché gli errori dei file di definizione non sono risolti."
    ja: "定義ファイルのエラーが解決されるまで利用できません。"
    ko: "정의 파일 오류가 해결될 때까지 사용할 수 없습니다."
    "pt-BR": "Indisponível até que os erros dos arquivos de definição sejam corrigidos."
    ru: "Недоступно, пока не исправлены ошибки в файлах определений."
    zh: "在定义文件错误修复之前不可用。"
    "zh-TW": "在定義檔錯誤修復之前無法使用。"
  # Headline of the non-blocking design-load notice (#3071): user designs
  # missing from the library this session — files that failed to parse, plus
  # designs retained as unresolved because a nested design is missing.
  designs_failed:
    de: "%{count} deiner gespeicherten Entwürfe konnten nicht geladen werden."
    en: "%{count} of your saved designs could not be loaded."
    es: "No se pudieron cargar %{count} de tus diseños guardados."
    fr: "%{count} de vos modèles enregistrés n'ont pas pu être chargés."
    it: "%{count} dei tuoi progetti salvati non si sono potuti caricare."
    ja: "保存済みの設計のうち %{count} 件を読み込めませんでした。"
    ko: "저장된 설계 중 %{count}개를 불러오지 못했습니다."
    "pt-BR": "%{count} dos seus projetos salvos não puderam ser carregados."
    ru: "Не удалось загрузить сохранённые проекты: %{count}."
    zh: "你保存的设计中有 %{count} 个无法加载。"
    "zh-TW": "你儲存的設計中有 %{count} 個無法載入。"
  # Per-entry reason for a design retained as unresolved (#3050/#3070): the
  # file parsed, but a design it references by id is absent from the library.
  designs_failed_unresolved:
    de: "Ein referenzierter Entwurf fehlt in der Bibliothek – meist eine deinstallierte Mod."
    en: "A design it references is missing from the library — most often an uninstalled mod."
    es: "Falta en la biblioteca un diseño al que hace referencia; normalmente, un mod desinstalado."
    fr: "Un modèle qu'il référence est absent de la bibliothèque — le plus souvent un mod désinstallé."
    it: "Un progetto a cui fa riferimento manca dalla libreria — di solito una mod disinstallata."
    ja: "参照している設計がライブラリにありません。多くの場合、アンインストールされた Mod が原因です。"
    ko: "참조하는 설계가 라이브러리에 없습니다. 대부분 제거된 모드가 원인입니다."
    "pt-BR": "Um projeto que ele referencia está ausente da biblioteca — geralmente um mod desinstalado."
    ru: "Проект, на который он ссылается, отсутствует в библиотеке — обычно из-за удалённого мода."
    zh: "它引用的设计不在库中——通常是因为卸载了模组。"
    "zh-TW": "它引用的設計不在庫中——通常是因為移除了模組。"
  designs_failed_remedy:
    de: "Die Dateien bleiben unverändert in deinem Entwurfsordner – nichts wird gelöscht. Eine Datei, die nicht geladen werden kann, stammt möglicherweise aus einer anderen Version des Spiels."
    en: "The files are kept untouched in your designs folder — nothing is deleted. A file that fails to load may have been saved by a different version of the game."
    es: "Los archivos se conservan intactos en tu carpeta de diseños; no se elimina nada. Un archivo que no se puede cargar puede provenir de otra versión del juego."
    fr: "Les fichiers restent intacts dans votre dossier de modèles — rien n'est supprimé. Un fichier qui ne se charge pas provient peut-être d'une autre version du jeu."
