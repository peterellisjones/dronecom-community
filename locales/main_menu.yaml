  load_failed_older_build:
    de: "Dieser Spielstand wurde von einer älteren Version des Spiels erstellt und kann nicht geladen werden. Spielstände werden nicht zwischen Versionen übertragen."
    en: "This save was written by an older build of the game and cannot be loaded. Saves are not carried between builds."
    es: "Esta partida se guardó con una versión anterior del juego y no puede cargarse. Las partidas no se transfieren entre versiones."
    fr: "Cette sauvegarde provient d'une version antérieure du jeu et ne peut pas être chargée. Les sauvegardes ne sont pas transférées entre les versions."
    it: "Questo salvataggio è stato creato da una versione precedente del gioco e non può essere caricato. I salvataggi non vengono trasferiti tra le versioni."
    ja: "このセーブデータは古いビルドで作成されたため読み込めません。セーブデータはビルド間で引き継がれません。"
    ko: "이 저장 데이터는 이전 빌드에서 만들어져 불러올 수 없습니다. 저장 데이터는 빌드 간에 유지되지 않습니다."
    "pt-BR": "Este jogo salvo foi criado por uma versão anterior do jogo e não pode ser carregado. Os jogos salvos não são transferidos entre versões."
    ru: "Это сохранение создано более старой сборкой игры и не может быть загружено. Сохранения не переносятся между сборками."
    zh: "该存档由旧版本创建，无法加载。存档不会在版本之间保留。"
    "zh-TW": "此存檔由舊版本建立，無法載入。存檔不會在版本之間保留。"
  load_failed_newer_build:
    de: "Dieser Spielstand wurde von einer neueren Version des Spiels erstellt. Wechsle zu dieser Version zurück, um ihn zu laden."
    en: "This save was written by a newer build of the game. Switch back to that build to load it."
    es: "Esta partida se guardó con una versión más reciente del juego. Vuelve a esa versión para cargarla."
    fr: "Cette sauvegarde provient d'une version plus récente du jeu. Revenez à cette version pour la charger."
    it: "Questo salvataggio è stato creato da una versione più recente del gioco. Torna a quella versione per caricarlo."
    ja: "このセーブデータは新しいビルドで作成されました。読み込むにはそのビルドに戻してください。"
    ko: "이 저장 데이터는 최신 빌드에서 만들어졌습니다. 불러오려면 해당 빌드로 되돌아가세요."
    "pt-BR": "Este jogo salvo foi criado por uma versão mais recente do jogo. Volte para essa versão para carregá-lo."
    ru: "Это сохранение создано более новой сборкой игры. Вернитесь к ней, чтобы загрузить сохранение."
    zh: "该存档由更新版本创建。请切回该版本后再加载。"
    "zh-TW": "此存檔由較新版本建立。請切回該版本後再載入。"
