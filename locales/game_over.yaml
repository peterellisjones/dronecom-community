  glossary:
    elapsed:
      de: "Verstrichen: Einsatzzeit von Anfang bis Ende."
      en: "Elapsed: mission time from start to end."
      es: "Transcurrido: tiempo de misión de principio a fin."
      fr: "Écoulé : temps de mission, du début à la fin."
      it: "Trascorso: tempo di missione dall'inizio alla fine."
      ja: "経過時間：開始から終了までのミッション時間。"
      ko: "경과: 시작부터 종료까지의 임무 시간."
      "pt-BR": "Decorrido: tempo de missão do início ao fim."
      ru: "Прошло: время миссии от начала до конца."
      zh: "已用时间：从开始到结束的任务时间。"
      "zh-TW": "已用時間：從開始到結束的任務時間。"
    dtg:
      de: "Datums-Zeit-Gruppe: Zulu-Zeit am Gefechtsende."
      en: "Date-time group: Zulu time the engagement ended."
      es: "Grupo fecha-hora: hora Zulú del fin del combate."
      fr: "Groupe date-heure : heure Zulu de fin d'engagement."
      it: "Gruppo data-ora: ora Zulu di fine ingaggio."
      ja: "日時群：交戦終了時のズールー時刻。"
      ko: "일시 그룹: 교전 종료 시각(Zulu)."
      "pt-BR": "Grupo data-hora: hora Zulu do fim do combate."
      ru: "Дата-время: время Zulu окончания боя."
      zh: "日期时间组：交战结束的祖鲁时间。"
      "zh-TW": "日期時間組：交戰結束的祖魯時間。"
    bda:
      de: "Gefechtsschadensbewertung: eingesetzte, verlorene und zerstörte Kräfte."
      en: "Battle damage assessment: forces committed, lost, and killed."
      es: "Evaluación de daños: fuerzas comprometidas, perdidas y destruidas."
      fr: "Évaluation des dommages : forces engagées, perdues et détruites."
      it: "Valutazione danni: forze impiegate, perse e distrutte."
      ja: "戦果評価：投入・喪失・撃破した戦力。"
      ko: "전투 피해 평가: 투입·손실·격파 전력."
      "pt-BR": "Avaliação de danos: forças empregadas, perdidas e destruídas."
      ru: "Оценка ущерба: задействованные, потерянные и уничтоженные силы."
      zh: "战损评估：投入、损失与击毁的兵力。"
      "zh-TW": "戰損評估：投入、損失與擊毀的兵力。"
    sorties:
      de: "Einsätze: in das Gefecht eingebrachte Einheiten."
      en: "Sorties: units committed to the engagement."
      es: "Salidas: unidades comprometidas en el combate."
      fr: "Sorties : unités engagées dans le combat."
      it: "Sortite: unità impiegate nell'ingaggio."
      ja: "出撃：交戦に投入したユニット。"
      ko: "출격: 교전에 투입된 유닛."
      "pt-BR": "Surtidas: unidades empregadas no combate."
      ru: "Вылеты: введённые в бой единицы."
      zh: "出击：投入交战的单位。"
      "zh-TW": "出擊：投入交戰的單位。"
    platforms_lost:
      de: "Plattformen verloren: eigene Plattformen verloren, alle Ursachen. Munition zählt getrennt."
      en: "Platforms lost: own platforms lost, all causes. Munitions are counted separately."
      es: "Plataformas perdidas: plataformas propias perdidas, por cualquier causa. La munición se cuenta aparte."
      fr: "Plateformes perdues : plateformes amies perdues, toutes causes confondues. Les munitions sont comptées à part."
      it: "Piattaforme perse: piattaforme proprie perse, per qualsiasi causa. Le munizioni si contano a parte."
      ja: "喪失プラットフォーム数：あらゆる原因で失った自軍プラットフォーム。弾薬は別途計上。"
      ko: "손실 플랫폼: 모든 원인으로 손실된 아군 플랫폼. 탄약은 별도로 계산한다."
      "pt-BR": "Plataformas perdidas: plataformas próprias perdidas, por qualquer causa. As munições são contadas à parte."
      ru: "Потеряно платформ: свои платформы, потерянные по любой причине. Боеприпасы считаются отдельно."
      zh: "损失平台：因任何原因损失的己方平台。弹药单独计算。"
      "zh-TW": "損失平台：因任何原因損失的己方平台。彈藥單獨計算。"
    munitions_lost:
      de: "Munition verloren: eigene Munition verbraucht oder im Flug zerstört."
      en: "Munitions lost: own munitions expended or destroyed in flight."
      es: "Munición perdida: munición propia consumida o destruida en vuelo."
      fr: "Munitions perdues : munitions propres consommées ou détruites en vol."
      it: "Munizioni perse: munizioni proprie consumate o distrutte in volo."
      ja: "喪失弾薬数：消費または飛行中に失った自軍弾薬。"
      ko: "손실 탄약: 소모되었거나 비행 중 파괴된 아군 탄약."
      "pt-BR": "Munição perdida: munições próprias consumidas ou destruídas em voo."
      ru: "Потеряно боеприпасов: свои боеприпасы, израсходованные или уничтоженные в полёте."
      zh: "损失弹药：消耗或在飞行中被摧毁的己方弹药。"
      "zh-TW": "損失彈藥：消耗或在飛行中被摧毀的己方彈藥。"
    platforms_killed:
      de: "Plattformen zerstört: zerstörte feindliche Plattformen. Munition zählt getrennt."
      en: "Platforms killed: enemy platforms destroyed. Munitions are counted separately."
      es: "Plataformas destruidas: plataformas enemigas destruidas. La munición se cuenta aparte."
      fr: "Plateformes détruites : plateformes ennemies détruites. Les munitions sont comptées à part."
      it: "Piattaforme distrutte: piattaforme nemiche distrutte. Le munizioni si contano a parte."
      ja: "撃破プラットフォーム数：撃破した敵プラットフォーム。弾薬は別途計上。"
      ko: "격파 플랫폼: 격파한 적 플랫폼. 탄약은 별도로 계산한다."
      "pt-BR": "Plataformas destruídas: plataformas inimigas destruídas. As munições são contadas à parte."
      ru: "Уничтожено платформ: уничтоженные вражеские платформы. Боеприпасы считаются отдельно."
      zh: "击毁平台：摧毁的敌方平台。弹药单独计算。"
      "zh-TW": "擊毀平台：摧毀的敵方平台。彈藥單獨計算。"
    munitions_killed:
      de: "Munition zerstört: abgeschossene feindliche Munition."
      en: "Munitions killed: enemy munitions shot down."
      es: "Munición destruida: munición enemiga derribada."
      fr: "Munitions détruites : munitions ennemies abattues."
      it: "Munizioni distrutte: munizioni nemiche abbattute."
      ja: "撃破弾薬数：撃墜した敵弾薬。"
      ko: "격파 탄약: 격추한 적 탄약."
      "pt-BR": "Munição destruída: munições inimigas abatidas."
      ru: "Уничтожено боеприпасов: сбитые вражеские боеприпасы."
      zh: "击毁弹药：击落的敌方弹药。"
      "zh-TW": "擊毀彈藥：擊落的敵方彈藥。"
    cost_lost:
      de: "Verlorene Kosten: Wert der eigenen zerstörten Einheiten."
      en: "Cost lost: value of own units destroyed."
      es: "Costo perdido: valor de las unidades propias destruidas."
      fr: "Coût perdu : valeur des unités amies détruites."
      it: "Costo perso: valore delle unità proprie distrutte."
      ja: "喪失コスト：撃破された自軍ユニットの価値。"
      ko: "손실 비용: 파괴된 아군 유닛의 가치."
      "pt-BR": "Custo perdido: valor das unidades próprias destruídas."
      ru: "Потерянная стоимость: ценность уничтоженных своих единиц."
      zh: "损失费用：被击毁的己方单位价值。"
      "zh-TW": "損失費用：被擊毀的己方單位價值。"
    cost_killed:
      de: "Zerstörte Kosten: Wert der zerstörten feindlichen Einheiten."
      en: "Cost killed: value of enemy units destroyed."
      es: "Costo destruido: valor de las unidades enemigas destruidas."
      fr: "Coût détruit : valeur des unités ennemies détruites."
      it: "Costo distrutto: valore delle unità nemiche distrutte."
      ja: "撃破コスト：撃破した敵ユニットの価値。"
      ko: "격파 비용: 파괴한 적 유닛의 가치."
      "pt-BR": "Custo destruído: valor das unidades inimigas destruídas."
      ru: "Уничтоженная стоимость: ценность уничтоженных вражеских единиц."
      zh: "摧毁费用：摧毁的敌方单位价值。"
      "zh-TW": "摧毀費用：摧毀的敵方單位價值。"
    civilians:
      de: "Von diesem Team zerstörte zivile Schiffe; sie zählen weder als Abschüsse noch als Gefechtswert und verursachen eine Strafe."
      en: "Civilian vessels destroyed by this team; they count as neither kills nor combat value and incur a fine."
      es: "Buques civiles destruidos por este equipo; no cuentan como bajas ni valor de combate y acarrean una multa."
      fr: "Navires civils détruits par cette équipe ; ils ne comptent ni comme éliminations ni comme valeur de combat et entraînent une amende."
      it: "Navi civili distrutte da questa squadra; non contano come eliminazioni né valore di combattimento e comportano una multa."
      ja: "この陣営が撃沈した民間船。撃破にも戦果にも計上されず、罰金が科されます。"
      ko: "이 팀이 격침한 민간 선박입니다. 격파나 전과로 계산되지 않으며 벌금이 부과됩니다."
      "pt-BR": "Navios civis destruídos por esta equipe; não contam como abates nem valor de combate e geram multa."
      ru: "Гражданские суда, уничтоженные этой командой; они не засчитываются как уничтожения или боевая ценность и влекут штраф."
      zh: "该队击沉的民用船只；不计入击毁或战果，并会被罚款。"
      "zh-TW": "該隊擊沉的民用船隻；不計入擊毀或戰果，並會被罰款。"
    weapons_employment:
      de: "Waffeneinsatz: abgefeuerte Schüsse und ihre Wirkung."
      en: "Weapons employment: rounds fired and their effect."
      es: "Empleo de armas: disparos realizados y su efecto."
      fr: "Emploi des armes : tirs effectués et leur effet."
      it: "Impiego delle armi: colpi sparati e loro effetto."
      ja: "兵器運用：発射した弾数とその効果。"
      ko: "무기 운용: 발사한 탄과 그 효과."
      "pt-BR": "Emprego de armas: disparos efetuados e seu efeito."
      ru: "Применение оружия: выпущенные боеприпасы и их эффект."
      zh: "武器使用：发射的弹药及其效果。"
      "zh-TW": "武器使用：發射的彈藥及其效果。"
    fired:
      de: "Abgefeuert: gestartete Schüsse."
      en: "Fired: rounds launched."
      es: "Disparados: proyectiles lanzados."
      fr: "Tirés : munitions lancées."
      it: "Lanciati: colpi lanciati."
      ja: "発射：発射した弾数。"
      ko: "발사: 발사한 탄."
      "pt-BR": "Disparados: munições lançadas."
      ru: "Выпущено: запущенные боеприпасы."
      zh: "发射：发射的弹药。"
      "zh-TW": "發射：發射的彈藥。"
    hits:
      de: "Treffer: Schüsse, die ein Ziel trafen."
      en: "Hits: rounds that struck a target."
      es: "Impactos: proyectiles que alcanzaron un blanco."
      fr: "Touches : munitions ayant atteint une cible."
      it: "Colpi a segno: colpi che hanno colpito un bersaglio."
      ja: "命中：目標に命中した弾数。"
      ko: "명중: 표적에 명중한 탄."
      "pt-BR": "Acertos: munições que atingiram um alvo."
      ru: "Попадания: боеприпасы, поразившие цель."
      zh: "命中：击中目标的弹药。"
      "zh-TW": "命中：擊中目標的彈藥。"
    expended:
      de: "Verbraucht: Schüsse mit feststehendem Ergebnis — Treffer oder Fehlschuss (verbraucht oder im Flug abgeschossen)."
      en: "Expended: rounds with a settled outcome — a hit, or a miss (spent short, or shot down in flight)."
      es: "Gastados: proyectiles con resultado definitivo — impacto o fallo (agotados o derribados en vuelo)."
      fr: "Consommés : munitions au résultat établi — touche ou échec (épuisées ou abattues en vol)."
      it: "Consumati: colpi con esito definito — a segno o mancati (esauriti o abbattuti in volo)."
      ja: "消費：結果が確定した弾数（命中、または消耗・飛行中の撃墜による失探）。"
      ko: "소모: 결과가 확정된 탄(명중, 또는 소진·비행 중 격추로 인한 빗나감)."
      "pt-BR": "Consumidos: munições com resultado definido — acerto ou erro (esgotadas ou abatidas em voo)."
      ru: "Израсходовано: боеприпасы с определённым исходом — попадание или промах (израсходованы или сбиты в полёте)."
      zh: "消耗：结果已确定的弹药（命中，或耗尽、飞行中被击落导致的脱靶）。"
      "zh-TW": "消耗：結果已確定的彈藥（命中，或耗盡、飛行中被擊落導致的脫靶）。"
    lost_stowed:
      de: "Verloren (gelagert): mit dem Träger zerstörte Schüsse."
      en: "Lost (stowed): rounds destroyed with their carrier."
      es: "Perdidos (almacenados): proyectiles destruidos con su portador."
      fr: "Perdus (stockés) : munitions détruites avec leur porteur."
      it: "Persi (stivati): colpi distrutti con il loro vettore."
      ja: "喪失（搭載中）：母機もろとも失った弾数。"
      ko: "손실(적재): 운반체와 함께 파괴된 탄."
      "pt-BR": "Perdidos (armazenados): munições destruídas com seu portador."
      ru: "Потеряно (на борту): боеприпасы, уничтоженные с носителем."
      zh: "损失（存储中）：随载具一同损失的弹药。"
      "zh-TW": "損失（存儲中）：隨載具一同損失的彈藥。"
    hit_rate:
      de: "Trefferquote: Treffer geteilt durch Verbrauchte."
      en: "Hit rate: hits divided by expended."
      es: "Tasa de acierto: impactos divididos entre gastados."
      fr: "Taux de réussite : touches divisées par consommées."
      it: "Percentuale colpi: colpi a segno divisi per consumati."
      ja: "命中率：命中を消費で割った値。"
      ko: "명중률: 명중을 소모로 나눈 값."
      "pt-BR": "Taxa de acerto: acertos divididos por consumidos."
      ru: "Точность: попадания, делённые на израсходованные."
      zh: "命中率：命中除以消耗。"
      "zh-TW": "命中率：命中除以消耗。"
    economy:
      de: "Wirtschaft: eingenommene, ausgegebene, als Strafe abgezogene und beim Schlusspfiff verbliebene Credits."
      en: "Economy: credits taken in, spent, lost to penalties, and left at the final whistle."
      es: "Economía: créditos ingresados, gastados, perdidos en multas y restantes al final."
      fr: "Économie : crédits encaissés, dépensés, perdus en amendes et restants au coup de sifflet final."
      it: "Economia: crediti incassati, spesi, persi in multe e rimasti al fischio finale."
      ja: "経済：獲得・支出・罰金で失った額、および終了時点の残高。"
      ko: "경제: 획득·지출·벌금으로 잃은 액수, 그리고 종료 시점의 잔액."
      "pt-BR": "Economia: créditos recebidos, gastos, perdidos em multas e restantes ao apito final."
      ru: "Экономика: полученные, потраченные, снятые штрафами и оставшиеся к финальному свистку кредиты."
      zh: "经济：进账、支出、罚没以及终局时剩余的信用点。"
      "zh-TW": "經濟：進帳、支出、罰沒以及終局時剩餘的信用點。"
    earned:
      de: "In diesem Gefecht verdiente Credits; das Startguthaben ist ausgeschlossen."
      en: "Credits earned during the engagement; starting funds are excluded."
      es: "Créditos ganados durante el combate; se excluyen los fondos iniciales."
      fr: "Crédits gagnés pendant l'engagement ; les fonds de départ sont exclus."
      it: "Crediti guadagnati durante l'ingaggio; i fondi iniziali sono esclusi."
      ja: "交戦中に獲得した信用点。初期資金は含まれません。"
      ko: "교전 중 획득한 크레딧입니다. 초기 자금은 제외됩니다."
      "pt-BR": "Créditos ganhos durante o combate; os fundos iniciais são excluídos."
      ru: "Кредиты, заработанные во время боя; стартовые средства не учитываются."
      zh: "交战期间获得的信用点；不含初始资金。"
      "zh-TW": "交戰期間獲得的信用點；不含初始資金。"
    spent:
      de: "Für Beschaffung ausgegebene Credits; Strafen zählen getrennt."
      en: "Credits spent on procurement; fines are counted separately."
      es: "Créditos gastados en adquisiciones; las multas se cuentan aparte."
      fr: "Crédits dépensés en achats ; les amendes sont comptées séparément."
      it: "Crediti spesi in acquisti; le multe sono conteggiate separatamente."
      ja: "調達に使った信用点。罰金は別途計上されます。"
      ko: "조달에 사용한 크레딧입니다. 벌금은 별도로 계산됩니다."
      "pt-BR": "Créditos gastos em aquisições; as multas são contadas separadamente."
      ru: "Кредиты, потраченные на закупки; штрафы считаются отдельно."
      zh: "用于采购的信用点；罚款单独计算。"
      "zh-TW": "用於採購的信用點；罰款單獨計算。"
    fined:
      de: "Strafen: als Strafe abgezogene Credits für Schäden am zivilen Verkehr."
      en: "Fined: credits taken as penalties for harming civilian traffic."
      es: "Multas: créditos retirados como sanción por dañar el tráfico civil."
      fr: "Amendes : crédits prélevés en pénalité pour avoir touché au trafic civil."
      it: "Multe: crediti prelevati come sanzione per aver colpito il traffico civile."
      ja: "罰金：民間船舶を害したことへの制裁として徴収された信用点。"
      ko: "벌금: 민간 선박에 피해를 입힌 데 대한 제재로 징수된 신용점."
      "pt-BR": "Multas: créditos retirados como penalidade por atingir o tráfego civil."
      ru: "Штрафы: кредиты, взысканные за ущерб гражданскому судоходству."
      zh: "罚款：因伤害民用船只而被扣除的信用点。"
      "zh-TW": "罰款：因傷害民用船隻而被扣除的信用點。"
    balance:
      de: "Saldo: verfügbare Mittel beim Schlusspfiff. Ein negativer Wert ist eine Schuld — das Team kann nichts kaufen, bis sie abgetragen ist."
      en: "Balance: spendable funds at the final whistle. A negative figure is debt — the team can buy nothing until it earns out."
      es: "Saldo: fondos disponibles al final. Una cifra negativa es deuda: el equipo no puede comprar nada hasta saldarla."
      fr: "Solde : fonds disponibles au coup de sifflet final. Un chiffre négatif est une dette — l'équipe ne peut rien acheter tant qu'elle n'est pas remboursée."
      it: "Saldo: fondi disponibili al fischio finale. Una cifra negativa è debito: la squadra non può comprare nulla finché non lo estingue."
      ja: "残高：終了時点で使える資金。マイナスは負債 — 返済しきるまでその陣営は何も買えない。"
      ko: "잔액: 종료 시점에 쓸 수 있는 자금. 음수는 부채 — 갚아낼 때까지 그 팀은 아무것도 살 수 없다."
      "pt-BR": "Saldo: fundos disponíveis ao apito final. Um valor negativo é dívida — a equipe não pode comprar nada até quitá-la."
      ru: "Баланс: доступные средства к финальному свистку. Отрицательное значение — долг: команда не может ничего купить, пока его не погасит."
      zh: "余额：终局时可动用的资金。负数即负债——在还清之前，该队什么也买不了。"
      "zh-TW": "餘額：終局時可動用的資金。負數即負債——在還清之前，該隊什麼也買不了。"
