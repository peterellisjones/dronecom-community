  destroy_selected_tooltip:
    de: "Zerstört die ausgewählten Einheiten, erfasst Verluste, aktualisiert Match-Statistiken und Ereignisprotokoll und kann das Match beenden. Entfernen löscht sie ohne Eintrag."
    en: "Destroy selected units, recording losses, updating match stats and the event log, and potentially ending the match. Despawn removes them without a record."
    es: "Destruye las unidades seleccionadas, registra pérdidas, actualiza las estadísticas y el registro de eventos, y puede terminar la partida. Eliminar las quita sin dejar registro."
    fr: "Détruit les unités sélectionnées, enregistre les pertes, met à jour les statistiques et le journal des événements, et peut terminer la partie. Supprimer les retire sans trace."
    it: "Distrugge le unità selezionate, registra le perdite, aggiorna statistiche e registro eventi e può terminare la partita. Rimuovi le elimina senza registrarle."
    ja: "選択したユニットを破壊し、損失・試合統計・イベントログを記録します。試合が終了する場合もあります。除去は記録を残さず削除します。"
    ko: "선택한 유닛을 파괴해 손실, 경기 통계와 이벤트 로그를 기록하며 매치가 종료될 수도 있습니다. 제거는 기록 없이 삭제합니다."
    "pt-BR": "Destrói as unidades selecionadas, registra perdas, atualiza as estatísticas e o registro de eventos e pode encerrar a partida. Remover as exclui sem registro."
    ru: "Уничтожает выбранные юниты, фиксирует потери, обновляет статистику и журнал событий и может завершить матч. Удаление убирает их без записи."
    zh: "摧毁所选单位，记录损失并更新比赛统计和事件日志，且可能结束比赛。移除则不会留下记录。"
    "zh-TW": "摧毀所選單位，記錄損失並更新比賽統計和事件日誌，且可能結束比賽。移除則不會留下記錄。"
