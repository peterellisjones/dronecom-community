  destroy_selected_tooltip:
    de: "Zerstört die ausgewählten Einheiten über den echten Verlustpfad: Ein Verlust wird erfasst, Match-Statistiken und Ereignisprotokoll werden aktualisiert, und das Match kann dadurch enden. Entfernen löscht eine Einheit dagegen lautlos, ohne Spur."
    en: "Destroys the selected units through the real loss path: it registers a loss, updates match stats and the event log, and can end the match. Despawn removes an entity silently, with no trace."
    es: "Destruye las unidades seleccionadas mediante la ruta de pérdida real: registra una pérdida, actualiza las estadísticas de partida y el registro de eventos, y puede terminar la partida. Eliminar, en cambio, quita una entidad en silencio, sin dejar rastro."
    fr: "Détruit les unités sélectionnées via le véritable circuit de perte : une perte est enregistrée, les statistiques de match et le journal des événements sont mis à jour, et la partie peut se terminer. Supprimer, à l'inverse, retire une entité silencieusement, sans laisser de trace."
    it: "Distrugge le unità selezionate tramite il percorso di perdita reale: registra una perdita, aggiorna le statistiche partita e il registro eventi, e può terminare la partita. Rimuovi, invece, elimina un'entità silenziosamente, senza lasciare traccia."
    ja: "選択したユニットを本物の損失経路で破壊する。損失が記録され、試合統計とイベントログが更新され、試合が終了する場合もある。除去は痕跡を残さず静かにエンティティを取り除く。"
    ko: "선택한 유닛을 실제 손실 경로로 파괴합니다. 손실이 기록되고 경기 통계와 이벤트 로그가 갱신되며, 매치가 종료될 수도 있습니다. 반면 제거는 흔적 없이 조용히 엔티티를 없앱니다."
    "pt-BR": "Destrói as unidades selecionadas pelo caminho real de perda: registra uma perda, atualiza as estatísticas da partida e o registro de eventos, e pode encerrar a partida. Remover, por outro lado, retira uma entidade silenciosamente, sem deixar rastro."
    ru: "Уничтожает выбранные юниты через настоящий путь потери: фиксируется потеря, обновляется статистика матча и журнал событий, и матч может завершиться. Удалить, в отличие от этого, тихо убирает сущность без следа."
    zh: "通过真实的损失路径摧毁所选单位：记录损失、更新比赛统计和事件日志，且可能结束比赛。移除则会悄无声息地清除实体，不留痕迹。"
    "zh-TW": "透過真實的損失路徑摧毀所選單位：記錄損失、更新比賽統計和事件日誌，且可能結束比賽。移除則會悄無聲息地清除實體，不留痕跡。"
