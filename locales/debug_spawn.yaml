  header_tooltip:
    de: "Setze Einheiten jedes Designs für jedes Team auf die Karte. Wähle Team und Design, schalte „Auf Karte setzen“ ein und klicke auf die Karte; Esc beendet das Platzieren."
    en: "Place units of any design for any team on the map. Pick a team and a design, turn on Place on map, then click the map; Esc stops placing."
    es: "Coloca en el mapa unidades de cualquier diseño para cualquier equipo. Elige equipo y diseño, activa Colocar en el mapa y haz clic en el mapa; Esc deja de colocar."
    fr: "Placez sur la carte des unités de n'importe quel design pour n'importe quelle équipe. Choisissez une équipe et un design, activez Placer sur la carte, puis cliquez sur la carte ; Échap arrête le placement."
    it: "Piazza sulla mappa unità di qualsiasi progetto per qualsiasi squadra. Scegli squadra e progetto, attiva Piazza sulla mappa e clicca sulla mappa; Esc interrompe il piazzamento."
    ja: "任意の設計のユニットを任意のチームとしてマップに配置します。チームと設計を選び、「マップに配置」をオンにしてマップをクリックします。Escで配置を終了します。"
    ko: "모든 설계의 유닛을 원하는 팀으로 지도에 배치합니다. 팀과 설계를 고르고 '지도에 배치'를 켠 뒤 지도를 클릭하세요. Esc로 배치를 멈춥니다."
    "pt-BR": "Coloque no mapa unidades de qualquer projeto para qualquer equipe. Escolha a equipe e o projeto, ative Colocar no mapa e clique no mapa; Esc para de colocar."
    ru: "Размещайте на карте юниты любого проекта за любую команду. Выберите команду и проект, включите «Разместить на карте» и щёлкните по карте; Esc прекращает размещение."
    zh: "为任意队伍在地图上放置任意设计的单位。选择队伍和设计，开启“放置到地图”，然后点击地图；按Esc停止放置。"
    "zh-TW": "為任意隊伍在地圖上放置任意設計的單位。選擇隊伍和設計，開啟「放置到地圖」，然後點擊地圖；按Esc停止放置。"
