  destroy_selected_neutral_tooltip:
    de: "Der neutrale Slot ist reiner Spawn — Einheiten anderer Teams auswählen, um sie zu zerstören."
    en: "The neutral slot is spawn-only — select another team's units to destroy them."
    es: "La ranura neutral solo genera unidades: selecciona unidades de otro equipo para destruirlas."
    fr: "L'emplacement neutre ne fait qu'apparaître des unités — sélectionnez celles d'une autre équipe pour les détruire."
    it: "Lo slot neutrale può solo generare unità: seleziona quelle di un'altra squadra per distruggerle."
    ja: "中立スロットはスポーン専用です。破壊するには他チームのユニットを選択してください。"
    ko: "중립 슬롯은 스폰 전용입니다. 파괴하려면 다른 팀의 유닛을 선택하세요."
    "pt-BR": "O slot neutro é apenas de geração — selecione unidades de outra equipe para destruí-las."
    ru: "Нейтральный слот только порождает юниты — выберите юниты другой команды, чтобы уничтожить их."
    zh: "中立槽位仅用于生成单位，请选择其他队伍的单位进行摧毁。"
    "zh-TW": "中立槽位僅用於生成單位，請選擇其他隊伍的單位進行摧毀。"
