      fr: "Azimut-élévation : champs de vision et pistes connues. Les pistes non détectées par cette plateforme sont estompées ; un cercle indique un capteur asservi, pas nécessairement un verrouillage acquis.\n\nANGLE INC contient les pistes sélectionnables sans position angulaire connue. Leur disposition ne représente ni relèvement ni élévation."
      it: "Azimut-elevazione: campi visivi e tracce note. Le tracce non rilevate da questa piattaforma sono attenuate; un cerchio indica un sensore asservito, non necessariamente un aggancio.\n\nANG IGN contiene tracce selezionabili senza posizione angolare nota. La posizione in quest’area non rappresenta rilevamento o elevazione."
      ja: "方位-仰角：センサー視野と既知の航跡。このプラットフォームが検出していない航跡は薄く表示します。円はセンサーへの目標割り当てを示し、ロック完了とは限りません。\n\n角度不明の領域には角度位置が不明な航跡を表示します。航跡は選択できますが、領域内の位置は方位や仰角を表しません。"
      ko: "방위각-고각: 센서 시야와 알려진 항적. 이 플랫폼이 탐지하지 않은 항적은 흐리게 표시합니다. 원은 센서 표적 할당을 뜻하며 고정 완료를 의미하지는 않습니다.\n\n각도 미상 영역에는 각도 위치를 모르는 항적이 표시됩니다. 선택할 수 있지만 영역 내 위치는 방위나 고각을 나타내지 않습니다."
      "pt-BR": "Azimute-elevação: campos de visão e trilhas conhecidas. Trilhas não detectadas por esta plataforma são atenuadas; um círculo indica sensor direcionado, não necessariamente travamento adquirido.\n\nÂNG DESC contém trilhas selecionáveis sem posição angular conhecida. As posições nessa área não representam marcação ou elevação."
      ru: "Азимут–угол места: поля обзора и известные трассы. Трассы без обнаружения этой платформой бледнее; круг означает назначение датчика, а не обязательно захват.\n\nУГОЛ НЕИЗВ содержит доступные для выбора трассы с неизвестным угловым положением. Расположение в этой области не обозначает пеленг или угол места."
      zh: "方位-仰角：传感器视场与已知航迹。本平台未探测到的航迹会淡化；圆圈表示传感器已指定跟踪，不一定已完成锁定。\n\n角度未知区域显示角度位置未知的航迹。航迹仍可选择，但此区域中的位置不代表方位或仰角。"
      "zh-TW": "方位-仰角：感測器視野與已知航跡。本平台未偵測到的航跡會淡化；圓圈表示感測器已指定追蹤，不一定已完成鎖定。\n\n角度未知區域顯示角度位置未知的航跡。航跡仍可選取，但此區域中的位置不代表方位或仰角。"
