    salvo_override_tooltip:
      de: "Entwurfswert %{default}; diese Plattform fordert pro Angriffsversuch bis zu %{requested} passende, bereite Geschosse an. %{aboard} passende Geschosse sind an Bord. Die flottenweite Zielkapazität wird beim Abschuss angewandt und hier während des Zielanflugs angezeigt."
      en: "Blueprint default %{default}; this platform requests up to %{requested} matching ready rounds per engagement attempt. %{aboard} matching rounds are aboard. Target-wide fleet capacity is applied at launch and shown here while closing on a target."
      es: "Valor predeterminado del diseño %{default}; esta plataforma solicita hasta %{requested} proyectiles compatibles listos por intento de ataque. Hay %{aboard} a bordo. La capacidad de flota por objetivo se aplica al lanzar y se muestra durante la aproximación."
      fr: "Valeur par défaut du modèle : %{default} ; cette plateforme demande jusqu’à %{requested} munitions compatibles prêtes par tentative d’engagement. %{aboard} sont à bord. La capacité de flotte par cible s’applique au tir et s’affiche pendant l’approche."
      it: "Valore predefinito del progetto %{default}; questa piattaforma richiede fino a %{requested} colpi compatibili pronti per tentativo d’ingaggio. %{aboard} sono a bordo. La capacità della flotta per bersaglio si applica al lancio e appare durante l’avvicinamento."
      ja: "設計既定値%{default}。このプラットフォームは交戦試行ごとに同種の発射可能弾を最大%{requested}発要求します。同種弾%{aboard}発を搭載中です。目標ごとの艦隊共通枠は発射時に適用され、接近中はここに表示されます。"
      ko: "설계 기본값 %{default}; 이 플랫폼은 교전 시도마다 같은 종류의 준비된 탄을 최대 %{requested}발 요청합니다. 같은 탄 %{aboard}발이 탑재되어 있습니다. 표적별 함대 공용 용량은 발사 시 적용되며 접근 중 여기에 표시됩니다."
      "pt-BR": "Padrão do projeto %{default}; esta plataforma solicita até %{requested} projéteis compatíveis prontos por tentativa de engajamento. Há %{aboard} a bordo. A capacidade da frota por alvo é aplicada no lançamento e aparece durante a aproximação."
      ru: "Значение проекта %{default}; эта платформа запрашивает до %{requested} готовых боеприпасов этого типа за попытку атаки. На борту %{aboard}. Общая ёмкость флота по цели применяется при пуске и показывается во время сближения."
      zh: "蓝图默认%{default}；此平台每次交战尝试最多请求%{requested}发同型待发弹药，当前搭载%{aboard}发。全舰队目标余量在发射时生效，并在接近目标时显示于此。"
      "zh-TW": "藍圖預設%{default}；此平台每次交戰嘗試最多要求%{requested}發同型待發彈藥，目前搭載%{aboard}發。全艦隊目標餘量在發射時生效，並在接近目標時顯示於此。"
