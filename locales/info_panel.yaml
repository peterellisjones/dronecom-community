      es: "Diseño %{default} · efectivo %{requested} · listos %{ready} · límite de flota para el objetivo ilimitado · si se selecciona, hasta %{conditional}."
      fr: "Modèle %{default} · effectif %{requested} · prêtes %{ready} · limite de flotte sur la cible illimitée · si sélectionnée, jusqu’à %{conditional}."
      it: "Progetto %{default} · effettivo %{requested} · pronti %{ready} · limite flotta sul bersaglio illimitato · se selezionato, fino a %{conditional}."
      ja: "設計 %{default} · 有効 %{requested} · 発射可能 %{ready} · 目標に対する艦隊共通上限なし · 選択時上限 %{conditional}。"
      ko: "설계 %{default} · 적용 %{requested} · 준비 %{ready} · 표적별 함대 한도 없음 · 선택 시 최대 %{conditional}."
      "pt-BR": "Projeto %{default} · efetivo %{requested} · prontos %{ready} · limite da frota no alvo ilimitado · se selecionado, até %{conditional}."
      ru: "Проект %{default} · действует %{requested} · готово %{ready} · общий лимит флота по цели отсутствует · при выборе не более %{conditional}."
      zh: "蓝图 %{default} · 生效 %{requested} · 待发 %{ready} · 全舰队目标上限无限 · 若选用，上限 %{conditional}。"
      "zh-TW": "藍圖 %{default} · 生效 %{requested} · 待發 %{ready} · 全艦隊目標上限無限 · 若選用，上限 %{conditional}。"
    # Glossary tooltip for the per-facility cell-occupancy stat row (#3017 cap,
    # #3147 physical readout, `VLS 1/12`): %{facility} is the launcher tag
    # (already caps), %{used} / %{capacity} are bare cell counts — %{used} is
    # rounds currently LOADED (physical), not manifest intent, so a fired cell
    # reads empty. Sentence-case prose (the row's own label/value are the caps
    # readout; this explains what it means).
    cells_readout:
      de: "%{used} von %{capacity} %{facility}-Zellen aktuell geladen."
      en: "%{used} of %{capacity} %{facility} cells currently loaded."
      es: "%{used} de %{capacity} celdas de %{facility} cargadas actualmente."
      fr: "%{used} des %{capacity} cellules %{facility} actuellement chargées."
      it: "%{used} di %{capacity} celle %{facility} attualmente caricate."
      ja: "%{facility} セル %{capacity} 中 %{used} が現在装填済み。"
      ko: "%{facility} 셀 %{capacity} 중 %{used}이(가) 현재 장전됨."
      "pt-BR": "%{used} de %{capacity} células de %{facility} carregadas no momento."
      ru: "%{used} из %{capacity} ячеек %{facility} сейчас заряжено."
      zh: "%{facility} 单元 %{capacity} 中当前已装填 %{used} 个。"
      "zh-TW": "%{facility} 單元 %{capacity} 中目前已裝填 %{used} 個。"
  # %{weight} is a glued-caps measure (e.g. "1234.5KG"), so the unit is not
  # repeated here (#1709 / ADR-0005).
  stores_weight:
    de: "%{weight} gesamt"
    en: "%{weight} total"
    es: "%{weight} en total"
    fr: "%{weight} au total"
    it: "%{weight} totali"
    ja: "合計 %{weight}"
    ko: "총 %{weight}"
    "pt-BR": "%{weight} no total"
    ru: "%{weight} всего"
    zh: "共 %{weight}"
    "zh-TW": "共 %{weight}"
  stores_weight_tooltip:
    de: "Gesamtgewicht der losen Fracht in diesem Lager. Die Frachtkapazität des Rumpfes begrenzt die gesamte Zuladung — Magazin, Lager und laufende Transfers zusammen."
    en: "Combined weight of the loose cargo held in these stores. The hull's cargo capacity limits its whole load — magazine, stores and transfers in flight together."
    es: "Peso combinado de la carga suelta guardada en este pañol. La capacidad de carga del casco limita el conjunto: santabárbara, pañol y transferencias en curso."
    fr: "Poids cumulé du fret en vrac de cette soute. La capacité d'emport de la coque limite l'ensemble : soute, magasin et transferts en cours."
    it: "Peso complessivo del carico sfuso in questi depositi. La capacità di carico dello scafo limita l'intero carico: santabarbara, deposito e trasferimenti in corso."
    ja: "この倉庫にある非搭載貨物の合計重量。船体の貨物容量は、弾庫・倉庫・輸送中の分を合わせた総積載を制限する。"
    ko: "이 창고에 있는 산적 화물의 총 중량입니다. 선체의 화물 용량은 탄약고와 창고, 이송 중인 물량을 모두 합한 적재량을 제한합니다."
    "pt-BR": "Peso somado da carga solta guardada nestes paióis. A capacidade de carga do casco limita o total: santabárbara, paiol e transferências em curso."
    ru: "Суммарный вес насыпного груза в этих кладовых. Грузоподъёмность корпуса ограничивает всю загрузку: погреб, кладовые и грузы в пути вместе."
    zh: "该储存舱内散装货物的总重量。舰体的载货容量限制的是全部载荷——弹药舱、储存舱与运输途中的货物之和。"
    "zh-TW": "該儲存艙內散裝貨物的總重量。艦體的載貨容量限制的是全部載荷——彈藥艙、儲存艙與運輸途中的貨物之和。"
  stores:
    # Glossary tooltip for the STORES section on a stowed drone's panel: the
    # rounds come from the hosting carrier, not the drone itself.
    drone_section_tooltip:
      de: "Das Lager des Trägers — kompatible Runden auf diese Drohne laden."
      en: "The hosting carrier's stores — load compatible rounds onto this drone."
      es: "El pañol del portaaeronaves anfitrión — carga rondas compatibles en este dron."
      fr: "La soute du porteur hôte — charger des munitions compatibles sur ce drone."
      it: "Il deposito della portaerei ospitante — carica colpi compatibili su questo drone."
      ja: "母艦の在庫 — 対応する弾をこのドローンに搭載する。"
      ko: "모함의 저장고 — 호환 탄을 이 드론에 적재한다."
      "pt-BR": "O paiol do porta-aeronaves anfitrião — carregue projéteis compatíveis neste drone."
      ru: "Склад несущего носителя — загрузите совместимые снаряды на этот дрон."
      zh: "母舰的库存 — 将兼容弹药装填到此无人机。"
      "zh-TW": "母艦的庫存 — 將相容彈藥裝填到此無人機。"
  # DC-996: Form Group button on the multi-select inspect panel.
  # DC-1032: platform-link row (stowed-in / launched-from) in the per-vehicle
  # inspect panel. Used by `render_platform_link` in `entity_view.rs`.
  stowed_in:
    de: "Eingestaut in"
    en: "Stowed in"
    es: "Embarcado en"
    fr: "Embarqué dans"
    it: "Imbarcato in"
    ja: "搭載先"
    ko: "탑재된 모함"
    "pt-BR": "Embarcado em"
    ru: "На борту"
    zh: "搭载于"
    "zh-TW": "搭載於"
  stowed_in_tooltip:
    de: "Die Plattform, an deren Bord sich diese Drohne befindet. Sie wird dort gewartet und muss starten, bevor sie einen Auftrag fliegen kann."
    en: "The platform this drone is aboard. It is serviced there and must launch before it can fly a mission."
    es: "La plataforma a bordo de la cual está este dron. Allí recibe mantenimiento y debe lanzarse antes de poder volar una misión."
    fr: "La plateforme à bord de laquelle se trouve ce drone. Il y est entretenu et doit être lancé avant de pouvoir voler une mission."
    it: "La piattaforma a bordo della quale si trova questo drone. Lì viene servito e deve essere lanciato prima di poter volare una missione."
    ja: "このドローンが搭載されているプラットフォーム。ここで整備され、任務に就くには発進が必要。"
    ko: "이 드론이 탑재된 플랫폼입니다. 여기서 정비를 받으며, 임무를 수행하려면 먼저 발진해야 합니다."
    "pt-BR": "A plataforma a bordo da qual este drone está. Ele é servido ali e precisa ser lançado antes de voar uma missão."
    ru: "Платформа, на борту которой находится этот дрон. Здесь он обслуживается и должен стартовать, прежде чем сможет выполнять задачу."
    zh: "该无人机所在的搭载平台。它在此接受勤务保障，须先发射才能执行任务。"
    "zh-TW": "該無人機所在的搭載平台。它在此接受勤務保障，須先發射才能執行任務。"
  launched_from:
    de: "Gestartet von"
    en: "Launched from"
    es: "Lanzado desde"
    fr: "Lancé depuis"
    it: "Lanciato da"
    ja: "発進元"
    ko: "발진 모함"
    "pt-BR": "Lançado de"
    ru: "Запущен с"
    zh: "从…发射"
    "zh-TW": "從…發射"
  launched_from_tooltip:
    de: "Die Plattform, von der diese Drohne gestartet ist. Sie ist jetzt in der Luft und wird dort wieder aufgenommen."
    en: "The platform this drone launched from. It is airborne now and recovers there when it returns."
    es: "La plataforma desde la que despegó este dron. Ahora está en vuelo y se recuperará allí al regresar."
    fr: "La plateforme depuis laquelle ce drone a décollé. Il est en vol et y sera récupéré à son retour."
    it: "La piattaforma da cui questo drone è decollato. Ora è in volo e vi sarà recuperato al rientro."
    ja: "このドローンが発進したプラットフォーム。現在は飛行中で、帰投時にはここへ収容される。"
    ko: "이 드론이 발진한 플랫폼입니다. 현재 비행 중이며 귀환 시 이곳에 회수됩니다."
    "pt-BR": "A plataforma de onde este drone decolou. Ele está em voo e será recolhido ali ao retornar."
    ru: "Платформа, с которой стартовал этот дрон. Сейчас он в воздухе и вернётся сюда для приёма."
    zh: "该无人机的起飞平台。它当前正在空中，返航时将在此回收。"
    "zh-TW": "該無人機的起飛平台。它當前正在空中，返航時將在此回收。"
  platform_lost:
    de: "(Plattform verloren)"
    en: "(platform lost)"
    es: "(plataforma perdida)"
    fr: "(plateforme perdue)"
    it: "(piattaforma persa)"
    ja: "(プラットフォーム消失)"
    ko: "(플랫폼 소실)"
    "pt-BR": "(plataforma perdida)"
    ru: "(платформа потеряна)"
    zh: "(平台丢失)"
    "zh-TW": "(平台丟失)"
  platform_lost_tooltip:
    de: "Die Mutterplattform ist nicht mehr im Lagebild — sie ging verloren oder ihr Zustand hat Sie noch nicht erreicht."
    en: "The parent platform is no longer in the tracked picture — it was lost, or its state has not reached you yet."
    es: "La plataforma matriz ya no figura en el cuadro táctico: se perdió o su estado aún no te ha llegado."
    fr: "La plateforme mère n'est plus dans la situation tactique : elle a été perdue, ou son état ne vous est pas encore parvenu."
    it: "La piattaforma madre non è più nel quadro tattico: è andata perduta o il suo stato non ti è ancora arrivato."
    ja: "母機はもはや戦術画面上に存在しない。喪失したか、その状態がまだ届いていない。"
    ko: "모 플랫폼이 더는 전술 상황도에 없습니다. 상실되었거나 그 상태가 아직 전달되지 않았습니다."
    "pt-BR": "A plataforma-mãe não está mais no quadro tático: foi perdida ou seu estado ainda não chegou até você."
    ru: "Носитель больше не отображается в тактической картине: он потерян либо его состояние ещё не дошло до вас."
    zh: "母平台已不在战术态势中：它已损失，或其状态尚未同步到你这里。"
    "zh-TW": "母平台已不在戰術態勢中：它已損失，或其狀態尚未同步到你這裡。"
  stowed_item_line_tooltip:
    de: "Was dieses Objekt tut und wo es sich befindet: sein Bereitschafts- oder Wartungsschritt, dann die Anlage oder Plattform, die es hält."
    en: "What this item is doing and where it sits: its readiness or servicing step, then the facility or platform holding it."
    es: "Qué hace este elemento y dónde está: su estado de alistamiento o paso de mantenimiento, y después la instalación o plataforma que lo aloja."
    fr: "Ce que fait cet élément et où il se trouve : son état de disponibilité ou son étape d'entretien, puis l'installation ou la plateforme qui l'abrite."
    it: "Che cosa fa questo elemento e dove si trova: il suo stato di prontezza o la fase di servizio, poi l'impianto o la piattaforma che lo ospita."
    ja: "この品目の状態と所在。準備状況または整備段階に続き、それを収容している設備またはプラットフォームを示す。"
    ko: "이 항목이 무엇을 하고 있으며 어디에 있는지: 준비 상태 또는 정비 단계, 그리고 이를 수용한 설비나 플랫폼입니다."
    "pt-BR": "O que este item está fazendo e onde está: seu estado de prontidão ou etapa de manutenção e, em seguida, a instalação ou plataforma que o abriga."
    ru: "Что делает этот объект и где он находится: степень готовности или этап обслуживания, затем удерживающий его пост или платформа."
    zh: "该项目的状态与所在位置：先是其准备状态或勤务阶段，然后是容纳它的设施或平台。"
    "zh-TW": "該項目的狀態與所在位置：先是其準備狀態或勤務階段，然後是容納它的設施或平台。"
  transfer_progress_tooltip:
    de: "Wie weit dieser Transfer fortgeschritten ist; bei 100 % erreicht das Objekt die daneben genannte Plattform."
    en: "How far this transfer has run; the item reaches the platform named beside it at 100%."
    es: "Cuánto ha avanzado esta transferencia; al 100 % el elemento llega a la plataforma indicada al lado."
    fr: "L'avancement de ce transfert ; à 100 %, l'élément atteint la plateforme nommée à côté."
    it: "A che punto è questo trasferimento; al 100% l'elemento raggiunge la piattaforma indicata accanto."
    ja: "この移送の進捗。100% で隣に示されたプラットフォームに到達する。"
    ko: "이 이송의 진행률입니다. 100%가 되면 옆에 표시된 플랫폼에 도착합니다."
    "pt-BR": "O quanto esta transferência avançou; a 100% o item chega à plataforma indicada ao lado."
    ru: "Насколько продвинулась эта передача; при 100 % объект достигает указанной рядом платформы."
    zh: "本次转运的进度；达到 100% 时，该项目抵达旁侧标注的平台。"
    "zh-TW": "本次轉運的進度；達到 100% 時，該項目抵達旁側標註的平台。"
  manifest_name_tooltip:
    de: "Eine Munition, die das Manifest dieser Plattform erwartet, die aber nirgends in Ihrem Bestand vorhanden ist. Es gibt kein Fahrzeug zum Verknüpfen; Abbrechen entfernt sie aus dem Manifest."
    en: "A round this platform's manifest expects that exists nowhere in your inventory. There is no vehicle to link to; cancelling drops it from the manifest."
    es: "Una munición que el manifiesto de esta plataforma espera pero que no existe en ningún lugar de tu inventario. No hay vehículo al que enlazar; cancelarla la retira del manifiesto."
    fr: "Une munition attendue par le manifeste de cette plateforme mais introuvable dans votre inventaire. Aucun véhicule à lier ; l'annuler la retire du manifeste."
    it: "Una munizione prevista dal manifesto di questa piattaforma ma non presente da nessuna parte nel tuo inventario. Non c'è alcun veicolo da collegare; annullarla la toglie dal manifesto."
    ja: "このプラットフォームの積載計画が要求しているが、在庫のどこにも存在しない弾薬。リンクする機体はなく、取り消せば計画から外れる。"
    ko: "이 플랫폼의 적재 계획이 요구하지만 보유 재고 어디에도 없는 탄약입니다. 연결할 기체가 없으며, 취소하면 계획에서 제외됩니다."
    "pt-BR": "Uma munição que o manifesto desta plataforma prevê, mas que não existe em lugar algum do seu inventário. Não há veículo a vincular; cancelá-la a remove do manifesto."
    ru: "Боеприпас, предусмотренный ведомостью этой платформы, но отсутствующий во всех ваших запасах. Связывать не с чем; отмена убирает его из ведомости."
    zh: "该平台的载荷清单要求、但你的库存中任何地方都没有的弹药。没有可链接的载具；取消即可将其从清单中移除。"
    "zh-TW": "該平台的載荷清單要求、但你的庫存中任何地方都沒有的彈藥。沒有可連結的載具；取消即可將其從清單中移除。"
  stowed_select_tooltip:
    de: "Dieses Objekt auswählen, damit ein Rechtsklick-Befehl in der Welt für es gilt. Ausgewählte verstaute Drohnen starten gemeinsam auf diesen Befehl und bilden bei mehr als einer eine Gruppe."
    en: "Pick this item so a right-click order in the world applies to it. Picked stowed drones launch together onto that order, forming a group when there is more than one."
    es: "Marca este elemento para que una orden con clic derecho en el mundo se le aplique. Los drones estibados marcados se lanzan juntos con esa orden y forman un grupo si hay más de uno."
    fr: "Cochez cet élément pour qu'un ordre par clic droit dans le monde s'y applique. Les drones arrimés cochés décollent ensemble sur cet ordre et forment un groupe s'ils sont plusieurs."
    it: "Seleziona questo elemento perché un ordine col tasto destro nel mondo si applichi a esso. I droni stivati selezionati decollano insieme su quell'ordine, formando un gruppo se sono più di uno."
    ja: "この品目を選択すると、ワールド上の右クリック命令が適用される。選択した搭載中のドローンはその命令に従って一斉に発進し、複数なら編隊を組む。"
    ko: "이 항목을 선택하면 월드에서의 우클릭 명령이 여기에 적용됩니다. 선택된 탑재 드론들은 그 명령으로 함께 발진하며, 둘 이상이면 편대를 이룹니다."
    "pt-BR": "Marque este item para que uma ordem com clique direito no mundo se aplique a ele. Drones estivados marcados decolam juntos com essa ordem, formando um grupo quando há mais de um."
    ru: "Отметьте этот объект, чтобы приказ правым щелчком в мире применялся к нему. Отмеченные размещённые дроны стартуют вместе по этому приказу и образуют группу, если их больше одного."
    zh: "勾选该项目，世界中的右键命令即会作用于它。被勾选的舱内无人机将一同按该命令发射，数量多于一架时自动编组。"
    "zh-TW": "勾選該項目，世界中的右鍵命令即會作用於它。被勾選的艙內無人機將一同按該命令發射，數量多於一架時自動編組。"
  jump_camera_tooltip:
    de: "Klicken, um die Karte auf diese Koordinaten zu zentrieren."
    en: "Click to centre the map on these coordinates."
    es: "Haz clic para centrar el mapa en estas coordenadas."
    fr: "Cliquez pour centrer la carte sur ces coordonnées."
    it: "Fai clic per centrare la mappa su queste coordinate."
    ja: "クリックすると地図をこの座標に合わせる。"
    ko: "클릭하면 지도를 이 좌표로 이동합니다."
    "pt-BR": "Clique para centralizar o mapa nestas coordenadas."
    ru: "Щёлкните, чтобы отцентрировать карту на этих координатах."
    zh: "点击可将地图居中到该坐标。"
    "zh-TW": "點擊可將地圖置中到該座標。"
  tasking_error_tooltip:
    de: "Der Auftrag endete mit einem Fehler: Die Einheit fliegt keinen Auftrag mehr und unternimmt nichts von sich aus, nicht einmal zur Selbstverteidigung. Erteilen Sie ihr einen neuen Befehl."
    en: "Its tasking ended in failure: the unit now flies no mission and takes no action of its own, not even to defend itself. Give it a new order."
    es: "Su asignación terminó en error: la unidad ya no vuela ninguna misión ni actúa por su cuenta, ni siquiera para defenderse. Dale una orden nueva."
    fr: "Sa mission s'est soldée par un échec : l'unité ne vole plus aucune mission et n'agit plus d'elle-même, pas même pour se défendre. Donnez-lui un nouvel ordre."
    it: "L'incarico si è concluso con un errore: l'unità non vola più alcuna missione e non agisce di propria iniziativa, nemmeno per difendersi. Dalle un nuovo ordine."
    ja: "任務は失敗に終わった。この機体はもはや任務を飛ばず、自衛すら含めて自ら行動しない。新たな命令を与えること。"
    ko: "임무가 실패로 끝났습니다. 이 유닛은 더 이상 임무를 수행하지 않으며, 자기 방어조차 스스로 하지 않습니다. 새 명령을 내리십시오."
    "pt-BR": "Sua atribuição terminou em falha: a unidade não voa mais nenhuma missão nem age por conta própria, nem mesmo para se defender. Dê-lhe uma nova ordem."
    ru: "Задача завершилась ошибкой: юнит больше не выполняет задание и не действует по своей инициативе, даже ради самозащиты. Отдайте ему новый приказ."
    zh: "其任务以失败告终：该单位不再执行任何任务，也不会自行行动，连自卫都不会。请重新下达命令。"
    "zh-TW": "其任務以失敗告終：該單位不再執行任何任務，也不會自行行動，連自衛都不會。請重新下達命令。"
  design_subtitle_tooltip:
    de: "Der Drohnenentwurf, nach dem dieses Fahrzeug gebaut wurde; Rumpf und verbaute Komponenten stammen aus diesem Entwurf."
    en: "The drone design this vehicle was built to; its chassis and fitted components come from that design."
    es: "El diseño de dron con el que se construyó este vehículo; su chasis y sus componentes provienen de ese diseño."
    fr: "Le modèle de drone selon lequel ce véhicule a été construit ; son châssis et ses composants proviennent de ce modèle."
    it: "Il progetto di drone su cui è stato costruito questo veicolo; telaio e componenti installati provengono da quel progetto."
    ja: "この機体が製造された元のドローン設計。シャーシと搭載コンポーネントはこの設計に由来する。"
    ko: "이 기체가 제작된 드론 설계입니다. 섀시와 장착 부품이 이 설계에서 나옵니다."
    "pt-BR": "O projeto de drone segundo o qual este veículo foi construído; seu chassi e componentes vêm desse projeto."
    ru: "Проект дрона, по которому построена эта машина; корпус и установленные компоненты взяты из него."
    zh: "该载具据以建造的无人机设计；其底盘与所装组件均源自该设计。"
    "zh-TW": "該載具據以建造的無人機設計；其底盤與所裝組件均源自該設計。"
