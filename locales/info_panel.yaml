    # Facility cell cap (#3017): checked BEFORE the weight branch below — a full
    # magazine blocks LOAD even with weight headroom to spare. %{facility} is
    # the launcher tag (already caps via `FacilityUi::facility_tag`, e.g. "VLS");
    # %{used}/%{capacity} are bare cell counts, not weight measures. Sentence-
    # case prose, colon gloss (#1787). Applies to any platform (carrier or
    # stowed drone), not just carriers.
    load_facility_full:
      de: "%{facility} voll: %{used}/%{capacity} Zellen belegt."
      en: "%{facility} full: %{used}/%{capacity} cells used."
