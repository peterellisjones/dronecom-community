    emcon:
      label:
        de: Emissionen
        en: EMCON
        es: Emisiones
        fr: Émissions
        it: Emissioni
        ja: 放射管理
        ko: 방출
        "pt-BR": Emissões
        ru: Излучение
        zh: 辐射管制
        "zh-TW": 輻射管制
      # Value labels (active=Radiate / passive=Silent) are the canonical
      # `doctrine.emcon.*` keys (display.yaml), shared with the designer (#1935).
      # #3256 advertised the keybinding in this prose, interpolating %{binding}.
      # #4217 moved it into the tooltip's keycap footer, which reads the live
      # binding at render time — so the locale string is back to the plain
      # glossary meaning and a rebind no longer has to pass through YAML. The
      # meaning is repeated here rather than referenced so the row has one
      # tooltip, not two stacked ones.
      label_tooltip:
        de: "Emissionskontrolle: ob Sensoren strahlen (aktiv) oder still bleiben (passiv)"
        en: "Emission control: whether sensors radiate (active) or stay silent (passive)"
        es: "Control de emisiones: si los sensores radian (activo) o permanecen en silencio (pasivo)"
        fr: "Contrôle des émissions : si les capteurs émettent (actif) ou restent silencieux (passif)"
        it: "Controllo delle emissioni: se i sensori irradiano (attivo) o restano silenti (passivo)"
        ja: "センサーが放射するか（能動）静かに保つか（受動）"
        ko: "센서가 방사하는지(능동) 침묵을 유지하는지(수동)"
        "pt-BR": "Controle de emissões: se os sensores irradiam (ativo) ou permanecem em silêncio (passivo)"
        ru: "Контроль излучения: излучают ли датчики (активный) или хранят молчание (пассивный)"
        zh: "传感器是辐射（主动）还是保持静默（被动）"
        "zh-TW": "感測器是輻射（主動）還是保持靜默（被動）"
      silent_locked_tooltip:
        de: "Dieses Fahrzeug hat keine aktiven Sensoren: immer lautlos"
        en: "This vehicle has no active sensors: always silent"
        es: "Este vehículo no tiene sensores activos: siempre en silencio"
        fr: "Ce véhicule n'a aucun capteur actif : toujours silencieux"
        it: "Questo veicolo non ha sensori attivi: sempre in silenzio"
        ja: "この機体にはアクティブセンサーがありません：常に静粛"
        ko: "이 기체에는 능동 센서가 없습니다：항상 침묵"
        "pt-BR": "Este veículo não tem sensores ativos: sempre em silêncio"
        ru: "У этой единицы нет активных датчиков: всегда в тишине"
        zh: "此载具没有主动传感器：始终静默"
        "zh-TW": "此載具沒有主動感測器：始終靜默"
    # #2817: read-only reaction readout in the shared doctrine editor (replaces the
    # removed ENGAGE WITHIN / BREAK OFF AT sliders). A launcher's reaction envelope
    # is weapon-derived (the standoff-fire cap, ADR-0013); a warhead's is the fixed
    # committal zone. `label` is the row label; `standoff`/`committal` is the
    # per-envelope value; `tooltip` explains the derivation.
    # #3192 Task 5: the Evade "Evade within" / "Resume beyond" sliders and
    # `DoctrineCommand::SetSafetyRange` are removed — the flee/resume band is
    # now the unit's own physics-derived `Vehicle::safety_band` (#3098), not
    # stored doctrine intent. A single read-only line replaces both sliders,
    # mirroring the `reaction.*` readout above. Sentence-case prose (this is
    # guidance explaining why the row is no longer editable, not a tactical
    # data value) — there is no per-unit numeric wire field yet to show a
    # real distance.
    auto_rtb_override:
      label:
        de: "Auto-RTB abgebrochen"
        en: "Auto-RTB cancelled"
        es: "RTB automático cancelado"
        fr: "RTB auto annulé"
        it: "RTB automatico annullato"
        ja: "自動帰還の取消"
        ko: "자동 귀환 취소"
        "pt-BR": "RTB automático cancelado"
        ru: "Автовозврат отменён"
        zh: "自动返航已取消"
        "zh-TW": "自動返航已取消"
      label_tooltip:
        de: "Automatische Rückkehr-Auslöser, die du für diese Einheit durch einen neuen Auftrag abgebrochen hast. Die übrigen Auslöser gelten weiter; ein abgebrochener wird wieder scharf, sobald seine Ursache behoben ist."
        en: "Automatic return-to-base triggers you have cancelled for this unit by giving it another mission. The remaining triggers still apply, and a cancelled one re-arms once its cause clears."
        es: "Disparadores de regreso automático que has cancelado para esta unidad al asignarle otra misión. Los demás siguen vigentes, y uno cancelado se rearma cuando su causa se resuelve."
        fr: "Déclencheurs de retour automatique que vous avez annulés pour cette unité en lui donnant une autre mission. Les autres restent actifs, et un déclencheur annulé se réarme dès que sa cause disparaît."
        it: "Attivatori di rientro automatico che hai annullato per questa unità assegnandole un'altra missione. Gli altri restano attivi e uno annullato si riarma quando la sua causa si risolve."
        ja: "別の任務を与えて取り消した自動帰還の条件。残りの条件は有効のままで、取り消した条件も原因が解消すれば再び有効になる。"
        ko: "다른 임무를 부여해 취소한 자동 귀환 조건. 나머지 조건은 그대로 적용되며, 취소된 조건도 원인이 해소되면 다시 활성화된다."
        "pt-BR": "Gatilhos de retorno automático que você cancelou para esta unidade ao dar-lhe outra missão. Os demais continuam valendo, e um cancelado se rearma assim que sua causa se resolve."
        ru: "Условия автоматического возврата, отменённые вами для этого юнита новым приказом. Остальные условия продолжают действовать, а отменённое снова включается, как только его причина устранена."
        zh: "你通过下达新任务为该单位取消的自动返航条件。其余条件仍然有效，已取消的条件在其原因解除后会重新生效。"
        "zh-TW": "你透過下達新任務為該單位取消的自動返航條件。其餘條件仍然有效，已取消的條件在其原因解除後會重新生效。"
      value_tooltip:
        de: "Diese Einheit kehrt wegen dieser Bedingungen nicht zur Basis zurück, bis jede behoben ist — Betanken, Bewaffnen oder Instandsetzen."
        en: "This unit will not return to base for these conditions until each one clears — refuelling, rearming, or being serviced."
        es: "Esta unidad no regresará a la base por estas condiciones hasta que cada una se resuelva: repostar, rearmar o ser reparada."
        fr: "Cette unité ne rentrera pas à la base pour ces conditions tant que chacune n'aura pas disparu — ravitaillement, réarmement ou remise en état."
        it: "Questa unità non rientrerà alla base per queste condizioni finché ciascuna non si risolve: rifornimento, riarmo o manutenzione."
        ja: "これらの条件では、給油・再武装・整備によって解消されるまで帰投しない。"
        ko: "이 조건들로는 급유·재무장·정비로 해소될 때까지 기지로 돌아가지 않는다."
        "pt-BR": "Esta unidade não retornará à base por estas condições até que cada uma se resolva — reabastecimento, rearme ou manutenção."
        ru: "По этим условиям юнит не вернётся на базу, пока каждое из них не будет устранено — дозаправка, перевооружение или ремонт."
        zh: "在这些条件下，该单位不会返航，直至各条件分别通过加油、再武装或维修解除。"
        "zh-TW": "在這些條件下，該單位不會返航，直至各條件分別透過加油、再武裝或維修解除。"
