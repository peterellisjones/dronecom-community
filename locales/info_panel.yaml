        ko: "레이더로 관측된 크기 — 유력한 플랫폼 후보에 대한 증거로 가중됩니다. 크기가 다른 선체가 병합된 항적은 관측된 범위를 표시합니다."
        "pt-BR": "Tamanho observado pelo radar, ponderado como evidência para a plataforma mais provável. Um contato fundido com cascos de tamanhos diferentes mostra a faixa observada."
