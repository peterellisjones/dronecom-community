        ja: "これまでに収集されたセンサー証拠から識別された、最も可能性の高い具体的なプラットフォームと、その確信度。"
        ko: "지금까지 수집된 센서 증거로 식별된 가장 유력한 구체적 플랫폼과 그 신뢰도."
        "pt-BR": "A plataforma específica mais provável identificada a partir das evidências de sensor coletadas até agora, com o nível de confiança."
        ru: "Наиболее вероятная конкретная платформа, установленная по накопленным данным датчиков, с уровнем достоверности."
        zh: "根据目前收集到的传感器证据识别出的最可能具体平台，及其置信度。"
