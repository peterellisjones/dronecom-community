    fr: "Décolle dès que le pont est libre, même si le ravitaillement ou le réarmement est incomplet. La maintenance se poursuit pendant l'attente."
    it: "Decolla non appena il ponte è libero, anche se il rifornimento o il riarmo non sono completi. La manutenzione prosegue durante l'attesa."
    ja: "給油や再武装が未完了でも、甲板が空き次第発進します。待機中も整備は継続します。"
    ko: "급유나 재무장이 끝나지 않았어도 갑판이 비는 즉시 발진합니다. 대기 중에도 정비는 계속됩니다."
    "pt-BR": "Decola assim que o convés fica livre, mesmo que o reabastecimento ou o rearmamento estejam incompletos. A manutenção continua durante a espera."
    ru: "Взлетает, как только палуба освобождается, даже если дозаправка или довооружение не завершены. Обслуживание продолжается во время ожидания."
    zh: "甲板一旦空出即起飞，即使加油或武装尚未完成。等待期间维护继续进行。"
    "zh-TW": "甲板一旦空出即起飛，即使加油或武裝尚未完成。等待期間維護持續進行。"
  scramble_disabled_ready:
