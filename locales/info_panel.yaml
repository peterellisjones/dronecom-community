    # The station tag on an active-transfer row (#3442): glossary tooltip for
    # the crew model — each station is an independent crew, one transfer at a
    # time (#3024), so a round at a different station is never held up by this
    # one.
    station_tooltip:
      de: "Die Decksmannschaft, die diesen Transfer ausführt. Jede Station bearbeitet jeweils einen Transfer; eine Runde an einer anderen Station wartet nicht auf diese."
      en: "The deck crew running this transfer. Each station works one transfer at a time, so a round at a different station is not waiting on this one."
      es: "La dotación de cubierta que realiza este traslado. Cada estación gestiona un traslado a la vez, así que una ronda en otra estación no espera a esta."
      fr: "L'équipage de pont qui effectue ce transfert. Chaque station traite un transfert à la fois, donc une munition à une autre station n'attend pas celle-ci."
      it: "La squadra di coperta che esegue questo trasferimento. Ogni stazione gestisce un trasferimento alla volta, quindi un colpo a un'altra stazione non attende questo."
      ja: "この移送を担当する甲板班。各ステーションは一度に1件の移送しか扱わないため、別のステーションの弾はこれを待たない。"
      ko: "이 이송을 담당하는 갑판 요원. 각 스테이션은 한 번에 하나의 이송만 처리하므로, 다른 스테이션의 탄은 이 이송을 기다리지 않는다."
      "pt-BR": "A equipe de convés que executa esta transferência. Cada estação processa uma transferência por vez, então um projétil em outra estação não espera por esta."
      ru: "Палубная команда, выполняющая этот трансфер. Каждая станция обрабатывает один трансфер за раз, поэтому снаряд на другой станции не ждёт этот."
      zh: "负责此次转运的甲板班组。每个站位一次只处理一次转运，因此另一个站位的弹药不会等待这次转运。"
      "zh-TW": "負責此次轉運的甲板班組。每個站位一次只處理一次轉運，因此另一個站位的彈藥不會等待這次轉運。"
    # #3326 ↓ on a HANGARED DRONE row: warehouse the airframe into the carrier's
    # stores. Distinct from `return_to_stores` (a munition round) because the
    # move is a slow deck evolution and it frees hangar space rather than
    # ammunition.
    strike_down_tooltip:
      de: "Diese Drohne ins Lager abrüsten und Hangarplatz freigeben. Ein langsames Decksmanöver, das den Flugdeck-Umschlag für seine Dauer belegt."
      en: "Strike this drone down into stores, freeing hangar space. A slow deck evolution that ties up the flight deck's transfer crew while it runs."
      es: "Bajar este dron al pañol, liberando espacio en el hangar. Una maniobra de cubierta lenta que ocupa la dotación de transferencia mientras dura."
      fr: "Descendre ce drone en soute pour libérer de la place au hangar. Une manœuvre de pont lente qui monopolise l'équipe de transfert pendant toute sa durée."
      it: "Ricovera questo drone nel deposito, liberando spazio nell'hangar. Una manovra di coperta lenta che impegna la squadra di trasferimento per tutta la durata."
      ja: "このドローンを在庫に降ろし、格納庫の空きを作る。時間のかかる甲板作業で、その間は飛行甲板の移送班を占有する。"
      ko: "이 드론을 저장고로 내려 격납고 공간을 확보한다. 진행 중에는 비행갑판 이송 요원을 점유하는 느린 갑판 작업이다."
      "pt-BR": "Recolher este drone ao paiol, liberando espaço no hangar. Uma manobra de convés lenta que ocupa a equipe de transferência enquanto dura."
      ru: "Убрать этот дрон на склад, освободив место в ангаре. Медленная палубная операция, занимающая расчёт перегрузки на всё её время."
      zh: "将此无人机收入库存，腾出机库空间。这是一项缓慢的甲板作业，期间会占用飞行甲板的转运班组。"
      "zh-TW": "將此無人機收入庫存，騰出機庫空間。這是一項緩慢的甲板作業，期間會占用飛行甲板的轉運班組。"
    # #3326 LOAD tooltip on a WAREHOUSED DRONE row in a carrier's STORES: the
    # reverse move. Replaces `load_to_facility_tooltip`, which speaks of
    # promoting a round into a launcher.
    bring_up_tooltip:
      de: "Diese Drohne aus dem Lager in den Hangar holen, wo sie startklar gemacht werden kann. Ein langsames Decksmanöver, das den Flugdeck-Umschlag für seine Dauer belegt."
      en: "Bring this drone up from stores into the hangar, where it can be readied for launch. A slow deck evolution that ties up the flight deck's transfer crew while it runs."
      es: "Subir este dron del pañol al hangar, donde puede prepararse para el lanzamiento. Una maniobra de cubierta lenta que ocupa la dotación de transferencia mientras dura."
      fr: "Remonter ce drone de la soute au hangar, où il pourra être préparé au lancement. Une manœuvre de pont lente qui monopolise l'équipe de transfert pendant toute sa durée."
      it: "Porta questo drone dal deposito all'hangar, dove può essere preparato al lancio. Una manovra di coperta lenta che impegna la squadra di trasferimento per tutta la durata."
      ja: "このドローンを在庫から格納庫へ上げ、発艦準備ができる状態にする。時間のかかる甲板作業で、その間は飛行甲板の移送班を占有する。"
      ko: "이 드론을 저장고에서 격납고로 올려 발진 준비가 가능한 상태로 만든다. 진행 중에는 비행갑판 이송 요원을 점유하는 느린 갑판 작업이다."
      "pt-BR": "Subir este drone do paiol para o hangar, onde pode ser preparado para o lançamento. Uma manobra de convés lenta que ocupa a equipe de transferência enquanto dura."
      ru: "Поднять этот дрон со склада в ангар, где его можно подготовить к вылету. Медленная палубная операция, занимающая расчёт перегрузки на всё её время."
      zh: "将此无人机从库存提升到机库，以便准备起飞。这是一项缓慢的甲板作业，期间会占用飞行甲板的转运班组。"
      "zh-TW": "將此無人機從庫存提升到機庫，以便準備起飛。這是一項緩慢的甲板作業，期間會佔用飛行甲板的轉運班組。"
    return_to_stores:
