      it: "Restituisci il colpo al deposito. I colpi liberati servono al riarmo automatico dei droni."
      ja: "弾を在庫に戻す。空いた弾はドローンの自動再武装に使われる。"
      ko: "탄을 저장고로 반환. 반환된 탄은 드론 자동 재무장에 사용된다."
      "pt-BR": "Devolver projétil ao paiol. Os projéteis liberados são usados no rearmamento automático de drones."
      ru: "Вернуть снаряд на склад. Освобождённые снаряды идут на автоматическое перевооружение дронов."
