    bearing_only_tooltip:
      de: "Reine Peilspur: Ein passiver Sensor liefert die Richtung, aber nicht die Entfernung, daher gibt es keine darstellbare Position."
      en: "Bearing-only track: a passive sensor gives its direction but not its range, so it has no plottable position."
      es: "Traza solo de marcación: un sensor pasivo da su dirección pero no su distancia, así que no hay posición representable."
      fr: "Piste au relèvement seul : un capteur passif en donne la direction mais pas la distance, il n'y a donc pas de position traçable."
      it: "Traccia di solo rilevamento: un sensore passivo ne dà la direzione ma non la distanza, quindi non esiste una posizione tracciabile."
      ja: "方位のみのトラック。受動センサーは方向を得るが距離は得られないため、標定可能な位置はない。"
      ko: "방위 전용 항적입니다. 수동 센서는 방향만 알 뿐 거리를 얻지 못하므로 표시할 위치가 없습니다."
      "pt-BR": "Trilha somente por marcação: um sensor passivo fornece a direção, mas não a distância, portanto não há posição a plotar."
      ru: "След только по пеленгу: пассивный датчик даёт направление, но не дальность, поэтому наносимой позиции нет."
      zh: "纯方位航迹：被动传感器只能得到方向而无法测距，因此没有可标绘的位置。"
      "zh-TW": "純方位航跡：被動感測器只能得到方向而無法測距，因此沒有可標繪的位置。"
    range_tooltip:
      de: "Entfernung von dieser Einheit zum Kontakt. Eine reine Peilspur hat keine messbare Entfernung und zeigt --."
      en: "Range from this unit to the contact. A bearing-only track has no range to measure and reads --."
      es: "Distancia desde esta unidad hasta el contacto. Una traza solo de marcación no tiene distancia que medir y muestra --."
      fr: "Distance de cette unité au contact. Une piste au relèvement seul n'a pas de distance mesurable et affiche --."
      it: "Distanza da questa unità al contatto. Una traccia di solo rilevamento non ha distanza da misurare e mostra --."
      ja: "この機体から接触目標までの距離。方位のみのトラックは測るべき距離がなく -- と表示される。"
      ko: "이 유닛에서 접촉까지의 거리입니다. 방위 전용 항적은 측정할 거리가 없어 --로 표시됩니다."
      "pt-BR": "Distância desta unidade até o contato. Uma trilha somente por marcação não tem distância a medir e exibe --."
      ru: "Дальность от этого юнита до контакта. У следа только по пеленгу нет измеряемой дальности, и он показывает --."
      zh: "本单位到该接触目标的距离。纯方位航迹无距离可测，显示为 --。"
      "zh-TW": "本單位到該接觸目標的距離。純方位航跡無距離可測，顯示為 --。"
    stale_subtitle_tooltip:
      de: "Gemeldete Zugehörigkeit und Klasse einer nicht mehr gehaltenen Spur. Ihre Position wird weiterhin vom letzten Fix aus koppelnavigiert und entfernt sich mit dem Alter immer weiter von der Wirklichkeit."
      en: "Reported affiliation and class of a track no longer held. Its position keeps being dead-reckoned from the last fix, so it drifts further from the truth as it ages."
      es: "Afiliación y clase informadas de una traza que ya no se mantiene. Su posición se sigue estimando por navegación a estima desde la última fijación, así que se aleja de la realidad conforme envejece."
      fr: "Appartenance et classe rapportées d'une piste qui n'est plus tenue. Sa position continue d'être extrapolée à l'estime depuis le dernier point, et s'écarte donc de la réalité en vieillissant."
      it: "Affiliazione e classe riportate di una traccia non più mantenuta. La sua posizione continua a essere estrapolata dall'ultimo punto nave, allontanandosi dal vero man mano che invecchia."
      ja: "すでに保持していないトラックの報告所属とクラス。位置は最後の測位から推測航法で進め続けられるため、時間が経つほど実際からずれていく。"
      ko: "더 이상 유지되지 않는 항적의 보고된 소속과 등급입니다. 위치는 마지막 측정값에서 추측 항법으로 계속 진행되므로, 시간이 지날수록 실제와 벌어집니다."
      "pt-BR": "Afiliação e classe informadas de uma trilha que já não é mantida. Sua posição continua sendo estimada por navegação estimada a partir da última fixação, afastando-se da realidade conforme envelhece."
      ru: "Заявленная принадлежность и класс следа, который больше не удерживается. Его позиция по-прежнему счисляется от последней обсервации, поэтому с возрастом всё сильнее расходится с истиной."
      zh: "已不再保持的航迹所报告的归属与类别。其位置仍从最后一次定位起以航位推算推进，因此随时间推移会越来越偏离实际。"
      "zh-TW": "已不再保持的航跡所報告的歸屬與類別。其位置仍從最後一次定位起以航位推算推進，因此隨時間推移會越來越偏離實際。"
