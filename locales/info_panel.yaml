      "ru": "Применяет боекомплект, возвращается на %{carrier}, довооружается и остаётся у причала. Доступные запасы могут измениться до прибытия. Боеприпасы не закупаются автоматически."
      "zh": "应用装载配置，返航至%{carrier}，完成再武装后保持在港状态。可用库存可能在抵达前发生变化。弹药不会自动购买。"
