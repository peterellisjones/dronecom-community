    also_lost:
      de: Mit Plattform verloren
      en: Lost with platform
      es: Perdidas con la plataforma
      fr: Perdues avec la plateforme
      it: Perse con la piattaforma
      ja: 機体と共に喪失
      ko: 기체와 함께 손실
      "pt-BR": Perdidas com a plataforma
      ru: Потеряны с платформой
      zh: 随平台损失
      "zh-TW": 隨平台損失
    also_lost_tooltip:
      de: "Weitere Einheiten (z. B. gestaute Drohnen), die mit dieser Plattform verloren gingen, statt sich überlappende Symbole auf einem Punkt zu stapeln."
      en: "Other units (e.g. stowed drones) that went down with this platform, rather than stacking overlapping symbols on one point."
      es: "Otras unidades (p. ej., drones estibados) que se perdieron junto con esta plataforma, en lugar de apilar símbolos superpuestos en un punto."
      fr: "Autres unités (p. ex. drones arrimés) perdues avec cette plateforme, plutôt que d'empiler des symboles superposés sur un même point."
      it: "Altre unità (ad es. droni stivati) perse insieme a questa piattaforma, invece di sovrapporre simboli nello stesso punto."
      ja: "このプラットフォームと共に失われた他のユニット（格納中のドローンなど）。1点に記号を重ねて表示する代わりにここに示す。"
      ko: "이 플랫폼과 함께 손실된 다른 유닛(격납된 드론 등) — 한 지점에 기호를 겹쳐 쌓는 대신 여기에 표시됩니다."
      "pt-BR": "Outras unidades (por exemplo, drones estivados) perdidas junto com esta plataforma, em vez de empilhar símbolos sobrepostos em um ponto."
      ru: "Другие единицы (например, убранные дроны), потерянные вместе с этой платформой, вместо наложения перекрывающихся символов в одной точке."
      zh: "随该平台一同损失的其他单位（例如已收纳的无人机），而非在同一点堆叠重叠的符号。"
      "zh-TW": "隨該平台一同損失的其他單位（例如已收納的無人機），而非在同一點堆疊重疊的符號。"
    subtitle_tooltip:
      de: "Entwurf und Klasse der verlorenen Einheit, soweit sie je identifiziert wurde. Eine nie beobachtete Einheit zeigt nur ihre Klasse."
      en: "Design and class of the lost unit, as far as it was ever identified. A unit never observed shows only its class."
      es: "Diseño y clase de la unidad perdida, hasta donde llegó a identificarse. Una unidad nunca observada muestra solo su clase."
      fr: "Modèle et classe de l'unité perdue, dans la mesure où elle a été identifiée. Une unité jamais observée n'affiche que sa classe."
      it: "Progetto e classe dell'unità perduta, per quanto sia stata identificata. Un'unità mai osservata mostra solo la classe."
      ja: "喪失した機体の設計とクラス（判明していた範囲）。一度も観測されていない機体はクラスのみを示す。"
      ko: "상실한 유닛의 설계와 등급으로, 식별된 범위까지만 표시됩니다. 한 번도 관측되지 않은 유닛은 등급만 나옵니다."
      "pt-BR": "Projeto e classe da unidade perdida, até onde chegou a ser identificada. Uma unidade nunca observada mostra apenas sua classe."
      ru: "Проект и класс потерянного юнита — в той мере, в какой он был опознан. Никогда не наблюдавшийся юнит показывает только класс."
      zh: "已损失单位的设计与类别，仅限曾经识别出的部分。从未被观测到的单位只显示其类别。"
      "zh-TW": "已損失單位的設計與類別，僅限曾經識別出的部分。從未被觀測到的單位只顯示其類別。"
