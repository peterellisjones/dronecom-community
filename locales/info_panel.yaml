      fr: "Éteint : n'émet ni ne détecte. Seuls les capteurs actifs peuvent être éteints."
      it: "Spento: non emette né rileva. Solo i sensori attivi possono essere spenti."
      ja: "オフ：放射も探知も行いません。オフにできるのは能動センサーのみです。"
