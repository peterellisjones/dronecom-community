    fr: "ALERTE"
    it: "ALLARME"
    ja: "緊急発進"
    ko: "긴급발진"
    "pt-BR": "ALERTA"
    ru: "ТРЕВОГА"
    zh: "紧急起飞"
    "zh-TW": "緊急起飛"
  scramble_tooltip:
    de: "Notstart. Die Wartung läuft weiter, während der Start wartet; die Drohne startet, sobald nichts anderes mehr die Startbahn belegt — in dem Betankungs- und Bewaffnungszustand, den sie bis dahin erreicht hat. Nicht vollständig bewaffnet zu starten ist der Preis dafür."
    en: "Emergency launch. Servicing continues while the launch waits; the drone goes the moment nothing else is holding its deck, in whatever fuelled and armed state it has reached by then. Launching partly armed is the price."
    es: "Lanzamiento de emergencia. El mantenimiento continúa mientras el lanzamiento espera; el dron sale en cuanto nada más ocupe su cubierta, con el combustible y el armamento que haya alcanzado. El precio es despegar parcialmente armado."
    fr: "Lancement d'urgence. La maintenance se poursuit pendant l'attente ; le drone part dès que plus rien n'occupe son pont, dans l'état de carburant et d'armement atteint à ce moment. Décoller partiellement armé en est le prix."
    it: "Lancio d'emergenza. La manutenzione prosegue mentre il lancio attende; il drone parte non appena nulla occupa più il suo ponte, con il carburante e l'armamento raggiunti fino a quel momento. Il prezzo è decollare parzialmente armato."
    ja: "緊急発進。待機中も整備は継続し、甲板が空いた瞬間に、その時点の燃料・武装状態のまま発進します。武装が不完全なまま出ることが代償です。"
    ko: "긴급발진. 대기하는 동안에도 정비는 계속되며, 갑판이 비는 즉시 그 시점의 연료·무장 상태 그대로 발진합니다. 무장이 불완전한 채 출격하는 것이 대가입니다."
    "pt-BR": "Lançamento de emergência. A manutenção continua enquanto o lançamento aguarda; o drone parte assim que nada mais ocupar seu convés, no estado de combustível e armamento alcançado até então. O preço é decolar parcialmente armado."
    ru: "Экстренный взлёт. Обслуживание продолжается, пока запуск ждёт; дрон уходит, как только палубу ничто не занимает, — с тем запасом топлива и вооружения, что успел набрать. Цена — взлёт с неполным вооружением."
    zh: "紧急起飞。等待期间维护继续进行；一旦甲板无人占用即刻起飞，以届时已达到的燃油与武装状态出击。代价是武装不全就上天。"
    "zh-TW": "緊急起飛。等待期間維護持續進行；一旦甲板無人佔用即刻起飛，以屆時已達到的燃油與武裝狀態出擊。代價是武裝不全就上天。"
  scramble_disabled_ready:
