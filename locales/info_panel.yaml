      "pt-BR": "%{facility} cheio: %{used}/%{capacity} células usadas."
      ru: "%{facility} заполнен: занято %{used}/%{capacity} ячеек."
      zh: "%{facility} 已满：%{capacity} 中已用 %{used} 格。"
      "zh-TW": "%{facility} 已滿：%{capacity} 中已用 %{used} 格。"
    # %{used}/%{capacity}/%{need} are glued-caps measures (e.g. "329.0KG"), so the
