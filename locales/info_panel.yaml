    enabled_tooltip:
      de: Sensor ein-/ausschalten
      en: Toggle sensor on/off
      es: Activar/desactivar sensor
      fr: Activer/désactiver le capteur
      it: Attiva/disattiva sensore
      ja: センサーのオン/オフ切替
      ko: 센서 켜기/끄기
      "pt-BR": Ligar/desligar sensor
      ru: Включить/выключить датчик
      zh: 开关传感器
      "zh-TW": 開關感測器
    kind_off_tooltip:
      de: "Dieser aktive Sensor ist ausgeschaltet: Er strahlt nicht ab und findet daher nichts. Nur aktive Sensoren lassen sich ausschalten."
      en: "This active sensor is switched off: it is not radiating, and so it is finding nothing. Only active sensors can be switched off."
      es: "Este sensor activo está apagado: no irradia y, por tanto, no detecta nada. Solo los sensores activos pueden apagarse."
      fr: "Ce capteur actif est éteint : il n'émet pas et ne détecte donc rien. Seuls les capteurs actifs peuvent être éteints."
      it: "Questo sensore attivo è spento: non irradia e quindi non rileva nulla. Solo i sensori attivi possono essere spenti."
      ja: "この能動センサーはオフになっている。放射していないため何も探知していない。オフにできるのは能動センサーのみ。"
      ko: "이 능동 센서는 꺼져 있습니다. 방사하지 않으므로 아무것도 탐지하지 못합니다. 끌 수 있는 것은 능동 센서뿐입니다."
      "pt-BR": "Este sensor ativo está desligado: não irradia e, portanto, não detecta nada. Apenas sensores ativos podem ser desligados."
      ru: "Этот активный датчик выключен: он не излучает и потому ничего не обнаруживает. Выключать можно только активные датчики."
      zh: "该主动传感器已关闭：不再辐射，因而什么也发现不了。只有主动传感器可以关闭。"
      "zh-TW": "該主動感測器已關閉：不再輻射，因而什麼也發現不了。只有主動感測器可以關閉。"
    emission_silent_tooltip:
      de: "Dieser Emitter strahlt nicht ab und trägt daher nichts zu dem bei, was feindliche Empfänger aufnehmen können."
      en: "This emitter is not radiating, so it is adding nothing to what hostile receivers can hear."
      es: "Este emisor no está irradiando, así que no aporta nada a lo que puedan captar los receptores hostiles."
      fr: "Cet émetteur n'émet pas ; il n'ajoute donc rien à ce que les récepteurs hostiles peuvent capter."
      it: "Questo emettitore non sta irradiando, quindi non aggiunge nulla a ciò che i ricevitori nemici possono captare."
      ja: "このエミッターは放射していないため、敵の受信機が拾えるものに何も加えていない。"
      ko: "이 방사원은 방사하고 있지 않으므로, 적 수신기가 포착할 수 있는 것에 아무것도 더하지 않습니다."
      "pt-BR": "Este emissor não está irradiando, portanto não acrescenta nada ao que receptores hostis possam captar."
      ru: "Этот излучатель не работает, поэтому ничего не добавляет к тому, что могут принять вражеские приёмники."
      zh: "该辐射源未在辐射，因而不会为敌方接收机增加任何可捕获的信号。"
      "zh-TW": "該輻射源未在輻射，因而不會為敵方接收機增加任何可捕獲的訊號。"
    group_active:
