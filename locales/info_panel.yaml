  lost_unit:
    lost:
      de: Verloren
      en: Lost
      es: Perdida
      fr: Perdue
      it: Persa
      ja: 喪失
      ko: 손실
      "pt-BR": Perdida
      ru: Потеряна
      zh: 损失
      "zh-TW": 損失
    lost_tooltip:
      de: "Wie diese Einheit verloren ging — dieselbe Terminologie wie das Kartensymbol."
      en: "How this unit was lost — the same terminology as the map symbol."
      es: "Cómo se perdió esta unidad, con la misma terminología que el símbolo del mapa."
      fr: "Comment cette unité a été perdue — la même terminologie que le symbole sur la carte."
      it: "Come è stata persa questa unità, con la stessa terminologia del simbolo sulla mappa."
      ja: "このユニットがどのように失われたか。地図記号と同じ用語で示される。"
      ko: "이 유닛이 어떻게 손실되었는지 — 지도 기호와 동일한 용어입니다."
      "pt-BR": "Como esta unidade foi perdida — a mesma terminologia do símbolo no mapa."
      ru: "Как была потеряна эта единица — та же терминология, что и на символе карты."
      zh: "该单位是如何损失的——与地图符号使用相同的术语。"
      "zh-TW": "該單位是如何損失的——與地圖符號使用相同的術語。"
    when:
      de: Wann
      en: When
      es: Cuándo
      fr: Quand
      it: Quando
      ja: 時刻
      ko: 시각
      "pt-BR": Quando
      ru: Когда
      zh: 时间
      "zh-TW": 時間
    when_tooltip:
      de: "Wie lange her der Verlust dieser Einheit war."
      en: "How long ago this unit was lost."
      es: "Hace cuánto tiempo se perdió esta unidad."
      fr: "Depuis combien de temps cette unité a été perdue."
      it: "Da quanto tempo è stata persa questa unità."
      ja: "このユニットが失われてから経過した時間。"
      ko: "이 유닛이 손실된 지 얼마나 지났는지."
      "pt-BR": "Há quanto tempo esta unidade foi perdida."
      ru: "Сколько времени прошло с потери этой единицы."
      zh: "该单位损失至今经过的时间。"
      "zh-TW": "該單位損失至今經過的時間。"
