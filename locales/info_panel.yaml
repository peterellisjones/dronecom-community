  scramble_tooltip:
    de: "Startet, sobald das Deck frei ist, auch wenn Betankung oder Bewaffnung noch nicht abgeschlossen sind. Die Wartung läuft während der Wartezeit weiter."
    en: "Launch as soon as the deck is free, even if refueling or rearming is incomplete. Servicing continues while waiting."
