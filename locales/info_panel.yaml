_version: 2

info_panel:
  alt_mode_tooltip:
    de: "Wie die Plattform die Höhe hält: ALT hält eine feste Höhe über dem Meeresspiegel; TERR folgt dem Gelände in einem festen Abstand."
    en: "How the platform holds altitude: ALT keeps a fixed height above sea level; TERR follows the terrain at a set clearance."
    es: "Cómo mantiene la altitud la plataforma: ALT conserva una altura fija sobre el nivel del mar; TERR sigue el terreno a una separación fija."
    fr: "Comment la plateforme tient l'altitude : ALT maintient une hauteur fixe au-dessus du niveau de la mer ; TERR suit le relief à une garde fixe."
    it: "Come la piattaforma mantiene la quota: ALT tiene un'altezza fissa sul livello del mare; TERR segue il terreno a una distanza fissa."
    ja: "高度の保持方法。ALTは海面からの一定高度を保ち、TERRは一定のクリアランスで地形に追従する。"
    ko: "플랫폼이 고도를 유지하는 방식: ALT는 해수면 기준 고정 고도를 유지하고, TERR는 일정 간격으로 지형을 따라갑니다."
    "pt-BR": "Como a plataforma mantém a altitude: ALT conserva uma altura fixa acima do nível do mar; TERR acompanha o terreno a uma folga fixa."
    ru: "Как платформа удерживает высоту: ALT держит постоянную высоту над уровнем моря; TERR следует рельефу с заданным зазором."
    zh: "平台保持高度的方式：ALT 保持相对海平面的固定高度；TERR 以设定的离地间隙贴地飞行。"
    "zh-TW": "平台保持高度的方式：ALT 保持相對海平面的固定高度；TERR 以設定的離地間隙貼地飛行。"
  battery_reserve_tooltip:
    de: "Der Treibstoff ist aufgebraucht; die Plattform läuft auf ihrer Notbatteriereserve und geht nieder, wenn diese leer ist."
    en: "Fuel is exhausted; the platform is running on its emergency battery reserve and will ditch when it runs out."
    es: "El combustible se ha agotado; la plataforma funciona con su reserva de batería de emergencia y caerá cuando se agote."
    fr: "Le carburant est épuisé ; la plateforme fonctionne sur sa réserve de batterie de secours et s'abîmera une fois celle-ci vide."
    it: "Il carburante è esaurito; la piattaforma sta usando la riserva di batteria d'emergenza e ammarerà quando si scaricherà."
    ja: "燃料が尽き、機体は非常用バッテリーで運転している。尽きれば不時着（着水）する。"
    ko: "연료가 소진되어 플랫폼이 비상 배터리 예비 전력으로 작동 중이며, 이마저 떨어지면 추락(불시착)합니다."
    "pt-BR": "O combustível acabou; a plataforma opera com sua reserva de bateria de emergência e cairá quando ela se esgotar."
    ru: "Топливо кончилось; платформа работает на аварийном резерве батареи и рухнет, когда он иссякнет."
    zh: "燃料已耗尽；平台正依靠应急电池储备运行，耗尽后将坠毁（迫降）。"
    "zh-TW": "燃料已耗盡；平台正依靠應急電池儲備運行，耗盡後將墜毀（迫降）。"
  cavitating_tooltip:
    de: "Dieses U-Boot kavitiert: Es fährt so schnell, dass der Propeller kollabierende Blasen erzeugt, was den abgestrahlten Lärm stark erhöht."
    en: "This submarine is cavitating: moving fast enough that its propeller throws off collapsing bubbles, sharply raising the noise it radiates."
    es: "Este submarino está cavitando: navega tan rápido que su hélice genera burbujas que colapsan, elevando bruscamente el ruido que irradia."
    fr: "Ce sous-marin cavite : il avance assez vite pour que son hélice produise des bulles qui implosent, augmentant fortement le bruit qu'il émet."
    it: "Questo sottomarino sta cavitando: procede così veloce che l'elica genera bolle che collassano, aumentando bruscamente il rumore irradiato."
    ja: "この潜水艦はキャビテーションを起こしている。速力が高くプロペラが崩壊する気泡を発生させ、放射雑音が急増している。"
    ko: "이 잠수함은 캐비테이션을 일으키고 있습니다: 속도가 빨라 프로펠러가 붕괴하는 기포를 만들어 방사 소음이 급격히 커집니다."
    "pt-BR": "Este submarino está cavitando: navega rápido o bastante para que a hélice gere bolhas que implodem, elevando bruscamente o ruído irradiado."
    ru: "Эта подводная лодка кавитирует: идёт так быстро, что винт создаёт схлопывающиеся пузыри, резко повышая излучаемый шум."
    zh: "该潜艇正在发生空泡：航速过快使螺旋桨产生溃灭的气泡，辐射噪声急剧上升。"
    "zh-TW": "該潛艇正在發生空泡：航速過快使螺旋槳產生潰滅的氣泡，輻射噪聲急劇上升。"
  # #2879/#2884: summary-row (accordion) hover hints. The footer swaps its line
  # to the shift-click bulk action while a header is hovered (open-all vs
  # close-all, matching what a shift-click would do); the clickable header band
  # itself carries the interaction hint on hover.
  accordion:
    shift_open_all_hint:
      de: "Shift-Klick, um alle zu öffnen"
      en: "Shift-click to open all"
      es: "Mayús+clic para abrir todo"
      fr: "Maj+clic pour tout ouvrir"
      it: "Maiusc+clic per aprire tutto"
      ja: "Shift+クリックですべて開く"
      ko: "Shift+클릭으로 모두 열기"
      "pt-BR": "Shift+clique para abrir tudo"
      ru: "Shift+клик, чтобы открыть все"
      zh: "Shift+单击展开全部"
      "zh-TW": "Shift+點擊展開全部"
    shift_close_all_hint:
      de: "Shift-Klick, um alle zu schließen"
      en: "Shift-click to close all"
      es: "Mayús+clic para cerrar todo"
      fr: "Maj+clic pour tout fermer"
      it: "Maiusc+clic per chiudere tutto"
      ja: "Shift+クリックですべて閉じる"
      ko: "Shift+클릭으로 모두 닫기"
      "pt-BR": "Shift+clique para fechar tudo"
      ru: "Shift+клик, чтобы закрыть все"
      zh: "Shift+单击收起全部"
      "zh-TW": "Shift+點擊收起全部"
    interaction_hint:
      de: "Klicken zum Auf- oder Zuklappen. Shift-Klick, um alle zu öffnen oder zu schließen."
      en: "Click to expand or collapse. Shift-click to open or close all."
      es: "Haz clic para expandir o contraer. Mayús+clic para abrir o cerrar todo."
      fr: "Cliquez pour développer ou réduire. Maj+clic pour tout ouvrir ou fermer."
      it: "Fai clic per espandere o comprimere. Maiusc+clic per aprire o chiudere tutto."
      ja: "クリックで開閉します。Shift+クリックですべて開閉します。"
      ko: "클릭하여 펼치거나 접습니다. Shift+클릭으로 모두 열거나 닫습니다."
      "pt-BR": "Clique para expandir ou recolher. Shift+clique para abrir ou fechar tudo."
      ru: "Нажмите, чтобы развернуть или свернуть. Shift+клик, чтобы открыть или закрыть все."
      zh: "单击展开或收起。Shift+单击展开或收起全部。"
      "zh-TW": "點擊展開或收起。Shift+點擊展開或收起全部。"
  # #1527/#1701: vehicle inspect panel GROUP row (entity_view.rs) — the row
  # label, plus the per-member Detach action (every member, leader included —
  # leadership is derived) and its glossary tooltip. Disband now lives only in
  # the group panel. Both this row and the group panel's MBR row (#3338)
  # render Detach as the same `LinkBreak` icon button, keyed by this tooltip.
  group:
    label_tooltip:
      de: "Die Gruppe, zu der diese Einheit gehört. Klicken, um das Gruppenfenster zu öffnen."
      en: "The group this unit belongs to. Click to open the group panel."
      es: "El grupo al que pertenece esta unidad. Haz clic para abrir el panel de grupo."
      fr: "Le groupe auquel appartient cette unité. Cliquez pour ouvrir le panneau de groupe."
      it: "Il gruppo a cui appartiene questa unità. Clicca per aprire il pannello del gruppo."
      ja: "このユニットが所属するグループ。クリックでグループパネルを開く。"
      ko: "이 유닛이 속한 그룹. 클릭하면 그룹 패널이 열립니다."
      "pt-BR": "O grupo ao qual esta unidade pertence. Clique para abrir o painel do grupo."
      ru: "Группа, к которой принадлежит этот юнит. Нажмите, чтобы открыть панель группы."
      zh: "该单位所属的编组。点击可打开编组面板。"
      "zh-TW": "該單位所屬的編組。點擊可開啟編組面板。"
    label:
      de: "Gruppe"
      en: "Group"
      es: "Grupo"
      fr: "Groupe"
      it: "Gruppo"
      ja: "グループ"
      ko: "그룹"
      "pt-BR": "Grupo"
      ru: "Группа"
      zh: "编组"
      "zh-TW": "編組"
    # Leader badge shown after the group link when the inspected unit is the
    # group's leader. Mirrors group_panel.members.leader.
    leader:
      de: "Anführer"
      en: "leader"
      es: "líder"
      fr: "chef"
      it: "capo"
      ja: "リーダー"
      ko: "대장"
      "pt-BR": "líder"
      ru: "ведущий"
      zh: "领队"
      "zh-TW": "領隊"
    leader_tooltip:
      de: "Diese Einheit führt ihre Gruppe: Sie hält Auftrag und Doktrin der Gruppe, die übrigen Mitglieder formieren sich auf sie."
      en: "This unit leads its group: it holds the group's mission and doctrine, and the other members form on it."
      es: "Esta unidad lidera su grupo: sostiene la misión y la doctrina del grupo, y los demás miembros se forman sobre ella."
      fr: "Cette unité commande son groupe : elle porte la mission et la doctrine du groupe, et les autres membres se forment sur elle."
      it: "Questa unità guida il proprio gruppo: ne detiene missione e dottrina, e gli altri membri si formano su di essa."
      ja: "この機体が編隊を率いる。編隊の任務とドクトリンを保持し、他の隊員はこれに追従して編隊を組む。"
      ko: "이 유닛이 편대를 이끕니다. 편대의 임무와 교리를 보유하며, 다른 대원들은 이 유닛을 기준으로 대형을 이룹니다."
      "pt-BR": "Esta unidade lidera seu grupo: detém a missão e a doutrina do grupo, e os demais membros se formam sobre ela."
      ru: "Этот юнит ведёт свою группу: он держит задачу и доктрину группы, остальные строятся на него."
      zh: "该单位统领其编队：编队的任务与作战准则由它持有，其余成员以它为基准编队。"
      "zh-TW": "該單位統領其編隊：編隊的任務與作戰準則由它持有，其餘成員以它為基準編隊。"
    # Now the button's only text (an icon button, #3338), so the wording must
    # stand alone as a self-describing action rather than a hover gloss on a
    # visible "Detach" label.
    detach_tooltip:
      de: "Dieses Mitglied von der Gruppe lösen. Es fliegt danach unter eigenen Befehlen weiter."
      en: "Detach this member from the group. It keeps flying under its own orders."
      es: "Separar este miembro del grupo. Seguirá volando bajo sus propias órdenes."
      fr: "Détacher ce membre du groupe. Il continue de voler sous ses propres ordres."
      it: "Distacca questo membro dal gruppo. Continuerà a volare sotto i propri ordini."
      ja: "このメンバーをグループから分離します。以後は自身の命令下で飛行を続けます。"
      ko: "이 구성원을 그룹에서 분리합니다. 이후 자신의 명령 하에 계속 비행합니다."
      "pt-BR": "Separar este membro do grupo. Ele continuará voando sob suas próprias ordens."
      ru: "Отсоединить этого участника от группы. Он продолжит полёт по собственным приказам."
      zh: "将该成员从编组中分离。此后它将依据自身的指令继续飞行。"
      "zh-TW": "將該成員從編組中分離。此後它將依據自身的指令繼續飛行。"
