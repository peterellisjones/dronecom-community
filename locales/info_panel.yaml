      emitters_tooltip:
        de: "Von diesem Kontakt abgestrahlte, per Fingerabdruck erfasste Emitter. Der Satz wird getrennt von der Rumpfidentifizierung geführt — derselbe Entwurf kann alles tragen —, doch ein reiner Suchkopf-Emitter weist den Kontakt eindeutig als Waffe aus."
        en: "Emitters fingerprinted radiating from this contact. The set is tracked separately from the hull identification — the same design can carry anything — though a seeker-only emitter does pin the contact as a weapon."
        es: "Emisores identificados por su firma radiando desde este contacto. El conjunto se rastrea aparte de la identificación del casco —un mismo diseño puede llevar cualquier cosa—, aunque un emisor exclusivo de buscador sí lo fija como arma."
        fr: "Émetteurs dont la signature a été relevée sur ce contact. L'ensemble est suivi séparément de l'identification de la coque — un même modèle peut tout emporter —, mais un émetteur d'autodirecteur seul le désigne bien comme une arme."
        it: "Emettitori identificati per firma che irradiano da questo contatto. L'insieme è tracciato separatamente dall'identificazione dello scafo — lo stesso progetto può portare qualsiasi cosa — anche se un emettitore di solo cercatore lo fissa come arma."
        ja: "この接触目標から放射され、指紋照合されたエミッター。同じ設計でも搭載は自由なため、この集合は艦型の同定とは別に追跡される。ただしシーカー専用のエミッターは、目標が兵器であることを確定させる。"
        ko: "이 접촉에서 방사되어 지문처럼 식별된 방사원입니다. 같은 설계도 무엇이든 탑재할 수 있으므로 이 집합은 선체 식별과 별도로 추적됩니다. 다만 탐색기 전용 방사원은 해당 접촉을 무기로 확정합니다."
        "pt-BR": "Emissores cuja assinatura foi identificada irradiando deste contato. O conjunto é rastreado à parte da identificação do casco — o mesmo projeto pode levar qualquer coisa —, embora um emissor exclusivo de buscador o fixe como arma."
        ru: "Излучатели, опознанные по «отпечатку» и работающие с этого контакта. Их набор отслеживается отдельно от опознания корпуса — один и тот же проект может нести что угодно, — однако излучатель только головки самонаведения однозначно определяет контакт как оружие."
        zh: "从该接触目标辐射并经指纹比对识别出的辐射源。同一设计可搭载任意载荷，故该集合与舰型识别分开追踪；不过仅用于导引头的辐射源可确定该目标为武器。"
        "zh-TW": "從該接觸目標輻射並經指紋比對識別出的輻射源。同一設計可搭載任意載荷，故該集合與艦型識別分開追蹤；不過僅用於導引頭的輻射源可確定該目標為武器。"
