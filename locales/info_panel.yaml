      ja: 能動
      ko: 능동
      "pt-BR": ATIVO
      ru: АКТИВ
      zh: 主动
      "zh-TW": 主動
    group_active_tooltip:
      de: "Emittierende Sensoren — sie senden Energie aus, um Ziele zu erkennen, und können selbst entdeckt werden."
      en: "Emitting sensors — they radiate energy to detect targets, and can themselves be detected."
      es: "Sensores emisores: irradian energía para detectar objetivos y ellos mismos pueden ser detectados."
      fr: "Capteurs émetteurs : ils émettent de l'énergie pour détecter des cibles et peuvent eux-mêmes être détectés."
      it: "Sensori emettitori: irradiano energia per rilevare bersagli e possono a loro volta essere rilevati."
      ja: "放射型センサー。目標を探知するためにエネルギーを放射し、自らも探知され得る。"
      ko: "방사형 센서 — 표적을 탐지하기 위해 에너지를 방사하며, 자신도 탐지될 수 있습니다."
      "pt-BR": "Sensores emissores: irradiam energia para detectar alvos e podem eles próprios ser detectados."
      ru: "Излучающие датчики — они испускают энергию для обнаружения целей и сами могут быть обнаружены."
      zh: "主动辐射式传感器——通过发射能量探测目标，同时自身也可能被探测到。"
      "zh-TW": "主動輻射式感測器——透過發射能量探測目標，同時自身也可能被探測到。"
