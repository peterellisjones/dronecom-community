    ru: "Этот игрок сообщает, что изменил эти файлы игровых данных: %{files}. Это его собственное заявление, проверить его нельзя."
    zh: "该玩家报告修改了这些游戏数据文件：%{files}。这是其自行申报的内容，无法验证。"
    "zh-TW": "該玩家回報修改了這些遊戲資料檔案：%{files}。這是其自行申報的內容，無法驗證。"
