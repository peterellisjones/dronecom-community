    ko: "먼저 빈 자리를 차지하세요. 관전자와 자리가 없는 플레이어는 준비할 것이 없습니다."
    "pt-BR": "Ocupe primeiro um assento livre — espectadores e jogadores sem assento não têm o que preparar."
    ru: "Сначала займите свободное место — зрителям и игрокам без места нечего готовить."
    zh: "请先占据一个空席位——观战者和未就座的玩家没有可准备的内容。"
