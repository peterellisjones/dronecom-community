    ja: "このホストのゲームデータはあなたのものと異なりますが、変更は報告されていません。同じバージョンの別ビルドを使用している可能性があります。"
    ko: "이 호스트의 게임 데이터가 당신의 것과 다르지만 변경 사항은 보고되지 않았습니다. 같은 버전의 다른 빌드일 수 있습니다."
    "pt-BR": "Os dados de jogo deste anfitrião diferem dos seus, embora ele não relate alterações. Provavelmente é outra compilação da mesma versão."
    ru: "Игровые данные этого хоста отличаются от ваших, хотя он не сообщает об изменениях. Вероятно, это другая сборка той же версии."
    zh: "该主机的游戏数据与你的不同，但其未报告任何修改。可能是同一版本的不同构建。"
    "zh-TW": "該主機的遊戲資料與你的不同，但其未回報任何修改。可能是同一版本的不同建置。"
