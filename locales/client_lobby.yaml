  readiness_tooltip:
    de: "Nur ein Hinweis. Der Host kann die Partie starten, ob alle Plätze bereit gemeldet sind oder nicht."
    en: "Advisory only. The host can start the match whether or not every seat has readied up."
    es: "Solo informativo. El anfitrión puede empezar la partida hayan confirmado o no todos los puestos."
    fr: "À titre indicatif. L'hôte peut lancer la partie que tous les sièges soient prêts ou non."
    it: "Solo indicativo. L'host può avviare la partita anche se non tutti i posti si sono dichiarati pronti."
