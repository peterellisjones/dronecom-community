    ru: "Только справочно. Ведущий может начать матч независимо от того, все ли места готовы."
    zh: "仅供参考。无论是否所有席位都已准备，主机都可以开始对战。"
    "zh-TW": "僅供參考。無論是否所有席位都已準備，主機都可以開始對戰。"
  ready_tooltip:
    de: "Teilt dem Host mit, dass Sie mit der Einrichtung fertig sind. Es ist nur ein Hinweis: Der Host kann auch ohne jeden bereiten Platz starten."
    en: "Tells the host you have finished setting up. It is advisory: the host can start without every seat ready."
    es: "Indica al anfitrión que has terminado de prepararte. Es solo informativo: puede empezar sin que todos los puestos estén listos."
    fr: "Indique à l'hôte que vous avez fini votre préparation. C'est indicatif : l'hôte peut lancer sans que tous les sièges soient prêts."
    it: "Comunica all'host che hai finito la preparazione. È solo indicativo: l'host può avviare senza che tutti i posti siano pronti."
    ja: "準備が整ったことをホストに伝えます。目安にすぎず、すべての席が準備完了でなくてもホストは開始できます。"
    ko: "준비가 끝났음을 호스트에게 알립니다. 참고용일 뿐이며, 모든 자리가 준비되지 않아도 호스트는 시작할 수 있습니다."
    "pt-BR": "Avisa o anfitrião de que você terminou a preparação. É apenas informativo: ele pode iniciar sem todos os assentos prontos."
    ru: "Сообщает ведущему, что вы завершили подготовку. Это лишь справка: ведущий может начать и без готовности всех мест."
    zh: "告知主机你已完成准备。这仅供参考：主机无需所有席位就绪即可开始。"
    "zh-TW": "告知主機你已完成準備。這僅供參考：主機無需所有席位就緒即可開始。"
