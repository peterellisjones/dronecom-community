_version: 2

workshop:
  mod_parts_badge:
    de: "MOD-TEILE"
    en: "MOD PARTS"
    es: "PIEZAS MOD"
    fr: "PIÈCES MOD"
    it: "PARTI MOD"
    ja: "MOD部品"
    ko: "모드 부품"
    "pt-BR": "PEÇAS MOD"
    ru: "МОД-ДЕТАЛИ"
    zh: "模组部件"
    "zh-TW": "模組部件"
  mod_parts_badge_tooltip:
    de: "Dieses Fahrzeug verwendet von einem Mod hinzugefügte Teile. Nur im Einzelspieler verfügbar."
    en: "This vehicle uses parts added by a mod. Available in single-player only."
    es: "Este vehículo usa piezas añadidas por un mod. Solo disponible en un jugador."
    fr: "Ce véhicule utilise des pièces ajoutées par un mod. Disponible en solo uniquement."
    it: "Questo veicolo usa parti aggiunte da una mod. Disponibile solo in giocatore singolo."
    ja: "この機体はMODが追加した部品を使用しています。シングルプレイヤーでのみ利用可能です。"
    ko: "이 유닛은 모드가 추가한 부품을 사용합니다. 싱글플레이어에서만 사용할 수 있습니다."
    "pt-BR": "Este veículo usa peças adicionadas por um mod. Disponível somente para um jogador."
    ru: "Эта техника использует детали, добавленные модом. Доступно только в одиночной игре."
    zh: "此载具使用了模组添加的部件。仅在单人游戏中可用。"
    "zh-TW": "此載具使用了模組新增的部件。僅在單人遊戲中可用。"
  workshop_badge:
    de: "WORKSHOP"
    en: "WORKSHOP"
    es: "WORKSHOP"
    fr: "WORKSHOP"
    it: "WORKSHOP"
    ja: "ワークショップ"
    ko: "워크숍"
    "pt-BR": "WORKSHOP"
    ru: "МАСТЕРСКАЯ"
    zh: "创意工坊"
    "zh-TW": "創意工坊"
  workshop_badge_tooltip:
    de: "Aus Workshop-Mod: %{mod_name}"
    en: "From workshop mod: %{mod_name}"
    es: "Del mod del taller: %{mod_name}"
    fr: "Du mod du workshop : %{mod_name}"
    it: "Dalla mod del workshop: %{mod_name}"
    ja: "ワークショップMod提供: %{mod_name}"
    ko: "워크숍 모드 제공: %{mod_name}"
    "pt-BR": "Do mod da workshop: %{mod_name}"
    ru: "Из мода мастерской: %{mod_name}"
    zh: "来自创意工坊模组：%{mod_name}"
    "zh-TW": "來自創意工坊模組：%{mod_name}"
  modded_parts_sp_only:
    de: "Verwendet Mod-Teile: %{parts}. Nur im Einzelspieler verfügbar."
    en: "Uses modded parts: %{parts}. Single-player only."
    es: "Usa piezas modificadas: %{parts}. Solo un jugador."
    fr: "Utilise des pièces moddées : %{parts}. Solo uniquement."
    it: "Usa parti modificate: %{parts}. Solo giocatore singolo."
    ja: "改造パーツを使用: %{parts}。シングルプレイヤー専用。"
    ko: "모드 부품 사용: %{parts}. 싱글플레이어 전용입니다."
    "pt-BR": "Usa peças modificadas: %{parts}. Somente um jogador."
    ru: "Использует модифицированные детали: %{parts}. Только для одиночной игры."
    zh: "使用了模组部件：%{parts}。仅限单人游戏。"
    "zh-TW": "使用了模組部件：%{parts}。僅限單人遊戲。"
  workshop_readonly:
    de: "Abonnierte Inhalte sind schreibgeschützt: zum Bearbeiten duplizieren."
    en: "Subscribed content is read-only: duplicate to edit."
    es: "El contenido suscrito es de solo lectura: duplica para editar."
    fr: "Le contenu abonné est en lecture seule : dupliquez pour modifier."
    it: "I contenuti sottoscritti sono di sola lettura: duplica per modificare."
    ja: "購読したコンテンツは読み取り専用です。編集するには複製してください。"
    ko: "구독한 콘텐츠는 읽기 전용입니다. 편집하려면 복제하세요."
    "pt-BR": "O conteúdo inscrito é somente leitura: duplique para editar."
    ru: "Подписанный контент доступен только для чтения: продублируйте, чтобы редактировать."
    zh: "订阅的内容为只读：复制后即可编辑。"
    "zh-TW": "訂閱的內容為唯讀：複製後即可編輯。"
  publish_required_items_tooltip:
    de: "Dieses Design verwendet von Mods hinzugefügte Teile: %{parts}. Wenn du es veröffentlichst, lege die Quell-Mod(s) auf der Workshop-Seite als Erforderliche Elemente fest, damit Abonnenten sie erhalten."
    en: "This design uses parts added by mods: %{parts}. If you publish it, set the source mod(s) as Required Items on its Workshop page so subscribers receive them."
    es: "Este diseño usa piezas añadidas por mods: %{parts}. Si lo publicas, configura el/los mod(s) de origen como Elementos requeridos en su página del Workshop para que los suscriptores los reciban."
    fr: "Ce plan utilise des pièces ajoutées par des mods : %{parts}. Si vous le publiez, définissez le(s) mod(s) source(s) comme Éléments requis sur sa page Workshop afin que les abonnés les reçoivent."
    it: "Questo progetto usa parti aggiunte da mod: %{parts}. Se lo pubblichi, imposta la/le mod di origine come Elementi richiesti nella sua pagina Workshop, così gli iscritti li riceveranno."
    ja: "このデザインはMODが追加した部品を使用しています: %{parts}。公開する場合は、元のMODをこのアイテムのワークショップページで必須アイテムに設定し、購読者が入手できるようにしてください。"
    ko: "이 디자인은 모드가 추가한 부품을 사용합니다: %{parts}. 게시할 경우 이 항목의 워크숍 페이지에서 원본 모드를 필수 항목으로 설정하면 구독자가 받을 수 있습니다."
    "pt-BR": "Este projeto usa peças adicionadas por mods: %{parts}. Se você publicá-lo, defina o(s) mod(s) de origem como Itens Necessários na página da Workshop deste item, para que os inscritos os recebam."
    ru: "Этот дизайн использует детали, добавленные модами: %{parts}. Если вы опубликуете его, укажите исходный мод(ы) как обязательные элементы на странице мастерской этого предмета, чтобы подписчики их получили."
    zh: "此设计使用了模组添加的部件：%{parts}。如果发布，请在该物品的创意工坊页面将来源模组设为必需项目，以便订阅者获取它们。"
    "zh-TW": "此設計使用了模組新增的部件：%{parts}。如果發布，請在該物品的創意工坊頁面將來源模組設為必要項目，以便訂閱者取得它們。"
