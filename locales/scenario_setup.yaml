    ja: "毎秒すべてのチームの予算に継続的に加算される信用額です。0にすると経済は配分のみになり、チームは開始予算のみを使用します。"
    ko: "매초 모든 진영의 예산에 지속적으로 적립되는 자금입니다. 0으로 설정하면 경제가 배분 전용이 되어 진영은 시작 예산만 사용합니다."
    "pt-BR": "Crédito contínuo adicionado ao orçamento de cada equipe a cada segundo; 0 torna a economia apenas de alocação, então as equipes gastam somente o orçamento inicial."
    ru: "Непрерывный доход, начисляемый в бюджет каждой команды каждую секунду; 0 делает экономику основанной только на распределении, поэтому команды тратят только стартовый бюджет."
    zh: "每秒持续计入各队预算的收入；设为 0 则经济仅为初始分配，各队只能使用起始预算。"
    "zh-TW": "每秒持續計入各隊預算的收入；設為 0 則經濟僅為初始分配，各隊只能使用起始預算。"
