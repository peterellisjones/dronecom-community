  income_mode_continuous_tooltip:
    de: "Ein fester Betrag, der jede Sekunde dem Budget jedes Teams gutgeschrieben wird, festgelegt über den Regler unten."
    en: "A flat rate credited to every team's budget each second, set by the dial below."
    es: "Una tasa fija acreditada al presupuesto de cada equipo cada segundo, definida por el control de abajo."
    fr: "Un taux fixe crédité au budget de chaque équipe chaque seconde, défini par le curseur ci-dessous."
    it: "Un tasso fisso accreditato sul budget di ogni squadra ogni secondo, impostato dal cursore sottostante."
    ja: "毎秒すべてのチームの予算に加算される固定額。下のダイヤルで設定する。"
    ko: "매초 모든 진영의 예산에 적립되는 고정 금액이며, 아래 다이얼로 설정합니다."
    "pt-BR": "Uma taxa fixa creditada ao orçamento de cada equipe a cada segundo, definida pelo controle abaixo."
    ru: "Фиксированная сумма, начисляемая в бюджет каждой команды каждую секунду; задаётся ползунком ниже."
    zh: "每秒计入各队预算的固定收入，由下方的数值调节。"
