  outer_zone_income_rate_tooltip:
    de: "Einkommen pro Sekunde, das eine Allianz für jede von ihr kontrollierte äußere Ringzone erhält, gleichmäßig aufgeteilt, wenn mehr als ein verbündetes Team sie hält."
    en: "Income per second an alliance earns for each outer-ring zone it controls, split evenly when more than one allied team holds it."
    es: "Ingresos por segundo que gana una alianza por cada zona del anillo exterior que controla, repartidos equitativamente cuando más de un equipo aliado la mantiene."
    fr: "Revenu par seconde qu'une alliance gagne pour chaque zone de l'anneau extérieur qu'elle contrôle, réparti équitablement lorsque plusieurs équipes alliées la tiennent."
    it: "Reddito al secondo che un'alleanza guadagna per ogni zona dell'anello esterno controllata, suddiviso equamente quando più di una squadra alleata la detiene."
    ja: "同盟が支配する外周リングのゾーンごとに得られる秒間収入。複数の同盟チームが保持している場合は均等に分配される。"
    ko: "동맹이 장악한 외곽 고리 구역마다 얻는 초당 수입입니다. 둘 이상의 동맹 진영이 함께 장악하면 균등하게 분배됩니다."
    "pt-BR": "Renda por segundo que uma aliança ganha por cada zona do anel externo que controla, dividida igualmente quando mais de uma equipe aliada a mantém."
    ru: "Доход в секунду, который альянс получает за каждую зону внешнего кольца под его контролем, поровну делится при удержании несколькими союзными командами."
    zh: "联盟每控制一个外环区域所获得的每秒收入；若有多个盟友队伍共同控制，则平均分配。"
    "zh-TW": "聯盟每控制一個外環區域所獲得的每秒收入；若有多個盟友隊伍共同控制，則平均分配。"
