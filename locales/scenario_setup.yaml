  income_mode_territory_capture_tooltip:
    de: "Einkommen stammt ausschließlich aus den von deiner Allianz kontrollierten Gebietszonen, zu den unten festgelegten Sätzen — nichts, solange deine Allianz keine hält."
    en: "Income comes only from the territory zones your alliance controls, at the rates set below — nothing while your alliance holds none."
    es: "Los ingresos provienen únicamente de las zonas de territorio que controla tu alianza, a las tasas definidas abajo; nada mientras tu alianza no controle ninguna."
    fr: "Le revenu provient uniquement des zones de territoire contrôlées par votre alliance, aux taux définis ci-dessous — rien tant que votre alliance n'en contrôle aucune."
    it: "Il reddito proviene esclusivamente dalle zone di territorio controllate dalla tua alleanza, ai tassi impostati sotto — nulla finché la tua alleanza non ne controlla nessuna."
    ja: "収入は自軍の同盟が支配する領域ゾーンのみから、下記のレートで得られる。同盟がどのゾーンも支配していなければ収入はゼロ。"
    ko: "수입은 동맹이 장악한 영역 구역에서만, 아래에 설정된 비율로 발생합니다 — 동맹이 아무 구역도 장악하지 못하면 수입이 없습니다."
    "pt-BR": "A renda vem apenas das zonas de território que sua aliança controla, nas taxas definidas abaixo — nada enquanto sua aliança não controlar nenhuma."
    ru: "Доход поступает только от зон территории, которые контролирует ваш альянс, по ставкам, указанным ниже — ничего, пока ваш альянс не удерживает ни одной зоны."
    zh: "收入仅来自你方联盟控制的领土区域，按下方设定的费率计算——若联盟未控制任何区域则没有收入。"
    "zh-TW": "收入僅來自己方聯盟控制的領土區域，按下方設定的費率計算——若聯盟未控制任何區域則沒有收入。"
