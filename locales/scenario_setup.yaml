  host_readiness_tooltip:
    de: "Nur ein Hinweis. Der Start hängt an der Flotte — mindestens ein Träger, im Budget, jedes Design noch gültig — nie an der Bereitschaft."
    en: "Advisory only. Start is gated on the fleet — at least one carrier, within budget, every design still valid — never on readiness."
    es: "Solo informativo. Empezar depende de la flota: al menos un portanaves, dentro del presupuesto y con todos los diseños válidos; nunca de estar listo."
    fr: "À titre indicatif. Le démarrage dépend de la flotte — au moins un porte-drones, dans le budget, chaque conception encore valide — jamais de l'état prêt."
    it: "Solo indicativo. L'avvio dipende dalla flotta — almeno una portaerei, entro il budget, ogni progetto ancora valido — mai dallo stato di pronto."
    ja: "目安にすぎません。開始の条件は艦隊側だけです。空母が 1 隻以上あり、予算内で、すべての設計が有効であること。準備状態は関係ありません。"
    ko: "참고용일 뿐입니다. 시작 조건은 함대뿐입니다. 항모가 최소 1척, 예산 이내, 모든 설계가 유효해야 하며 준비 여부는 무관합니다."
    "pt-BR": "Apenas informativo. Iniciar depende da frota — ao menos um porta-aviões, dentro do orçamento, todos os projetos válidos — nunca da prontidão."
    ru: "Только справочно. Запуск зависит только от флота — хотя бы один авианосец, в пределах бюджета, все проекты действительны — но не от готовности."
    zh: "仅供参考。能否开始只取决于舰队：至少一艘航母、不超预算、所有设计仍然有效，与是否准备无关。"
    "zh-TW": "僅供參考。能否開始只取決於艦隊：至少一艘航母、不超預算、所有設計仍然有效，與是否準備無關。"
