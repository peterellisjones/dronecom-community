  income_mode_tooltip:
    de: "Wie das Einkommen in diesem Match ermittelt wird: eine feste Rate pro Sekunde, gar kein Einkommen, oder Einkommen aus den Gebietszonen deiner Allianz."
    en: "How this match's income is derived: a flat per-second rate, none at all, or territory-zone income for your alliance."
    es: "Cómo se calculan los ingresos en esta partida: una tasa fija por segundo, ninguno en absoluto, o ingresos de las zonas de territorio de tu alianza."
    fr: "Comment le revenu de cette partie est calculé : un taux fixe par seconde, aucun revenu du tout, ou un revenu des zones de territoire de votre alliance."
    it: "Come viene calcolato il reddito in questa partita: un tasso fisso al secondo, nessun reddito, oppure reddito dalle zone di territorio della tua alleanza."
    ja: "この試合の収入の算出方法：秒間固定レート、収入なし、または自軍の同盟の領域ゾーンによる収入のいずれかです。"
    ko: "이번 경기의 수입 산출 방식: 초당 고정 비율, 수입 없음, 또는 동맹의 영역 구역에 따른 수입 중 하나입니다."
    "pt-BR": "Como a renda desta partida é calculada: uma taxa fixa por segundo, nenhuma renda, ou renda das zonas de território da sua aliança."
    ru: "Как рассчитывается доход в этом матче: фиксированная ставка в секунду, отсутствие дохода вовсе, либо доход от зон территории вашего альянса."
    zh: "本场比赛的收入来源：每秒固定收入、完全没有收入，或来自你方联盟领土区域的收入。"
    "zh-TW": "本場比賽的收入來源：每秒固定收入、完全沒有收入，或來自己方聯盟領土區域的收入。"
