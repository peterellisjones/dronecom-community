    es: "Sin ingresos continuos: cada equipo gasta únicamente su presupuesto inicial durante toda la partida."
    fr: "Aucun revenu continu — chaque équipe ne dépense que son budget de départ pour toute la partie."
    it: "Nessun reddito continuo — ogni squadra spende solo il proprio budget iniziale per l'intera partita."
