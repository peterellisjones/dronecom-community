  match_timeout_required_tooltip:
    de: "Gebietskontrolle hat keine Vernichtungs-Rückfallebene, daher ist ein Zeitlimit erforderlich — es kann nicht deaktiviert werden, solange diese Siegbedingung gewählt ist."
    en: "Territory Control has no elimination backstop, so a time limit is required — it can't be turned off while this victory condition is selected."
    es: "Control Territorial no tiene un respaldo por eliminación, por lo que se requiere un límite de tiempo; no se puede desactivar mientras esta condición de victoria esté seleccionada."
    fr: "Le Contrôle du territoire n'a pas de filet de sécurité par élimination, une limite de temps est donc obligatoire — elle ne peut pas être désactivée tant que cette condition de victoire est sélectionnée."
    it: "Il Controllo del territorio non ha un meccanismo di riserva basato sull'eliminazione, quindi è necessario un limite di tempo — non può essere disattivato finché questa condizione di vittoria è selezionata."
    ja: "領域支配には撃破によるバックアップがないため、制限時間の設定が必須。この勝利条件を選択している間はオフにできない。"
    ko: "영역 장악에는 격파를 통한 대비책이 없으므로 제한 시간이 필수입니다 — 이 승리 조건이 선택된 동안에는 끌 수 없습니다."
    "pt-BR": "Controle de Território não tem um respaldo por eliminação, então um limite de tempo é obrigatório — não pode ser desativado enquanto essa condição de vitória estiver selecionada."
    ru: "У режима «Контроль территории» нет резервного условия через уничтожение, поэтому лимит времени обязателен — его нельзя отключить, пока выбрано это условие победы."
    zh: "领土控制没有歼灭作为后备胜利方式，因此必须设置时间限制——选中该胜利条件时无法关闭。"
    "zh-TW": "領土控制沒有殲滅作為後備勝利方式，因此必須設定時間限制——選中該勝利條件時無法關閉。"
