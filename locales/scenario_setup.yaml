    "zh-TW": "勝利條件"
  win_condition_carriers:
    de: "Träger zerstört"
    en: "Carriers Destroyed"
    es: "Portaaviones destruidos"
    fr: "Porte-avions détruits"
    it: "Portaerei distrutte"
    ja: "空母撃沈"
    ko: "항공모함 격침"
    "pt-BR": "Porta-aviões destruídos"
    ru: "Авианосцы уничтожены"
    zh: "航母被摧毁"
    "zh-TW": "航母被摧毀"
  win_condition_carriers_tooltip:
    de: "Eine Seite scheidet aus, sobald alle ihre Träger versenkt sind — überlebende Drohnen halten sie nicht im Kampf."
    en: "A side is eliminated once every carrier it owns is sunk — surviving drones don't keep it in the fight."
    es: "Un bando queda eliminado en cuanto se hunden todos sus portaaviones — los drones supervivientes no lo mantienen en la lucha."
    fr: "Un camp est éliminé dès que tous ses porte-avions sont coulés — les drones survivants ne le maintiennent pas dans le combat."
    it: "Una fazione viene eliminata non appena tutte le sue portaerei sono affondate — i droni superstiti non la mantengono in combattimento."
    ja: "保有する空母がすべて撃沈された時点で、その陣営は脱落します。生き残ったドローンがいても戦闘には留まりません。"
    ko: "보유한 항공모함이 모두 격침되면 그 진영은 탈락합니다 — 살아남은 드론이 있어도 전투에 남지 못합니다."
    "pt-BR": "Um lado é eliminado assim que todos os seus porta-aviões são afundados — drones sobreviventes não o mantêm na luta."
    ru: "Сторона выбывает, как только потоплены все её авианосцы, — уцелевшие дроны не удерживают её в бою."
    zh: "当一方拥有的所有航母都被击沉时，该方即被淘汰——幸存的无人机无法让其继续作战。"
    "zh-TW": "當一方擁有的所有航母都被擊沉時，該方即被淘汰——倖存的無人機無法讓其繼續作戰。"
  win_condition_all_units:
    de: "Alle Einheiten zerstört"
    en: "All Units Destroyed"
    es: "Todas las unidades destruidas"
    fr: "Toutes les unités détruites"
    it: "Tutte le unità distrutte"
    ja: "全ユニット撃破"
    ko: "전 유닛 격파"
    "pt-BR": "Todas as unidades destruídas"
    ru: "Все юниты уничтожены"
    zh: "全部单位被摧毁"
    "zh-TW": "全部單位被摧毀"
  win_condition_all_units_tooltip:
    de: "Eine Seite scheidet erst aus, wenn alle ihre Einheiten — Träger wie Drohnen — zerstört sind."
    en: "A side is eliminated only once every unit it owns — carriers and drones alike — is destroyed."
    es: "Un bando solo queda eliminado cuando se destruyen todas sus unidades, tanto portaaviones como drones."
    fr: "Un camp n'est éliminé que lorsque toutes ses unités — porte-avions et drones — sont détruites."
    it: "Una fazione viene eliminata solo quando tutte le sue unità — portaerei e droni — sono distrutte."
    ja: "保有するすべてのユニット（空母・ドローンを問わず）が破壊された時点で、初めてその陣営は脱落します。"
    ko: "보유한 모든 유닛(항공모함과 드론 모두)이 파괴되어야만 그 진영이 탈락합니다."
    "pt-BR": "Um lado só é eliminado quando todas as suas unidades — porta-aviões e drones — são destruídas."
    ru: "Сторона выбывает только тогда, когда уничтожены все её юниты — как авианосцы, так и дроны."
    zh: "只有当一方拥有的所有单位——航母与无人机皆然——都被摧毁时，该方才被淘汰。"
    "zh-TW": "只有當一方擁有的所有單位——航母與無人機皆然——都被摧毀時，該方才被淘汰。"
  win_condition_territory:
    de: "Gebietskontrolle"
    en: "Territory Control"
    es: "Control Territorial"
    fr: "Contrôle du territoire"
    it: "Controllo del territorio"
    ja: "領域支配"
    ko: "영역 장악"
    "pt-BR": "Controle de Território"
    ru: "Контроль территории"
    zh: "领土控制"
    "zh-TW": "領土控制"
  win_condition_territory_tooltip:
    de: "Eine Allianz gewinnt, sobald sie alle Gebietszonen ununterbrochen für die festgelegte Haltedauer kontrolliert — in diesem Modus spielt Vernichtung keine Rolle."
    en: "An alliance wins once it continuously holds every territory zone for the configured hold duration — elimination plays no part in this mode."
    es: "Una alianza gana en cuanto mantiene continuamente el control de todas las zonas de territorio durante la duración de retención configurada; la eliminación no interviene en este modo."
    fr: "Une alliance gagne dès qu'elle contrôle en continu toutes les zones de territoire pendant la durée de maintien configurée — l'élimination n'entre pas en jeu dans ce mode."
    it: "Un'alleanza vince non appena controlla ininterrottamente tutte le zone di territorio per la durata di mantenimento configurata — l'eliminazione non ha alcun ruolo in questa modalità."
    ja: "同盟は、設定された保持時間の間すべての領域ゾーンを継続的に支配した時点で勝利する。このモードでは撃破は勝敗に関係しない。"
    ko: "동맹은 설정된 유지 시간 동안 모든 영역 구역을 계속 장악하는 즉시 승리합니다 — 이 모드에서는 격파가 승패에 영향을 주지 않습니다."
    "pt-BR": "Uma aliança vence assim que controla continuamente todas as zonas de território pela duração de posse configurada — a eliminação não tem papel nesse modo."
    ru: "Альянс побеждает, как только непрерывно удерживает все зоны территории в течение заданной продолжительности удержания — уничтожение не играет роли в этом режиме."
    zh: "当一个联盟连续控制所有领土区域达到设定的占领时长时即获胜——该模式下歼灭并不影响胜负。"
    "zh-TW": "當一個聯盟連續控制所有領土區域達到設定的佔領時長時即獲勝——該模式下殲滅並不影響勝負。"
  territory_hold_duration:
    de: "Haltedauer"
    en: "Hold Duration"
    es: "Duración de retención"
    fr: "Durée de maintien"
    it: "Durata di mantenimento"
    ja: "保持時間"
    ko: "유지 시간"
    "pt-BR": "Duração de posse"
    ru: "Продолжительность удержания"
    zh: "占领时长"
    "zh-TW": "佔領時長"
  territory_hold_duration_tooltip:
    de: "Wie viele Sekunden lang eine Allianz alle Gebietszonen ununterbrochen halten muss, um unter Gebietskontrolle zu gewinnen."
    en: "How long, in seconds, an alliance must continuously hold every territory zone to win under Territory Control."
    es: "Cuántos segundos debe una alianza mantener continuamente el control de todas las zonas de territorio para ganar bajo Control Territorial."
    fr: "Pendant combien de secondes une alliance doit maintenir en continu toutes les zones de territoire pour gagner en mode Contrôle du territoire."
    it: "Per quanti secondi un'alleanza deve mantenere ininterrottamente tutte le zone di territorio per vincere in modalità Controllo del territorio."
    ja: "領域支配モードで勝利するために、同盟がすべての領域ゾーンを継続的に保持しなければならない秒数。"
    ko: "영역 장악 모드에서 승리하려면 동맹이 모든 영역 구역을 몇 초 동안 계속 장악해야 하는지를 나타냅니다."
    "pt-BR": "Por quantos segundos uma aliança deve manter continuamente o controle de todas as zonas de território para vencer no modo Controle de Território."
    ru: "Сколько секунд альянс должен непрерывно удерживать все зоны территории, чтобы победить в режиме «Контроль территории»."
    zh: "在领土控制模式下，联盟需连续控制所有领土区域多少秒才能获胜。"
    "zh-TW": "在領土控制模式下，聯盟需連續控制所有領土區域多少秒才能獲勝。"
  match_timeout:
    de: "Zeitlimit"
    en: "Time Limit"
    es: "Límite de tiempo"
    fr: "Limite de temps"
    it: "Limite di tempo"
    ja: "制限時間"
    ko: "제한 시간"
    "pt-BR": "Limite de tempo"
    ru: "Лимит времени"
    zh: "时间限制"
    "zh-TW": "時間限制"
  match_timeout_tooltip:
    de: "Beendet das Match automatisch bei einem Zeitlimit — die Seite mit dem höchsten zerstörten Gegnerwert gewinnt den Stichentscheid; bei genauem Gleichstand endet es unentschieden."
    en: "Ends the match automatically at a time limit — the side that destroyed the most enemy value wins the tie-break; an exact tie is a draw."
    es: "Termina la partida automáticamente al alcanzar un límite de tiempo — el bando que haya destruido más valor enemigo gana el desempate; un empate exacto es tablas."
    fr: "Termine automatiquement la partie à une limite de temps — le camp ayant détruit le plus de valeur ennemie remporte le départage ; une égalité exacte donne un match nul."
    it: "Termina automaticamente la partita al raggiungimento di un limite di tempo — la fazione che ha distrutto il maggior valore nemico vince lo spareggio; un pareggio esatto è un pareggio."
    ja: "制限時間に達すると試合を自動的に終了します — 敵の価値をより多く破壊した陣営がタイブレークで勝利します。完全な同点の場合は引き分けです。"
    ko: "제한 시간에 도달하면 경기가 자동으로 종료됩니다 — 적의 가치를 가장 많이 파괴한 진영이 동점자 결정에서 승리합니다. 정확히 동점이면 무승부입니다."
    "pt-BR": "Encerra a partida automaticamente ao atingir o limite de tempo — o lado que destruiu mais valor inimigo vence o desempate; um empate exato é declarado empate."
    ru: "Автоматически завершает матч по истечении лимита времени — сторона, уничтожившая наибольшую ценность противника, побеждает при равенстве прочих условий; точная ничья — это ничья."
    zh: "达到时间限制后自动结束比赛——摧毁敌方价值最多的一方在平局判定中获胜；完全打平则为平局。"
    "zh-TW": "達到時間限制後自動結束比賽——摧毀敵方價值最多的一方在平局判定中獲勝；完全打平則為平局。"
