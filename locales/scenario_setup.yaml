  neutral_traffic_tooltip:
    de: "Bevölkert die Karte mit neutralen Zivilschiffen — Frachtern und Tankern, die das Gebiet durchqueren. Sie ergreifen für keine Seite Partei und sind unbewaffnet."
    en: "Populate the map with neutral civilian shipping — cargo vessels and tankers crossing the area. They take no side and carry no weapons."
    es: "Puebla el mapa con navegación civil neutral: cargueros y petroleros que cruzan la zona. No toman partido y no llevan armas."
    fr: "Peuple la carte de navires civils neutres : cargos et pétroliers traversant la zone. Ils ne prennent aucun parti et ne sont pas armés."
    it: "Popola la mappa con navi civili neutrali: cargo e petroliere che attraversano l'area. Non prendono posizione e sono disarmate."
    ja: "中立の民間船舶（貨物船やタンカー）がマップを横断するようになります。どちらの陣営にも味方せず、武装もしていません。"
    ko: "중립 민간 선박(화물선과 유조선)이 지역을 가로지르며 맵을 채웁니다. 어느 편도 들지 않으며 무장하지 않았습니다."
    "pt-BR": "Povoa o mapa com navegação civil neutra — cargueiros e petroleiros atravessando a área. Não tomam partido e não portam armas."
    ru: "Заполняет карту нейтральными гражданскими судами — сухогрузами и танкерами, пересекающими район. Они не принимают ничью сторону и не вооружены."
    zh: "在地图上生成中立的民用船舶——穿越该区域的货轮和油轮。它们不偏袒任何一方，也不携带武器。"
    "zh-TW": "在地圖上生成中立的民用船舶——穿越該區域的貨輪和油輪。它們不偏袒任何一方，也不攜帶武器。"
