_version: 2

hosting_panel:
  title:
    de: "MULTIPLAYER-HOSTING"
    en: "MULTIPLAYER HOSTING"
    es: "ALOJAMIENTO MULTIJUGADOR"
    fr: "HÉBERGEMENT MULTIJOUEUR"
    it: "HOSTING MULTIGIOCATORE"
    ja: "マルチプレイヤーホスティング"
    ko: "멀티플레이어 호스팅"
    "pt-BR": "HOSPEDAGEM MULTIJOGADOR"
    ru: "ХОСТИНГ МУЛЬТИПЛЕЕРА"
    zh: "多人游戏主机托管"
    "zh-TW": "多人遊戲主機代管"
  sp_hint:
    de: "Das Aktivieren von Mehrspieler öffnet eine Steam-Lobby. Andere Spieler können dann jedem offenen Platz beitreten, während das Match läuft."
    en: "Enabling multiplayer opens a Steam lobby. Other players can then join any open seat while the match is running."
    es: "Activar el multijugador abre una sala de Steam. Otros jugadores podrán entonces unirse a cualquier puesto libre mientras la partida está en curso."
    fr: "Activer le multijoueur ouvre un salon Steam. D'autres joueurs peuvent alors rejoindre n'importe quel poste ouvert pendant que la partie est en cours."
    it: "Attivare il multigiocatore apre una lobby Steam. Altri giocatori potranno quindi unirsi a qualsiasi posto libero mentre la partita è in corso."
    ja: "マルチプレイヤーを有効にすると、Steamロビーが開きます。試合の進行中でも、他のプレイヤーは空いている席に参加できるようになります。"
    ko: "멀티플레이어를 활성화하면 Steam 로비가 열립니다. 그러면 경기가 진행되는 동안에도 다른 플레이어가 빈 자리에 참가할 수 있습니다."
    "pt-BR": "Ativar o multijogador abre um lobby da Steam. Outros jogadores poderão então entrar em qualquer assento livre enquanto a partida estiver em andamento."
    ru: "Включение мультиплеера открывает лобби Steam. После этого другие игроки смогут присоединиться к любому свободному месту, пока матч идёт."
    zh: "启用多人游戏会开放一个Steam大厅。之后，其他玩家可以在比赛进行期间加入任何空闲席位。"
    "zh-TW": "啟用多人遊戲會開放一個Steam大廳。之後，其他玩家可以在比賽進行期間加入任何空閒席位。"
  enable_multiplayer:
    de: "MEHRSPIELER AKTIVIEREN"
    en: "ENABLE MULTIPLAYER"
    es: "ACTIVAR MULTIJUGADOR"
    fr: "ACTIVER LE MULTIJOUEUR"
    it: "ATTIVA MULTIGIOCATORE"
    ja: "マルチプレイヤーを有効化"
    ko: "멀티플레이어 활성화"
    "pt-BR": "ATIVAR MULTIJOGADOR"
    ru: "ВКЛЮЧИТЬ МУЛЬТИПЛЕЕР"
    zh: "启用多人游戏"
    "zh-TW": "啟用多人遊戲"
  enable_tooltip:
    de: "Öffnet eine Steam-Lobby, damit andere Spieler diesem laufenden Match beitreten können."
    en: "Open a Steam lobby so other players can join this match while it's running."
    es: "Abre una sala de Steam para que otros jugadores puedan unirse a esta partida en curso."
    fr: "Ouvre un salon Steam pour que d'autres joueurs puissent rejoindre cette partie en cours."
    it: "Apre una lobby Steam in modo che altri giocatori possano unirsi a questa partita in corso."
    ja: "他のプレイヤーがこの進行中の試合に参加できるよう、Steamロビーを開きます。"
    ko: "다른 플레이어가 진행 중인 이 경기에 참가할 수 있도록 Steam 로비를 엽니다."
    "pt-BR": "Abre um lobby da Steam para que outros jogadores possam entrar nesta partida em andamento."
    ru: "Открывает лобби Steam, чтобы другие игроки могли присоединиться к этому идущему матчу."
    zh: "开放一个Steam大厅，让其他玩家加入这场正在进行的比赛。"
    "zh-TW": "開放一個Steam大廳，讓其他玩家加入這場正在進行的比賽。"
  steam_unavailable_tooltip:
    de: "Online-Mehrspieler erfordert Steam"
    en: "Online multiplayer requires Steam"
    es: "El multijugador en línea requiere Steam"
    fr: "Le multijoueur en ligne nécessite Steam"
    it: "Il multigiocatore online richiede Steam"
    ja: "オンラインマルチプレイにはSteamが必要です"
    ko: "온라인 멀티플레이어에는 Steam이 필요합니다"
    "pt-BR": "Multijogador online requer Steam"
    ru: "Онлайн-мультиплеер требует Steam"
    zh: "在线多人游戏需要Steam"
    "zh-TW": "線上多人遊戲需要Steam"
  disable_multiplayer:
    de: "MEHRSPIELER DEAKTIVIEREN"
    en: "DISABLE MULTIPLAYER"
    es: "DESACTIVAR MULTIJUGADOR"
    fr: "DÉSACTIVER LE MULTIJOUEUR"
    it: "DISATTIVA MULTIGIOCATORE"
    ja: "マルチプレイヤーを無効化"
    ko: "멀티플레이어 비활성화"
    "pt-BR": "DESATIVAR MULTIJOGADOR"
    ru: "ОТКЛЮЧИТЬ МУЛЬТИПЛЕЕР"
    zh: "禁用多人游戏"
    "zh-TW": "停用多人遊戲"
  disable_tooltip:
    de: "Trennt alle verbundenen Spieler und schließt die Steam-Lobby."
    en: "Disconnects any connected players and closes the Steam lobby."
    es: "Desconecta a los jugadores conectados y cierra la sala de Steam."
    fr: "Déconnecte tous les joueurs connectés et ferme le salon Steam."
    it: "Disconnette tutti i giocatori collegati e chiude la lobby Steam."
    ja: "接続中のプレイヤーを切断し、Steamロビーを閉じます。"
    ko: "연결된 모든 플레이어의 연결을 끊고 Steam 로비를 닫습니다."
    "pt-BR": "Desconecta todos os jogadores conectados e fecha o lobby da Steam."
    ru: "Отключает всех подключённых игроков и закрывает лобби Steam."
    zh: "断开所有已连接的玩家并关闭Steam大厅。"
    "zh-TW": "中斷所有已連線的玩家並關閉Steam大廳。"
  invite_link_label:
    de: "EINLADUNGSLINK"
    en: "INVITE LINK"
    es: "ENLACE DE INVITACIÓN"
    fr: "LIEN D'INVITATION"
    it: "LINK DI INVITO"
    ja: "招待リンク"
    ko: "초대 링크"
