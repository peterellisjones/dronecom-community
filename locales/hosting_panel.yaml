    es: "Desconecta a este jugador y devuelve el puesto al control de la IA."
    fr: "Déconnecte ce joueur et rend le poste au contrôle de l'IA."
    it: "Disconnette questo giocatore e restituisce il posto al controllo dell'IA."
    ja: "このプレイヤーを切断し、席をAIの制御に戻します。"
    ko: "이 플레이어의 연결을 끊고 자리를 AI 제어로 되돌립니다."
