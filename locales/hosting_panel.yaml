    de: "Schließt diesen Platz — die KI übernimmt wieder die Kontrolle, und kein Spieler kann ihn beanspruchen."
    en: "Close this seat — the AI resumes control and no player may claim it."
    es: "Cierra este puesto — la IA retoma el control y ningún jugador podrá ocuparlo."
    fr: "Ferme ce poste — l'IA reprend le contrôle et aucun joueur ne peut l'occuper."
    it: "Chiude questo posto — l'IA riprende il controllo e nessun giocatore potrà occuparlo."
    ja: "この席を閉じます — AIが制御を取り戻し、プレイヤーは参加できなくなります。"
    ko: "이 자리를 닫습니다 — AI가 다시 제어를 맡으며 플레이어는 참가할 수 없습니다."
    "pt-BR": "Fecha este assento — a IA retoma o controle e nenhum jogador poderá ocupá-lo."
    ru: "Закрывает это место — ИИ снова берёт управление, и ни один игрок не сможет его занять."
    zh: "关闭此席位——AI将重新接管控制，玩家将无法加入。"
    "zh-TW": "關閉此席位——AI將重新接管控制，玩家將無法加入。"
