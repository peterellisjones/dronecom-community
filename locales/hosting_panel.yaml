  invite_link_tooltip:
    de: "Teilen Sie diesen Link, damit ein Spieler Ihrer Steam-Lobby beitreten kann."
    en: "Share this link so a player can join your Steam lobby."
    es: "Comparta este enlace para que un jugador pueda unirse a su sala de Steam."
    fr: "Partagez ce lien pour qu'un joueur puisse rejoindre votre salon Steam."
    it: "Condividi questo link in modo che un giocatore possa unirsi alla tua lobby Steam."
    ja: "このリンクを共有すると、プレイヤーがあなたのSteamロビーに参加できます。"
    ko: "이 링크를 공유하면 플레이어가 당신의 Steam 로비에 참가할 수 있습니다."
    "pt-BR": "Compartilhe este link para que um jogador possa entrar no seu lobby da Steam."
    ru: "Поделитесь этой ссылкой, чтобы игрок мог присоединиться к вашему лобби Steam."
    zh: "分享此链接，让玩家加入您的Steam大厅。"
    "zh-TW": "分享此連結，讓玩家加入您的Steam大廳。"
