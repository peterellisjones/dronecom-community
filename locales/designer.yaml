    ru: "Суммарное установившееся энергопотребление: базовая нагрузка шасси плюс все установленные датчики. Должно оставаться в пределах энергоснабжения шасси, показанного на индикаторе мощности выше."
    zh: "稳态总功耗：底盘基础负载加上所有已安装传感器的功耗。必须保持在上方功率条所示的底盘供电范围内。"
