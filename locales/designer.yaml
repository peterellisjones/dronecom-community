    en: "Maximum one-way range at each throttle setting (bell). Faster bells burn fuel quicker and reach less far."
    es: "Alcance máximo de ida en cada régimen de velocidad (bell). Los bells más rápidos consumen combustible más deprisa y alcanzan menos lejos."
    fr: "Portée maximale aller simple à chaque régime de vitesse (bell). Les bells plus rapides consomment plus de carburant et portent moins loin."
    it: "Raggio massimo di sola andata per ogni regime di velocità (bell). I bell più veloci consumano carburante più in fretta e arrivano meno lontano."
    ja: "各速力設定（ベル）での最大片道射程。速いベルほど燃料消費が早く、到達距離は短くなる。"
    ko: "각 속력 설정(벨)에서의 최대 편도 사거리. 더 빠른 벨은 연료를 더 빨리 소모하며 도달 거리가 짧아집니다."
    "pt-BR": "Alcance máximo de ida em cada regime de velocidade (bell). Bells mais rápidos consomem combustível mais rápido e alcançam menos longe."
    ru: "Максимальная дальность в один конец на каждом режиме хода (bell). На более быстрых режимах топливо расходуется быстрее, а дальность меньше."
    zh: "每个航速档位（bell）下的最大单程射程。速度越快的档位耗油越快，射程越短。"
    "zh-TW": "每個航速檔位（bell）下的最大單程射程。速度越快的檔位耗油越快，射程越短。"
