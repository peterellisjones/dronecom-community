    de: "Der steilste Überkopfwinkel, in dem diese Zelle noch ein Ziel bekämpfen kann. Darüber hinaus liegt das Ziel zu nahe am Zenit, als dass die Zelle noch einschwenken könnte."
    en: "The steepest overhead angle this airframe can still engage a target at. Beyond this the target is too close to directly overhead for the airframe to curve onto it."
    es: "El ángulo cenital más pronunciado al que este fuselaje aún puede combatir un blanco. Más allá de este, el blanco está demasiado cerca de la vertical para que el fuselaje pueda virar hacia él."
    fr: "L'angle zénithal le plus prononcé auquel cette cellule peut encore engager une cible. Au-delà, la cible est trop proche de la verticale pour que la cellule puisse s'orienter vers elle."
    it: "L'angolo zenitale più ripido a cui questa cellula riesce ancora a ingaggiare un bersaglio. Oltre questo, il bersaglio è troppo vicino alla verticale perché la cellula possa virare su di esso."
    ja: "この機体がなお目標を交戦できる最大の頭上角度。これを超えると目標は真上に近すぎて機体が旋回できない。"
    ko: "이 기체가 여전히 표적과 교전할 수 있는 최대 정수리각입니다. 이를 넘으면 표적이 머리 바로 위에 너무 가까워 기체가 선회할 수 없습니다."
    "pt-BR": "O ângulo zenital mais acentuado em que esta fuselagem ainda consegue engajar um alvo. Além disso, o alvo fica próximo demais da vertical para a fuselagem conseguir virar sobre ele."
    ru: "Максимальный зенитный угол, при котором этот планер ещё способен атаковать цель. Дальше цель оказывается слишком близко к зениту, чтобы планер мог довернуть на неё."
    zh: "该机体仍能交战目标的最陡顶角。超过此角度，目标过于接近正上方，机体已无法转向命中。"
