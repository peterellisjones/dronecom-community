    ko: "10,000ft(3,048m) 고도 발사 → 수상 표적:"
    "pt-BR": "Lançamento a 10.000 ft (3.048 m) → alvo na superfície:"
    ru: "Пуск с 10 000 футов (3 048 м) → надводная цель:"
    zh: "10,000英尺（3,048米）发射 → 水面目标："
    "zh-TW": "10,000 英尺（3,048 公尺）發射 → 水面目標："
  high_launch_to_surface_reach_tooltip:
    de: "Start auf 10.000 ft (3.048 m) → Oberflächenziel. Kinematische Bodenentfernung bei vollem Tank und einfacher Strecke aus dem angepassten Flugmodell dieser Waffe auf ihrem gewählten Flugprofil. Sie setzt einen Start auf 10.000 ft (3.048 m) und ein Oberflächenziel voraus. Die Zielhöhe wird vom Höhenvorteil abgezogen; ein Ziel auf gleicher Höhe erhält den Meereshöhen-Basiswert. Sie ist weder Plattformausdauer noch Kampfradius noch eine Einsatzgarantie und trifft keine Annahme über Zieltyp, Aspekt, Annäherung, Bewegung oder Manöver. Automatische Verteidigung nutzt den Stationsfeuerbereich; befohlene Angriffe und der Kartenbogen nutzen die aktuelle zielspezifische Feuerlösung."
    en: "10,000 ft (3,048 m) launch → surface target. Full-fuel, one-way kinematic ground distance from this weapon's fitted flight model on its selected trajectory profile. It assumes a 10,000 ft (3,048 m) launch and a surface target. A target's altitude subtracts from that altitude advantage; a co-altitude target gets the sea-level baseline. It is not platform endurance, combat radius, or an engagement guarantee, and has no target type, aspect, closure, motion, or maneuver assumption. Automatic Defend uses the station-fire envelope; ordered attacks and the map arc use the live target-specific launch solution."
    es: "Lanzamiento a 10.000 pies (3.048 m) → objetivo en superficie. Distancia terrestre cinemática de ida, con combustible completo, del modelo de vuelo ajustado de esta arma en su perfil de trayectoria seleccionado. Supone un lanzamiento a 10.000 pies (3.048 m) y un objetivo en superficie. La altitud del objetivo se resta de esa ventaja de altitud; un objetivo a la misma altitud recibe la referencia de nivel del mar. No es autonomía de plataforma, radio de combate ni garantía de enfrentamiento, y no supone tipo de objetivo, aspecto, cierre, movimiento ni maniobra. La defensa automática usa la envolvente de fuego desde estación; los ataques ordenados y el arco del mapa usan la solución de lanzamiento actual específica del objetivo."
    fr: "Lancement à 10 000 ft (3 048 m) → cible en surface. Distance au sol cinématique en aller simple, plein de carburant, issue du modèle de vol ajusté de cette arme sur son profil de trajectoire sélectionné. Elle suppose un lancement à 10 000 ft (3 048 m) et une cible en surface. L'altitude de la cible est soustraite de cet avantage d'altitude ; une cible à la même altitude reçoit la référence du niveau de la mer. Ce n'est ni l'autonomie de la plateforme, ni le rayon de combat, ni une garantie d'engagement, et elle ne suppose ni type de cible, ni aspect, ni rapprochement, ni mouvement, ni manœuvre. La défense automatique utilise l'enveloppe de tir depuis la station ; les attaques ordonnées et l'arc de carte utilisent la solution de lancement dynamique propre à la cible."
    it: "Lancio da 10.000 ft (3.048 m) → bersaglio in superficie. Distanza al suolo cinematica di sola andata, a pieno carburante, dal modello di volo adattato di quest'arma sul profilo di traiettoria selezionato. Presuppone un lancio da 10.000 ft (3.048 m) e un bersaglio in superficie. L'altitudine del bersaglio si sottrae a quel vantaggio di quota; un bersaglio alla stessa quota riceve il valore base del livello del mare. Non è autonomia della piattaforma, raggio di combattimento o garanzia d'ingaggio e non presuppone tipo di bersaglio, aspetto, chiusura, movimento o manovra. La difesa automatica usa l'inviluppo di tiro dalla stazione; gli attacchi ordinati e l'arco sulla mappa usano la soluzione di lancio dinamica specifica del bersaglio."
    ja: "10,000 ft（3,048 m）発射 → 水上目標。この兵器の選択された飛行プロファイルにおける、適合済み飛行モデルからの満タン時・片道の運動学的対地距離です。10,000 ft（3,048 m）からの発射と水上目標を前提とします。目標の高度はこの高度優位から差し引かれ、同高度の目標には海面高度の基準値が適用されます。プラットフォームの航続時間、戦闘行動半径、交戦保証ではなく、目標種別、アスペクト、接近率、運動、機動を仮定しません。自動防御はステーション射撃範囲を使用し、命令された攻撃とマップの射程弧は目標固有の現在の発射解を使用します。"
    ko: "10,000ft(3,048m) 고도 발사 → 수상 표적. 이 무장의 선택된 탄도 프로파일에서 보정된 비행 모델이 산출한 완전 연료 편도 운동학적 지상 거리입니다. 10,000ft(3,048m) 고도 발사와 수상 표적을 가정합니다. 표적 고도는 해당 고도 이점에서 차감되며, 같은 고도의 표적은 해수면 기준값을 사용합니다. 플랫폼 체공시간, 전투 반경 또는 교전 보장이 아니며 표적 유형, 방위, 접근률, 운동 또는 기동을 가정하지 않습니다. 자동 방어는 주둔지 사격 범위를 사용하며, 명령된 공격과 지도 사거리 호는 현재 표적별 발사 해를 사용합니다."
    "pt-BR": "Lançamento a 10.000 ft (3.048 m) → alvo na superfície. Distância terrestre cinemática de ida, com tanque cheio, do modelo de voo ajustado desta arma em seu perfil de trajetória selecionado. Pressupõe lançamento a 10.000 ft (3.048 m) e alvo na superfície. A altitude do alvo é subtraída dessa vantagem de altitude; um alvo na mesma altitude recebe a referência ao nível do mar. Não é autonomia da plataforma, raio de combate nem garantia de engajamento e não pressupõe tipo de alvo, aspecto, fechamento, movimento ou manobra. A defesa automática usa o envelope de tiro da estação; ataques ordenados e o arco do mapa usam a solução de lançamento dinâmica específica do alvo."
    ru: "Пуск с 10 000 футов (3 048 м) → надводная цель. Односторонняя кинематическая дальность по земле при полном запасе топлива, вычисленная по подобранной модели полёта этого оружия на выбранном профиле траектории. Предполагает пуск с 10 000 футов (3 048 м) и надводную цель. Высота цели вычитается из этого преимущества по высоте; цель на той же высоте получает базовое значение уровня моря. Это не продолжительность полёта платформы, не боевой радиус и не гарантия поражения, а также не предполагает тип цели, ракурс, сближение, движение или манёвр. Автоматическая оборона использует зону огня со станции; приказные атаки и дуга на карте используют текущий расчёт пуска по конкретной цели."
    zh: "10,000英尺（3,048米）发射 → 水面目标。基于该武器选定弹道剖面的拟合飞行模型计算的满油单程运动学地面距离。它假定从10,000英尺（3,048米）发射并以水面目标为目标。目标高度会从该高度优势中扣除；同高度目标采用海平面基准值。这不是平台续航、作战半径或交战保证，也不假定目标类型、方位、接近率、运动或机动。自动防御使用阵位射击范围；受令攻击和地图射程弧使用当前针对目标的发射解。"
    "zh-TW": "10,000 英尺（3,048 公尺）發射 → 水面目標。依此武器所選彈道剖面的擬合飛行模型計算之滿油單程運動學地面距離。它假定從 10,000 英尺（3,048 公尺）發射並以水面目標為目標。目標高度會從該高度優勢中扣除；同高度目標採用海平面基準值。這不是平台續航、作戰半徑或交戰保證，也不假定目標類型、方位、接近率、運動或機動。自動防禦使用陣位射擊範圍；受令攻擊和地圖射程弧使用目前針對目標的發射解。"
