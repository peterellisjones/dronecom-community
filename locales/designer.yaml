    fr: "Puissance insuffisante : consomme %{needed}, seulement %{free} libres"
    it: "Potenza insufficiente: assorbe %{needed}, solo %{free} liberi"
    ja: "電力不足：%{needed} を消費しますが、空きは %{free} のみ。"
    ko: "전력 부족: %{needed} 소모하지만 %{free}만 남음"
    "pt-BR": "Energia insuficiente: consome %{needed}, apenas %{free} livres"
    ru: "Не хватает энергии: потребляет %{needed}, свободно только %{free}"
    zh: "电力不足：消耗 %{needed}，仅剩 %{free}。"
    "zh-TW": "電力不足：消耗 %{needed}，僅剩 %{free}。"
  # One sentence, two surfaces (#4125): the disabled hover on a warhead the hull
  # cannot deliver, AND the warnings-bar text for
  # ValidationError::WarheadRequiresTargetDomain, so what a player reads before
  # mounting and after cannot drift apart. States the rule, then the remedy —
  # the old copy named the `target_domains` .ron field, which the designer shows
  # nowhere, and the reporter duly went looking for a targeting sensor.
  warhead_no_self_delivery:
    de: "Ein Sprengkopf wird ins Ziel geflogen, was dieser Rumpf nie tut. Stattdessen Munition in der Bewaffnung mitführen."
    en: "A warhead is delivered by flying the vehicle into its target, which this hull never does. Carry a munition in the loadout instead."
    es: "Una cabeza de combate se entrega lanzando el vehículo contra su objetivo, algo que este casco nunca hace. Lleva munición en el armamento en su lugar."
    fr: "Une ogive est délivrée en projetant le véhicule sur sa cible, ce que cette coque ne fait jamais. Emportez plutôt une munition dans l'emport."
    it: "Una testata viene portata a segno lanciando il veicolo sul bersaglio, cosa che questo scafo non fa mai. Imbarca invece una munizione nell'armamento."
    ja: "弾頭は機体ごと目標に突入して届けるものですが、この艇体はそれを行いません。代わりに兵装へ弾薬を搭載してください。"
    ko: "탄두는 기체를 표적에 직접 충돌시켜 투발하지만, 이 선체는 그런 공격을 하지 않습니다. 대신 무장에 탄약을 실으세요."
    "pt-BR": "Uma ogiva é entregue lançando o veículo contra o alvo, o que este casco nunca faz. Leve uma munição no armamento em vez disso."
    ru: "Боеголовка доставляется тараном — самим аппаратом, а этот корпус так не атакует. Вместо неё возьмите боеприпас в загрузку."
    zh: "战斗部依靠载具自身撞向目标来投送，本艇体不会这样攻击。请改为在挂载中携带弹药。"
    "zh-TW": "彈頭依靠載具自身撞向目標來投送，本艇體不會這樣攻擊。請改為在掛載中攜帶彈藥。"
