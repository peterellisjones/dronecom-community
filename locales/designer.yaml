  # Axis glossary tooltip (#2891) — grounded in the sensor that reads this
  # signature: active radar detection (`SensorKind::Radar`).
  sig_rcs_tooltip:
    de: "Radarquerschnitt — wie stark du das aktive Radar eines Gegners reflektierst. Ein größerer RCS bedeutet Entdeckung auf größere Entfernung."
    en: "Radar cross-section — how strongly you reflect an enemy's active radar. A larger RCS means detection at longer range."
    es: "Sección transversal de radar — cuánto reflejas el radar activo enemigo. Un RCS mayor implica detección a mayor distancia."
    fr: "Surface équivalente radar — l'intensité avec laquelle vous réfléchissez le radar actif ennemi. Un RCS plus élevé signifie une détection à plus longue portée."
    it: "Sezione radar equivalente — quanto rifletti il radar attivo nemico. Un RCS maggiore significa rilevamento a distanza maggiore."
    ja: "レーダー反射断面積（RCS）——敵の能動レーダーへの反射の強さ。RCSが大きいほど、より遠距離で探知される。"
    ko: "레이더 반사 단면적(RCS) — 적의 능동 레이더에 얼마나 강하게 반사되는지를 나타냅니다. RCS가 클수록 더 먼 거리에서 탐지됩니다."
    "pt-BR": "Seção transversal de radar — o quanto você reflete o radar ativo inimigo. Um RCS maior significa detecção a maior distância."
    ru: "Эффективная площадь рассеяния (ЭПР) — насколько сильно вы отражаете активный радар противника. Чем больше ЭПР, тем на большей дальности вас обнаружат."
    zh: "雷达反射截面（RCS）——你对敌方主动雷达的反射强度。RCS越大，被探测到的距离就越远。"
    "zh-TW": "雷達反射截面（RCS）——你對敵方主動雷達的反射強度。RCS越大，被偵測到的距離就越遠。"
  sig_ir:
    de: "IR"
    en: "IR"
    es: "IR"
    fr: "IR"
    it: "IR"
    ja: "IR"
    ko: "IR"
    "pt-BR": "IR"
    ru: "ИК"
    zh: "IR"
    "zh-TW": "IR"
  # Axis glossary tooltip (#2891) — grounded in `SensorKind::Ir`, a passive
  # thermal sensor.
  sig_ir_tooltip:
    de: "Infrarotsignatur — von Rumpf und Triebwerken abgestrahlte Wärme. Eine größere IR-Signatur bedeutet Entdeckung auf größere Entfernung durch passive IR-Sensoren."
    en: "Infrared signature — heat radiated by the hull and engines. A larger IR signature means detection at longer range by passive IR sensors."
    es: "Firma infrarroja — calor irradiado por el casco y los motores. Una firma IR mayor implica detección a mayor distancia por sensores IR pasivos."
    fr: "Signature infrarouge — chaleur rayonnée par la coque et les moteurs. Une signature IR plus élevée signifie une détection à plus longue portée par des capteurs IR passifs."
    it: "Firma infrarossa — calore irradiato dallo scafo e dai motori. Una firma IR maggiore significa rilevamento a distanza maggiore da parte di sensori IR passivi."
    ja: "赤外線シグネチャ——船体とエンジンが放射する熱。IRシグネチャが大きいほど、受動IRセンサーによってより遠距離で探知される。"
    ko: "적외선 신호 — 선체와 엔진에서 방출되는 열입니다. IR 신호가 클수록 수동 적외선 센서에 의해 더 먼 거리에서 탐지됩니다."
    "pt-BR": "Assinatura infravermelha — calor irradiado pelo casco e motores. Uma assinatura IR maior significa detecção a maior distância por sensores IV passivos."
    ru: "Инфракрасная сигнатура — тепло, излучаемое корпусом и двигателями. Чем больше ИК-сигнатура, тем на большей дальности вас обнаружат пассивные ИК-датчики."
    zh: "红外特征信号——舰体与发动机辐射的热量。红外特征越大，被被动红外传感器探测到的距离就越远。"
    "zh-TW": "紅外線特徵訊號——艦體與發動機輻射的熱量。紅外線特徵越大，被被動紅外線感測器偵測到的距離就越遠。"
  sig_visual:
    de: "VIS"
    en: "VIS"
    es: "VIS"
    fr: "VIS"
    it: "VIS"
    ja: "目視"
    ko: "시각"
    "pt-BR": "VIS"
    ru: "ВИЗ"
    zh: "目视"
    "zh-TW": "目視"
  # Axis glossary tooltip (#2891) — grounded in `SensorKind::Visual`, a
  # distinct daylight-EO sensor (not merged with IR).
  sig_visual_tooltip:
    de: "Visueller Querschnitt — wie groß du dem Auge oder einer Kamera erscheinst. Eine größere VIS-Signatur bedeutet Entdeckung auf größere Entfernung durch visuelle Sensoren."
    en: "Visual cross-section — how large you appear to the eye or a camera. A larger VISUAL signature means detection at longer range by visual sensors."
    es: "Sección visual — qué tan grande pareces al ojo o a una cámara. Una firma VIS mayor implica detección a mayor distancia por sensores visuales."
    fr: "Surface visuelle — votre taille apparente à l'œil ou à une caméra. Une signature VIS plus élevée signifie une détection à plus longue portée par des capteurs visuels."
    it: "Sezione visiva — quanto appari grande a occhio nudo o a una telecamera. Una firma VIS maggiore significa rilevamento a distanza maggiore da parte di sensori visivi."
    ja: "視覚断面積——肉眼やカメラに映る大きさ。視覚シグネチャが大きいほど、視覚センサーによってより遠距離で探知される。"
    ko: "시각 단면적 — 육안이나 카메라에 얼마나 크게 보이는지를 나타냅니다. 시각 신호가 클수록 시각 센서에 의해 더 먼 거리에서 탐지됩니다."
    "pt-BR": "Seção visual — o quão grande você aparece a olho nu ou para uma câmera. Uma assinatura visual maior significa detecção a maior distância por sensores visuais."
    ru: "Визуальная заметность — насколько крупным вы выглядите невооружённым глазом или в камеру. Чем больше визуальная сигнатура, тем на большей дальности вас обнаружат визуальные датчики."
    zh: "视觉截面——肉眼或摄像头看到的大小。视觉特征越大，被视觉传感器探测到的距离就越远。"
    "zh-TW": "視覺截面——肉眼或攝影機看到的大小。視覺特徵越大，被視覺感測器偵測到的距離就越遠。"
  sig_sonar_noise:
    de: "SONAR"
    en: "SONAR"
    es: "SONAR"
    fr: "SONAR"
    it: "SONAR"
    ja: "ソナー"
    ko: "소나"
    "pt-BR": "SONAR"
    ru: "СОНАР"
    zh: "声纳"
    "zh-TW": "聲納"
  # Axis glossary tooltip (#2891) — grounded in `SensorKind::SonarPassive`:
  # continuous radiated self-noise, distinct from SONAR XS's echo return.
  sig_sonar_noise_tooltip:
    de: "Abgestrahltes Eigengeräusch — das kontinuierliche Geräusch, das Rumpf und Maschinen unter Wasser erzeugen. Lauteres Geräusch bedeutet Entdeckung auf größere Entfernung durch passives Sonar."
    en: "Radiated self-noise — the continuous sound your hull and machinery make underwater. Louder noise means detection at longer range by passive sonar."
    es: "Ruido propio irradiado — el sonido continuo que el casco y la maquinaria producen bajo el agua. Un ruido mayor implica detección a mayor distancia por sonar pasivo."
    fr: "Bruit propre rayonné — le son continu émis par la coque et les machines sous l'eau. Un bruit plus fort signifie une détection à plus longue portée par sonar passif."
    it: "Rumore proprio irradiato — il suono continuo prodotto sott'acqua dallo scafo e dai macchinari. Un rumore maggiore significa rilevamento a distanza maggiore da parte del sonar passivo."
    ja: "自己雑音——船体と機関が水中で発する持続的な音。雑音が大きいほど、受動ソナーによってより遠距離で探知される。"
    ko: "방사 자체 소음 — 선체와 기관이 수중에서 지속적으로 내는 소리입니다. 소음이 클수록 수동 소나에 의해 더 먼 거리에서 탐지됩니다."
    "pt-BR": "Ruído próprio irradiado — o som contínuo que o casco e as máquinas produzem debaixo d'água. Um ruído maior significa detecção a maior distância por sonar passivo."
    ru: "Собственный излучаемый шум — непрерывный звук, создаваемый корпусом и механизмами под водой. Чем громче шум, тем на большей дальности вас обнаружит пассивный гидролокатор."
    zh: "自身辐射噪声——舰体与机械在水下持续发出的声音。噪声越大，被被动声纳探测到的距离就越远。"
    "zh-TW": "自身輻射噪音——艦體與機械在水下持續發出的聲音。噪音越大，被被動聲納偵測到的距離就越遠。"
  sig_sonar_xs:
    de: "SONAR XS"
