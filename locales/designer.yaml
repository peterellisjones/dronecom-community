    "pt-BR": "Capacidade de pontos de vida do casco — quanto dano este projeto consegue absorver antes de ser destruído."
    ru: "Запас прочности корпуса — сколько повреждений этот проект способен выдержать до уничтожения."
    zh: "船体生命值容量 —— 该设计在被摧毁前能够承受的伤害量。"
    "zh-TW": "船體生命值容量 —— 該設計在被摧毀前能夠承受的傷害量。"
  # A fitted munition has two fixed-condition projections from one cached
  # full-fuel flight model. They are not endurance, radius, or engagement claims.
  sea_level_to_surface_reach:
    de: "Start auf Meereshöhe → Oberflächenziel:"
    en: "Sea-level launch → surface target:"
    es: "Lanzamiento al nivel del mar → objetivo en superficie:"
    fr: "Lancement au niveau de la mer → cible en surface :"
    it: "Lancio dal livello del mare → bersaglio in superficie:"
    ja: "海面高度発射 → 水上目標:"
    ko: "해수면 고도 발사 → 수상 표적:"
    "pt-BR": "Lançamento ao nível do mar → alvo na superfície:"
    ru: "Пуск с уровня моря → надводная цель:"
    zh: "海平面发射 → 水面目标："
    "zh-TW": "海平面發射 → 水面目標："
  sea_level_to_surface_reach_tooltip:
    de: "Start auf Meereshöhe → Oberflächenziel. Kinematische Bodenentfernung bei vollem Tank und einfacher Strecke aus dem angepassten Flugmodell dieser Waffe auf ihrem gewählten Flugprofil. Sie setzt einen Start auf Meereshöhe und ein Oberflächenziel voraus. Sie ist weder Plattformausdauer noch Kampfradius noch eine Einsatzgarantie. Sie trifft keine Annahme über Zieltyp, Aspekt, Annäherung, Bewegung oder Manöver. Automatische Verteidigung nutzt den Stationsfeuerbereich; befohlene Angriffe und der Kartenbogen nutzen die aktuelle zielspezifische Feuerlösung."
    en: "Sea-level launch → surface target. Full-fuel, one-way kinematic ground distance from this weapon's fitted flight model on its selected trajectory profile. It assumes a sea-level launch and a surface target. It is not platform endurance, combat radius, or an engagement guarantee. It has no target type, aspect, closure, motion, or maneuver assumption. Automatic Defend uses the station-fire envelope; ordered attacks and the map arc use the live target-specific launch solution."
    es: "Lanzamiento al nivel del mar → objetivo en superficie. Distancia terrestre cinemática de ida, con combustible completo, del modelo de vuelo ajustado de esta arma en su perfil de trayectoria seleccionado. Supone un lanzamiento al nivel del mar y un objetivo en superficie. No es autonomía de plataforma, radio de combate ni garantía de enfrentamiento. No supone tipo de objetivo, aspecto, cierre, movimiento ni maniobra. La defensa automática usa la envolvente de fuego desde estación; los ataques ordenados y el arco del mapa usan la solución de lanzamiento actual específica del objetivo."
    fr: "Lancement au niveau de la mer → cible en surface. Distance au sol cinématique en aller simple, plein de carburant, issue du modèle de vol ajusté de cette arme sur son profil de trajectoire sélectionné. Elle suppose un lancement au niveau de la mer et une cible en surface. Ce n'est ni l'autonomie de la plateforme, ni le rayon de combat, ni une garantie d'engagement. Elle ne suppose ni type de cible, ni aspect, ni rapprochement, ni mouvement, ni manœuvre. La défense automatique utilise l'enveloppe de tir depuis la station ; les attaques ordonnées et l'arc de carte utilisent la solution de lancement dynamique propre à la cible."
    it: "Lancio dal livello del mare → bersaglio in superficie. Distanza al suolo cinematica di sola andata, a pieno carburante, dal modello di volo adattato di quest'arma sul profilo di traiettoria selezionato. Presuppone un lancio dal livello del mare e un bersaglio in superficie. Non è autonomia della piattaforma, raggio di combattimento o garanzia d'ingaggio. Non presuppone tipo di bersaglio, aspetto, chiusura, movimento o manovra. La difesa automatica usa l'inviluppo di tiro dalla stazione; gli attacchi ordinati e l'arco sulla mappa usano la soluzione di lancio dinamica specifica del bersaglio."
    ja: "海面高度発射 → 水上目標。この兵器の選択された飛行プロファイルにおける、適合済み飛行モデルからの満タン時・片道の運動学的対地距離です。海面高度からの発射と水上目標を前提とします。プラットフォームの航続時間、戦闘行動半径、交戦保証ではありません。目標種別、アスペクト、接近率、運動、機動を仮定しません。自動防御はステーション射撃範囲を使用し、命令された攻撃とマップの射程弧は目標固有の現在の発射解を使用します。"
    ko: "해수면 고도 발사 → 수상 표적. 이 무장의 선택된 탄도 프로파일에서 보정된 비행 모델이 산출한 완전 연료 편도 운동학적 지상 거리입니다. 해수면 고도 발사와 수상 표적을 가정합니다. 플랫폼 체공시간, 전투 반경 또는 교전 보장이 아닙니다. 표적 유형, 방위, 접근률, 운동 또는 기동을 가정하지 않습니다. 자동 방어는 주둔지 사격 범위를 사용하며, 명령된 공격과 지도 사거리 호는 현재 표적별 발사 해를 사용합니다."
    "pt-BR": "Lançamento ao nível do mar → alvo na superfície. Distância terrestre cinemática de ida, com tanque cheio, do modelo de voo ajustado desta arma em seu perfil de trajetória selecionado. Pressupõe lançamento ao nível do mar e alvo na superfície. Não é autonomia da plataforma, raio de combate nem garantia de engajamento. Não pressupõe tipo de alvo, aspecto, fechamento, movimento ou manobra. A defesa automática usa o envelope de tiro da estação; ataques ordenados e o arco do mapa usam a solução de lançamento dinâmica específica do alvo."
    ru: "Пуск с уровня моря → надводная цель. Односторонняя кинематическая дальность по земле при полном запасе топлива, вычисленная по подобранной модели полёта этого оружия на выбранном профиле траектории. Предполагает пуск с уровня моря и надводную цель. Это не продолжительность полёта платформы, не боевой радиус и не гарантия поражения. Не предполагает тип цели, ракурс, сближение, движение или манёвр. Автоматическая оборона использует зону огня со станции; приказные атаки и дуга на карте используют текущий расчёт пуска по конкретной цели."
    zh: "海平面发射 → 水面目标。基于该武器选定弹道剖面的拟合飞行模型计算的满油单程运动学地面距离。它假定从海平面发射并以水面目标为目标。这不是平台续航、作战半径或交战保证；不假定目标类型、方位、接近率、运动或机动。自动防御使用阵位射击范围；受令攻击和地图射程弧使用当前针对目标的发射解。"
    "zh-TW": "海平面發射 → 水面目標。依此武器所選彈道剖面的擬合飛行模型計算之滿油單程運動學地面距離。它假定從海平面發射並以水面目標為目標。這不是平台續航、作戰半徑或交戰保證；不假定目標類型、方位、接近率、運動或機動。自動防禦使用陣位射擊範圍；受令攻擊和地圖射程弧使用目前針對目標的發射解。"
