  # Status shown for a user design whose nested blueprint reference does not
  # resolve against the library — typically a design nesting a Workshop
  # blueprint whose mod is uninstalled (#3070). The design is retained but has
  # no materialized recipe, so it cannot be built or edited until the reference
  # is restored.
  unresolvable:
    de: "nicht auflösbar"
    en: "unresolvable"
    es: "no resoluble"
    fr: "non résolu"
    it: "non risolvibile"
