  gloss_sensor_kind:
    de: "Das Signal, das dieser Sensor erfasst."
    en: "The signal this sensor reads."
    es: "La señal que percibe este sensor."
    fr: "Le signal que capte ce capteur."
    it: "Il segnale che rileva questo sensore."
    ja: "このセンサーが読み取る信号。"
    ko: "이 센서가 감지하는 신호입니다."
    "pt-BR": "O sinal que este sensor lê."
    ru: "Сигнал, который считывает этот датчик."
    zh: "该传感器读取的信号。"
    "zh-TW": "該感測器讀取的信號。"
  gloss_role:
    de: "Was dieser Sensor leistet. Ein Such-Sensor baut das Lagebild auf; ein Feuerleit-Sensor kann überhaupt nicht suchen — er schaltet sich auf eine ihm zugewiesene Spur auf, um eine Waffe zu leiten."
    en: "What this set does. A search set builds the tactical picture; a fire-control set cannot search at all — it locks onto a track it has been cued onto, to guide a weapon."
    es: "Qué hace este conjunto. Un conjunto de búsqueda construye el cuadro táctico; un conjunto de control de fuego no puede buscar en absoluto: se engancha a una traza que se le ha designado, para guiar un arma."
    fr: "Ce que fait ce capteur. Un capteur de recherche construit le tableau tactique ; un capteur de contrôle de tir ne peut pas du tout rechercher — il se verrouille sur une piste qui lui a été désignée, pour guider une arme."
    it: "Cosa fa questo set. Un set di ricerca costruisce il quadro tattico; un set di controllo del fuoco non può affatto cercare — si aggancia a una traccia che gli è stata designata, per guidare un'arma."
    ja: "このセットが何を行うか。捜索セットは戦術状況図を構築する。射撃管制セットはまったく捜索できない——指示された航跡にロックオンし、兵器を誘導するだけだ。"
    ko: "이 세트가 무엇을 하는지. 탐색 세트는 전술 상황도를 구축한다. 사격 통제 세트는 전혀 탐색할 수 없다 — 지정된 항적에 잠금을 걸어 무기를 유도할 뿐이다."
    "pt-BR": "O que este conjunto faz. Um conjunto de busca constrói o quadro tático; um conjunto de controle de fogo não pode buscar de forma alguma — ele trava em uma trilha que lhe foi designada, para guiar uma arma."
    ru: "Что делает этот комплект. Поисковый комплект строит тактическую картину; комплект управления огнём вообще не может вести поиск — он захватывает трек, на который был наведён, чтобы наводить оружие."
    zh: "该传感器能做什么。搜索型传感器构建战术态势图；火控型传感器完全无法搜索——它只能锁定被指示给它的航迹，以引导武器。"
    "zh-TW": "該感測器能做什麼。搜索型感測器建構戰術態勢圖；火控型感測器完全無法搜索——它只能鎖定被指示給它的航跡，以引導武器。"
  gloss_track_file:
    de: "Wie viele Kontakte dieser Sensor gleichzeitig halten kann. Über dem Limit verwirft er die schwächsten Spuren."
    en: "How many contacts this set can hold at once. Past the limit it starts dropping the weakest tracks."
    es: "Cuántos contactos puede mantener este conjunto a la vez. Superado el límite, empieza a descartar las trazas más débiles."
    fr: "Combien de contacts ce capteur peut contenir à la fois. Au-delà de la limite, il commence à abandonner les pistes les plus faibles."
    it: "Quanti contatti questo set può contenere alla volta. Superato il limite, inizia a scartare le tracce più deboli."
    ja: "このセットが同時に保持できる接触の数。上限を超えると、最も弱い航跡から取りこぼし始める。"
    ko: "이 세트가 동시에 보유할 수 있는 접촉 수. 한도를 넘으면 가장 약한 항적부터 놓치기 시작한다."
    "pt-BR": "Quantos contatos este conjunto pode manter de uma vez. Além do limite, ele começa a descartar as trilhas mais fracas."
    ru: "Сколько контактов может одновременно удерживать этот комплект. При превышении предела он начинает терять слабейшие треки."
    zh: "该传感器一次能保持多少个接触。超过上限后，会开始丢弃信号最弱的航迹。"
    "zh-TW": "該感測器一次能保持多少個接觸。超過上限後，會開始丟棄訊號最弱的航跡。"
  gloss_locks:
    de: "Wie viele Feuerleit-Aufschaltungen dieser Sensor gleichzeitig halten kann. Jede geleitete Waffe im Flug benötigt eine."
    en: "How many fire-control locks this set can hold at once. Each guided weapon in flight needs one."
    es: "Cuántos enganches de control de fuego puede mantener este conjunto a la vez. Cada arma guiada en vuelo necesita uno."
    fr: "Combien de verrouillages de contrôle de tir ce capteur peut contenir à la fois. Chaque arme guidée en vol en nécessite un."
    it: "Quanti agganci di controllo del fuoco questo set può contenere alla volta. Ogni arma guidata in volo ne richiede uno."
    ja: "このセットが同時に保持できる射撃管制ロックの数。飛行中の誘導兵器1発につき1つ必要となる。"
    ko: "이 세트가 동시에 보유할 수 있는 사격 통제 잠금 수. 비행 중인 유도 무기 하나당 하나가 필요하다."
    "pt-BR": "Quantas travas de controle de fogo este conjunto pode manter de uma vez. Cada arma guiada em voo precisa de uma."
    ru: "Сколько захватов управления огнём может одновременно удерживать этот комплект. Каждому управляемому оружию в полёте нужен один."
    zh: "该传感器一次能保持多少个火控锁定。每枚飞行中的制导武器都需要一个。"
    "zh-TW": "該感測器一次能保持多少個火控鎖定。每枚飛行中的導引武器都需要一個。"
  gloss_lock_warning:
    de: "Ob dieser Sensor dich warnt, wenn sich etwas anderes auf dich aufschaltet."
    en: "Whether this set warns you when something else locks onto you."
    es: "Si este conjunto te avisa cuando algo se engancha a ti."
    fr: "Si ce capteur vous avertit lorsque quelque chose d'autre se verrouille sur vous."
    it: "Se questo set ti avvisa quando qualcos'altro si aggancia a te."
    ja: "何か他のものが自分にロックオンしてきたとき、このセットが警告するかどうか。"
    ko: "다른 무언가가 잠금을 걸어올 때 이 세트가 경고하는지 여부."
    "pt-BR": "Se este conjunto avisa você quando algo trava em você."
    ru: "Предупреждает ли этот комплект вас, когда что-то захватывает вас."
    zh: "该传感器是否会在被其他目标锁定时警告你。"
    "zh-TW": "該感測器是否會在被其他目標鎖定時警告你。"
  gloss_concurrency:
    de: "Ob dieser Sensor weitersuchen kann, während er eine Aufschaltung hält, oder die Suche unterbrechen muss, um eine zu halten."
    en: "Whether this set can keep searching while it holds a lock, or must stop searching to hold one."
    es: "Si este conjunto puede seguir buscando mientras mantiene un enganche, o debe dejar de buscar para mantener uno."
    fr: "Si ce capteur peut continuer à rechercher tout en maintenant un verrouillage, ou doit arrêter de rechercher pour en maintenir un."
    it: "Se questo set può continuare a cercare mentre mantiene un aggancio, o deve interrompere la ricerca per mantenerne uno."
    ja: "このセットがロックを保持しながら捜索を続けられるか、それとも保持するために捜索を止めなければならないか。"
    ko: "이 세트가 잠금을 유지하면서 계속 탐색할 수 있는지, 아니면 유지하려면 탐색을 멈춰야 하는지."
    "pt-BR": "Se este conjunto pode continuar buscando enquanto mantém uma trava, ou precisa parar de buscar para mantê-la."
    ru: "Может ли этот комплект продолжать поиск, удерживая захват, или должен прекратить поиск, чтобы его удерживать."
    zh: "该传感器能否在保持锁定的同时继续搜索，还是必须停止搜索才能保持锁定。"
    "zh-TW": "該感測器能否在保持鎖定的同時繼續搜索，還是必須停止搜索才能保持鎖定。"
  gloss_rep_range_em:
    de: "Gegen ein %{air} (Luft) oder ein %{surface} (Oberfläche), klare Bedingungen, freie Sichtlinie angenommen.%{offmap}"
    en: "Vs a %{air} (air) or a %{surface} (surface), clear conditions, line of sight assumed.%{offmap}"
    es: "Frente a un %{air} (aire) o un %{surface} (superficie), condiciones despejadas, línea de visión asumida.%{offmap}"
    fr: "Face à un %{air} (air) ou un %{surface} (surface), conditions dégagées, ligne de vue supposée.%{offmap}"
    it: "Contro un %{air} (aria) o un %{surface} (superficie), condizioni favorevoli, linea di vista presunta.%{offmap}"
    ja: "%{air}（空中）または%{surface}（水上）に対して、晴天・視線良好を仮定。%{offmap}"
    ko: "%{air}(공중) 또는 %{surface}(수상) 기준, 맑은 조건에서 시선 확보를 가정합니다.%{offmap}"
    "pt-BR": "Contra um %{air} (ar) ou um %{surface} (superfície), condições claras, linha de visão presumida.%{offmap}"
    ru: "Против %{air} (воздух) или %{surface} (поверхность), ясные условия, прямая видимость предполагается.%{offmap}"
    zh: "对%{air}（空中）或%{surface}（水面），晴朗条件，假定视线通畅。%{offmap}"
    "zh-TW": "對%{air}（空中）或%{surface}（水面），晴朗條件，假定視線通暢。%{offmap}"
  gloss_rep_range_sonar:
    de: "Gegen ein %{surface} (Oberfläche) oder ein %{subsurface} (getaucht), klare Bedingungen, Ziel mit Marschfahrt.%{offmap}"
    en: "Vs a %{surface} (surface) or a %{subsurface} (submerged), clear conditions, target at cruise speed.%{offmap}"
    es: "Frente a un %{surface} (superficie) o un %{subsurface} (sumergido), condiciones despejadas, objetivo a velocidad de crucero.%{offmap}"
    fr: "Face à un %{surface} (surface) ou un %{subsurface} (immergé), conditions dégagées, cible à vitesse de croisière.%{offmap}"
    it: "Contro un %{surface} (superficie) o un %{subsurface} (immerso), condizioni favorevoli, bersaglio a velocità di crociera.%{offmap}"
    ja: "%{surface}（水上）または%{subsurface}（水中）に対して、晴天・巡航速度の目標を仮定。%{offmap}"
    ko: "%{surface}(수상) 또는 %{subsurface}(수중) 기준, 맑은 조건, 순항 속도의 표적입니다.%{offmap}"
    "pt-BR": "Contra um %{surface} (superfície) ou um %{subsurface} (submerso), condições claras, alvo em velocidade de cruzeiro.%{offmap}"
    ru: "Против %{surface} (поверхность) или %{subsurface} (в погружённом состоянии), ясные условия, цель на крейсерской скорости.%{offmap}"
    zh: "对%{surface}（水面）或%{subsurface}（水下），晴朗条件，目标处于巡航速度。%{offmap}"
    "zh-TW": "對%{surface}（水面）或%{subsurface}（水下），晴朗條件，目標處於巡航速度。%{offmap}"
  gloss_rep_range_esm:
    de: "Gegen die Emissionen eines strahlenden %{emitter}, klare Bedingungen, freie Sichtlinie angenommen.%{offmap}"
    en: "Vs the emissions of a radiating %{emitter}, clear conditions, line of sight assumed.%{offmap}"
    es: "Frente a las emisiones de un %{emitter} en emisión, condiciones despejadas, línea de visión asumida.%{offmap}"
    fr: "Face aux émissions d'un %{emitter} en émission, conditions dégagées, ligne de vue supposée.%{offmap}"
    it: "Contro le emissioni di un %{emitter} irradiante, condizioni favorevoli, linea di vista presunta.%{offmap}"
    ja: "放射中の%{emitter}の放射に対して、晴天・視線良好を仮定。%{offmap}"
    ko: "방사 중인 %{emitter}의 방사 기준, 맑은 조건에서 시선 확보를 가정합니다.%{offmap}"
    "pt-BR": "Contra as emissões de um %{emitter} irradiando, condições claras, linha de visão presumida.%{offmap}"
    ru: "Против излучения работающего %{emitter}, ясные условия, прямая видимость предполагается.%{offmap}"
    zh: "对正在辐射的%{emitter}发射信号，晴朗条件，假定视线通畅。%{offmap}"
    "zh-TW": "對正在輻射的%{emitter}發射信號，晴朗條件，假定視線通暢。%{offmap}"
  gloss_rep_range_offmap:
    de: "Reicht bis über die Karte hinaus (+) — überall auf der Karte erfasst."
    en: "Range spans the whole map (+) — detected anywhere on it."
    es: "El alcance cubre todo el mapa (+): detectado en cualquier punto."
    fr: "La portée couvre toute la carte (+) — détecté partout dessus."
    it: "La portata copre tutta la mappa (+) — rilevato ovunque su di essa."
    ja: "探知距離がマップ全域に及ぶ（+）——どこでも探知。"
    ko: "탐지 거리가 맵 전역에 미침(+) — 어디서나 탐지."
    "pt-BR": "O alcance cobre todo o mapa (+) — detectado em qualquer ponto."
    ru: "Дальность покрывает всю карту (+) — обнаруживается в любой её точке."
    zh: "探测距离覆盖全图（+）——任意位置均可探知。"
    "zh-TW": "探測距離覆蓋全圖（+）——任意位置均可探知。"
  gloss_threshold:
    de: "Erfassungsschwelle — niedriger bedeutet größere Reichweite; siehe Referenzreichweite."
    en: "Detection floor — lower means longer range; see Rep Range."
    es: "Umbral de detección — más bajo significa mayor alcance; ver Alcance de referencia."
    fr: "Seuil de détection — plus bas signifie plus de portée ; voir Portée de référence."
    it: "Soglia di rilevamento — più basso significa maggiore portata; vedi Portata di riferimento."
    ja: "探知限界：低いほど探知距離が伸びる。基準距離を参照。"
    ko: "탐지 한계: 낮을수록 탐지거리가 길어집니다. 기준 거리 참고."
    "pt-BR": "Limite de detecção — quanto mais baixo, maior o alcance; ver Alcance de referência."
    ru: "Порог обнаружения — чем ниже, тем больше дальность; см. эталонную дальность."
    zh: "探测门限——越低探测距离越远；参见参考距离。"
    "zh-TW": "偵測門限——越低偵測距離越遠；參見參考距離。"
  gloss_scan_interval:
    de: "Wie oft die Kontakte dieses Sensors aktualisiert werden."
    en: "How often this sensor's contacts update."
    es: "Con qué frecuencia se actualizan los contactos de este sensor."
    fr: "À quelle fréquence les contacts de ce capteur sont actualisés."
    it: "Con quale frequenza vengono aggiornati i contatti di questo sensore."
    ja: "このセンサーのコンタクトが更新される頻度。"
    ko: "이 센서의 접촉 정보가 갱신되는 빈도입니다."
    "pt-BR": "Com que frequência os contatos deste sensor são atualizados."
    ru: "Как часто обновляются контакты этого датчика."
    zh: "该传感器的目标信息更新频率。"
    "zh-TW": "該感測器的目標資訊更新頻率。"
  gloss_fov:
    de: "Suchkegel; Ziele außerhalb werden nicht erfasst."
    en: "Search cone; targets outside are not seen."
    es: "Cono de búsqueda; los objetivos fuera de él no se detectan."
    fr: "Cône de recherche ; les cibles en dehors ne sont pas détectées."
    it: "Cono di ricerca; i bersagli al di fuori non vengono rilevati."
    ja: "探索円錐。範囲外の目標は探知されない。"
    ko: "탐색 원뿔. 범위 밖의 표적은 탐지되지 않습니다."
    "pt-BR": "Cone de busca; alvos fora dele não são detectados."
    ru: "Конус поиска; цели за его пределами не обнаруживаются."
    zh: "搜索锥角；范围外的目标不会被探测到。"
    "zh-TW": "搜索錐角；範圍外的目標不會被偵測到。"
  gloss_iff_margin:
    de: "IFF wirkt um diesen Betrag kürzer als die Erfassungsreichweite."
    en: "IFF works at shorter range than detection by this margin."
    es: "El IFF actúa a menor alcance que la detección, en este margen."
    fr: "L'IFF agit à une portée plus courte que la détection, de cette marge."
    it: "L'IFF opera a distanza minore del rilevamento, di questo margine."
    ja: "IFFはこのマージン分、探知より短い距離で機能する。"
    ko: "IFF는 이 여유만큼 탐지보다 짧은 거리에서 작동합니다."
    "pt-BR": "O IFF atua a uma distância menor que a detecção, nessa margem."
    ru: "IFF работает на дальности короче обнаружения на эту величину."
    zh: "IFF的作用距离比探测短这一余量。"
    "zh-TW": "IFF的作用距離比偵測短這一餘量。"
  gloss_active:
    de: "Strahlt — für feindliches ESM auch über die eigene Reichweite hinaus sichtbar; unter EMCON stumm."
    en: "Radiates — visible to enemy ESM beyond its own range; silenced under EMCON."
    es: "Radia — visible para el ESM enemigo más allá de su propio alcance; silenciado bajo EMCON."
    fr: "Émet — visible par l'ESM ennemi au-delà de sa propre portée ; réduit au silence sous EMCON."
    it: "Irradia — visibile all'ESM nemico oltre la propria portata; silenziato sotto EMCON."
    ja: "放射する：自らの探知距離を超えて敵ESMに見える。EMCON下では沈黙する。"
    ko: "방사합니다: 자신의 탐지 거리를 넘어서도 적 ESM에 노출됩니다. EMCON 하에서는 침묵합니다."
    "pt-BR": "Irradia — visível ao ESM inimigo além do seu próprio alcance; silenciado sob EMCON."
    ru: "Излучает — виден вражескому ESM за пределами собственной дальности; молчит при EMCON."
    zh: "辐射——超出自身探测距离仍可被敌方ESM发现；EMCON下静默。"
    "zh-TW": "輻射——超出自身偵測距離仍可被敵方ESM發現；EMCON下靜默。"
  gloss_passive:
    de: "Nur Empfang; für feindliches ESM unsichtbar."
    en: "Listens only; invisible to enemy ESM."
    es: "Solo escucha; invisible para el ESM enemigo."
    fr: "Écoute uniquement ; invisible pour l'ESM ennemi."
    it: "Solo ascolto; invisibile all'ESM nemico."
    ja: "受信のみ。敵ESMに探知されない。"
    ko: "수신 전용. 적 ESM에 보이지 않습니다."
    "pt-BR": "Apenas escuta; invisível ao ESM inimigo."
    ru: "Только приём; невидим для вражеского ESM."
    zh: "仅接收；敌方ESM无法发现。"
    "zh-TW": "僅接收；敵方ESM無法發現。"
  gloss_accuracy:
    de: "Typischer Messfehler; kleiner bedeutet präziser."
    en: "Typical measurement error; smaller is more precise."
    es: "Error de medición típico; cuanto menor, más preciso."
    fr: "Erreur de mesure typique ; plus elle est petite, plus la précision est élevée."
    it: "Errore di misura tipico; più è piccolo, più è preciso."
    ja: "標準測定誤差。値が小さいほど精度が高い。"
    ko: "일반적인 측정 오차. 값이 작을수록 정밀합니다."
    "pt-BR": "Erro de medição típico; quanto menor, mais preciso."
    ru: "Типичная погрешность измерения; чем меньше, тем точнее."
    zh: "典型测量误差；数值越小精度越高。"
    "zh-TW": "典型測量誤差；數值越小精度越高。"
  gloss_physics:
    de: "Bestimmt Messgenauigkeit und Auflösung — nicht die Erfassungsreichweite."
    en: "Sets measurement accuracy and resolution — not detection range."
    es: "Determina la precisión y resolución de la medición — no el alcance de detección."
    fr: "Détermine la précision et la résolution de mesure — pas la portée de détection."
    it: "Determina precisione e risoluzione di misura — non la portata di rilevamento."
    ja: "測定精度と分解能を設定する。探知距離ではない。"
    ko: "측정 정밀도와 분해능을 결정합니다. 탐지 거리와는 무관합니다."
    "pt-BR": "Define a precisão e a resolução da medição — não o alcance de detecção."
    ru: "Определяет точность и разрешение измерения — не дальность обнаружения."
    zh: "决定测量精度与分辨率——与探测距离无关。"
    "zh-TW": "決定測量精度與解析度——與偵測距離無關。"
  gloss_damage:
    de: "Maximaler Schaden, der über den Explosionsradius abnimmt."
    en: "Peak damage, falling off across the blast radius."
    es: "Daño máximo, que disminuye a lo largo del radio de explosión."
    fr: "Dégâts maximaux, diminuant sur le rayon d'explosion."
    it: "Danno massimo, che diminuisce lungo il raggio di esplosione."
    ja: "最大ダメージ。爆発半径内で減衰する。"
    ko: "최대 피해량이며, 폭발 반경에 걸쳐 감소합니다."
    "pt-BR": "Dano máximo, diminuindo ao longo do raio de explosão."
    ru: "Максимальный урон, убывающий на протяжении радиуса взрыва."
    zh: "峰值伤害，在爆炸半径内递减。"
    "zh-TW": "峰值傷害，在爆炸半徑內遞減。"
  gloss_blast_radius:
    de: "Der Schaden fällt auf dieser Distanz auf null ab."
