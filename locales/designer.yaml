  # scoped child `Ui`) silently escapes the grid's wrap layout regardless of
  # `label_value_grid_bounded`; `stat_with_tooltip` renders straight into the
  # grid's own `Ui` instead, so it both fixes the overflow and gives LAUNCH
  # parity with RECOVERY's existing tooltip.
  launch_requires_tooltip:
    de: "Die Einrichtung, von der aus dieser Entwurf starten muss — eine davon an Bord des Trägers genügt; der Entwurf braucht nicht alle."
