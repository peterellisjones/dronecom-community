      "pt-BR": "Defina se este projeto retorna automaticamente por combustível bingo, Winchester, qualquer condição ou nunca."
      ru: "Задайте автоматический возврат этой конструкции при топливе «Бинго», состоянии Winchester, любом из них или никогда."
      zh: "设置此设计在燃油达到 Bingo、弹药耗尽、任一条件或从不自动返航。"
      "zh-TW": "設定此設計在燃油達到 Bingo、彈藥耗盡、任一條件或從不自動返航。"
    warning:
      roe_no_weapons:
        de: "Fahrzeug hat keine Waffen; ROE wird kein Feuer auslösen."
        en: "Vehicle has no weapons; ROE will never trigger fire."
        es: "El vehículo no tiene armas; las ROE nunca activarán fuego."
        fr: "Le véhicule n'a pas d'armes ; les ROE ne déclencheront jamais le feu."
        it: "Il veicolo non ha armi; le ROE non attiveranno mai il fuoco."
        ja: "この機体は武装なし。ROEが射撃を行うことはない。"
        ko: "이 차량에는 무기가 없습니다; ROE가 발포를 유발하지 않습니다."
        "pt-BR": "O veículo não tem armas; as ROE nunca ativarão o fogo."
        ru: "Аппарат не имеет вооружения; ПОП не вызовет открытие огня."
        zh: "该载具无武器；交战规则不会触发开火。"
        "zh-TW": "該載具無武器；交戰規則不會觸發開火。"
      emcon_no_emitters:
        de: "Fahrzeug hat keine aktiven Sensoren; EMCON Aktiv hat keine Wirkung."
        en: "Vehicle has no active sensors; EMCON Active has no effect."
        es: "El vehículo no tiene sensores activos; EMCON activo no tiene efecto."
        fr: "Le véhicule n'a pas de capteurs actifs ; EMCON actif n'a aucun effet."
        it: "Il veicolo non ha sensori attivi; EMCON attivo non ha effetto."
        ja: "この機体には能動センサーがない。EMCON能動は効果なし。"
        ko: "이 차량에는 능동 센서가 없습니다; EMCON 활성화는 효과 없음."
        "pt-BR": "O veículo não tem sensores ativos; EMCON ativo não tem efeito."
        ru: "Аппарат не имеет активных датчиков; EMCON (активный) не имеет эффекта."
        zh: "该载具无主动传感器；EMCON主动无效。"
        "zh-TW": "該載具無主動感測器；EMCON主動無效。"
