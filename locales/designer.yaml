  # part needs, and what is actually free (already net of any
  # SoleInCategory swap credit), rendered through the Weight / PowerKw measure
  # newtypes so the unit rides them (ADR-0005).
  over_weight_budget:
    de: "Zu schwer: benötigt %{needed}, nur %{free} frei"
    en: "Too heavy: needs %{needed}, only %{free} free"
    es: "Demasiado pesado: necesita %{needed}, solo %{free} libres"
    fr: "Trop lourd : nécessite %{needed}, seulement %{free} libres"
    it: "Troppo pesante: richiede %{needed}, solo %{free} liberi"
    ja: "重量超過：%{needed} 必要ですが、空きは %{free} のみ。"
    ko: "중량 초과: %{needed} 필요하지만 %{free}만 남음"
    "pt-BR": "Pesado demais: precisa de %{needed}, apenas %{free} livres"
    ru: "Слишком тяжёлый: требуется %{needed}, свободно только %{free}"
    zh: "超重：需要 %{needed}，仅剩 %{free}。"
    "zh-TW": "超重：需要 %{needed}，僅剩 %{free}。"
  over_power_budget:
