  lane_logistics_tooltip:
    de: "Logistik: Treibstoff und Ersatzteile. Sie werden aus Beständen geliefert statt auf einer Werft gebaut, daher hat diese Spur einen eigenen Bauplatz und wartet nie hinter einer Plattform."
    en: "Logistics: fuel and spare parts. They are delivered from stock rather than built in a yard, so this lane has its own build slot and never waits behind a platform."
    es: "Logística: combustible y repuestos. Se entregan del inventario en lugar de construirse en un astillero, así que esta vía tiene su propia ranura de producción y nunca espera detrás de una plataforma."
    fr: "Logistique : carburant et pièces de rechange. Livrés sur stock plutôt que construits en chantier, cette file dispose donc de son propre poste de production et n'attend jamais derrière une plateforme."
    it: "Logistica: carburante e ricambi. Vengono consegnati dalle scorte anziché costruiti in cantiere, quindi questa corsia ha una propria postazione di produzione e non attende mai dietro a una piattaforma."
    ja: "補給：燃料と予備部品。造船所で建造されるのではなく在庫から供給されます。このレーンは独自の生産枠を持ち、プラットフォームの後ろで待つことはありません。"
    ko: "군수: 연료와 예비 부품. 조선소에서 건조하는 대신 재고에서 공급됩니다. 이 레인은 자체 생산 슬롯을 가지며 플랫폼 뒤에서 대기하지 않습니다."
    "pt-BR": "Logística: combustível e peças de reposição. São entregues do estoque em vez de construídos em estaleiro, então esta faixa tem seu próprio posto de produção e nunca espera atrás de uma plataforma."
    ru: "Снабжение: топливо и запасные части. Они поставляются со склада, а не строятся на верфи, поэтому эта линия имеет собственный производственный слот и никогда не ждёт позади платформы."
    zh: "补给：燃料与备件。它们从库存交付，而非在船厂建造，因此本通道拥有独立的生产位，绝不会排在平台之后等待。"
    "zh-TW": "補給：燃料與備件。它們從庫存交付，而非在船廠建造，因此本通道擁有獨立的生產位，絕不會排在平台之後等待。"
  lane_construction:
    de: "FERTIGUNG"
    en: "CONSTRUCTION"
    es: "CONSTRUCCIÓN"
    fr: "CONSTRUCTION"
    it: "COSTRUZIONE"
    ja: "建造"
    ko: "건조"
    "pt-BR": "CONSTRUÇÃO"
    ru: "ПОСТРОЙКА"
    zh: "建造"
    "zh-TW": "建造"
  lane_construction_tooltip:
    de: "Fertigung: alles, was aus einem Entwurf auf einer Werft gebaut wird — Plattformrümpfe wie auch Lenkwaffen. Es wird immer nur eines gebaut, und ein noch unbezahlbarer Auftrag hält die Spur an, während sich das Guthaben ansammelt."
    en: "Construction: anything built from a design in a yard — platform hulls and munition rounds alike. One builds at a time, and an order you cannot yet afford holds this lane while the balance builds up."
    es: "Construcción: todo lo que se fabrica a partir de un diseño en un astillero, tanto cascos de plataformas como municiones. Se construye uno cada vez, y un pedido que aún no puedes pagar retiene esta vía mientras se acumula el saldo."
    fr: "Construction : tout ce qui est fabriqué en chantier à partir d'un plan — coques de plateformes comme munitions. Une seule à la fois, et une commande que vous ne pouvez pas encore payer bloque cette file le temps que le solde s'accumule."
    it: "Costruzione: tutto ciò che viene fabbricato in cantiere a partire da un progetto, sia scafi di piattaforme sia munizioni. Se ne costruisce uno alla volta, e un ordine che non puoi ancora permetterti blocca questa corsia mentre il saldo si accumula."
    ja: "建造：設計図から造船所で造られるものすべて。プラットフォームの船体も兵装も同じです。一度に一つずつ建造され、まだ購入できない発注は残高が貯まるまでこのレーンを保持します。"
    ko: "건조: 조선소에서 설계도로 만드는 모든 것. 플랫폼 선체와 탄약이 모두 여기에 속합니다. 한 번에 하나씩 건조되며, 아직 지불할 수 없는 주문은 잔액이 쌓일 때까지 이 레인을 점유합니다."
    "pt-BR": "Construção: tudo o que é fabricado em estaleiro a partir de um projeto, tanto cascos de plataformas quanto munições. Constrói-se um de cada vez, e um pedido que você ainda não pode pagar retém esta faixa enquanto o saldo se acumula."
    ru: "Постройка: всё, что изготавливается на верфи по чертежу, — и корпуса платформ, и боеприпасы. Строится по одному, а заказ, который пока не по карману, удерживает эту линию, пока накапливается баланс."
    zh: "建造：一切依据设计在船厂建造之物——平台船体与弹药皆在此列。一次只建造一件，尚无力支付的订单会占住本通道，直到余额积累足够。"
    "zh-TW": "建造：一切依據設計在船廠建造之物——平台船體與彈藥皆在此列。一次只建造一件，尚無力支付的訂單會占住本通道，直到餘額累積足夠。"
