      it: "Vista aggregata di sola lettura dell'inventario dei membri attuali. Espandi per controllare la fonte e lo stato in tempo reale di ogni membro."
      ja: "現在のメンバーのインベントリを集約した読み取り専用表示です。展開すると、各メンバーの現在の供給元とステータスを確認できます。"
      ko: "현재 멤버의 인벤토리를 집계한 읽기 전용 보기입니다. 펼치면 각 멤버의 실시간 출처와 상태를 확인할 수 있습니다."
      "pt-BR": "Visão agregada somente leitura do inventário dos membros atuais. Expanda para ver a origem e o status em tempo real de cada membro."
      ru: "Сводка инвентаря текущих участников только для чтения. Разверните, чтобы проверить источник и состояние каждого участника в реальном времени."
      zh: "当前成员库存的只读汇总。展开可查看每名成员的实时来源和状态。"
      "zh-TW": "目前成員庫存的唯讀彙總。展開即可查看每位成員的即時來源和狀態。"
