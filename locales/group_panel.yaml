    tooltip:
      de: "Schreibgeschützte Zusammenfassung des Inventars der aktuellen Mitglieder. Erweitern, um Quelle und Status jedes Mitglieds in Echtzeit zu prüfen."
      en: "Read-only aggregate of the current members' inventory. Expand to inspect each member's live source and status."
