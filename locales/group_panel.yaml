  # DC-993: mission strings moved to `mission.yaml` and renamed
  # `mission.*` so both this panel and the per-vehicle inspect panel
  # reference the same keys.
  # DC-1133.6: the legacy STATUS / Doctrine / Members / Formation collapsible
  # headers were removed with the skeleton rebuild — the accordion row labels
  # live under `glossary.{mbr,inv,roe,form}` and the envelope rows under
  # `glossary.{spdenv,altband}`.
  members:
    # The group panel's own member rows dropped their LEADER tag in #3216
    # (leadership is derived, and the masthead already links the anchor), but
    # the key stays: the top toolbar's groups tooltip still badges the anchor in
    # its member list, where nothing else identifies it.
    leader:
      de: "Anführer"
      en: "leader"
      es: "líder"
      fr: "chef"
      it: "capo"
      ja: "リーダー"
      ko: "대장"
      "pt-BR": "líder"
      ru: "ведущий"
      zh: "领队"
      "zh-TW": "領隊"
    # #3216: the design each member was built from, shown bare (no per-unit
    # index) beside its callsign — the callsign hides the designator its name
    # would otherwise carry.
    designator_tooltip:
      de: "Der Entwurf, aus dem dieses Mitglied gebaut wurde."
      en: "The design this member was built from."
      es: "El diseño con el que se construyó este miembro."
      fr: "Le modèle à partir duquel ce membre a été construit."
      it: "Il progetto da cui è stato costruito questo membro."
      ja: "このメンバーの製造元となった設計。"
      ko: "이 구성원이 제작된 설계."
      "pt-BR": "O projeto a partir do qual este membro foi construído."
      ru: "Проект, по которому построен этот участник."
      zh: "该成员所依据的设计。"
      "zh-TW": "該成員所依據的設計。"
    rounds_tooltip:
      de: "Munition an Bord, gemessen an der Beladung, für die dieses Mitglied bestückt wurde. Bernstein, wenn nichts mehr übrig ist."
      en: "Munitions aboard, against the loadout this member was armed to. Amber when it is out."
      es: "Municiones a bordo, frente a la carga con la que se armó este miembro. Ámbar cuando se ha quedado sin ellas."
