      ja: "現在のグループメンバー全員から集約された正規の設計図タイプです。"
      ko: "현재 그룹 멤버 전체에서 집계된 표준 설계도 유형입니다."
      "pt-BR": "Tipo de projeto canônico agregado entre os membros atuais do grupo."
      ru: "Канонический тип чертежа, агрегированный по текущим участникам группы."
      zh: "基于当前群组成员汇总的标准蓝图类型。"
      "zh-TW": "根據目前群組成員彙總的標準藍圖類型。"
