      en: "Rounds of this type the group holds now, against the number its members' loadouts plan for, and whether that plan is met."
      es: "Munición de este tipo que el grupo tiene ahora, frente a la cantidad prevista por las cargas de sus miembros, y si ese plan se cumple."
      fr: "Munitions de ce type actuellement détenues par le groupe, face au nombre prévu par les emports de ses membres, et si ce plan est satisfait."
      it: "Munizioni di questo tipo attualmente in dotazione al gruppo, rispetto al numero previsto dagli allestimenti dei suoi membri, e se il piano è soddisfatto."
      ja: "この編隊が現在保有する当該弾薬数と、隊員の兵装計画が要求する数、そしてその計画が満たされているか。"
      ko: "이 편대가 현재 보유한 해당 탄약 수와, 대원들의 무장 계획이 요구하는 수, 그리고 그 계획의 충족 여부입니다."
      "pt-BR": "Munições deste tipo que o grupo tem agora, ante a quantidade prevista pelas cargas de seus membros, e se esse plano está atendido."
      ru: "Боеприпасы этого типа, имеющиеся у группы сейчас, в сравнении с количеством, заложенным в снаряжение её участников, и выполнен ли этот план."
      zh: "该编队当前持有的此类弹药数量、其成员挂载计划所要求的数量，以及该计划是否得到满足。"
      "zh-TW": "該編隊當前持有的此類彈藥數量、其成員掛載計畫所要求的數量，以及該計畫是否得到滿足。"
